/* ---------- JSON エクスポート／インポート ---------- */
function exportJSON(){
  var payload = { app: "margin-nanpin-planner", version: DATA_VERSION, exportedAt: new Date().toISOString(), data: state };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nanpin-plan-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  toast("JSONバックアップを書き出しました。");
}
document.getElementById("importFile").addEventListener("change", function(ev){
  var file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var parsed = null;
    try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
    if (parsed === null){
      showModal("<h3>読み込めませんでした</h3><p style='margin:0 0 14px'>ファイルの内容がJSONとして読み取れないため、取り込みを中止しました。現在のデータはそのまま保持されています。</p><div class='rowflex' style='justify-content:flex-end'><button class='btn primary' onclick='closeModal()'>閉じる</button></div>");
      return;
    }
    var res = unpackState(parsed);
    if (!res.ok){
      var msg = res.reason === "version"
        ? "このファイルの形式バージョン（" + res.foundVersion + "）は、このアプリ（" + DATA_VERSION + "）より新しいため取り込めませんでした。新しいアプリで書き出したファイルは、古いアプリでは開けません。"
        : "ファイルの形式が不正か破損しているため、取り込みを中止しました。";
      showModal("<h3>読み込めませんでした</h3><p style='margin:0 0 14px'>" + esc(msg) + "現在のデータはそのまま保持されています。</p><div class='rowflex' style='justify-content:flex-end'><button class='btn primary' onclick='closeModal()'>閉じる</button></div>");
      return;
    }
    state = res.state;
    ui.selectedInsId = state.instruments.length ? state.instruments[0].id : null;
    ui.selectedDrop = null;
    recalc(); render();
    toast("データを復元しました（形式バージョン " + DATA_VERSION + " として検証済み）。");
  };
  reader.readAsText(file);
});

/* ---------- 自己テスト（指示書 §8） ---------- */
function runSelfTests(){
  var T = [];
  function t(name, ok, detail){ T.push({ name: name, ok: !!ok, detail: detail }); }
  /* 1 累計額 */
  var s1 = sampleState(); var r1 = MarginSim.simulate(s1);
  var cumBudget = s1.instruments[0].stages.reduce(function(a, x){ return a + x.budget; }, 0);
  var lastCum = r1.stageRes[s1.instruments[0].stages[s1.instruments[0].stages.length - 1].id].cumBudget;
  t("購入計画の累計額", cumBudget === 4500000 && lastCum === 4500000, "サンプル計画の予算合計・最終累計ともに 4,500,000円");
  /* 2 購入額変更で結果更新 */
  var s2 = JSON.parse(JSON.stringify(s1)); s2.instruments[0].stages[0].budget = 900000;
  var r2 = MarginSim.simulate(sanitizeState(s2));
  t("購入額変更時に全体の結果が更新される", r2.planCost !== r1.planCost && r2.rows[1].totalPrincipal !== r1.rows[1].totalPrincipal, "第1段階の予算を変更すると計画購入総額と建玉総額が変化");
  /* 3 複数銘柄の合算 */
  var s3 = sampleState();
  s3.instruments.push({ id: "t2", code: "7203", name: "テスト株", type: "stock", acquiredPrice: 1000, closePrice: 1000, closeDate: "", closeSource: "", unit: 100, baseIsSample: false, ref: { name: "なし", baseDate: "", baseValue: null, currentValue: null }, stages: [{ id: "t2s", dropPct: 10, budget: 90000, enabled: true }] });
  var r3 = MarginSim.simulate(s3);
  var row10 = r3.rows.filter(function(r){ return r.drop === 10; })[0];
  t("複数銘柄の建玉が正しく合算される", row10 && row10.totalPrincipal === 64800 + r3.stageRes["t2s"].cost + (r1.rows.filter(function(r){ return r.drop === 10; })[0].newPrincipal), "−10%時点の建玉総額＝既存＋銘柄A計画＋銘柄B計画");
  /* 4 担保の重複計上なし */
  t("担保が重複計上されない", row10 && row10.collateral === MarginSim.collateralAt(s3.account.collateral, 10, 1), "銘柄が2つでも代用評価額は口座全体で1回だけ計上");
  /* 5 建玉ゼロ */
  var s5 = sampleState(); s5.positions = []; s5.instruments[0].stages = [];
  var r5 = MarginSim.simulate(s5);
  t("建玉ゼロでゼロ除算しない", r5.current.rate === null && r5.rows.every(function(r){ return r.rate === null; }), "建代金0のとき維持率は null（画面表示は「対象外」）で NaN にならない");
  /* 6 数量の売買単位 */
  var okUnit = true, okBudget = true;
  Object.keys(r1.stageRes).forEach(function(k){ var rr = r1.stageRes[k]; if (rr.qty % 10 !== 0) okUnit = false; });
  s1.instruments[0].stages.forEach(function(sg){ var rr = r1.stageRes[sg.id]; if (rr.cost > sg.budget) okBudget = false; });
  t("購入数量が売買単位に適合し予算を超えない", okUnit && okBudget, "全段階で数量は売買単位10の倍数、実購入額は予算以下");
  /* 7 保証金不足 */
  var s7 = sampleState(); s7.account.collateral = 1000; s7.account.cash = 0;
  var r7 = MarginSim.simulate(s7);
  t("保証金不足時の処理", Object.keys(r7.stageRes).some(function(k){ return !r7.stageRes[k].feasible; }) && !!r7.firstInfeasible, "担保を極小にすると段階が実行不能として判定され、最初の実行不能段階が記録される");
  /* 8 保存・復元 */
  var roundtrip = sanitizeState(JSON.parse(JSON.stringify(state)));
  t("保存・復元で数値が変化しない", JSON.stringify(roundtrip) === JSON.stringify(sanitizeState(state)), "JSON化→検証付き復元で全数値が一致");
  /* 9 不正入力の除去 */
  var dirty = sampleState(); dirty.instruments[0].stages[0].budget = "abc"; dirty.instruments[0].acquiredPrice = -500; dirty.settings.maxDrop = 9999;
  var clean9 = sanitizeState(dirty);
  t("不正な入力値が計算に混入しない", clean9.instruments[0].stages[0].budget === 0 && clean9.instruments[0].acquiredPrice === 0 && clean9.settings.maxDrop === 100, "文字列・負数・範囲外の値を検証で除去／丸め");
  /* 10 手計算との一致 */
  var s10 = { version: 1, meta: { isSample: false, updatedAt: "" },
    account: { broker: "", collateral: 1000000, collateralBasis: "after", cash: 0, brokerRate: null }, positions: [],
    instruments: [{ id: "h1", code: "9999", name: "手計算", type: "stock", acquiredPrice: 1000, closePrice: 1000, closeDate: "", closeSource: "", unit: 100, baseIsSample: false, ref: { name: "なし", baseDate: "", baseValue: null, currentValue: null }, stages: [{ id: "h1s", dropPct: 10, budget: 90000, enabled: true }] }],
    settings: { marginCall: 20, management: 25, newMargin: 31, maxDrop: 80, step: 5, collateralMode: "same", collateralCustom: 100, includeProfit: true, fees: 0 } };
  var r10 = MarginSim.simulate(s10);
  var stg = r10.stageRes["h1s"];
  var row20 = r10.rows.filter(function(r){ return r.drop === 20; })[0];
  var expectedRate = (800000 - 10000) / 90000 * 100;
  t("計算結果が手計算と一致する", stg.price === 900 && stg.qty === 100 && stg.cost === 90000 && Math.abs(row20.rate - expectedRate) < 0.01 && row20.totalPnl === -10000,
    "価格900円×100株＝90,000円、−20%時点で担保800,000円・評価損−10,000円・維持率 " + expectedRate.toFixed(1) + "%");
  /* 11 形式バージョン付き保存の往復（自動保存・JSON 共通の封筒） */
  var packed = packState(s1);
  var unpacked = unpackState(JSON.parse(JSON.stringify(packed)));
  t("形式バージョン付きで保存・復元できる", packed.version === DATA_VERSION && unpacked.ok && JSON.stringify(unpacked.state) === JSON.stringify(sanitizeState(s1)), "封筒（バージョン " + DATA_VERSION + "）に包んでJSON化し、検証付きで開くと全数値が一致");
  /* 12 破損・形式不一致への対応 */
  var newerRes = unpackState({ app: "margin-nanpin-planner", version: DATA_VERSION + 99, data: sampleState() });
  var brokenRes = unpackState({ app: "margin-nanpin-planner", version: DATA_VERSION, data: { foo: 1 } });
  var garbageRes = unpackState("not an object");
  t("破損・形式不一致の保存データを安全に弾く", !newerRes.ok && newerRes.reason === "version" && !brokenRes.ok && brokenRes.reason === "corrupt" && !garbageRes.ok, "新しい形式は version、構造の壊れたデータは corrupt として検出し、推測で読み込まない");
  /* 13 終値データ（prices.json）の検証 */
  var feed13 = PriceFeed.sanitize({ updatedAt: "2026-11-17T07:00:00+09:00", source: "test",
    stocks: { "200A": { name: "テストETF", type: "ETF", unit: 1, close: 3081, closeDate: "2026-11-16" }, "BAD": { close: -5, closeDate: "2026-11-16" }, "NODATE": { close: 100, closeDate: "" } },
    indices: { "TOPIX": { latestClose: 3100, latestDate: "2026-11-16", history: { "2026-11-13": 3000, "2026-11-16": 3100 } } } });
  t("終値データ（prices.json）を検証して取り込む", !!feed13 && !!feed13.stocks["200A"] && !feed13.stocks["BAD"] && !feed13.stocks["NODATE"] && feed13.indices["TOPIX"].latestClose === 3100, "正常な銘柄・指数だけを取り込み、価格不正・日付なしの項目は除外する");
  /* 14 取得価格と最新終値の騰落率 */
  var chg14 = changePct(5500, 3081);
  t("取得価格と最新終値から騰落率を計算する", chg14 !== null && Math.abs(chg14 - (-43.9818)) < 0.001 && changePct(0, 100) === null && changePct(100, null) === null, "取得価格5,500円・終値3,081円 → −43.98%。取得価格未設定・終値未取得では計算しない");
  /* 15 旧形式（基準価格・現在価格）からの移行 */
  var old15 = sampleState();
  old15.instruments[0].basePrice = 5500; old15.instruments[0].currentPrice = 3500;
  delete old15.instruments[0].acquiredPrice; delete old15.instruments[0].closePrice;
  var mig15 = sanitizeState(old15);
  t("旧形式データを新しい価格形式へ移行する", mig15.instruments[0].acquiredPrice === 5500 && mig15.instruments[0].closePrice === 3500, "旧「基準価格」は取得価格へ、旧「現在価格」は最新終値へ引き継ぐ");
  /* 16 参考指数の基準日終値の解決 */
  var base16 = PriceFeed.indexCloseOn(feed13, "TOPIX", "2026-11-15");
  var exact16 = PriceFeed.indexCloseOn(feed13, "TOPIX", "2026-11-13");
  t("参考指数の基準日の終値を解決する", !!base16 && base16.close === 3000 && base16.date === "2026-11-13" && !base16.exact && !!exact16 && exact16.exact === true, "基準日が休場日なら直近の営業日の終値を使い、完全一致かどうかを区別できる");
  /* 17 銘柄コードの正規化と、銘柄名・区分・売買単位の取り込み */
  var feed17 = PriceFeed.sanitize({ updatedAt: "2026-11-17T07:00:00+09:00", source: "test",
    stocks: { "200A": { name: "半導体ETF", type: "ETF", unit: 1, close: 3081, closeDate: "2026-11-16" },
              "285a": { name: "テスト半導体株", type: "個別株式", unit: 100, close: 8392, closeDate: "2026-11-16" } },
    indices: {} });
  var q17a = PriceFeed.stock(feed17, "200a");
  var q17b = PriceFeed.stock(feed17, " 285A ");
