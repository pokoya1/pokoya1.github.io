<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#0d3b34" />
<link rel="icon" href="data:," />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>信用ナンピン計画・リスク管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface2:#eef2f5; --ink:#182230; --muted:#5a6b7e;
  --line:#d7dfe7; --line2:#c3cedb;
  --accent:#0d7a68; --accent-ink:#0a5c4f; --accent-bg:#e2f2ee;
  --warn:#9a6206; --warn-bg:#fdf0d5; --warn-line:#e8c877;
  --danger:#b3261e; --danger-bg:#fdecea; --danger-line:#f0b3ae;
  --info:#1d5fa8; --info-bg:#e6effa;
  --shadow:0 1px 3px rgba(16,32,48,.08),0 4px 14px rgba(16,32,48,.05);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f141b; --surface:#182029; --surface2:#1f2937; --ink:#e7edf4; --muted:#9db0c4;
    --line:#2b394c; --line2:#3a4c64;
    --accent:#2fbf9f; --accent-ink:#7fe3cb; --accent-bg:#123c33;
    --warn:#f0b95a; --warn-bg:#3d2f0e; --warn-line:#7a5c1c;
    --danger:#ff8a80; --danger-bg:#421d1a; --danger-line:#7c3833;
    --info:#8dbdf2; --info-bg:#17334f;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",system-ui,sans-serif;font-size:15px;line-height:1.55}
button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem}
input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent)}
.num{font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:.45rem .9rem;font-weight:700;font-size:.9rem;min-height:2.5rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#06231d}}
.btn.danger-outline{color:var(--danger);border-color:var(--danger-line)}
.btn.small{min-height:2.25rem;padding:.3rem .65rem;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type="number"],input[type="text"],input[type="date"],select{background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:.45rem .6rem;font:inherit;font-size:.95rem;width:100%}
input[type="number"]{text-align:right;font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type="range"]{width:100%;accent-color:var(--accent);min-height:2rem;padding:0}
label.flabel{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:.3rem}
.field{min-width:0}
.hint{font-size:.78rem;color:var(--muted);margin-top:.35rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.apptitle{font-weight:900;font-size:1rem;letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:.12rem .6rem;font-size:.72rem;font-weight:700;border:1px solid var(--line2);background:var(--surface2);color:var(--muted)}
.badge.sample{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.tabs{display:none;gap:4px}
.tabs button{border:1px solid transparent;background:transparent;color:var(--muted);font-weight:700;border-radius:8px;padding:.5rem .9rem;min-height:2.5rem}
.tabs button[aria-selected="true"]{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent)}
@media(min-width:760px){.tabs{display:flex}.wrap{padding-bottom:40px}}
/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{background:none;border:none;color:var(--muted);font-size:.68rem;font-weight:700;padding:.45rem 0 .4rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:3.4rem}
.bottomnav button[aria-selected="true"]{color:var(--accent-ink)}
.bottomnav svg{width:22px;height:22px}
@media(min-width:760px){.bottomnav{display:none}}
/* cards & layout */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:14px}
.card h2{font-size:1.02rem;margin:0 0 4px;font-weight:900}
.card h3{font-size:.92rem;margin:0 0 8px;font-weight:900}
.card .sub{color:var(--muted);font-size:.83rem;margin:0 0 10px}
.grid2{display:grid;gap:14px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}.grid2.wide{grid-template-columns:3fr 2fr}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:.74rem;font-weight:700;color:var(--muted)}
.kpi .k-value{font-size:1.45rem;font-weight:900;line-height:1.25;margin-top:2px}
.kpi .k-value small{font-size:.8rem;font-weight:700;color:var(--muted)}
.kpi .k-note{font-size:.76rem;color:var(--muted);margin-top:2px}
.kpi.alert{border-color:var(--danger-line);background:var(--danger-bg)}
.kpi.caution{border-color:var(--warn-line);background:var(--warn-bg)}
.hero-rate{background:linear-gradient(135deg,#0d3b34,#0d7a68);color:#fff;border-radius:var(--radius);padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.hero-rate .h-label{font-size:.8rem;font-weight:700;opacity:.85}
.hero-rate .h-big{font-size:1.6rem;font-weight:900;line-height:1.35;margin-top:4px}
.hero-rate .h-sub{font-size:.88rem;opacity:.92;margin-top:6px}
.hero-rate.danger{background:linear-gradient(135deg,#5f130e,#b3261e)}
.hero-rate.caution{background:linear-gradient(135deg,#5c3d05,#9a6206)}
.pill{display:inline-block;border-radius:999px;padding:.1rem .55rem;font-size:.72rem;font-weight:700;vertical-align:middle}
.pill.safe{background:var(--accent-bg);color:var(--accent-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.mute{background:var(--surface2);color:var(--muted)}
.pill.info{background:var(--info-bg);color:var(--info)}
/* table */
.tblwrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:.88rem}
table.dt th,table.dt td{padding:.5rem .55rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.dt th{font-size:.74rem;color:var(--muted);font-weight:700;background:var(--surface2);position:sticky;top:0}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt tr.sel td{background:var(--accent-bg)}
table.dt tr.row-danger td{background:var(--danger-bg)}
table.dt tr.row-warn td{background:var(--warn-bg)}
table.dt tbody tr{cursor:pointer}
@media(max-width:640px){
  .hide-sp{display:none}
  /* 詳細表はスマホでは行カード形式に組み替える（横スクロールなし） */
  .tblwrap{overflow-x:visible}
  table.dt thead{display:none}
  table.dt,table.dt tbody{display:block}
  table.dt tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;padding:10px 6px;border-bottom:1px solid var(--line)}
  table.dt td{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:none;padding:.28rem 0;white-space:normal;text-align:right;font-size:.86rem}
  table.dt td::before{content:attr(data-label);font-size:.72rem;font-weight:700;color:var(--muted);text-align:left}
  table.dt td:first-child{grid-column:1 / -1;font-size:1rem;font-weight:900;border-bottom:1px dashed var(--line);padding-bottom:.4rem}
  table.dt td:first-child::before{content:"下落率"}
}
/* chart */
.chartbox{width:100%}
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:0;border-top:3px solid var(--accent);border-radius:2px}
.sw.dash{border-top-style:dashed}
.sw.mgmt{border-color:#d9930d}.sw.call{border-color:var(--danger)}
.dotkey{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d9930d}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);color:var(--muted);font-weight:700;padding:.35rem .8rem;min-height:2.25rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
/* plan */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:.55rem .8rem;text-align:left;min-height:3rem;box-shadow:var(--shadow)}
.chip[aria-selected="true"]{border-color:var(--accent);background:var(--accent-bg)}
.chip .c-code{font-weight:900;font-size:.95rem}
.chip .c-name{font-size:.72rem;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.formgrid{grid-template-columns:repeat(4,1fr)}.formgrid.c3{grid-template-columns:repeat(3,1fr)}}
.stagerow{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px;background:var(--surface)}
.stagerow.off{opacity:.55}
.stagerow .sr-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stagerow .sr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media(min-width:760px){.stagerow .sr-grid{grid-template-columns:repeat(4,1fr)}}
.stagerow .calc{font-size:.86rem}
.stagerow .calc .cl{font-size:.72rem;color:var(--muted);font-weight:700}
.stagerow .calc .cv{font-weight:900;font-size:1rem}
.switchlabel{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.85rem;cursor:pointer;padding:.3rem 0;min-height:2.25rem}
.minibar{position:sticky;top:57px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-top:14px;display:flex;gap:8px 18px;flex-wrap:wrap;font-size:.85rem}
.minibar b{font-size:1rem}
.posrow{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px}
.posrow .pr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
@media(min-width:760px){.posrow .pr-grid{grid-template-columns:repeat(5,1fr)}}
.rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mt{margin-top:12px}.mb0{margin-bottom:0}
.notice{border-radius:var(--radius);padding:12px 14px;font-size:.86rem;margin-top:14px;border:1px solid}
.notice.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--ink)}
.notice.info{background:var(--info-bg);border-color:var(--line2)}
.notice.danger{background:var(--danger-bg);border-color:var(--danger-line)}
details.more{margin-top:10px}
details.more summary{font-weight:700;color:var(--accent-ink);cursor:pointer;padding:.4rem 0;min-height:2.25rem}
/* 折り畳み式 詳細カード（ダッシュボード：下落率別の詳細） */
.card.detail-card{padding:0;overflow:hidden}
.card.detail-card>summary{list-style:none;cursor:pointer;padding:16px;-webkit-tap-highlight-color:transparent}
.card.detail-card>summary::-webkit-details-marker{display:none}
.card.detail-card>summary::marker{content:""}
.detail-summary-in{display:flex;align-items:flex-start;gap:12px}
.detail-summary-main{flex:1;min-width:0}
.detail-summary-main h2{font-size:1.02rem;margin:0;font-weight:900;line-height:1.4}
.detail-summary-meta{color:var(--muted);font-size:.82rem;margin-top:4px;line-height:1.5}
.detail-summary-meta strong{color:var(--ink)}
.detail-toggle{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface2);color:var(--accent-ink);border-radius:999px;padding:.32rem .7rem;font-size:.8rem;font-weight:700;white-space:nowrap;margin-top:2px}
.detail-toggle .chev{display:inline-block;font-size:.72rem;line-height:1;transition:transform .18s ease}
.card.detail-card[open ] .detail-toggle .chev{transform:rotate(180deg)}
.card.detail-card[open ] .detail-toggle .label-open{display:none}
.card.detail-card:not([open ]) .detail-toggle .label-close{display:none}
.detail-body{padding:0 16px 16px;border-top:1px solid var(--line)}
.detail-body .sub{margin-top:12px}
@media(max-width:640px){.detail-summary-in{flex-wrap:wrap}.detail-toggle{margin-top:6px}}
.kv{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;text-align:right;font-weight:700}
@media(max-width:640px){
  .kv{grid-template-columns:1fr;gap:0}
  .kv dt{margin-top:10px}
  .kv dd{text-align:left;font-size:1.02rem;border-bottom:1px solid var(--line);padding-bottom:6px}
}
/* modal & toast */
.modalback{position:fixed;inset:0;background:rgba(8,16,24,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;max-width:440px;width:100%;padding:20px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 8px;font-size:1.05rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:90;background:#182230;color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-size:.88rem;font-weight:700;box-shadow:var(--shadow);max-width:92vw;text-align:center}
@media(min-width:760px){.toast{bottom:28px}}
.testlist{list-style:none;margin:8px 0 0;padding:0;font-size:.88rem}
.testlist li{padding:.45rem 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.testlist .ok{color:var(--accent-ink);font-weight:900}
.testlist .ng{color:var(--danger);font-weight:900}
footer.note{color:var(--muted);font-size:.78rem;margin-top:22px;line-height:1.7}
/* 価格パネル（取得価格・最新終値・参考指数） */
.pricepanel{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-top:12px}
.pricepanel .pp-label{font-size:.74rem;font-weight:700;color:var(--muted)}
.pricepanel .pp-value{font-size:1.35rem;font-weight:900;line-height:1.3;margin-top:2px}
.pricepanel .pp-value .pill{font-size:.95rem;padding:.2rem .7rem}
.coderow{display:flex;gap:10px;align-items:flex-end}
.coderow .btn{flex-shrink:0;min-height:3rem}
.pill.up{background:var(--accent-bg);color:var(--accent-ink)}
.pill.down{background:var(--info-bg);color:var(--info)}
.posline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.posline:last-child{border-bottom:none;padding-bottom:2px}
.posline-main{flex:1;min-width:0}
.posline-sub{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.posline .pill{font-size:.92rem;padding:.25rem .7rem;flex-shrink:0}
/* スマホ優先：入力欄は16px以上（iOSの自動ズーム防止）と大きめのタップ領域にする */
@media(max-width:759px){
  input[type="number"],input[type="text"],input[type="date"],select{font-size:16px;min-height:3rem}
  .btn{min-height:2.9rem}
  .chip{min-height:3.4rem}
  .pricepanel .pp-value{font-size:1.2rem}
}
.view[hidden]{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="apptitle">信用ナンピン計画・リスク管理 <span class="badge sample" id="sampleBadge">サンプルデータ</span> <span class="badge" id="saveStatus" role="status">自動保存を確認中…</span></div>
    <nav class="tabs" role="tablist" aria-label="画面切替">
      <button role="tab" data-view="dashboard" aria-selected="true">ダッシュボード</button>
      <button role="tab" data-view="plan" aria-selected="false">購入計画</button>
      <button role="tab" data-view="account" aria-selected="false">口座・保有状況</button>
      <button role="tab" data-view="settings" aria-selected="false">設定・データ</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-dashboard"></section>
  <section class="view" id="view-plan" hidden></section>
  <section class="view" id="view-account" hidden></section>
  <section class="view" id="view-settings" hidden></section>
  <footer class="note">
    本ツールは信用取引の購入計画と保証金維持率の<strong>概算シミュレーション</strong>です。維持率が追証基準に到達することと、実際に追証（追加保証金）が発生することは同一ではありません。証券会社ごとの実際の計算制度・掛目・最低保証金等とは異なる場合があり、制度への適合を保証するものではありません。実際の取引判断は証券会社の表示と制度をご確認ください。口座の認証情報は取得せず、実際の注文も行いません。
  </footer>
</main>

<nav class="bottomnav" aria-label="画面切替">
  <button data-view="dashboard" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h4v8H3zM10 3h4v18h-4zM17 8h4v13h-4z"/></svg>ダッシュボード</button>
  <button data-view="plan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>購入計画</button>
  <button data-view="account" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>口座・保有</button>
  <button data-view="settings" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.06-.4.1-.8.1-1.2z"/></svg>設定・データ</button>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr-only" aria-label="JSONファイルを読み込む" />
<script>
"use strict";
/* ============================================================
   信用ナンピン計画・リスク管理（第一段階）
   計算モデルは独立モジュール MarginSim に分離。
   丸め規則：価格は円未満を切り捨てて表示・計算に使用（想定価格＝取得価格×(1−下落率) を円単位に切り捨て）。
   数量は売買単位で切り捨て、実購入額＝数量×想定価格（円）。予算を一切超えない。
   ============================================================ */
var DATA_VERSION = 2;
var uidSeq = 100;
function uid(p){ return p + "_" + (++uidSeq) + "_" + Math.random().toString(36).slice(2,7); }
function num(v, fb){ var n = (typeof v === "string") ? Number(v.replace(/[,，\s]/g,"")) : Number(v); return isFinite(n) ? n : (fb === undefined ? 0 : fb); }
function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
function fmtYen(v){ if (v === null || v === undefined || !isFinite(v)) return "—"; var r = Math.round(v); return (r < 0 ? "−" : "") + Math.abs(r).toLocaleString("ja-JP") + "円"; }
function fmtYenShort(v){ if (v === null || v === undefined || !isFinite(v)) return "—"; return (v < 0 ? "−" : "") + Math.abs(Math.round(v)).toLocaleString("ja-JP"); }
function fmtPct(v, digits){ if (v === null || v === undefined || !isFinite(v)) return "対象外"; return v.toFixed(digits === undefined ? 1 : digits) + "%"; }
function fmtSignedYen(v){ if (v === null || v === undefined || !isFinite(v)) return "—"; var r = Math.round(v); return (r > 0 ? "+" : (r < 0 ? "−" : "")) + Math.abs(r).toLocaleString("ja-JP") + "円"; }
function esc(s){ return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
/* 銘柄コードの正規化：前後の空白を除き英字を大文字化する（例 "285a" → "285A"）。コード照合はすべてこの形式で行う */
function normalizeCode(code){ return String(code === null || code === undefined ? "" : code).trim().toUpperCase().slice(0, 12); }

/* ---------- サンプルデータ（指示書 §5） ---------- */
function sampleStages(){
  var defs = [[5,100000],[10,100000],[15,100000],[20,200000],[25,437500],[30,437500],[35,437500],[40,437500],[45,437500],[50,437500],[55,437500],[60,437500],[65,500000]];
  return defs.map(function(d){ return { id: uid("st"), dropPct: d[0], budget: d[1], enabled: true }; });
}
function sampleState(){
  return {
    version: DATA_VERSION,
    meta: { isSample: true, updatedAt: "" },
    account: { broker: "", collateral: 15617481, collateralBasis: "after", cash: 70309, brokerRate: null },
    positions: [
      { id: uid("pos"), code: "", name: "既存信用建玉（サンプル）", side: "buy", principal: 64800, pnl: null }
    ],
    instruments: [
      { id: uid("ins"), code: "1308", name: "上場インデックスファンドTOPIX", type: "ETF",
        acquiredPrice: 3000, closePrice: null, closeDate: "", closeSource: "", unit: 10, baseIsSample: true,
        ref: { name: "TOPIX", baseDate: "", baseValue: null, currentValue: null },
        stages: sampleStages() }
    ],
    settings: { marginCall: 20, management: 25, newMargin: 31, maxDrop: 80, step: 5,
                collateralMode: "same", collateralCustom: 100, includeProfit: true, fees: 0 }
  };
}

/* ---------- 入力サニタイズ（不正値を計算に混入させない） ---------- */
function sanitizeState(s){
  if (!s || typeof s !== "object") return null;
  var out = sampleState();
  out.meta = { isSample: !!(s.meta && s.meta.isSample), updatedAt: String((s.meta && s.meta.updatedAt) || "") };
  var a = s.account || {};
  out.account = {
    broker: String(a.broker || "").slice(0, 60),
    collateral: clamp(num(a.collateral, 0), 0, 1e12),
    collateralBasis: a.collateralBasis === "before" ? "before" : "after",
    cash: clamp(num(a.cash, 0), -1e12, 1e12),
    brokerRate: (a.brokerRate === null || a.brokerRate === "" || a.brokerRate === undefined) ? null : clamp(num(a.brokerRate, NaN), 0, 100000)
  };
  if (!isFinite(out.account.brokerRate)) out.account.brokerRate = null;
  out.positions = Array.isArray(s.positions) ? s.positions.slice(0, 100).map(function(p){
    p = p || {};
    var pnl = (p.pnl === null || p.pnl === "" || p.pnl === undefined) ? null : num(p.pnl, NaN);
    return { id: String(p.id || uid("pos")), code: normalizeCode(p.code), name: String(p.name || "").slice(0, 60),
             side: p.side === "sell" ? "sell" : "buy",
             principal: clamp(num(p.principal, 0), 0, 1e12),
             pnl: isFinite(pnl) ? clamp(pnl, -1e12, 1e12) : null };
  }) : [];
  out.instruments = Array.isArray(s.instruments) ? s.instruments.slice(0, 50).map(function(it){
    it = it || {};
    var r = it.ref || {};
    var bv = (r.baseValue === null || r.baseValue === "" || r.baseValue === undefined) ? null : num(r.baseValue, NaN);
    var cv = (r.currentValue === null || r.currentValue === "" || r.currentValue === undefined) ? null : num(r.currentValue, NaN);
    /* 価格の統一：旧形式の「基準価格」は取得価格へ、「現在価格」は最新終値へ移行して引き継ぐ */
    var acqRaw = (it.acquiredPrice === undefined || it.acquiredPrice === null) ? it.basePrice : it.acquiredPrice;
    var cpRaw = (it.closePrice === undefined) ? it.currentPrice : it.closePrice;
    var cpv = (cpRaw === null || cpRaw === "" || cpRaw === undefined) ? null : num(cpRaw, NaN);
    return { id: String(it.id || uid("ins")), code: normalizeCode(it.code), name: String(it.name || "").slice(0, 80),
      type: it.type === "stock" ? "stock" : "ETF",
      acquiredPrice: clamp(num(acqRaw, 0), 0, 1e9),
      closePrice: isFinite(cpv) ? clamp(cpv, 0, 1e9) : null,
      closeDate: String(it.closeDate || "").slice(0, 10),
      closeSource: it.closeSource === "manual" ? "manual" : (it.closeSource === "json" ? "json" : ""),
      unit: Math.max(1, Math.round(num(it.unit, 1))), baseIsSample: !!it.baseIsSample,
      ref: { name: ["日経平均","TOPIX","S&P500","NASDAQ100","なし"].indexOf(r.name) >= 0 ? r.name : "なし",
             baseDate: String(r.baseDate || ""), baseValue: isFinite(bv) ? bv : null, currentValue: isFinite(cv) ? cv : null },
      stages: Array.isArray(it.stages) ? it.stages.slice(0, 100).map(function(st){
        st = st || {};
        return { id: String(st.id || uid("st")), dropPct: clamp(num(st.dropPct, 0), 0, 100),
                 budget: clamp(Math.round(num(st.budget, 0)), 0, 1e12), enabled: st.enabled !== false };
      }) : [] };
  }) : [];
  var st = s.settings || {};
  out.settings = {
    marginCall: clamp(num(st.marginCall, 20), 0, 100), management: clamp(num(st.management, 25), 0, 100),
    newMargin: clamp(num(st.newMargin, 31), 1, 100), maxDrop: clamp(Math.round(num(st.maxDrop, 80)), 5, 100),
    step: clamp(num(st.step, 5), 1, 50),
    collateralMode: ["same","half","strong","none","custom"].indexOf(st.collateralMode) >= 0 ? st.collateralMode : "same",
    collateralCustom: clamp(num(st.collateralCustom, 100), 0, 300),
    includeProfit: st.includeProfit !== false, fees: clamp(num(st.fees, 0), 0, 1e12)
  };
  out.version = DATA_VERSION;
  return out;
}

/* ============================================================
   計算モジュール MarginSim（証券会社の実制度とは独立した概算モデル）
   維持率 ＝（代用評価額(シナリオ後) ＋ 保証金現金 ＋ 建玉評価損益(算入設定適用後) − 控除費用）÷ 建代金合計 × 100
   建代金合計が 0 のとき維持率は null（画面では「対象外」）。
   ============================================================ */
var MarginSim = (function(){
  function collateralFactor(settings){
    switch (settings.collateralMode){
      case "same": return 1; case "half": return 0.5; case "strong": return 1.2; case "none": return 0;
      case "custom": return clamp(num(settings.collateralCustom, 100), 0, 300) / 100;
      default: return 1;
    }
  }
  function stagePrice(basePrice, dropPct){ return Math.floor(basePrice * (1 - dropPct / 100)); }
  function qtyFor(budget, price, unit){
    if (!(price > 0) || !(unit >= 1) || !(budget > 0)) return 0;
    return Math.floor(budget / price / unit) * unit;
  }
  function adjPnl(pnl, settings){ return settings.includeProfit ? pnl : Math.min(pnl, 0); }
  /* 既存建玉の評価損益：現在値（建代金＋現在評価損益）が下落率ぶん変動する近似。pnl 未入力は 0 として概算し approx を立てる */
  function existingPnlAt(positions, dropPct){
    var pnl = 0, approx = false;
    positions.forEach(function(p){
      var cur = p.pnl === null ? 0 : p.pnl;
      if (p.pnl === null && p.principal > 0) approx = true;
      var mv = p.principal + cur;
      var delta = mv * (dropPct / 100);
      pnl += cur + (p.side === "sell" ? delta : -delta);
    });
    return { pnl: pnl, approx: approx };
  }
  function collateralAt(base, dropPct, factor){ return Math.max(0, Math.floor(base * (1 - (dropPct / 100) * factor))); }

  /* 全段階の数量・実購入額・実行可否をトリガー到達時点の保証金で判定（段階は下落率の昇順に処理） */
  function evaluateStages(state){
    var st = state.settings, factor = collateralFactor(st);
    var flat = [];
    state.instruments.forEach(function(ins){
      ins.stages.forEach(function(sg){ flat.push({ ins: ins, sg: sg }); });
    });
    flat.sort(function(a, b){ return a.sg.dropPct - b.sg.dropPct || String(a.ins.code).localeCompare(String(b.ins.code)); });
    var result = {}; var executedPrior = [];
    flat.forEach(function(item){
      var ins = item.ins, sg = item.sg;
      var price = stagePrice(ins.acquiredPrice, sg.dropPct);
      var qty = qtyFor(sg.budget, price, ins.unit);
      var cost = qty * price;
      var rec = { price: price, qty: qty, cost: cost, feasible: false, reason: "", cumBudget: 0 };
      if (!sg.enabled){ rec.reason = "無効"; result[sg.id] = rec; return; }
      if (qty <= 0){ rec.reason = price <= 0 ? "取得価格が未設定" : "予算内で売買単位を購入できない"; result[sg.id] = rec; return; }
      /* トリガー到達時点（下落率＝この段階の下落率）の推計保証金 */
      var t = sg.dropPct;
      var exP = existingPnlAt(state.positions, t);
      var newPnl = 0;
      executedPrior.forEach(function(p){
        var curPrice = Math.floor(p.ins.acquiredPrice * (1 - t / 100));
        newPnl += p.qty * (curPrice - p.price);
      });
      var balance = collateralAt(state.account.collateral, t, factor) + state.account.cash
                    + adjPnl(exP.pnl + newPnl, st) - st.fees;
      var required = Math.ceil(cost * st.newMargin / 100);
      if (balance >= required){ rec.feasible = true; executedPrior.push({ ins: ins, qty: qty, price: price }); }
      else { rec.reason = "必要保証金（概算 " + fmtYen(required) + "）に対し推計保証金が不足"; }
      result[sg.id] = rec;
    });
    /* 累計予算（有効段階のみ、下落率順） */
    state.instruments.forEach(function(ins){
      var sorted = ins.stages.slice().sort(function(a, b){ return a.dropPct - b.dropPct; });
      var cum = 0;
      sorted.forEach(function(sg){ if (sg.enabled){ cum += sg.budget; } if (result[sg.id]) result[sg.id].cumBudget = cum; });
    });
    return result;
  }

  function simulate(state){
    var st = state.settings, factor = collateralFactor(st);
    var stageRes = evaluateStages(state);
    var drops = [];
    for (var d = 0; d <= st.maxDrop + 1e-9; d += st.step) drops.push(Math.round(d * 100) / 100);
    if (drops[drops.length - 1] !== st.maxDrop) drops.push(st.maxDrop);
    var existingPrincipal = state.positions.reduce(function(s, p){ return s + p.principal; }, 0);
    var rows = drops.map(function(drop){
      var executed = [];
      state.instruments.forEach(function(ins){
        ins.stages.forEach(function(sg){
          var r = stageRes[sg.id];
          if (sg.enabled && r && r.feasible && sg.dropPct <= drop + 1e-9) executed.push({ ins: ins, sg: sg, r: r });
        });
      });
      var newPrincipal = executed.reduce(function(s, e){ return s + e.r.cost; }, 0);
      var newPnl = executed.reduce(function(s, e){
        var curPrice = Math.floor(e.ins.acquiredPrice * (1 - drop / 100));
        return s + e.r.qty * (curPrice - e.r.price);
      }, 0);
      var exP = existingPnlAt(state.positions, drop);
      var collateral = collateralAt(state.account.collateral, drop, factor);
      var totalPnl = exP.pnl + newPnl;
      var balance = collateral + state.account.cash + adjPnl(totalPnl, st) - st.fees;
      var totalPrincipal = existingPrincipal + newPrincipal;
      var rate = totalPrincipal > 0 ? (balance / totalPrincipal) * 100 : null;
      var capacity = st.newMargin > 0 ? Math.max(0, Math.floor(balance / (st.newMargin / 100)) - totalPrincipal) : 0;
      var infeasibleHere = 0;
      state.instruments.forEach(function(ins){ ins.stages.forEach(function(sg){
        var r = stageRes[sg.id];
        if (sg.enabled && r && !r.feasible && sg.dropPct <= drop + 1e-9) infeasibleHere++;
      });});
      return { drop: drop, collateral: collateral, existingPnl: exP.pnl, newPnl: newPnl, totalPnl: totalPnl,
               existingPnlApprox: exP.approx, newPrincipal: newPrincipal, totalPrincipal: totalPrincipal,
               balance: balance, rate: rate, capacity: capacity, executedCount: executed.length, infeasibleCount: infeasibleHere };
    });
    /* 現在値（下落率0%、計画購入は未実行として既存建玉のみで推計） */
    var exNow = existingPnlAt(state.positions, 0);
    var balanceNow = state.account.collateral + state.account.cash + adjPnl(exNow.pnl, st) - st.fees;
    var current = { principal: existingPrincipal, pnl: exNow.pnl, pnlApprox: exNow.approx,
                    balance: balanceNow, rate: existingPrincipal > 0 ? (balanceNow / existingPrincipal) * 100 : null };
    /* 計画合計 */
    var planBudget = 0, planCost = 0;
    state.instruments.forEach(function(ins){ ins.stages.forEach(function(sg){
      if (sg.enabled){ planBudget += sg.budget; planCost += stageRes[sg.id] ? stageRes[sg.id].cost : 0; }
    });});
    /* 最初の到達点 */
    function firstBelow(threshold){
      for (var i = 0; i < rows.length; i++){ if (rows[i].rate !== null && rows[i].rate < threshold) return rows[i]; }
      return null;
    }
    var firstInfeasible = null;
    state.instruments.forEach(function(ins){ ins.stages.forEach(function(sg){
      var r = stageRes[sg.id];
      if (sg.enabled && r && !r.feasible && (firstInfeasible === null || sg.dropPct < firstInfeasible.drop)) {
        firstInfeasible = { drop: sg.dropPct, code: ins.code, reason: r.reason };
      }
    });});
    var minPnl = rows.length ? Math.min.apply(null, rows.map(function(r){ return r.totalPnl; })) : 0;
    return { rows: rows, stageRes: stageRes, current: current, planBudget: planBudget, planCost: planCost,
             firstMgmt: firstBelow(st.management), firstCall: firstBelow(st.marginCall),
             firstInfeasible: firstInfeasible, minPnl: minPnl, factor: factor };
  }
  return { collateralFactor: collateralFactor, stagePrice: stagePrice, qtyFor: qtyFor,
           existingPnlAt: existingPnlAt, collateralAt: collateralAt, evaluateStages: evaluateStages, simulate: simulate };
})();

/* ============================================================
   終値データ（prices.json）の検証と参照 PriceFeed
   prices.json はアプリと同じ場所に置かれる外部ファイル（定期ジョブが大引け後に最新化する想定）。
   形式：{ version, updatedAt, source,
          stocks:  { 銘柄コード: { name, type, unit, close, closeDate } },
          indices: { 指数名: { latestClose, latestDate, history: { "YYYY-MM-DD": 終値 } } } }
   不正な項目（価格が正でない・日付形式が違う）は取り込まない。
   騰落率は changePct（基準となる価格 → 比較する価格）で一元計算する。
   ============================================================ */
function changePct(from, to){
  if (!(from > 0) || to === null || to === undefined || !isFinite(to)) return null;
  return (to / from - 1) * 100;
}
var PriceFeed = (function(){
  function validDate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "")); }
  function sanitize(raw){
    if (!raw || typeof raw !== "object") return null;
    var stocks = {}, indices = {};
    if (raw.stocks && typeof raw.stocks === "object"){
      Object.keys(raw.stocks).slice(0, 200).forEach(function(code){
        var e = raw.stocks[code] || {};
        var close = num(e.close, NaN);
        if (!isFinite(close) || close <= 0 || !validDate(e.closeDate)) return;
        stocks[normalizeCode(code)] = {
          name: String(e.name || "").slice(0, 80),
          /* 終値データ側の区分表記ゆれ（"stock" / "個別株式"）をアプリ内部形式へそろえる */
          type: (e.type === "stock" || e.type === "個別株式" || e.type === "株式") ? "stock" : "ETF",
          unit: Math.max(1, Math.round(num(e.unit, 1))),
          close: close, closeDate: String(e.closeDate)
        };
      });
    }
    if (raw.indices && typeof raw.indices === "object"){
      Object.keys(raw.indices).slice(0, 20).forEach(function(name){
        var e = raw.indices[name] || {};
        var hist = {};
        if (e.history && typeof e.history === "object"){
          Object.keys(e.history).slice(0, 500).forEach(function(d){
            var v = num(e.history[d], NaN);
            if (validDate(d) && isFinite(v) && v > 0) hist[d] = v;
          });
        }
        var latest = num(e.latestClose, NaN);
        var key = String(name).slice(0, 20);
        if (isFinite(latest) && latest > 0 && validDate(e.latestDate)){
          indices[key] = { latestClose: latest, latestDate: String(e.latestDate), history: hist };
        } else if (Object.keys(hist).length){
          var dates = Object.keys(hist).sort();
          var ld = dates[dates.length - 1];
          indices[key] = { latestClose: hist[ld], latestDate: ld, history: hist };
        }
      });
    }
    return { updatedAt: String(raw.updatedAt || ""), source: String(raw.source || ""), stocks: stocks, indices: indices };
  }
  function stock(feed, code){ var c = normalizeCode(code); return (feed && c && feed.stocks[c]) ? feed.stocks[c] : null; }
  function indexLatest(feed, name){ return (feed && name && feed.indices[name]) ? feed.indices[name] : null; }
  /* 基準日の終値：指定日に無ければ、それ以前で最も近い営業日の終値を返す（exact=false で区別できる） */
  function indexCloseOn(feed, name, dateStr){
    var ix = indexLatest(feed, name);
    if (!ix || !validDate(dateStr)) return null;
    if (ix.history[dateStr] !== undefined) return { close: ix.history[dateStr], date: dateStr, exact: true };
    var dates = Object.keys(ix.history).filter(function(d){ return d < dateStr; }).sort();
    if (dates.length){ var d = dates[dates.length - 1]; return { close: ix.history[d], date: d, exact: false }; }
    if (ix.latestDate && ix.latestDate <= dateStr) return { close: ix.latestClose, date: ix.latestDate, exact: ix.latestDate === dateStr };
    return null;
  }
  return { sanitize: sanitize, stock: stock, indexLatest: indexLatest, indexCloseOn: indexCloseOn, validDate: validDate };
})();

<script>
"use strict";
/* ---------- アプリ状態と永続保存（IndexedDB） ----------
   データは端末のブラウザ内 IndexedDB に、形式バージョン付きの封筒（envelope）で自動保存し、
   起動時に復元する。保存データが破損している場合や、このアプリより新しい形式の場合は
   推測で読み込まず・勝手に上書きもせず、検証関数 unpackState が理由を返して安全に処理する。
   JSON バックアップ（書き出し／読み込み）も同じ封筒・同じ検証を通す。 */
var state = sampleState();
var sim = MarginSim.simulate(state);
var ui = { view: "dashboard", selectedInsId: state.instruments[0].id, selectedDrop: null, chartScale: "auto", detailOpen: false };

function recalc(){ sim = MarginSim.simulate(state); scheduleSave(); }

/* 形式バージョン付きで包む／検証して開く（自動保存・復元・JSON 共通） */
function packState(st, savedAt){
  return { app: "margin-nanpin-planner", version: DATA_VERSION, savedAt: savedAt || new Date().toISOString(), data: st };
}
function unpackState(payload){
  if (!payload || typeof payload !== "object") return { ok: false, reason: "corrupt" };
  var raw = (payload.data && typeof payload.data === "object") ? payload.data : payload;
  var ver = num(payload.version !== undefined ? payload.version : raw.version, NaN);
  if (!isFinite(ver)) return { ok: false, reason: "corrupt" };
  if (ver > DATA_VERSION) return { ok: false, reason: "version", foundVersion: ver };
  if (!raw || typeof raw !== "object" || (!Array.isArray(raw.instruments) && !raw.account)) return { ok: false, reason: "corrupt" };
  var clean = sanitizeState(raw); /* 旧バージョンは現行形式の既定値で補いながら移行する */
  if (!clean) return { ok: false, reason: "corrupt" };
  return { ok: true, state: clean, fromVersion: ver };
}

/* ---------- IndexedDB ストレージ層 ---------- */
var IDB_NAME = "nanpin-planner-db", IDB_STORE = "kv", IDB_KEY = "app-state", IDB_CORRUPT_KEY = "app-state-corrupt-backup";
var persistenceReady = false; /* 初回読み込みが終わるまで自動保存しない（サンプルで保存済みデータを上書きしないため） */
var storageBlocked = false;   /* 新しい形式の保存データを検出したときは、上書き防止のため自動保存を止める */
var storageAvailable = true;  /* 埋め込み表示など IndexedDB が使えない環境では false になり、JSON のみで運用する */
var lastSavedAt = "";
var loadWarning = "";         /* "" | "corrupt" | "version" */
var loadWarningVersion = null;
var saveTimer = null, savePending = false;

function idbOpen(){
  return new Promise(function(resolve, reject){
    if (!("indexedDB" in window)) { reject(new Error("IndexedDB unavailable")); return; }
    var req = window.indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error("IndexedDB open failed")); };
    req.onblocked = function(){ reject(new Error("IndexedDB blocked")); };
  });
}
function idbRun(mode, fn){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, mode);
      var req = null;
      try { req = fn(tx.objectStore(IDB_STORE)); } catch (e) { try { db.close(); } catch (e2) {} reject(e); return; }
      tx.oncomplete = function(){ db.close(); resolve(req ? req.result : null); };
      tx.onabort = function(){ db.close(); reject(tx.error || new Error("IndexedDB aborted")); };
      tx.onerror = function(){ reject(tx.error || new Error("IndexedDB failed")); };
    });
  });

function scheduleSave(){

/* 起動時の復元：保存データがあれば検証して読み込む。なければ現在の（サンプル）状態を初回保存する */
function initPersistence(){
  idbGet(IDB_KEY).then(function(record){
    if (record === undefined || record === null){
      persistenceReady = true;
      savePending = true;
      saveNow();
      return;
    }
    var res = unpackState(record);
    if (res.ok){
      state = res.state;
      ui.selectedInsId = state.instruments.length ? state.instruments[0].id : null;
      ui.selectedDrop = null;
      if (record.savedAt) { var d = new Date(record.savedAt); if (isFinite(d.getTime())) lastSavedAt = d.toLocaleString("ja-JP"); }
      persistenceReady = true;
      sim = MarginSim.simulate(state);
      render();
      setSaveStatus("保存データを復元しました");
      toast("前回保存したデータを復元しました。");
      return;
    }
    if (res.reason === "version"){
      /* 新しい形式：内容を推測で読まず、上書きもしない */
      storageBlocked = true; loadWarning = "version"; loadWarningVersion = res.foundVersion;
      persistenceReady = true;
      setSaveStatus("保存データの形式が新しいため未読込");
      render();
      toast("保存データは新しい形式のため読み込めませんでした。自動保存は停止しています。");
      return;
    }
    /* 破損：原本を退避キーへ移してから初期データで開始し、自動保存を再開する */
    loadWarning = "corrupt";
    idbPut(IDB_CORRUPT_KEY, record).then(function(){ return idbDel(IDB_KEY); }).catch(function(){}).then(function(){
      persistenceReady = true;
      savePending = true;
      saveNow();
      render();
      toast("保存データが破損していたため、初期データで開始しました。");
    });
  }).catch(function(){
    storageAvailable = false;
    persistenceReady = true;
    setSaveStatus("自動保存を利用できません");
    render();
  });
}

    + '<div class="rowflex" style="justify-content:flex-end;margin-bottom:6px"><span style="font-size:.8rem;color:var(--muted);font-weight:700">縦軸</span><span class="seg" role="group" aria-label="縦軸スケール">'
    + '<button data-scale="auto" aria-pressed="' + (ui.chartScale !== "linear") + '">対数</button><button data-scale="linear" aria-pressed="' + (ui.chartScale === "linear") + '">線形</button></span></div>'
    + '<div class="chartbox">' + chartSVG() + "</div>"
    + '<div class="legend"><span><span class="sw"></span>シミュレーション維持率</span><span><span class="sw dash mgmt"></span>自主管理基準 ' + st.management + '%</span><span><span class="sw dash call"></span>追証基準 ' + st.marginCall + '%</span><span><span class="dotkey"></span>購入予定段階</span></div>'
    + "</div>";

  var detailMeta = "全" + sim.rows.length + "段階（0%〜−" + st.maxDrop + "%）"
    + " ・ 管理基準到達：" + (sim.firstMgmt ? "<strong>−" + sim.firstMgmt.drop + "%</strong>" : "なし")
    + " ・ 追証基準到達：" + (sim.firstCall ? "<strong>−" + sim.firstCall.drop + "%</strong>" : "なし")
    + (ui.selectedDrop !== null ? " ・ 選択中：<strong>−" + ui.selectedDrop + "%</strong>" : "");
  html += '<details class="card detail-card" id="dropDetail"' + (ui.detailOpen ? " open" : "") + '><summary aria-label="下落率別の詳細を開閉する"><div class="detail-summary-in"><div class="detail-summary-main"><h2>下落率別の詳細（シミュレーション）</h2><div class="detail-summary-meta">' + detailMeta + ' — タップで表を開きます</div></div><span class="detail-toggle"><span class="label-open">詳細を開く</span><span class="label-close">閉じる</span><span class="chev" aria-hidden="true">▼</span></span></div></summary><div class="detail-body"><p class="sub">実口座の現在値ではなく、各下落率まで相場が下落し、到達した購入段階をすべて実行した場合の推計です。新規建余力は概算です。行を選ぶとグラフ上に位置を示します。</p><div class="tblwrap"><table class="dt"><thead><tr>'
    + "<th>下落率</th><th>累計購入額</th><th>建玉総額</th><th>評価損益</th><th>代用評価額</th><th>維持率</th><th>新規建余力（概算）</th><th>状態</th></tr></thead><tbody>";
  sim.rows.forEach(function(r){
    var rs = rateStatus(r.rate);
    var rowCls = ui.selectedDrop === r.drop ? "sel" : (r.rate !== null && r.rate < st.marginCall ? "row-danger" : (r.rate !== null && r.rate < st.management ? "row-warn" : ""));
    var stateLabel = r.rate === null ? "対象外" : rs.label;
    if (r.infeasibleCount > 0) stateLabel += "・購入不能あり";
    html += '<tr data-drop="' + r.drop + '" class="' + rowCls + '"><td class="num">−' + r.drop + '%</td><td class="num" data-label="累計購入額">' + fmtYenShort(r.newPrincipal) + '円</td><td class="num" data-label="建玉総額">' + fmtYenShort(r.totalPrincipal) + '円</td><td class="num" data-label="評価損益">' + fmtSignedYen(r.totalPnl) + '</td><td class="num" data-label="代用評価額">' + fmtYenShort(r.collateral) + '円</td><td class="num" data-label="維持率"><strong>' + fmtPct(r.rate) + '</strong></td><td class="num" data-label="新規建余力（概算）">' + fmtYenShort(r.capacity) + '円</td><td data-label="状態"><span class="pill ' + rs.cls + '">' + esc(stateLabel) + "</span></td></tr>";
  });
  html += "</tbody></table></div>";
  if (sim.rows.some(function(r){ return r.existingPnlApprox; })){
    html += '<p class="hint">※ 既存建玉の一部は評価損益が未入力のため、評価損益の推計は概算です（未入力分は現在損益0として下落変動のみ反映）。正確な値が必要な場合は「口座・保有状況」で評価損益を入力してください。</p>';
  }
  html += "</div></details>";

  html += '<div class="card"><h2>現在の実口座情報</h2><p class="sub">シミュレーション値ではなく、登録されている現在の口座情報です。</p><dl class="kv">'
    + "<dt>証券会社</dt><dd>" + (state.account.broker ? esc(state.account.broker) : "未登録") + "</dd>"
    + "<dt>代用有価証券評価額（" + (state.account.collateralBasis === "after" ? "掛目適用後" : "掛目適用前・時価") + "）</dt><dd class='num'>" + fmtYen(state.account.collateral) + "</dd>"
    + "<dt>委託保証金現金</dt><dd class='num'>" + fmtYen(state.account.cash) + "</dd>"
    + "<dt>既存建玉 建代金合計</dt><dd class='num'>" + fmtYen(cur.principal) + "</dd>"
    + "<dt>推計保証金残高</dt><dd class='num'>" + fmtYen(cur.balance) + "</dd>"
    + "<dt>情報更新日時</dt><dd>" + (state.meta.updatedAt ? esc(state.meta.updatedAt) : "未記録") + "</dd></dl>"
    + '<div class="rowflex mt"><button class="btn" data-goto="account">口座情報を編集</button><button class="btn" data-goto="plan">購入計画を編集</button></div></div>';

  el.innerHTML = html;

  if (detailEl){ detailEl.addEventListener("toggle", function(){ ui.detailOpen = detailEl.open; var meta = detailEl.querySelector(".detail-summary-meta"); if (meta && !detailEl.open){ /* 閉じたときも要約はそのまま（再描画なしで状態だけ保持） */ } }); }

}
function kpi(label, value, note, cls){
  return '<div class="kpi ' + (cls || "") + '"><div class="k-label">' + esc(label) + '</div><div class="k-value num">' + value + '</div><div class="k-note">' + esc(note) + "</div></div>";
}

/* ---------- 維持率グラフ（手書きSVG） ---------- */
function chartSVG(){
  var st = state.settings, rows = sim.rows.filter(function(r){ return r.rate !== null; });
  var W = 760, H = 380, L = 84, R = 16, T = 14, B = 40, iw = W - L - R, ih = H - T - B;
  if (!rows.length) return '<p class="hint">建玉がないため、維持率グラフは表示できません（対象外）。購入計画を登録すると、計画実行後の維持率が表示されます。</p>';
  var maxRate = Math.max.apply(null, rows.map(function(r){ return r.rate; }));
  var useLog = ui.chartScale !== "linear" && maxRate > 300;
  var yMin = useLog ? 5 : 0;
  var yMax = useLog ? Math.pow(10, Math.ceil(Math.log10(Math.max(maxRate, 30)))) : Math.max(30, Math.ceil(maxRate * 1.1 / 10) * 10);
  function X(d){ return L + (d / st.maxDrop) * iw; }
  function Y(v){
    if (useLog){ var lo = Math.log10(yMin), hi = Math.log10(yMax); return T + ih - ((Math.log10(Math.max(v, yMin)) - lo) / (hi - lo)) * ih; }
    return T + ih - (v / yMax) * ih;
  }
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="下落率と保証金維持率のシミュレーショングラフ">';
  var ticks = useLog ? [5,10,20,25,50,100,200,500,1000,2000,5000,10000,20000,50000,100000].filter(function(v){ return v >= yMin && v <= yMax; })
                     : (function(){ var a = []; var stepT = yMax > 1000 ? 500 : (yMax > 200 ? 100 : 25); for (var v = 0; v <= yMax; v += stepT) a.push(v); return a; })();
  ticks.forEach(function(v){
    var y = Y(v);
    s += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>'
       + '<text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v.toLocaleString("ja-JP") + "%</text>";
  });
  for (var d = 0; d <= st.maxDrop; d += (st.maxDrop >= 60 ? 10 : 5)){
    var x = X(d);
    s += '<text x="' + x + '" y="' + (H - 18) + '" text-anchor="middle" font-size="11" fill="var(--muted)">−' + d + '%</text>'
       + '<line x1="' + x + '" y1="' + T + '" x2="' + x + '" y2="' + (T + ih) + '" stroke="var(--line)" stroke-width="0.5" opacity="0.5"/>';
  }
  s += '<text x="' + (L + iw / 2) + '" y="' + (H - 2) + '" text-anchor="middle" font-size="11" fill="var(--muted)">下落率</text>';
  function thresh(v, color, label){
    if (v < yMin || v > yMax) return "";
    var y = Y(v);
    return '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="' + color + '" stroke-width="1.6" stroke-dasharray="7 4"/>'
         + '<text x="' + (W - R - 2) + '" y="' + (y - 5) + '" text-anchor="end" font-size="11" font-weight="700" fill="' + color + '">' + label + " " + v + "%</text>";
  }
  s += thresh(st.management, "#d9930d", "自主管理基準");
  s += thresh(st.marginCall, "#d43a31", "追証基準");
  if (ui.selectedDrop !== null){
    var sx = X(ui.selectedDrop);
    s += '<line x1="' + sx + '" y1="' + T + '" x2="' + sx + '" y2="' + (T + ih) + '" stroke="var(--info)" stroke-width="1.6"/>';
  }
  var pts = rows.map(function(r){ return X(r.drop).toFixed(1) + "," + Y(r.rate).toFixed(1); }).join(" ");
  s += '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/>';
  rows.forEach(function(r){
    s += '<circle cx="' + X(r.drop) + '" cy="' + Y(r.rate) + '" r="' + (ui.selectedDrop === r.drop ? 5.5 : 3) + '" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"><title>−' + r.drop + "%：維持率 " + fmtPct(r.rate) + "</title></circle>";
  });
  /* 購入段階マーカー */
  var rateAt = {};
  sim.rows.forEach(function(r){ rateAt[r.drop] = r.rate; });
  var seen = {};
  state.instruments.forEach(function(ins){ ins.stages.forEach(function(sg){
    if (!sg.enabled || sg.dropPct > st.maxDrop) return;
    var row = sim.rows.reduce(function(best, r){ return Math.abs(r.drop - sg.dropPct) < Math.abs(best.drop - sg.dropPct) ? r : best; }, sim.rows[0]);
    if (!row || row.rate === null) return;
    var key = sg.dropPct + ":" + Math.round(row.rate);
    if (seen[key]) return; seen[key] = 1;
    s += '<circle cx="' + X(sg.dropPct) + '" cy="' + Y(row.rate) + '" r="5" fill="#d9930d" stroke="var(--surface)" stroke-width="1.5"><title>' + esc(ins.code) + " −" + sg.dropPct + "% 段階</title></circle>";
  });});
  s += "</svg>";
  return s;
}
</script>
<script>
"use strict";
/* ================= 購入計画 ================= */
function currentInstrument(){
  var ins = state.instruments.filter(function(i){ return i.id === ui.selectedInsId; })[0];
  if (!ins && state.instruments.length){ ins = state.instruments[0]; ui.selectedInsId = ins.id; }

}
function renderPlan(){
  var el = document.getElementById("view-plan");
  var html = '<div class="minibar"><span>計画購入総額（実購入） <b class="num">' + fmtYen(sim.planCost) + '</b></span><span>予算合計 <b class="num">' + fmtYen(sim.planBudget) + '</b></span><span>管理基準の最初の到達 <b>' + (sim.firstMgmt ? "−" + sim.firstMgmt.drop + "%" : "なし（−" + state.settings.maxDrop + "%まで）") + '</b></span><span>想定最大評価損 <b class="num">' + fmtSignedYen(sim.minPnl) + "</b></span></div>";

  }
  var quote = PriceFeed.stock(pricesData, ins.code);

  var refBaseVal = ixBase ? ixBase.close : ins.ref.baseValue;

  function chgPill(v){ return v === null ? '<span class="pill mute">—</span>' : '<span class="pill ' + (v >= 0 ? "up" : "down") + '">' + (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) + "%</span>"; }
  function fmtIdx(v){ return (v === null || v === undefined || !isFinite(v)) ? "データなし" : Number(v).toLocaleString("ja-JP", { maximumFractionDigits: 2 }); }

  html += '<div class="grid2" style="margin-top:14px"><div class="card" style="margin-top:0"><h2>銘柄情報' + (ins.baseIsSample ? ' <span class="badge sample">取得価格は仮のサンプル値</span>' : "") + '</h2>'
    + '<p class="sub">購入トリガーは、この銘柄自身の<strong>取得価格</strong>からの下落率です。最新終値は終値データ（prices.json）から自動で取り込み、取得価格との騰落率を表示します。「銘柄情報を取得」を押すと、登録済みコードでは銘柄名・区分・売買単位（ETFは1口／10口など銘柄ごとに異なります）も終値データの値に合わせて取り込みます。</p>'
    + '<div class="coderow"><div class="field" style="flex:1;min-width:0"><label class="flabel" for="f_code">銘柄コード</label><input type="text" id="f_code" value="' + esc(ins.code) + '" autocomplete="off"></div><button class="btn" id="fetchQuote" type="button">銘柄情報を取得</button></div>'
    + '<p class="hint">' + (pricesStatus === "ok"
        ? (quote ? "終値データに登録あり：" + esc(quote.closeDate) + " 終値 " + fmtYen(quote.close) + (quote.name ? "／" + esc(quote.name) : "") + "／" + (quote.type === "ETF" ? "ETF" : "個別株式") + "・売買単位 " + quote.unit
                 : "このコードは終値データに未登録です。登録済みコードは銘柄名・区分・売買単位・終値が自動で入ります。未登録の場合は各欄を手入力してください。")
        : pricesStatusText()) + '</p>'
    + '<div class="formgrid">'
    + fld("銘柄名", '<input type="text" id="f_name" value="' + esc(ins.name) + '" autocomplete="off">')

    + '<div class="pricepanel"><div class="pp-cell"><div class="pp-label">最新終値' + (ins.closePrice !== null ? "（" + esc(ins.closeDate || "日付不明") + (ins.closeSource === "json" ? "・終値データ" : "・手入力") + "）" : "") + '</div><div class="pp-value num">' + (ins.closePrice !== null ? fmtYen(ins.closePrice) : "未取得") + '</div></div>'

        : "")

    + '<div class="card" style="margin-top:0"><h2>参考指数（比較用）</h2>'

    + "</div>"

      ? '<p class="hint">参考指数は未設定です。選ぶと比較表示が有効になります。</p>'
      : '<div class="pricepanel"><div class="pp-cell"><div class="pp-label">基準日の終値' + (refBaseVal !== null && refBaseVal !== undefined ? "（" + esc(refBaseDateUsed || "") + (ixBase ? (ixBase.exact ? "・終値データ" : "・直近の営業日") : "・手入力") + "）" : "") + '</div><div class="pp-value num">' + fmtIdx(refBaseVal) + '</div></div>'

        + '<div class="pp-cell"><div class="pp-label">基準日からの騰落率</div><div class="pp-value">' + (refChg === null ? "—" : chgPill(refChg)) + "</div></div></div>"
        + (!ixBase ? '<div style="margin-top:10px">' + fld("基準日の終値を手入力", '<input type="number" id="f_refbase" min="0" step="0.01" value="' + (ins.ref.baseValue === null ? "" : ins.ref.baseValue) + '" placeholder="終値データに無い場合は手入力">') + "</div>" : "")
        + (!ixLatest ? '<div style="margin-top:10px">' + fld("最新値を手入力", '<input type="number" id="f_refcur" min="0" step="0.01" value="' + (ins.ref.currentValue === null ? "" : ins.ref.currentValue) + '" placeholder="終値データに無い場合は手入力">') + "</div>" : "")
        + '<p class="hint">' + ((ixLatest || ixBase) ? "終値データ（prices.json）から自動表示しています。" : "この指数の終値データは未取得のため、手入力値で騰落率を計算します。") + "</p>")
    + "</div></div>";

  var sorted = ins.stages.slice().sort(function(a, b){ return a.dropPct - b.dropPct; });
  html += '<div class="card"><h2>ナンピン購入計画（' + esc(ins.code) + " " + esc(ins.name) + '）</h2>'
    + '<p class="sub">購入数量は売買単位（' + ins.unit + '）で切り捨て、実購入額が予算を超えないように計算します。想定価格は取得価格×(1−下落率)を円未満切り捨て。変更は全体の維持率シミュレーションへ即時反映されます。</p>'
    + '<div class="rowflex"><button class="btn primary small" id="addStage">＋ 購入段階を追加</button><button class="btn small" id="resetPlan">計画を初期化</button></div>'
    + '<div id="stageList">';
  sorted.forEach(function(sg){
    var r = sim.stageRes[sg.id] || { price: 0, qty: 0, cost: 0, feasible: false, reason: "", cumBudget: 0 };
    var statusPill = !sg.enabled ? '<span class="pill mute">無効</span>'
      : (r.qty <= 0 ? '<span class="pill danger">実行不能：' + esc(r.reason) + "</span>"
      : (r.feasible ? '<span class="pill safe">実行予定</span>' : '<span class="pill danger">実行不能（概算判定）</span>'));
    html += '<div class="stagerow' + (sg.enabled ? "" : " off") + '" data-stage="' + sg.id + '">'
      + '<div class="sr-top"><label class="switchlabel"><input type="checkbox" data-act="toggle" ' + (sg.enabled ? "checked" : "") + "> 有効</label>"
      + "<strong>−" + sg.dropPct + "% 段階</strong>" + statusPill
      + '<span style="margin-left:auto"></span><button class="btn small danger-outline" data-act="del">この段階を削除</button></div>'
      + '<div class="sr-grid">'
      + fld("下落率（%）", '<input type="number" data-act="drop" aria-label="下落率（%）" min="0" max="100" step="0.5" value="' + sg.dropPct + '">')
      + '<div class="calc"><div class="cl">想定購入価格</div><div class="cv num" data-cell="price">' + fmtYen(r.price) + "</div></div>"
      + fld("追加購入予定額（予算・円）", '<input type="number" data-act="budget" aria-label="追加購入予定額（予算・円）" min="0" step="1000" value="' + sg.budget + '">')
      + '<div class="calc"><div class="cl">累計購入予定額（予算）</div><div class="cv num" data-cell="cum">' + fmtYen(r.cumBudget) + "</div></div>"
      + "</div>"
      + '<label class="flabel" style="margin-top:8px">購入額スライダー（0〜100万円）</label><input type="range" data-act="slider" min="0" max="1000000" step="2500" value="' + Math.min(sg.budget, 1000000) + '" aria-label="購入額スライダー">'
      + '<div class="sr-grid">'
      + '<div class="calc"><div class="cl">購入数量（' + (ins.type === "ETF" ? "口" : "株") + '）</div><div class="cv num" data-cell="qty">' + r.qty.toLocaleString("ja-JP") + "</div></div>"
      + '<div class="calc"><div class="cl">実購入予定額</div><div class="cv num" data-cell="cost">' + fmtYen(r.cost) + "</div></div>"
      + '<div class="calc"><div class="cl">予算との差</div><div class="cv num" data-cell="diff">' + fmtYen(sg.budget - r.cost) + "</div></div>"
      + '<div class="calc"><div class="cl">実行状態の詳細</div><div style="font-size:.8rem" data-cell="reason">' + (sg.enabled ? esc(r.feasible ? "トリガー到達時点で必要保証金を満たす見込み（概算）" : r.reason) : "無効のため計算対象外") + "</div></div>"
      + "</div></div>";
  });
  var planBudgetIns = ins.stages.filter(function(s){ return s.enabled; }).reduce(function(a, s){ return a + s.budget; }, 0);
  var planCostIns = ins.stages.filter(function(s){ return s.enabled; }).reduce(function(a, s){ var r = sim.stageRes[s.id]; return a + (r ? r.cost : 0); }, 0);
  html += '</div><p class="hint">この銘柄の計画：予算合計 <strong class="num">' + fmtYen(planBudgetIns) + '</strong>／実購入予定合計 <strong class="num">' + fmtYen(planCostIns) + "</strong>（差は売買単位への丸めによる未使用分）</p></div>";
  el.innerHTML = html;
  bindPlanCommon(el);
  bindInstrumentForm(el, ins);
  bindStages(el, ins);
}
function fld(label, inner){ var m = inner.match(/id="([^"]+)"/); var f = m ? ' for="' + m[1] + '"' : ""; return '<div class="field"><label class="flabel"' + f + ">" + esc(label) + "</label>" + inner + "</div>"; }
function bindPlanCommon(el){
  el.querySelectorAll("[data-ins]").forEach(function(b){ b.onclick = function(){ ui.selectedInsId = b.getAttribute("data-ins"); renderPlan(); }; });
  var add = el.querySelector("#addIns");
  if (add) add.onclick = function(){
    var ni = { id: uid("ins"), code: "", name: "", type: "stock", acquiredPrice: 0, closePrice: null, closeDate: "", closeSource: "", unit: 100, baseIsSample: false,
               ref: { name: "なし", baseDate: "", baseValue: null, currentValue: null },
               stages: [{ id: uid("st"), dropPct: 5, budget: 100000, enabled: true }] };
    state.instruments.push(ni); ui.selectedInsId = ni.id; state.meta.isSample = false;
    recalc(); renderPlan(); toast("銘柄を追加しました。コード・取得価格を入力してください。");
  };
}
function commitIns(ins, patch){ Object.keys(patch).forEach(function(k){ ins[k] = patch[k]; }); recalc(); }
function bindInstrumentForm(el, ins){
  function on(id, fn){ var n = el.querySelector(id); if (n) n.addEventListener("change", function(){ fn(n); recalc(); renderPlan(); }); }
  on("#f_code", function(n){
    var nc = normalizeCode(n.value);
    if (nc !== ins.code){
      ins.code = nc;
      /* コードが変わったら終値データから銘柄名・区分・売買単位・終値を取り直す。
         未登録コードに変えた場合は、前の銘柄の終値（データ由来）を残さずクリアする（手入力の終値は残す） */
      if (PriceFeed.stock(pricesData, nc)){ applyPricesToState(); }
      else if (ins.closeSource === "json"){
        ins.closePrice = null; ins.closeDate = ""; ins.closeSource = "";
      }
    }
  });
  on("#f_name", function(n){ ins.name = n.value.trim().slice(0, 80); });
  on("#f_type", function(n){ ins.type = n.value === "stock" ? "stock" : "ETF"; });
  on("#f_unit", function(n){ ins.unit = Math.max(1, Math.round(num(n.value, 1))); });
  on("#f_acq", function(n){ ins.acquiredPrice = clamp(num(n.value, 0), 0, 1e9); ins.baseIsSample = false; });
  on("#f_close", function(n){ ins.closePrice = n.value === "" ? null : clamp(num(n.value, 0), 0, 1e9); if (ins.closePrice !== null) ins.closeSource = "manual"; });
  on("#f_closedate", function(n){ ins.closeDate = n.value; });
  var fq = el.querySelector("#fetchQuote");
  if (fq) fq.onclick = function(){
    var codeInput = el.querySelector("#f_code");
    ins.code = normalizeCode(codeInput ? codeInput.value : "");
    if (pricesStatus !== "ok"){ toast("終値データ（prices.json）を取得できていません。再読み込みします。"); recalc(); loadPrices(); return; }
    var q = PriceFeed.stock(pricesData, ins.code);
    if (!q){ recalc(); renderPlan(); toast("コード「" + ins.code + "」は終値データに未登録です。銘柄名・売買単位・終値は手入力できます。"); return; }
    /* 終値だけでなく、銘柄名・区分・売買単位も終値データの値で取り込む（明示的に取得を押した操作なので上書きする） */
    ins.closePrice = q.close; ins.closeDate = q.closeDate; ins.closeSource = "json";
    var filled = [];
    if (q.name){ ins.name = q.name; filled.push("銘柄名"); }
    ins.type = q.type; filled.push(q.type === "ETF" ? "区分（ETF）" : "区分（個別株式）");
    ins.unit = q.unit; filled.push("売買単位 " + q.unit);
    filled.push(q.closeDate + " 終値 " + fmtYen(q.close));
    recalc(); renderPlan();
    toast("銘柄情報を取り込みました：" + filled.join("・"));
  };
  on("#f_refname", function(n){ ins.ref.name = n.value; });
  on("#f_refdate", function(n){ ins.ref.baseDate = n.value; });
  on("#f_refbase", function(n){ ins.ref.baseValue = n.value === "" ? null : num(n.value, NaN); if (!isFinite(ins.ref.baseValue)) ins.ref.baseValue = null; });
  on("#f_refcur", function(n){ ins.ref.currentValue = n.value === "" ? null : num(n.value, NaN); if (!isFinite(ins.ref.currentValue)) ins.ref.currentValue = null; });
  var dup = el.querySelector("#dupIns");
  if (dup) dup.onclick = function(){
    showModal('<h3>計画の複製</h3><p style="margin:0 0 10px">銘柄情報と購入計画を複製します。新しい銘柄コードを入力してください。</p>'
      + '<label class="flabel">新しい銘柄コード</label><input type="text" id="dupCode" value="' + esc(ins.code) + '">'
      + '<label class="flabel" style="margin-top:10px">新しい銘柄名</label><input type="text" id="dupName" value="' + esc(ins.name) + '（複製）">'
      + '<div class="rowflex" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="mCancel">キャンセル</button><button class="btn primary" id="mOk">複製する</button></div>');
    document.getElementById("mCancel").onclick = closeModal;
    document.getElementById("mOk").onclick = function(){
      var copy = JSON.parse(JSON.stringify(ins));
      copy.id = uid("ins"); copy.code = normalizeCode(document.getElementById("dupCode").value);
      copy.name = document.getElementById("dupName").value.trim().slice(0, 80); copy.baseIsSample = false;
      copy.stages.forEach(function(s){ s.id = uid("st"); });
      state.instruments.push(copy); ui.selectedInsId = copy.id;
      closeModal(); recalc(); renderPlan(); toast("計画を複製しました。");
    };
  };
  var del = el.querySelector("#delIns");
  if (del) del.onclick = function(){
    confirmModal("銘柄を削除しますか", "銘柄「" + esc(ins.code) + " " + esc(ins.name) + "」とその購入計画を削除します。この操作は取り消せません。", "削除する", function(){
      state.instruments = state.instruments.filter(function(i){ return i.id !== ins.id; });
      ui.selectedInsId = state.instruments.length ? state.instruments[0].id : null;
      recalc(); renderPlan(); toast("銘柄を削除しました。");
    });
  };
  var addStage = el.querySelector("#addStage");
  if (addStage) addStage.onclick = function(){
    var maxDrop = ins.stages.length ? Math.max.apply(null, ins.stages.map(function(s){ return s.dropPct; })) : 0;
    ins.stages.push({ id: uid("st"), dropPct: Math.min(100, maxDrop + 5), budget: 100000, enabled: true });
    recalc(); renderPlan();
  };
  var reset = el.querySelector("#resetPlan");
  if (reset) reset.onclick = function(){
    confirmModal("購入計画を初期化しますか", ins.code === "1308"
      ? "この銘柄の計画を初期サンプル（−5%〜−65%、累計予算 4,500,000円）に戻します。"
      : "この銘柄の購入計画をすべて削除し、−5%・10万円の1段階だけの初期状態に戻します。", "初期化する", function(){
      ins.stages = ins.code === "1308" ? sampleStages() : [{ id: uid("st"), dropPct: 5, budget: 100000, enabled: true }];
      recalc(); renderPlan(); toast("購入計画を初期化しました。");
    });
  };
}
function bindStages(el, ins){
  el.querySelectorAll("[data-stage]").forEach(function(row){
    var sid = row.getAttribute("data-stage");
    var sg = ins.stages.filter(function(s){ return s.id === sid; })[0];
    if (!sg) return;
    row.querySelectorAll("[data-act]").forEach(function(ctrl){
      var act = ctrl.getAttribute("data-act");
      if (act === "toggle"){ ctrl.addEventListener("change", function(){ sg.enabled = ctrl.checked; recalc(); renderPlan(); }); }
      else if (act === "del"){ ctrl.addEventListener("click", function(){
        confirmModal("購入段階を削除しますか", "−" + sg.dropPct + "%／予算 " + fmtYen(sg.budget) + " の段階を削除します。", "削除する", function(){
          ins.stages = ins.stages.filter(function(s){ return s.id !== sid; }); recalc(); renderPlan();
        });
      }); }
      else if (act === "drop"){ ctrl.addEventListener("change", function(){ sg.dropPct = clamp(num(ctrl.value, sg.dropPct), 0, 100); recalc(); renderPlan(); }); }
      else if (act === "budget"){
        ctrl.addEventListener("input", function(){ sg.budget = clamp(Math.round(num(ctrl.value, 0)), 0, 1e12); recalc(); refreshStageRow(row, ins, sg); refreshMinibar(); });
        ctrl.addEventListener("change", function(){ renderPlan(); });
      }
      else if (act === "slider"){
        ctrl.addEventListener("input", function(){
          sg.budget = num(ctrl.value, 0);
          var b = row.querySelector('[data-act="budget"]'); if (b) b.value = sg.budget;
          recalc(); refreshStageRow(row, ins, sg); refreshMinibar();
        });
        ctrl.addEventListener("change", function(){ renderPlan(); });
      }
    });
  });
}
function refreshStageRow(row, ins, sg){
  var r = sim.stageRes[sg.id]; if (!r) return;
  function set(cell, txt){ var n = row.querySelector('[data-cell="' + cell + '"]'); if (n) n.textContent = txt; }
  set("price", fmtYen(r.price)); set("cum", fmtYen(r.cumBudget)); set("qty", r.qty.toLocaleString("ja-JP"));
  set("cost", fmtYen(r.cost)); set("diff", fmtYen(sg.budget - r.cost));
  set("reason", sg.enabled ? (r.feasible ? "トリガー到達時点で必要保証金を満たす見込み（概算）" : r.reason) : "無効のため計算対象外");
}
function refreshMinibar(){
  var bar = document.querySelector("#view-plan .minibar");
  if (bar) bar.innerHTML = '<span>計画購入総額（実購入） <b class="num">' + fmtYen(sim.planCost) + '</b></span><span>予算合計 <b class="num">' + fmtYen(sim.planBudget) + '</b></span><span>管理基準の最初の到達 <b>' + (sim.firstMgmt ? "−" + sim.firstMgmt.drop + "%" : "なし（−" + state.settings.maxDrop + "%まで）") + '</b></span><span>想定最大評価損 <b class="num">' + fmtSignedYen(sim.minPnl) + "</b></span>";
}

/* ================= 口座・保有状況 ================= */
function renderAccount(){
  var el = document.getElementById("view-account"), a = state.account, cur = sim.current;
  var html = '<div class="card"><h2>口座情報</h2><p class="sub">代用有価証券評価額は<strong>掛目適用後の評価額</strong>を標準入力とします。掛目適用前の時価を入力する場合は、下の区分を切り替えてください（計算では入力値をそのまま代用評価額として扱います）。</p>'
    + '<div class="formgrid c3">'
    + fld("証券会社名", '<input type="text" id="a_broker" value="' + esc(a.broker) + '" placeholder="例：○○証券" autocomplete="off">')
    + fld("代用有価証券評価額（円）", '<input type="number" id="a_collateral" min="0" step="1" value="' + a.collateral + '">')
    + fld("代用評価額の区分", '<select id="a_basis"><option value="after"' + (a.collateralBasis === "after" ? " selected" : "") + '>掛目適用後の評価額（標準）</option><option value="before"' + (a.collateralBasis === "before" ? " selected" : "") + ">掛目適用前の時価</option></select>")
    + fld("委託保証金現金（円）", '<input type="number" id="a_cash" step="1" value="' + a.cash + '">')
    + fld("証券会社表示の保証金維持率（%・任意）", '<input type="number" id="a_brokerRate" min="0" step="0.1" value="' + (a.brokerRate === null ? "" : a.brokerRate) + '" placeholder="未入力">')
    + fld("情報更新日時", '<input type="text" id="a_updated" value="' + esc(state.meta.updatedAt) + '" placeholder="例：2026-11-17 11:30">')
    + "</div>"
    + '<dl class="kv mt"><dt>推計保証金残高（現在）</dt><dd class="num">' + fmtYen(cur.balance) + '</dd>'
    + '<dt>推計維持率（既存建玉のみ）</dt><dd class="num">' + fmtPct(cur.rate) + (cur.pnlApprox ? "（評価損益未入力分あり・概算）" : "") + "</dd>"
    + (a.brokerRate !== null && cur.rate !== null ? '<dt>証券会社表示との差</dt><dd class="num">' + (a.brokerRate - cur.rate >= 0 ? "+" : "−") + Math.abs(a.brokerRate - cur.rate).toFixed(1) + " pt（計算モデルが異なるため差が生じます）</dd>" : "")
    + "</dl></div>";

  html += '<div class="card"><h2>既存の信用建玉</h2><p class="sub">購入計画とは別に、すでに保有している信用建玉を登録します。評価損益は空欄（未入力）にできます。その場合シミュレーションでは概算として扱い、勝手な値で補完しません。</p>'
    + '<div class="rowflex"><button class="btn primary small" id="addPos">＋ 建玉を追加</button></div><div id="posList">';
  state.positions.forEach(function(p){
    html += '<div class="posrow" data-pos="' + p.id + '"><div class="rowflex"><strong>' + esc(p.code || "コード未設定") + " " + esc(p.name || "") + '</strong><span class="pill ' + (p.side === "buy" ? "info" : "warn") + '">' + (p.side === "buy" ? "買建" : "売建") + '</span><span style="margin-left:auto"></span><button class="btn small danger-outline" data-pact="del">削除</button></div>'
      + '<div class="pr-grid">'
      + fld("銘柄コード", '<input type="text" data-pact="code" aria-label="建玉の銘柄コード" value="' + esc(p.code) + '" autocomplete="off">')
      + fld("銘柄名・メモ", '<input type="text" data-pact="name" aria-label="建玉の銘柄名・メモ" value="' + esc(p.name) + '" autocomplete="off">')
      + fld("買建・売建", '<select data-pact="side" aria-label="買建・売建"><option value="buy"' + (p.side === "buy" ? " selected" : "") + '>買建</option><option value="sell"' + (p.side === "sell" ? " selected" : "") + ">売建</option></select>")
      + fld("建代金（円）", '<input type="number" data-pact="principal" aria-label="建代金（円）" min="0" step="1" value="' + p.principal + '">')
      + fld("現在の評価損益（円・空欄=未入力）", '<input type="number" data-pact="pnl" aria-label="現在の評価損益（円）" step="1" value="' + (p.pnl === null ? "" : p.pnl) + '" placeholder="未入力">')
      + "</div></div>";
  });
  var totP = state.positions.reduce(function(s, p){ return s + p.principal; }, 0);

  el.innerHTML = html;

  function on(id, fn){ var n = el.querySelector(id); if (n) n.addEventListener("change", function(){ fn(n); recalc(); renderAccount(); }); }
  on("#a_broker", function(n){ a.broker = n.value.trim().slice(0, 60); state.meta.isSample = false; });
  on("#a_collateral", function(n){ a.collateral = clamp(num(n.value, 0), 0, 1e12); state.meta.isSample = false; });
  on("#a_basis", function(n){ a.collateralBasis = n.value === "before" ? "before" : "after"; });
  on("#a_cash", function(n){ a.cash = clamp(num(n.value, 0), -1e12, 1e12); state.meta.isSample = false; });
  on("#a_brokerRate", function(n){ a.brokerRate = n.value === "" ? null : num(n.value, NaN); if (!isFinite(a.brokerRate)) a.brokerRate = null; });
  on("#a_updated", function(n){ state.meta.updatedAt = n.value.trim(); });
  el.querySelector("#addPos").onclick = function(){
    state.positions.push({ id: uid("pos"), code: "", name: "", side: "buy", principal: 0, pnl: null });
    recalc(); renderAccount();
  };
  el.querySelectorAll("[data-pos]").forEach(function(row){
    var p = state.positions.filter(function(x){ return x.id === row.getAttribute("data-pos"); })[0];
    if (!p) return;
    row.querySelectorAll("[data-pact]").forEach(function(ctrl){
      var act = ctrl.getAttribute("data-pact");
      if (act === "del"){ ctrl.addEventListener("click", function(){
        confirmModal("建玉を削除しますか", "「" + esc(p.name || p.code || "建玉") + "」（建代金 " + fmtYen(p.principal) + "）を削除します。", "削除する", function(){
          state.positions = state.positions.filter(function(x){ return x.id !== p.id; }); recalc(); renderAccount();
        });
      }); return; }
      ctrl.addEventListener("change", function(){
        if (act === "code") p.code = normalizeCode(ctrl.value);
        else if (act === "name") p.name = ctrl.value.trim().slice(0, 60);
        else if (act === "side") p.side = ctrl.value === "sell" ? "sell" : "buy";
        else if (act === "principal") p.principal = clamp(num(ctrl.value, 0), 0, 1e12);
        else if (act === "pnl"){ p.pnl = ctrl.value === "" ? null : num(ctrl.value, NaN); if (!isFinite(p.pnl)) p.pnl = null; }
        recalc(); renderAccount();
      });
    });
  });
}
</script>
<script>
"use strict";
/* ================= 設定・データ管理 ================= */
function renderSettings(){

  var html = '<div class="grid2 wide"><div>'

    + fld("シミュレーション刻み幅（%）", '<input type="number" id="s_step" min="1" max="50" step="1" value="' + s.step + '">')
