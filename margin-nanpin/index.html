/* ---------- 価格中継への取得（10秒タイムアウト） ---------- */
function fetchRelayQuote(code, relayUrl){
  var base = sanitizeRelayUrl(relayUrl || "");
  if (!base) return Promise.reject({ reason: "nourl", message: "中継URLが設定されていません" });
  var c = normalizeCode(code);
  if (!c) return Promise.reject({ reason: "invalid", message: "銘柄コードが空です" });
  var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ try { ctrl.abort(); } catch (e) {} }, 10000) : null;
  var opts = { cache: "no-store" };
  if (ctrl) opts.signal = ctrl.signal;
  return fetch(base + "/?code=" + encodeURIComponent(c), opts).then(function(res){
    if (timer) clearTimeout(timer);
    if (res.status === 404) throw { reason: "notfound", status: 404 };
    if (!res.ok) throw { reason: "http", status: res.status, message: "HTTP " + res.status };
    return res.json();
  }).then(function(json){
    var parsed = RelayFeed.parse(json, c);
    if (!parsed.ok) throw { reason: parsed.reason || "invalid", message: parsed.message || "" };
    return parsed.data;
  }).catch(function(err){
    if (timer) clearTimeout(timer);
    if (err && err.reason) throw err;
    if (err && err.name === "AbortError") throw { reason: "timeout", message: "タイムアウトしました" };
    throw { reason: "network", message: err && err.message ? String(err.message) : "通信に失敗しました" };
  });
}
function fetchRelayHealth(relayUrl){
  var base = sanitizeRelayUrl(relayUrl || "");
  if (!base) return Promise.reject({ reason: "nourl", message: "中継URLが空欄です" });
  var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ try { ctrl.abort(); } catch (e) {} }, 10000) : null;
  var opts = { cache: "no-store" };
  if (ctrl) opts.signal = ctrl.signal;
  return fetch(base + "/", opts).then(function(res){
    if (timer) clearTimeout(timer);
    if (!res.ok) throw { reason: "http", status: res.status, message: "HTTP " + res.status + " が返りました" };
    return res.json();
  }).then(function(json){
    if (timer) clearTimeout(timer);
    if (json && json.ok === true) return json;
    throw { reason: "invalid", message: "ok:true が返りませんでした" };
  }).catch(function(err){
    if (timer) clearTimeout(timer);
    if (err && err.reason) throw err;
    if (err && err.name === "AbortError") throw { reason: "timeout", message: "タイムアウトしました（10秒）" };
    throw { reason: "network", message: err && err.message ? String(err.message) : "通信に失敗しました" };

}

  if (!targets.length) return Promise.resolve(false);

    chain = chain.then(function(){
      return fetchRelayQuote(ins.code, relayUrl).then(function(data){
        if (RelayFeed.applyToInstrument(ins, data, { auto: true })) changed = true;

/* 価格データの鮮度判定：取得日時（generatedAt）が2日以上前、または最新の終値の対象営業日が5日以上前なら「古い可能性」を返す */
function priceFreshness(){
  if (pricesStatus !== "ok" || !pricesData) return { stale: false, reasons: [] };
  var reasons = [];
  var now = Date.now();
  var gen = pricesData.generatedAt ? Date.parse(pricesData.generatedAt) : NaN;
  if (isFinite(gen) && now - gen > 2 * 24 * 3600 * 1000) reasons.push("取得日時（" + pricesData.generatedAt + "）が2日以上前です");
  var latest = "";
  Object.keys(pricesData.stocks).forEach(function(c){ if (pricesData.stocks[c].closeDate > latest) latest = pricesData.stocks[c].closeDate; });
  Object.keys(pricesData.indices).forEach(function(n){ if (pricesData.indices[n].latestDate > latest) latest = pricesData.indices[n].latestDate; });
  if (latest){
    var lt = Date.parse(latest + "T00:00:00");
    if (isFinite(lt) && now - lt > 5 * 24 * 3600 * 1000) reasons.push("最新の終値の対象営業日が " + latest + " で、直近の営業日から大きく離れています");
  }
  return { stale: reasons.length > 0, reasons: reasons, latestDate: latest };
}

/* ---------- 維持率グラフ（手書きSVG） ---------- */
function chartSVG(){
  var st = state.settings, rows = sim.rows.filter(function(r){ return r.rate !== null; });
  var W = 760, H = 380, L = 84, R = 16, T = 14, B = 40, iw = W - L - R, ih = H - T - B;
  if (!rows.length) return '<p class="hint">建玉がないため、維持率グラフは表示できません（対象外）。購入計画を登録すると、計画実行後の維持率が表示されます。</p>';
  var maxRate = Math.max.apply(null, rows.map(function(r){ return r.rate; }));
  var useLog = ui.chartScale !== "linear" && maxRate > 300;
  var yMin = useLog ? 5 : 0;
  var yMax = useLog ? Math.pow(10, Math.ceil(Math.log10(Math.max(maxRate, 30)))) : Math.max(30, Math.ceil(maxRate * 1.1 / 10) * 10);
  function X(d){ return L + (d / st.maxDrop) * iw; }
  function Y(v){
    if (useLog){ var lo = Math.log10(yMin), hi = Math.log10(yMax); return T + ih - ((Math.log10(Math.max(v, yMin)) - lo) / (hi - lo)) * ih; }
    return T + ih - (v / yMax) * ih;
  }
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="下落率と保証金維持率のシミュレーショングラフ">';
  var ticks = useLog ? [5,10,20,25,50,100,200,500,1000,2000,5000,10000,20000,50000,100000].filter(function(v){ return v >= yMin && v <= yMax; })
                     : (function(){ var a = []; var stepT = yMax > 1000 ? 500 : (yMax > 200 ? 100 : 25); for (var v = 0; v <= yMax; v += stepT) a.push(v); return a; })();
  ticks.forEach(function(v){
    var y = Y(v);
    s += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>'
       + '<text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v.toLocaleString("ja-JP") + "%</text>";
  });
  var detailedC = isDetailedScenario(state);
  for (var d = 0; d <= st.maxDrop; d += (st.maxDrop >= 60 ? 10 : 5)){
    var x = X(d);
    var tickLabel = detailedC ? (Math.round((st.maxDrop > 0 ? d / st.maxDrop : 0) * 100) + "%（−" + d + "%）") : ("−" + d + "%");
    s += '<text x="' + x + '" y="' + (H - 18) + '" text-anchor="middle" font-size="' + (detailedC ? 10 : 11) + '" fill="var(--muted)">' + tickLabel + '</text>'
       + '<line x1="' + x + '" y1="' + T + '" x2="' + x + '" y2="' + (T + ih) + '" stroke="var(--line)" stroke-width="0.5" opacity="0.5"/>';
  }
  s += '<text x="' + (L + iw / 2) + '" y="' + (H - 2) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + (detailedC ? "進行度（括弧内は基準パスの下落率）" : "下落率") + '</text>';
  function thresh(v, color, label){
    if (v < yMin || v > yMax) return "";
    var y = Y(v);
    return '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="' + color + '" stroke-width="1.6" stroke-dasharray="7 4"/>'
         + '<text x="' + (W - R - 2) + '" y="' + (y - 5) + '" text-anchor="end" font-size="11" font-weight="700" fill="' + color + '">' + label + " " + v + "%</text>";
  }
  s += thresh(st.management, "#d9930d", "自主管理基準");
  s += thresh(st.marginCall, "#d43a31", "追証基準");
  if (ui.selectedDrop !== null){
    var sx = X(ui.selectedDrop);
    s += '<line x1="' + sx + '" y1="' + T + '" x2="' + sx + '" y2="' + (T + ih) + '" stroke="var(--info)" stroke-width="1.6"/>';
  }
  var pts = rows.map(function(r){ return X(r.drop).toFixed(1) + "," + Y(r.rate).toFixed(1); }).join(" ");
  s += '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/>';
  rows.forEach(function(r){
    var titleC = detailedC
      ? "進行度 " + (r.progress * 100).toFixed(1) + "%（" + state.instruments.map(function(ins){ return (normalizeCode(ins.code) || "—") + " −" + (r.dropsByIns[ins.id] || 0).toFixed(1) + "%"; }).join("／") + "）：維持率 " + fmtPct(r.rate)
      : "−" + r.drop + "%：維持率 " + fmtPct(r.rate);
    s += '<circle cx="' + X(r.drop) + '" cy="' + Y(r.rate) + '" r="' + (ui.selectedDrop === r.drop ? 5.5 : 3) + '" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"><title>' + esc(titleC) + "</title></circle>";
  });
  /* 購入段階マーカー */
  var rateAt = {};
  sim.rows.forEach(function(r){ rateAt[r.drop] = r.rate; });
  var seen = {};
  state.instruments.forEach(function(ins){ ins.stages.forEach(function(sg){
    var bd = MarginSim.triggerBaseDrop(state, ins, sg);
    if (!sg.enabled || sg.executed || !(bd <= st.maxDrop)) return;
    var row = sim.rows.reduce(function(best, r){ return Math.abs(r.drop - bd) < Math.abs(best.drop - bd) ? r : best; }, sim.rows[0]);
    if (!row || row.rate === null) return;
    var key = bd.toFixed(4) + ":" + Math.round(row.rate);
    if (seen[key]) return; seen[key] = 1;
    var titleM = detailedC ? (ins.code + " −" + sg.dropPct + "% 段階（進行度 " + (MarginSim.triggerProgress(state, ins, sg) * 100).toFixed(1) + "% で発動）") : (ins.code + " −" + sg.dropPct + "% 段階");
    s += '<circle cx="' + X(bd) + '" cy="' + Y(row.rate) + '" r="5" fill="#d9930d" stroke="var(--surface)" stroke-width="1.5"><title>' + esc(titleM) + "</title></circle>";
  });});
  s += "</svg>";
  return s;
}

function bindReverse(el, ins){
  /* 入力欄の生の文字列をそのまま読む（既定値への置き換えや範囲への丸めで入力エラーを隠さないため） */
  function readRawInputs(){
    function gv(id){ var n = el.querySelector(id); return n ? String(n.value).trim() : ""; }
    var modeEl = el.querySelector("#r_mode");
    return { target: gv("#r_target"), minRate: gv("#r_minrate"), start: gv("#r_start"), end: gv("#r_end"),
             step: gv("#r_step"), mode: modeEl ? modeEl.value : "equal" };
  }
  /* 入力変更では再描画しない：change（フォーカス離脱）のタイミングで画面を作り直すと、直後の
     「逆算する」クリックの対象要素が差し替わり、1回目のクリックが飲み込まれてしまうため。
     値の取り込みだけを行い、描画は「逆算する」実行時・反映時にまとめて行う */
  ["#r_target","#r_minrate","#r_start","#r_end","#r_step","#r_mode"].forEach(function(id){
    var n = el.querySelector(id);
    if (n) n.addEventListener("change", function(){ ui.reverse = readRawInputs(); });
  });
  var run = el.querySelector("#revRunBtn");
  if (run) run.onclick = function(){
    var raw = readRawInputs();
    /* 入力検証：問題があれば理由を表示して計算を実行しない。既存のプレビューは消さずに残す */
    var verr = ReverseCalc.validateParams(raw);
    if (verr){
      ui.reverse = raw;
      ui.reverseError = verr;
      renderPlan();
      toast(verr);
      return;
    }
    ui.reverseError = null;
    ui.reverse = ReverseCalc.parseParams(raw);
    if (!(ins.planBasePrice > 0)){ toast("先に計画基準価格を入力してください（想定価格が計算できません）。"); return; }
    run.disabled = true; run.textContent = "逆算中…";
    /* 重い計算で描画が固まらないよう、ボタン表示を先に反映してから実行する */
    setTimeout(function(){
      var result = ReverseCalc.solve(state, ins.id, ui.reverse);
      if (result.status === "invalid"){
        ui.reverseError = result.error;
        renderPlan();
        toast(result.error);
        return;
      }
      ui.reversePreview = { insId: ins.id, params: ReverseCalc.parseParams(ui.reverse), result: result };
      renderPlan();
      toast(result.status === "ok" ? "逆算が完了しました（プレビュー表示中です。計画はまだ変更していません）。" : "逆算結果を表示しました。理由を確認してください。");
    }, 30);
  };
  var apply = el.querySelector("#revApplyBtn");
  if (apply) apply.onclick = function(){
    var rp = ui.reversePreview;
    if (!rp || rp.insId !== ins.id || rp.result.status !== "ok") return;
    confirmModal("この計画を反映しますか",
      "(i) 現在の計画の未実行段階はすべて、逆算結果の段階（" + rp.result.stages.length + "段階・総予算 " + fmtYen(rp.result.totalBudget) + "）に置き換わります。<br>(ii) 実行済み段階は保護され、変更されません。実保有も変更されません。<br>(iii) 反映前に、設定・データ画面からJSONエクスポートでバックアップを取ることをおすすめします。<br>反映の直前に、現在のデータで候補予算が今も成立するかを再検証します。",
      "再検証して反映する", function(){
        /* 適用前の再検証：プレビュー後に口座・価格・計画が変わっていたら古い結果をそのまま反映しない */
        var ev = ReverseCalc.evaluateCandidate(state, ins.id, rp.params, rp.result.totalBudget);
        if (!ev.ok || ev.totalQty <= 0){
          var fresh = ReverseCalc.solve(state, ins.id, rp.params);
          ui.reversePreview = { insId: ins.id, params: rp.params, result: fresh };
          renderPlan();
          toast("前提が変わっていたため、候補予算が成立しなくなりました。逆算を再実行し、新しいプレビューを表示しました。内容を確認してから再度反映してください。");
          return;
        }
        var kept = ins.stages.filter(function(s){ return s.executed; });
        var news = rp.result.stages.map(function(sg){
          return { id: uid("st"), dropPct: sg.dropPct, budget: sg.budget, enabled: true, executed: false, execPrice: null, execQty: null, execAmount: null, reflected: false };
        });
        ins.stages = kept.concat(news);
        ui.reversePreview = null;
        recalc(); renderPlan();
        toast("逆算結果を反映しました（未実行 " + news.length + " 段階を置き換え" + (kept.length ? "、実行済み " + kept.length + " 段階は保護" : "") + "）。");
      });
  };
  /* 逆算プレビューを計画へ反映せず、そのまま案（スロット）として保存する（ステップ2） */
  var saveSlotBtn = el.querySelector("#revSaveSlotBtn");
  if (saveSlotBtn) saveSlotBtn.onclick = function(){
    var rp = ui.reversePreview;
    if (!rp || rp.insId !== ins.id || rp.result.status !== "ok") return;
    var slot = PlanSlots.slotFromRecipe(ins, "逆算案（目標 −" + rp.params.target + "%・最低維持率 " + rp.params.minRate + "%）",
      rp.result.stages.map(function(sg){ return { dropPct: sg.dropPct, budget: sg.budget }; }));
    if (!PlanSlots.addSlot(ins, slot)){
      toast("保存できる案は1銘柄につき最大" + PlanSlots.MAX_SLOTS + "件です。不要な案を削除してから保存してください。");
      return;
    }
    recalc(); renderPlan();
    toast("逆算結果を案「" + slot.name + "」として保存しました（計画には反映していません）。下の「計画の比較・保存」で比べられます。");
  };
}

   mousedown → blur/change（再描画でボタン要素が差し替わる）→ mouseup の順になり click が
   発生せず、1回目のクリックが飲み込まれる（逆算ボタンで v1.9.1 に修正したのと同型のパターン。
   「銘柄情報を取得」ボタンでは mousedown の既定動作を止める方式で既に対策済み）。
   点検の結果、同じ再描画構造を持つ追加・削除系ボタンにも同型パターンがあったため、同じ考え方で統一する：
   (1) ボタンの mousedown の既定動作（フォーカス移動）を止め、change の再描画を click の前に挟まない。
   (2) click ハンドラの冒頭で commitActiveInput() を呼び、フォーカス中の入力欄の change を
   明示的に発火して未確定の編集を先に取り込む（この時点で再描画が起きても、click ハンドラ自体は
   既に実行中なので処理は続行できる）。これにより「編集が保存される」ことと

  if (tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") return;
  if (a.type === "checkbox" || a.type === "radio" || a.type === "button") return;

      recalc(); renderPlan(); toast("銘柄を削除しました。");
    });
  };
  var addStage = el.querySelector("#addStage");
  guardButtonClick(addStage);
  if (addStage) addStage.onclick = function(){
    commitActiveInput();
    var maxDrop = ins.stages.length ? Math.max.apply(null, ins.stages.map(function(s){ return s.dropPct; })) : 0;
    ins.stages.push({ id: uid("st"), dropPct: Math.min(100, maxDrop + 5), budget: 100000, enabled: true, executed: false, execPrice: null, execQty: null, execAmount: null, reflected: false });
    recalc(); renderPlan();
  };
  var reset = el.querySelector("#resetPlan");
  guardButtonClick(reset);
  if (reset) reset.onclick = function(){
    commitActiveInput();
    confirmModal("購入計画を初期化しますか", ins.code === "1308"
      ? "この銘柄の計画を初期サンプル（−5%〜−65%、累計予算 4,500,000円）に戻します。"
      : "この銘柄の購入計画をすべて削除し、−5%・10万円の1段階だけの初期状態に戻します。", "初期化する", function(){
      ins.stages = ins.code === "1308" ? sampleStages() : [{ id: uid("st"), dropPct: 5, budget: 100000, enabled: true, executed: false, execPrice: null, execQty: null, execAmount: null, reflected: false }];
      recalc(); renderPlan(); toast("購入計画を初期化しました。");
    });
  };
}
function bindStages(el, ins){
  el.querySelectorAll("[data-stage]").forEach(function(row){
    var sid = row.getAttribute("data-stage");
    var sg = ins.stages.filter(function(s){ return s.id === sid; })[0];
    if (!sg) return;
    row.querySelectorAll("[data-act]").forEach(function(ctrl){
      var act = ctrl.getAttribute("data-act");
      /* 行内のボタン（段階の削除・実行済みにする・保有へ反映）はクリック飲み込み対策の対象：
         同じ行や上のフォームの入力欄を編集中に押しても1回で効くようにする */
      if (ctrl.tagName === "BUTTON") guardButtonClick(ctrl);
      if (act === "toggle"){ ctrl.addEventListener("change", function(){ sg.enabled = ctrl.checked; recalc(); renderPlan(); }); }
      else if (act === "del"){ ctrl.addEventListener("click", function(){
        commitActiveInput();
        confirmModal("購入段階を削除しますか", "−" + sg.dropPct + "%／予算 " + fmtYen(sg.budget) + " の段階を削除します。", "削除する", function(){
          ins.stages = ins.stages.filter(function(s){ return s.id !== sid; }); recalc(); renderPlan();
        });
      }); }
      else if (act === "drop"){ ctrl.addEventListener("change", function(){ sg.dropPct = clamp(num(ctrl.value, sg.dropPct), 0, 100); recalc(); renderPlan(); }); }
      else if (act === "budget"){
        ctrl.addEventListener("input", function(){ sg.budget = clamp(Math.round(num(ctrl.value, 0)), 0, 1e12); recalc(); refreshStageRow(row, ins, sg); refreshMinibar(); });
        ctrl.addEventListener("change", function(){ renderPlan(); });
      }
      else if (act === "slider"){
        ctrl.addEventListener("input", function(){
          sg.budget = num(ctrl.value, 0);
          var b = row.querySelector('[data-act="budget"]'); if (b) b.value = sg.budget;
          recalc(); refreshStageRow(row, ins, sg); refreshMinibar();
        });
        ctrl.addEventListener("change", function(){ renderPlan(); });
      }
      else if (act === "execToggle" || act === "markExec"){
        ctrl.addEventListener("click", function(){
          if (act === "markExec") commitActiveInput();
          var toExec = act === "markExec" ? true : ctrl.checked;
          if (toExec && !sg.executed){
            /* 実行済みにする際は、計画値（想定価格・数量・実購入予定額）を実績の初期値として下書きする。実際の値と違えば実績欄で直せる */
            var r = sim.stageRes[sg.id];
            if (r){ if (sg.execPrice === null) sg.execPrice = r.price; if (sg.execQty === null) sg.execQty = r.qty; if (sg.execAmount === null) sg.execAmount = r.cost; }
          }
          sg.executed = toExec;
          recalc(); renderPlan();
          toast(toExec ? "段階を実行済みにしました。実績は「現在の保有」へ反映して管理してください。" : "段階を未実行に戻しました。");
        });
      }
      else if (act === "execPrice" || act === "execQty"){
        ctrl.addEventListener("change", function(){
          var v = ctrl.value === "" ? null : num(ctrl.value, NaN);
          if (!isFinite(v)) v = null;
          if (act === "execPrice") sg.execPrice = v === null ? null : clamp(v, 0, 1e9);
          else sg.execQty = v === null ? null : clamp(Math.round(v), 0, 1e9);
          if (sg.execPrice !== null && sg.execQty !== null) sg.execAmount = Math.round(sg.execPrice * sg.execQty);
          recalc(); renderPlan();
        });
      }
      else if (act === "execAmount"){
        ctrl.addEventListener("change", function(){
          sg.execAmount = ctrl.value === "" ? null : clamp(Math.round(num(ctrl.value, 0)), 0, 1e12);
          recalc(); renderPlan();
        });
      }
      else if (act === "reflect"){
        ctrl.addEventListener("click", function(){
          commitActiveInput();
          if (sg.execQty === null || sg.execPrice === null || !(sg.execQty > 0)){
            toast("先に実際の購入価格と購入数量を入力してください。"); return;
          }
          var merged = mergeHolding(ins.holding, "buy", sg.execQty, sg.execPrice);
          if (!merged){ toast("現在の保有が売建のため、買いの実績は反映できませんでした。保有欄で区分を確認してください。"); return; }
          ins.holding = merged; sg.reflected = true;
          recalc(); renderPlan();
          toast("実績を現在の保有へ反映しました（保有 " + merged.qty.toLocaleString("ja-JP") + "・平均建値 " + fmtYen(merged.avgPrice) + "）。");
        });
      }
    });
  });
}
function refreshStageRow(row, ins, sg){
  var r = sim.stageRes[sg.id]; if (!r) return;
  function set(cell, txt){ var n = row.querySelector('[data-cell="' + cell + '"]'); if (n) n.textContent = txt; }
  set("price", fmtYen(r.price)); set("cum", fmtYen(r.cumBudget)); set("qty", r.qty.toLocaleString("ja-JP"));
  set("cost", fmtYen(r.cost)); set("diff", fmtYen(sg.budget - r.cost));
  set("reason", sg.enabled ? (r.feasible ? "トリガー到達時点で必要保証金を満たす見込み（概算）" : r.reason) : "無効のため計算対象外");
}
function refreshMinibar(){
  var bar = document.querySelector("#view-plan .minibar");
  if (bar) bar.innerHTML = '<span>計画購入総額（実購入） <b class="num">' + fmtYen(sim.planCost) + '</b></span><span>予算合計 <b class="num">' + fmtYen(sim.planBudget) + '</b></span><span>管理基準の最初の到達 <b>' + (sim.firstMgmtPrecise !== null ? reachShort(sim.firstMgmtPrecise) + (isDetailedScenario(state) ? "" : "（0.1%精度）") : (isDetailedScenario(state) ? "なし（進行度100%まで）" : "なし（−" + state.settings.maxDrop + "%まで）")) + '</b></span><span>想定最大評価損 <b class="num">' + fmtSignedYen(sim.minPnl) + "</b></span>";
}

/* ================= 口座・保有状況 ================= */
function renderAccount(){
  var el = document.getElementById("view-account"), a = state.account, cur = sim.current;
  var hcInfo = collateralHaircutInfo(a);
  var html = scenarioSummaryHtml() + '<div class="card"><h2>口座情報</h2><p class="sub">代用有価証券評価額は<strong>掛目適用後の評価額を直接入力</strong>する方式が標準です。入力方式を切り替えると、適用前の時価と掛目（%）から適用後評価額を自動計算することもできます。どちらの方式でも、計算には常に適用後の評価額を使います。</p>'
    + '<div class="formgrid c3">'
    + fld("証券会社名", '<input type="text" id="a_broker" value="' + esc(a.broker) + '" placeholder="例：○○証券" autocomplete="off">')
    + fld("代用有価証券の入力方式", '<select id="a_basis"><option value="after"' + (hcInfo.mode === "after" ? " selected" : "") + '>適用後の評価額を直接入力（標準）</option><option value="before"' + (hcInfo.mode === "before" ? " selected" : "") + ">適用前の時価と掛目から計算</option></select>")
    + (hcInfo.mode === "before"
      ? fld("代用有価証券の時価（円・掛目適用前）", '<input type="number" id="a_market" min="0" step="1" value="' + (a.collateralMarket === null ? "" : a.collateralMarket) + '" placeholder="未入力">')
        + fld("掛目（%）", '<input type="number" id="a_haircut" min="0" max="100" step="1" value="' + (a.collateralHaircut === null ? "" : a.collateralHaircut) + '" placeholder="未入力">')
        + fld("代用有価証券評価額（円・自動計算）", '<input type="number" id="a_collateral" value="' + a.collateral + '" disabled aria-disabled="true">')
      : fld("代用有価証券評価額（円・掛目適用後）", '<input type="number" id="a_collateral" min="0" step="1" value="' + a.collateral + '">'))
    + fld("委託保証金現金（円）", '<input type="number" id="a_cash" step="1" value="' + a.cash + '">')
    + fld("受渡未到来の決済損益（円・任意）", '<input type="number" id="a_unsettled" step="1" value="' + (a.unsettledPnl === null || a.unsettledPnl === undefined ? "" : a.unsettledPnl) + '" placeholder="未入力">')
    + fld("証券会社表示の保証金維持率（%・任意）", '<input type="number" id="a_brokerRate" min="0" step="0.1" value="' + (a.brokerRate === null ? "" : a.brokerRate) + '" placeholder="未入力">')
    + fld("情報更新日時", '<input type="text" id="a_updated" value="' + esc(state.meta.updatedAt) + '" placeholder="例：2026-11-17 11:30">')
    + "</div>"
    + '<p class="hint">受渡未到来の決済損益は任意項目です。空欄（初期値）の場合は算入しません。入力がある場合のみ、その金額を下落率で変動させない固定額として、現在の維持率と全シナリオの実質保証金にそのまま加えます（プラスの決済益もマイナスの決済損も入力できます）。証券会社の画面に受渡未到来の決済損益が表示されている場合のみ入力してください。現金や建玉の評価損益に含めて入力しないでください（二重計上になります）。</p>'
    + (hcInfo.mode === "before"
      ? '<p class="hint" style="font-size:.92rem">計算に使う代用評価額：<strong class="num">' + fmtYen(a.collateral) + "</strong>"
        + (hcInfo.applied !== null ? '（時価 ' + fmtYen(a.collateralMarket) + " × 掛目 " + a.collateralHaircut + "% を切り捨てて計算）" : "（時価と掛目がそろうと自動で計算されます）") + "</p>"
        + (hcInfo.warning ? '<div class="notice warn" style="margin-top:10px">掛目が未設定のため、時価から適用後評価額を計算できません（現在表示されている適用後評価額で計算しています）。</div>' : "")
        + '<p class="hint">掛目は証券会社・資産の種類によって異なります。この入力は単一の掛目率による簡略化です。入力方式を「直接入力」に戻すと、最後に計算された適用後評価額がそのまま直接編集できる値として残ります。</p>'
      : "")
    + '<dl class="kv mt"><dt>推計保証金残高（現在・実質保証金）</dt><dd class="num">' + fmtYen(cur.balance) + (cur.belowMinMargin ? '（最低保証金額 ' + fmtYen(state.settings.minMargin) + ' 未満：差し入れが必要になる場合があります）' : '（最低保証金額 ' + fmtYen(state.settings.minMargin) + ' 以上）') + '</dd>'
    + '<dt>推計維持率（現在の保有＋既存建玉）</dt><dd class="num">' + fmtPct(cur.rate) + (cur.pnlApprox ? "（評価損益未入力分あり・概算）" : "") + "</dd>"
    + (a.brokerRate !== null && cur.rate !== null ? '<dt>証券会社表示との差</dt><dd class="num">' + (a.brokerRate - cur.rate >= 0 ? "+" : "−") + Math.abs(a.brokerRate - cur.rate).toFixed(1) + " pt（計算モデルが異なるため差が生じます）</dd>" : "")
    + "</dl></div>";

  /* 簡易モードでは建玉の個別編集は出さず、件数と建代金合計の要約に置き換える（ステップ4・4-1）。
     口座の基本項目（上の口座情報カード）は簡易モードでも編集できる */
  if (viewMode() === "simple"){
    var totPSimple = state.positions.reduce(function(s, p){ return s + p.principal; }, 0);
    html += '<div class="card"><h2>計画銘柄以外の既存建玉（要約）</h2><p class="sub">登録件数 ' + state.positions.length + '件／建代金合計 <strong class="num">' + fmtYen(totPSimple) + '</strong>（銘柄別保有の建代金合計は <strong class="num">' + fmtYen(cur.holdingsPrincipal) + '</strong>）。建玉の追加・個別編集は詳細モードで表示します。</p>' + otherPositionsWarningHtml(state) + '<div class="rowflex mt"><button class="btn small" data-mode="detailed" type="button">詳細モードに切り替える</button></div></div>';
  } else {
  html += '<div class="card"><h2>計画銘柄以外の既存建玉</h2><p class="sub">購入計画の対象銘柄<strong>以外</strong>で、すでに保有している信用建玉を登録します。計画対象銘柄の保有は「購入計画」画面の銘柄ごとの「現在の保有」で管理してください。<strong>同じ建玉を両方に登録すると二重計上になります。</strong>全体の計算では、銘柄別保有とここの建玉を合算します。評価損益は空欄（未入力）にできます。その場合シミュレーションでは概算として扱い、勝手な値で補完しません。</p>'
    + '<div class="rowflex"><button class="btn primary small" id="addPos">＋ 建玉を追加</button></div><div id="posList">';
  state.positions.forEach(function(p){
    html += '<div class="posrow" data-pos="' + p.id + '"><div class="rowflex"><strong>' + esc(p.code || "コード未設定") + " " + esc(p.name || "") + '</strong><span class="pill ' + (p.side === "buy" ? "info" : "warn") + '">' + (p.side === "buy" ? "買建" : "売建") + '</span><span style="margin-left:auto"></span><button class="btn small danger-outline" data-pact="del">削除</button></div>'
      + '<div class="pr-grid">'
      + fld("銘柄コード", '<input type="text" data-pact="code" aria-label="建玉の銘柄コード" value="' + esc(p.code) + '" autocomplete="off">')
      + fld("銘柄名・メモ", '<input type="text" data-pact="name" aria-label="建玉の銘柄名・メモ" value="' + esc(p.name) + '" autocomplete="off">')
      + fld("買建・売建", '<select data-pact="side" aria-label="買建・売建"><option value="buy"' + (p.side === "buy" ? " selected" : "") + '>買建</option><option value="sell"' + (p.side === "sell" ? " selected" : "") + ">売建</option></select>")
      + fld("建代金（円）", '<input type="number" data-pact="principal" aria-label="建代金（円）" min="0" step="1" value="' + p.principal + '">')
      + fld("現在の評価損益（円・空欄=未入力）", '<input type="number" data-pact="pnl" aria-label="現在の評価損益（円）" step="1" value="' + (p.pnl === null ? "" : p.pnl) + '" placeholder="未入力">')
      + "</div></div>";
  });
  var totP = state.positions.reduce(function(s, p){ return s + p.principal; }, 0);
  html += '</div><p class="hint">計画銘柄以外の既存建玉の建代金合計：<strong class="num">' + fmtYen(totP) + '</strong>／銘柄別保有の建代金合計：<strong class="num">' + fmtYen(cur.holdingsPrincipal) + '</strong>（担保は銘柄ごとに重複計上せず、口座全体で一度だけ計算します）</p>' + otherPositionsWarningHtml(state) + "</div>";
  }
  el.innerHTML = html;
  bindPremise(el); bindModeSwitch(el);

  function on(id, fn){ var n = el.querySelector(id); if (n) n.addEventListener("change", function(){ fn(n); recalc(); renderAccount(); }); }
  on("#a_broker", function(n){ a.broker = n.value.trim().slice(0, 60); state.meta.isSample = false; });
  on("#a_collateral", function(n){ if (a.collateralBasis === "before") return; a.collateral = clamp(num(n.value, 0), 0, 1e12); state.meta.isSample = false; });
  on("#a_basis", function(n){
    a.collateralBasis = n.value === "before" ? "before" : "after";
    /* 時価＋掛目方式へ切り替えた初回は掛目に初期値80を表示する。時価欄は空欄から始め、
       適用後評価額を時価欄へ流し込むことはしない（二重適用の防止）。直接入力へ戻すときは
       最後に計算された適用後評価額がそのまま残る（sync は直接入力方式では何もしない） */
    if (a.collateralBasis === "before" && a.collateralHaircut === null) a.collateralHaircut = COLLATERAL_HAIRCUT_DEFAULT;
    syncCollateralFromHaircut(a);
  });
  on("#a_market", function(n){
    var v = n.value === "" ? NaN : num(n.value, NaN);
    a.collateralMarket = isFinite(v) ? clamp(v, 0, 1e12) : null;
    syncCollateralFromHaircut(a);
    state.meta.isSample = false;
  });
  on("#a_haircut", function(n){
    var v = n.value === "" ? NaN : num(n.value, NaN);
    a.collateralHaircut = isFinite(v) ? clamp(v, 0, 100) : null;
    syncCollateralFromHaircut(a);
    state.meta.isSample = false;
  });
  on("#a_cash", function(n){ a.cash = clamp(num(n.value, 0), -1e12, 1e12); state.meta.isSample = false; });
  on("#a_unsettled", function(n){ var v = n.value === "" ? NaN : num(n.value, NaN); a.unsettledPnl = isFinite(v) ? clamp(v, -1e12, 1e12) : null; state.meta.isSample = false; });
  on("#a_brokerRate", function(n){ a.brokerRate = n.value === "" ? null : num(n.value, NaN); if (!isFinite(a.brokerRate)) a.brokerRate = null; });
  on("#a_updated", function(n){ state.meta.updatedAt = n.value.trim(); });
  if (viewMode() !== "simple"){
  guardButtonClick(el.querySelector("#addPos"));
  el.querySelector("#addPos").onclick = function(){
    commitActiveInput();
    state.positions.push({ id: uid("pos"), code: "", name: "", side: "buy", principal: 0, pnl: null });
    recalc(); renderAccount();
  };
  el.querySelectorAll("[data-pos]").forEach(function(row){
    var p = state.positions.filter(function(x){ return x.id === row.getAttribute("data-pos"); })[0];
    if (!p) return;
    row.querySelectorAll("[data-pact]").forEach(function(ctrl){
      var act = ctrl.getAttribute("data-pact");
      if (ctrl.tagName === "BUTTON") guardButtonClick(ctrl);
      if (act === "del"){ ctrl.addEventListener("click", function(){
        commitActiveInput();
        confirmModal("建玉を削除しますか", "「" + esc(p.name || p.code || "建玉") + "」（建代金 " + fmtYen(p.principal) + "）を削除します。", "削除する", function(){
          state.positions = state.positions.filter(function(x){ return x.id !== p.id; }); recalc(); renderAccount();
        });
      }); return; }
      ctrl.addEventListener("change", function(){
        if (act === "code") p.code = normalizeCode(ctrl.value);
        else if (act === "name") p.name = ctrl.value.trim().slice(0, 60);
        else if (act === "side") p.side = ctrl.value === "sell" ? "sell" : "buy";
        else if (act === "principal") p.principal = clamp(num(ctrl.value, 0), 0, 1e12);
        else if (act === "pnl"){ p.pnl = ctrl.value === "" ? null : num(ctrl.value, NaN); if (!isFinite(p.pnl)) p.pnl = null; }
        recalc(); renderAccount();
      });
    });
  });
  }
}
</script>
<script>
"use strict";
/* ================= 設定・データ管理 ================= */
function renderSettings(){
  var el = document.getElementById("view-settings"), s = state.settings;
  var simple = viewMode() === "simple";

  var html = '<div class="grid2 wide"><div>'

    + '<div class="formgrid">'
    + fld("自主管理基準（%）", '<input type="number" id="s_mgmt" min="0" max="100" step="0.5" value="' + s.management + '">')
    + fld("追証基準（%）", '<input type="number" id="s_call" min="0" max="100" step="0.5" value="' + s.marginCall + '">')
    + fld("新規建保証金率（%）", '<input type="number" id="s_newm" min="1" max="100" step="1" value="' + s.newMargin + '">')

/* ---------- JSON エクスポート／インポート ---------- */
function exportJSON(){
  var payload = { app: "margin-nanpin-planner", version: DATA_VERSION, exportedAt: new Date().toISOString(), data: state };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nanpin-plan-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  recordExportNow();
  toast("JSONバックアップを書き出しました。");
}
document.getElementById("importFile").addEventListener("change", function(ev){
  var file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var parsed = null;
    try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
    if (parsed === null){
      showModal("<h3>読み込めませんでした</h3><p style='margin:0 0 14px'>ファイルの内容がJSONとして読み取れないため、取り込みを中止しました。現在のデータはそのまま保持されています。</p><div class='rowflex' style='justify-content:flex-end'><button class='btn primary' onclick='closeModal()'>閉じる</button></div>");
      return;
    }
    var res = unpackState(parsed);
    if (!res.ok){
      var msg = res.reason === "version"
        ? "このファイルの形式バージョン（" + res.foundVersion + "）は、このアプリ（" + DATA_VERSION + "）より新しいため取り込めませんでした。新しいアプリで書き出したファイルは、古いアプリでは開けません。"
        : "ファイルの形式が不正か破損しているため、取り込みを中止しました。";
      showModal("<h3>読み込めませんでした</h3><p style='margin:0 0 14px'>" + esc(msg) + "現在のデータはそのまま保持されています。</p><div class='rowflex' style='justify-content:flex-end'><button class='btn primary' onclick='closeModal()'>閉じる</button></div>");
      return;
    }
    state = res.state;
    ui.selectedInsId = state.instruments.length ? state.instruments[0].id : null;
    ui.selectedDrop = null;
    recalc(); render();
    toast("データを復元しました（形式バージョン " + DATA_VERSION + " として検証済み）。");
  };
  reader.readAsText(file);
});

/* ---------- 自己テスト（指示書 §8） ---------- */
function runSelfTests(){
  var T = [];
  function t(name, ok, detail){ T.push({ name: name, ok: !!ok, detail: detail }); }
  /* 1 累計額 */
  var s1 = sampleState(); var r1 = MarginSim.simulate(s1);
  var cumBudget = s1.instruments[0].stages.reduce(function(a, x){ return a + x.budget; }, 0);
  var lastCum = r1.stageRes[s1.instruments[0].stages[s1.instruments[0].stages.length - 1].id].cumBudget;
  t("購入計画の累計額", cumBudget === 4500000 && lastCum === 4500000, "サンプル計画の予算合計・最終累計ともに 4,500,000円");
  /* 2 購入額変更で結果更新 */
  var s2 = JSON.parse(JSON.stringify(s1)); s2.instruments[0].stages[0].budget = 900000;
  var r2 = MarginSim.simulate(sanitizeState(s2));
  t("購入額変更時に全体の結果が更新される", r2.planCost !== r1.planCost && r2.rows[1].totalPrincipal !== r1.rows[1].totalPrincipal, "第1段階の予算を変更すると計画購入総額と建玉総額が変化");
  /* 3 複数銘柄の合算 */
  var s3 = sampleState();
  s3.instruments.push({ id: "t2", code: "7203", name: "テスト株", type: "stock", planBasePrice: 1000, closePrice: 1000, closeDate: "", closeSource: "", unit: 100, baseIsSample: false, holding: { qty: 0, avgPrice: 0, side: "buy" }, ref: { name: "なし", baseDate: "", baseValue: null, currentValue: null }, stages: [{ id: "t2s", dropPct: 10, budget: 90000, enabled: true, executed: false, execPrice: null, execQty: null, execAmount: null, reflected: false }] });
  var r3 = MarginSim.simulate(s3);
  var row10 = r3.rows.filter(function(r){ return r.drop === 10; })[0];
  t("複数銘柄の建玉が正しく合算される", row10 && row10.totalPrincipal === 64800 + r3.stageRes["t2s"].cost + (r1.rows.filter(function(r){ return r.drop === 10; })[0].newPrincipal), "−10%時点の建玉総額＝既存＋銘柄A計画＋銘柄B計画");
  /* 4 担保の重複計上なし */
  t("担保が重複計上されない", row10 && row10.collateral === MarginSim.collateralAt(s3.account.collateral, 10, 1), "銘柄が2つでも代用評価額は口座全体で1回だけ計上");
  /* 5 建玉ゼロ */
  var s5 = sampleState(); s5.positions = []; s5.instruments[0].stages = [];
  var r5 = MarginSim.simulate(s5);
  t("建玉ゼロでゼロ除算しない", r5.current.rate === null && r5.rows.every(function(r){ return r.rate === null; }), "建代金0のとき維持率は null（画面表示は「対象外」）で NaN にならない");
  /* 6 数量の売買単位 */
  var okUnit = true, okBudget = true;
  Object.keys(r1.stageRes).forEach(function(k){ var rr = r1.stageRes[k]; if (rr.qty % s1.instruments[0].unit !== 0) okUnit = false; });
  s1.instruments[0].stages.forEach(function(sg){ var rr = r1.stageRes[sg.id]; if (rr.cost > sg.budget) okBudget = false; });
  t("購入数量が売買単位に適合し予算を超えない", okUnit && okBudget, "全段階で数量は売買単位（サンプル1308は1口）の倍数、実購入額は予算以下");
  /* 7 保証金不足 */
  var s7 = sampleState(); s7.account.collateral = 1000; s7.account.cash = 0;
  var r7 = MarginSim.simulate(s7);
  t("保証金不足時の処理", Object.keys(r7.stageRes).some(function(k){ return !r7.stageRes[k].feasible; }) && !!r7.firstInfeasible, "担保を極小にすると段階が実行不能として判定され、最初の実行不能段階が記録される");
  /* 8 保存・復元 */
  var roundtrip = sanitizeState(JSON.parse(JSON.stringify(state)));
  t("保存・復元で数値が変化しない", JSON.stringify(roundtrip) === JSON.stringify(sanitizeState(state)), "JSON化→検証付き復元で全数値が一致");
  /* 9 不正入力の除去 */
  var dirty = sampleState(); dirty.instruments[0].stages[0].budget = "abc"; dirty.instruments[0].planBasePrice = -500; dirty.settings.maxDrop = 9999;
  var clean9 = sanitizeState(dirty);
  t("不正な入力値が計算に混入しない", clean9.instruments[0].stages[0].budget === 0 && clean9.instruments[0].planBasePrice === 0 && clean9.settings.maxDrop === 100, "文字列・負数・範囲外の値を検証で除去／丸め");

    instruments: [{ id: "h1", code: "9999", name: "手計算", type: "stock", planBasePrice: 1000, closePrice: 1000, closeDate: "", closeSource: "", unit: 100, baseIsSample: false, holding: { qty: 0, avgPrice: 0, side: "buy" }, ref: { name: "なし", baseDate: "", baseValue: null, currentValue: null }, stages: [{ id: "h1s", dropPct: 10, budget: 90000, enabled: true, executed: false, execPrice: null, execQty: null, execAmount: null, reflected: false }] }],

  var newerRes = unpackState({ app: "margin-nanpin-planner", version: DATA_VERSION + 99, data: sampleState() });

  var feed13 = PriceFeed.sanitize({ updatedAt: "2026-11-17T07:00:00+09:00", source: "test",

  /* 14 計画基準価格と最新終値の騰落率 */

  /* 17 銘柄コードの正規化と、銘柄名・区分・売買単位の取り込み */

  s97.settings.costLayer = { enabled: true, ratePct: 3.25, days: 90, includeAdmin: true };
  var round97 = unpackState(JSON.parse(JSON.stringify(packState(s97))));
  var old97 = sampleState(); delete old97.settings.costLayer;
  var mig97 = sanitizeState(old97);
  var bad97 = sampleState(); bad97.settings.costLayer = { enabled: "yes", ratePct: -5, days: 99999999, includeAdmin: 1 };
  var bad97c = sanitizeState(bad97).settings.costLayer;
  t("費用設定がJSON往復で保持され項目のない旧データは無効として読み込める", round97.ok && round97.state.settings.costLayer.enabled === true
    && round97.state.settings.costLayer.ratePct === 3.25 && round97.state.settings.costLayer.days === 90 && round97.state.settings.costLayer.includeAdmin === true
    && mig97.settings.costLayer.enabled === false && mig97.settings.costLayer.ratePct === 2.8 && mig97.settings.costLayer.days === 180 && mig97.settings.costLayer.includeAdmin === false
    && bad97c.ratePct === 0 && bad97c.days === 36500 && DATA_VERSION === 3,
    "有効・金利3.25%・90日・管理費ありは封筒に包んだJSON往復で保持される。costLayer 項目のない旧データは無効・初期値（2.80%／180日／管理費なし）で補完され、従来どおり読み込める。範囲外の値は丸められ、データ形式バージョンは3のまま");
  /* 98 費用込みの現在維持率（概算）は現在の建代金合計に対する概算費用を差し引いた値で、管理費の建玉件数は
        既存建玉の件数＋未実行段階数（計画全体の概算）ではなく、現在値では既存建玉のみで数える */
  var s98 = sanitizeState(sampleState());
  s98.settings.costLayer = { enabled: true, ratePct: 2.8, days: 180, includeAdmin: true };
  var r98 = MarginSim.simulate(s98);
  var base98 = MarginSim.basePositionCount(s98);
  var expect98 = r98.current.principal * 0.028 * 180 / 365 + base98 * 6 * 110;
  t("費用込みの現在維持率が現在の建代金合計への概算費用で計算される", base98 === 1 && Math.abs(r98.current.cost - expect98) < 0.01
    && Math.abs(r98.current.costRate - (r98.current.balance - expect98) / r98.current.principal * 100) < 0.001
    && r98.current.costParts.count === 1,
    "サンプルの既存建玉は1件（建代金64,800円・保有なし）のため、現在値の管理費は1件×6か月×110円で数える（未実行の計画段階はまだ建玉ではない）。費用込み現在維持率は（実質保証金 − 概算費用 " + fmtYen(r98.current.cost) + "）÷ 現在の建代金合計で計算される");
  return T;
}
