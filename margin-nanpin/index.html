<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#0d3b34" />
<link rel="icon" href="data:," />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>信用ナンピン計画・リスク管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface2:#eef2f5; --ink:#182230; --muted:#5a6b7e;
  --line:#d7dfe7; --line2:#c3cedb;
  --accent:#0d7a68; --accent-ink:#0a5c4f; --accent-bg:#e2f2ee;
  --warn:#9a6206; --warn-bg:#fdf0d5; --warn-line:#e8c877;
  --danger:#b3261e; --danger-bg:#fdecea; --danger-line:#f0b3ae;
  --info:#1d5fa8; --info-bg:#e6effa;
  --shadow:0 1px 3px rgba(16,32,48,.08),0 4px 14px rgba(16,32,48,.05);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f141b; --surface:#182029; --surface2:#1f2937; --ink:#e7edf4; --muted:#9db0c4;
    --line:#2b394c; --line2:#3a4c64;
    --accent:#2fbf9f; --accent-ink:#7fe3cb; --accent-bg:#123c33;
    --warn:#f0b95a; --warn-bg:#3d2f0e; --warn-line:#7a5c1c;
    --danger:#ff8a80; --danger-bg:#421d1a; --danger-line:#7c3833;
    --info:#8dbdf2; --info-bg:#17334f;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",system-ui,sans-serif;font-size:15px;line-height:1.55}
button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem}
input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent)}
.num{font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:.45rem .9rem;font-weight:700;font-size:.9rem;min-height:2.5rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#06231d}}
.btn.danger-outline{color:var(--danger);border-color:var(--danger-line)}
.btn.small{min-height:2.25rem;padding:.3rem .65rem;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type="number"],input[type="text"],input[type="date"],select{background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:.45rem .6rem;font:inherit;font-size:.95rem;width:100%}
input[type="number"]{text-align:right;font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type="range"]{width:100%;accent-color:var(--accent);min-height:2rem;padding:0}
label.flabel{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:.3rem}
.field{min-width:0}
.hint{font-size:.78rem;color:var(--muted);margin-top:.35rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.apptitle{font-weight:900;font-size:1rem;letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:.12rem .6rem;font-size:.72rem;font-weight:700;border:1px solid var(--line2);background:var(--surface2);color:var(--muted)}
.badge.sample{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.tabs{display:none;gap:4px}
.tabs button{border:1px solid transparent;background:transparent;color:var(--muted);font-weight:700;border-radius:8px;padding:.5rem .9rem;min-height:2.5rem}
.tabs button[aria-selected="true"]{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent)}
@media(min-width:760px){.tabs{display:flex}.wrap{padding-bottom:40px}}
/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{background:none;border:none;color:var(--muted);font-size:.68rem;font-weight:700;padding:.45rem 0 .4rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:3.4rem}
.bottomnav button[aria-selected="true"]{color:var(--accent-ink)}
.bottomnav svg{width:22px;height:22px}
@media(min-width:760px){.bottomnav{display:none}}
/* cards & layout */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:14px}
.card h2{font-size:1.02rem;margin:0 0 4px;font-weight:900}
.card h3{font-size:.92rem;margin:0 0 8px;font-weight:900}
.card .sub{color:var(--muted);font-size:.83rem;margin:0 0 10px}
.grid2{display:grid;gap:14px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}.grid2.wide{grid-template-columns:3fr 2fr}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:.74rem;font-weight:700;color:var(--muted)}
.kpi .k-value{font-size:1.45rem;font-weight:900;line-height:1.25;margin-top:2px}
.kpi .k-value small{font-size:.8rem;font-weight:700;color:var(--muted)}
.kpi .k-note{font-size:.76rem;color:var(--muted);margin-top:2px}
.kpi.alert{border-color:var(--danger-line);background:var(--danger-bg)}
.kpi.caution{border-color:var(--warn-line);background:var(--warn-bg)}
.hero-rate{background:linear-gradient(135deg,#0d3b34,#0d7a68);color:#fff;border-radius:var(--radius);padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.hero-rate .h-label{font-size:.8rem;font-weight:700;opacity:.85}
.hero-rate .h-big{font-size:1.6rem;font-weight:900;line-height:1.35;margin-top:4px}
.hero-rate .h-sub{font-size:.88rem;opacity:.92;margin-top:6px}
.hero-rate.danger{background:linear-gradient(135deg,#5f130e,#b3261e)}
.hero-rate.caution{background:linear-gradient(135deg,#5c3d05,#9a6206)}
.pill{display:inline-block;border-radius:999px;padding:.1rem .55rem;font-size:.72rem;font-weight:700;vertical-align:middle}
.pill.safe{background:var(--accent-bg);color:var(--accent-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.mute{background:var(--surface2);color:var(--muted)}
.pill.info{background:var(--info-bg);color:var(--info)}
/* table */
.tblwrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:.88rem}
table.dt th,table.dt td{padding:.5rem .55rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.dt th{font-size:.74rem;color:var(--muted);font-weight:700;background:var(--surface2);position:sticky;top:0}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt tr.sel td{background:var(--accent-bg)}
table.dt tr.row-danger td{background:var(--danger-bg)}
table.dt tr.row-warn td{background:var(--warn-bg)}
table.dt tbody tr{cursor:pointer}
@media(max-width:640px){
  .hide-sp{display:none}
  /* 詳細表はスマホでは行カード形式に組み替える（横スクロールなし） */
  .tblwrap{overflow-x:visible}
  table.dt thead{display:none}
  table.dt,table.dt tbody{display:block}
  table.dt tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;padding:10px 6px;border-bottom:1px solid var(--line)}
  table.dt td{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:none;padding:.28rem 0;white-space:normal;text-align:right;font-size:.86rem}
  table.dt td::before{content:attr(data-label);font-size:.72rem;font-weight:700;color:var(--muted);text-align:left}
  table.dt td:first-child{grid-column:1 / -1;font-size:1rem;font-weight:900;border-bottom:1px dashed var(--line);padding-bottom:.4rem}
  table.dt td:first-child::before{content:"下落率"}
}
/* chart */
.chartbox{width:100%}
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:0;border-top:3px solid var(--accent);border-radius:2px}
.sw.dash{border-top-style:dashed}
.sw.mgmt{border-color:#d9930d}.sw.call{border-color:var(--danger)}
.dotkey{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d9930d}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);color:var(--muted);font-weight:700;padding:.35rem .8rem;min-height:2.25rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
/* plan */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:.55rem .8rem;text-align:left;min-height:3rem;box-shadow:var(--shadow)}
.chip[aria-selected="true"]{border-color:var(--accent);background:var(--accent-bg)}
.chip .c-code{font-weight:900;font-size:.95rem}
.chip .c-name{font-size:.72rem;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.formgrid{grid-template-columns:repeat(4,1fr)}.formgrid.c3{grid-template-columns:repeat(3,1fr)}}
.stagerow{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px;background:var(--surface)}
.stagerow.off{opacity:.55}
.stagerow .sr-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stagerow .sr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media(min-width:760px){.stagerow .sr-grid{grid-template-columns:repeat(4,1fr)}}
.stagerow .calc{font-size:.86rem}
.stagerow .calc .cl{font-size:.72rem;color:var(--muted);font-weight:700}
.stagerow .calc .cv{font-weight:900;font-size:1rem}
.switchlabel{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.85rem;cursor:pointer;padding:.3rem 0;min-height:2.25rem}
.minibar{position:sticky;top:57px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-top:14px;display:flex;gap:8px 18px;flex-wrap:wrap;font-size:.85rem}
.minibar b{font-size:1rem}
.posrow{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px}
.posrow .pr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
@media(min-width:760px){.posrow .pr-grid{grid-template-columns:repeat(5,1fr)}}
.rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mt{margin-top:12px}.mb0{margin-bottom:0}
.notice{border-radius:var(--radius);padding:12px 14px;font-size:.86rem;margin-top:14px;border:1px solid}
.notice.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--ink)}
.notice.info{background:var(--info-bg);border-color:var(--line2)}
.notice.danger{background:var(--danger-bg);border-color:var(--danger-line)}
details.more{margin-top:10px}
details.more summary{font-weight:700;color:var(--accent-ink);cursor:pointer;padding:.4rem 0;min-height:2.25rem}
/* 折り畳み式 詳細カード（ダッシュボード：下落率別の詳細） */
.card.detail-card{padding:0;overflow:hidden}
.card.detail-card>summary{list-style:none;cursor:pointer;padding:16px;-webkit-tap-highlight-color:transparent}
.card.detail-card>summary::-webkit-details-marker{display:none}
.card.detail-card>summary::marker{content:""}
.detail-summary-in{display:flex;align-items:flex-start;gap:12px}
.detail-summary-main{flex:1;min-width:0}
.detail-summary-main h2{font-size:1.02rem;margin:0;font-weight:900;line-height:1.4}
.detail-summary-meta{color:var(--muted);font-size:.82rem;margin-top:4px;line-height:1.5}
.detail-summary-meta strong{color:var(--ink)}
.detail-toggle{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface2);color:var(--accent-ink);border-radius:999px;padding:.32rem .7rem;font-size:.8rem;font-weight:700;white-space:nowrap;margin-top:2px}
.detail-toggle .chev{display:inline-block;font-size:.72rem;line-height:1;transition:transform .18s ease}
.card.detail-card[open ] .detail-toggle .chev{transform:rotate(180deg)}
.card.detail-card[open ] .detail-toggle .label-open{display:none}
.card.detail-card:not([open ]) .detail-toggle .label-close{display:none}
.detail-body{padding:0 16px 16px;border-top:1px solid var(--line)}
.detail-body .sub{margin-top:12px}
@media(max-width:640px){.detail-summary-in{flex-wrap:wrap}.detail-toggle{margin-top:6px}}
.kv{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;text-align:right;font-weight:700}
@media(max-width:640px){
  .kv{grid-template-columns:1fr;gap:0}
  .kv dt{margin-top:10px}
  .kv dd{text-align:left;font-size:1.02rem;border-bottom:1px solid var(--line);padding-bottom:6px}
}
/* modal & toast */
.modalback{position:fixed;inset:0;background:rgba(8,16,24,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;max-width:440px;width:100%;padding:20px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 8px;font-size:1.05rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:90;background:#182230;color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-size:.88rem;font-weight:700;box-shadow:var(--shadow);max-width:92vw;text-align:center}
@media(min-width:760px){.toast{bottom:28px}}
.testlist{list-style:none;margin:8px 0 0;padding:0;font-size:.88rem}
.testlist li{padding:.45rem 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.testlist .ok{color:var(--accent-ink);font-weight:900}
.testlist .ng{color:var(--danger);font-weight:900}
footer.note{color:var(--muted);font-size:.78rem;margin-top:22px;line-height:1.7}
/* 価格パネル（計画基準価格・最新終値・参考指数） */
.pricepanel{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-top:12px}
.pricepanel .pp-label{font-size:.74rem;font-weight:700;color:var(--muted)}
.pricepanel .pp-value{font-size:1.35rem;font-weight:900;line-height:1.3;margin-top:2px}
.pricepanel .pp-value .pill{font-size:.95rem;padding:.2rem .7rem}
.coderow{display:flex;gap:10px;align-items:flex-end}
.coderow .btn{flex-shrink:0;min-height:3rem}
.pill.up{background:var(--accent-bg);color:var(--accent-ink)}
.pill.down{background:var(--info-bg);color:var(--info)}
.posline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.posline:last-child{border-bottom:none;padding-bottom:2px}
.posline-main{flex:1;min-width:0}
.posline-sub{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.posline .pill{font-size:.92rem;padding:.25rem .7rem;flex-shrink:0}
/* スマホ優先：入力欄は16px以上（iOSの自動ズーム防止）と大きめのタップ領域にする */
@media(max-width:759px){
  input[type="number"],input[type="text"],input[type="date"],select{font-size:16px;min-height:3rem}
  .btn{min-height:2.9rem}
  .chip{min-height:3.4rem}
  .pricepanel .pp-value{font-size:1.2rem}
}
.grouphead{font-size:1rem;font-weight:900;margin:18px 0 0}
.grouphead .gh-tag{font-size:.72rem;color:var(--muted);font-weight:700;margin-left:6px}
.view[hidden]{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="apptitle">信用ナンピン計画・リスク管理 <span class="badge sample" id="sampleBadge">サンプルデータ</span> <span class="badge" id="saveStatus" role="status">自動保存を確認中…</span></div>
    <nav class="tabs" role="tablist" aria-label="画面切替">
      <button role="tab" data-view="dashboard" aria-selected="true">ダッシュボード</button>
      <button role="tab" data-view="plan" aria-selected="false">購入計画</button>
      <button role="tab" data-view="account" aria-selected="false">口座・保有状況</button>
      <button role="tab" data-view="settings" aria-selected="false">設定・データ</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-dashboard"></section>
  <section class="view" id="view-plan" hidden></section>
  <section class="view" id="view-account" hidden></section>
  <section class="view" id="view-settings" hidden></section>
  <footer class="note">
    本ツールは信用取引の購入計画と保証金維持率の<strong>概算シミュレーション</strong>です。維持率が追証基準に到達することと、実際に追証（追加保証金）が発生することは同一ではありません。証券会社ごとの実際の計算制度・掛目・最低保証金等とは異なる場合があり、制度への適合を保証するものではありません。実際の取引判断は証券会社の表示と制度をご確認ください。口座の認証情報は取得せず、実際の注文も行いません。
  </footer>
</main>

<nav class="bottomnav" aria-label="画面切替">
  <button data-view="dashboard" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h4v8H3zM10 3h4v18h-4zM17 8h4v13h-4z"/></svg>ダッシュボード</button>
  <button data-view="plan" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>購入計画</button>
  <button data-view="account" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg>口座・保有</button>
  <button data-view="settings" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.06-.4.1-.8.1-1.2z"/></svg>設定・データ</button>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr-only" aria-label="JSONファイルを読み込む" />
<script>
"use strict";
/* ============================================================
   信用ナンピン計画・リスク管理（第一段階）
   計算モデルは独立モジュール MarginSim に分離。
   丸め規則：価格は円未満を切り捨てて表示・計算に使用（想定価格＝計画基準価格×(1−下落率) を円単位に切り捨て）。
   価格は3分離：計画基準価格（下落率の起点・ユーザー入力）／平均建値（銘柄別保有の実績）／最新終値（終値データ）。
   実行済みの購入段階は実績として保有側で表し、将来シミュレーションでは再購入しない（二重計上防止）。
   数量は売買単位で切り捨て、実購入額＝数量×想定価格（円）。予算を一切超えない。
   ============================================================ */

function fmtYen(v){ if (v === null || v === undefined || !isFinite(v)) return "—"; var r = Math.round(v); return (r < 0 ? "−" : "") + Math.abs(r).toLocaleString("ja-JP") + "円"; }
function fmtYenShort(v){ if (v === null || v === undefined || !isFinite(v)) return "—"; return (v < 0 ? "−" : "") + Math.abs(Math.round(v)).toLocaleString("ja-JP"); }
function fmtPct(v, digits){ if (v === null || v === undefined || !isFinite(v)) return "対象外"; return v.toFixed(digits === undefined ? 1 : digits) + "%"; }
function fmtSignedYen(v){ if (v === null || v === undefined || !isFinite(v)) return "—"; var r = Math.round(v); return (r > 0 ? "+" : (r < 0 ? "−" : "")) + Math.abs(r).toLocaleString("ja-JP") + "円"; }

function normalizeCode(code){ return String(code === null || code === undefined ? "" : code).trim().toUpperCase().slice(0, 12); }
/* 価格中継URLの検証：https URL のみ許可し、それ以外は除去（空文字）する。末尾スラッシュは取り除く */

      planBasePrice: clamp(num(pbRaw, 0), 0, 1e9),

      closeAnomalyCount: clamp(Math.round(num(it.closeAnomalyCount, 0)), 0, 1000),

/* ============================================================
   計算モジュール MarginSim（証券会社の実制度とは独立した概算モデル）
   維持率 ＝（代用評価額(シナリオ後) ＋ 保証金現金 ＋ min(建玉評価損益, 0) − 控除費用）÷ 建代金合計 × 100
   評価損益の算入はSBI証券公式の委託保証金率の計算に合わせ、評価損（マイナス）の場合のみ差し引き、
   評価益（プラス）の場合はゼロとして計算する（評価益は維持率に算入しない）。評価損益そのものの表示は符号どおり行う。
   建代金合計が 0 のとき維持率は null（画面では「対象外」）。
   ============================================================ */
var MarginSim = (function(){
  function collateralFactor(settings){
    switch (settings.collateralMode){
      case "same": return 1; case "half": return 0.5; case "strong": return 1.2; case "none": return 0;
      case "custom": return clamp(num(settings.collateralCustom, 100), 0, 300) / 100;
      default: return 1;
    }
  }
  /* 想定価格＝計画基準価格×(1−下落率) を円単位に切り捨てる共通の丸め処理。
     切り捨て前に相対 1e-9 の微小補正を加え、浮動小数点誤差を吸収する
     （例：70,000円×(1−0.55)＝31,499.999999999996 → 31,500円）。
     本物の端数（誤差より十分大きい小数部分）は従来どおり切り捨てる。
     想定価格・購入数量・建代金・累計購入額・評価損益はすべてこの価格から導出する */
  function stagePrice(basePrice, dropPct){
    var raw = basePrice * (1 - dropPct / 100);
    return Math.floor(raw + Math.abs(raw) * 1e-9);
  }
  function qtyFor(budget, price, unit){
    if (!(price > 0) || !(unit >= 1) || !(budget > 0)) return 0;
    return Math.floor(budget / price / unit) * unit;
  }
  /* SBI証券公式ルール：評価損益合計がマイナス（損）の場合のみ差し引き、プラス（益）の場合はゼロとして計算する */
  function adjPnl(pnl, settings){ return Math.min(pnl, 0); }
  /* 既存建玉の評価損益：現在値（建代金＋現在評価損益）が下落率ぶん変動する近似。pnl 未入力は 0 として概算し approx を立てる */
  function existingPnlAt(positions, dropPct){
    var pnl = 0, approx = false;
    positions.forEach(function(p){
      var cur = p.pnl === null ? 0 : p.pnl;
      if (p.pnl === null && p.principal > 0) approx = true;
      var mv = p.principal + cur;
      var delta = mv * (dropPct / 100);
      pnl += cur + (p.side === "sell" ? delta : -delta);
    });
    return { pnl: pnl, approx: approx };
  }
  function collateralAt(base, dropPct, factor){ return Math.max(0, Math.floor(base * (1 - (dropPct / 100) * factor))); }
  /* ---------- 銘柄別の実保有建玉（第4節） ----------
     保有は銘柄ごとに「数量×平均建値」で管理し、建代金と評価損益はここから一元計算する（二重入力・二重計上をしない）。
     現在の評価損益は最新終値基準。終値が無い保有は現在損益0として概算し approx を立てる（既存建玉の未入力と同じ扱い）。 */
  function holdingPrincipal(ins){ var h = ins.holding; return (h && h.qty > 0) ? h.qty * h.avgPrice : 0; }
  function holdingPnlNow(ins){
    var h = ins.holding;
    if (!h || !(h.qty > 0)) return { pnl: 0, approx: false };
    if (!(ins.closePrice > 0)) return { pnl: 0, approx: h.avgPrice > 0 };
    var diff = h.side === "sell" ? (h.avgPrice - ins.closePrice) : (ins.closePrice - h.avgPrice);
    return { pnl: h.qty * diff, approx: false };
  }
  /* 下落率シナリオでの保有評価損益：シナリオ価格は購入段階と同じく計画基準価格×(1−下落率)で決める
     （現在の下落率の地点では最新終値基準の現在損益と一致する）。計画基準価格が無い場合は終値、
     それも無い場合は平均建値を起点にする（終値が無い保有は概算として approx を引き継ぐ） */
  function holdingPnlAt(ins, dropPct){
    var h = ins.holding;
    if (!h || !(h.qty > 0)) return { pnl: 0, approx: false };
    var now = holdingPnlNow(ins);
    var base = ins.planBasePrice > 0 ? ins.planBasePrice : (ins.closePrice > 0 ? ins.closePrice : h.avgPrice);
    if (!(base > 0)) return { pnl: now.pnl, approx: now.approx };
    var price = base * (1 - dropPct / 100);
    var pnl = h.side === "sell" ? h.qty * (h.avgPrice - price) : h.qty * (price - h.avgPrice);
    return { pnl: pnl, approx: now.approx };
  }
  function holdingsTotalsAt(state, dropPct){
    var principal = 0, pnl = 0, approx = false;
    state.instruments.forEach(function(ins){
      principal += holdingPrincipal(ins);
      var r = holdingPnlAt(ins, dropPct);
      pnl += r.pnl; if (r.approx) approx = true;
    });
    return { principal: principal, pnl: pnl, approx: approx };
  }
  function holdingsTotalsNow(state){
    var principal = 0, pnl = 0, approx = false;
    state.instruments.forEach(function(ins){
      principal += holdingPrincipal(ins);
      var r = holdingPnlNow(ins);
      pnl += r.pnl; if (r.approx) approx = true;
    });
    return { principal: principal, pnl: pnl, approx: approx };
  }

  /* 全段階の数量・実購入額・実行可否をトリガー到達時点の保証金で判定（段階は下落率の昇順に処理） */
  function evaluateStages(state){
    var st = state.settings, factor = collateralFactor(st);
    var flat = [];
    state.instruments.forEach(function(ins){
      ins.stages.forEach(function(sg){ flat.push({ ins: ins, sg: sg }); });
    });
    flat.sort(function(a, b){ return a.sg.dropPct - b.sg.dropPct || String(a.ins.code).localeCompare(String(b.ins.code)); });
    var result = {}; var executedPrior = [];
    flat.forEach(function(item){
      var ins = item.ins, sg = item.sg;
      var price = stagePrice(ins.planBasePrice, sg.dropPct);
      var qty = qtyFor(sg.budget, price, ins.unit);
      var cost = qty * price;
      /* 段階の状態は3分類する：buy＝購入（1売買単位以上あり新規建て条件を満たす）、
         skip＝見送り（単位丸め後の数量が0。保証金不足ではなく、実行不能として扱わず後続段階を妨げない）、
         infeasible＝実行不能（数量は1単位以上あるが新規建て条件を満たせない）。
         新規建て条件（31%等）の判定は数量が1売買単位以上の段階にだけ適用する */
      var rec = { price: price, qty: qty, cost: cost, feasible: false, status: "", reason: "", cumBudget: 0, executed: !!sg.executed };
      /* 実行済みの段階は実績として保有建玉側で表すため、将来シミュレーションでは再購入しない */
      if (sg.executed){ rec.status = "executed"; rec.reason = "実行済み"; result[sg.id] = rec; return; }
      if (!sg.enabled){ rec.status = "disabled"; rec.reason = "無効"; result[sg.id] = rec; return; }
      if (qty <= 0){ rec.status = "skip"; rec.reason = price <= 0 ? "計画基準価格が未設定" : "見送り（数量0）：予算内で売買単位を購入できないため、この段階は購入しません（保証金不足ではありません）"; result[sg.id] = rec; return; }
      /* トリガー到達時点（下落率＝この段階の下落率）の推計保証金 */
      var t = sg.dropPct;
      var exP = existingPnlAt(state.positions, t);
      var hdT = holdingsTotalsAt(state, t);
      var newPnl = 0;
      executedPrior.forEach(function(p){
        var curPrice = stagePrice(p.ins.planBasePrice, t);
        newPnl += p.qty * (curPrice - p.price);
      });
      var balance = collateralAt(state.account.collateral, t, factor) + state.account.cash
                    + adjPnl(exP.pnl + hdT.pnl + newPnl, st) - st.fees;
      var required = Math.ceil(cost * st.newMargin / 100);
      if (balance >= required){ rec.feasible = true; rec.status = "buy"; executedPrior.push({ ins: ins, qty: qty, price: price }); }
      else { rec.status = "infeasible"; rec.reason = "必要保証金（概算 " + fmtYen(required) + "）に対し推計保証金が不足"; }
      result[sg.id] = rec;
    });
    /* 累計予算（有効かつ未実行の段階のみ、下落率順。実行済みは今後の購入予定に数えない） */
    state.instruments.forEach(function(ins){
      var sorted = ins.stages.slice().sort(function(a, b){ return a.dropPct - b.dropPct; });
      var cum = 0;
      sorted.forEach(function(sg){ if (sg.enabled && !sg.executed){ cum += sg.budget; } if (result[sg.id]) result[sg.id].cumBudget = cum; });
    });
    return result;
  }

  function simulate(state){
    var st = state.settings, factor = collateralFactor(st);
    var stageRes = evaluateStages(state);
    var drops = [];
    for (var d = 0; d <= st.maxDrop + 1e-9; d += st.step) drops.push(Math.round(d * 100) / 100);
    if (drops[drops.length - 1] !== st.maxDrop) drops.push(st.maxDrop);
    var existingPrincipal = state.positions.reduce(function(s, p){ return s + p.principal; }, 0);
    var rows = drops.map(function(drop){
      var executed = [];
      state.instruments.forEach(function(ins){
        ins.stages.forEach(function(sg){
          var r = stageRes[sg.id];
          if (sg.enabled && r && r.feasible && sg.dropPct <= drop + 1e-9) executed.push({ ins: ins, sg: sg, r: r });
        });
      });
      var newPrincipal = executed.reduce(function(s, e){ return s + e.r.cost; }, 0);

   JSON バックアップ（書き出し／読み込み）も同じ封筒・同じ検証を通す。 */
var state = sampleState();

function packState(st, savedAt){

function fetchRelayQuote(code, relayUrl){
  var base = sanitizeRelayUrl(relayUrl || "");
  if (!base) return Promise.reject({ reason: "nourl", message: "中継URLが設定されていません" });
  var c = normalizeCode(code);
  if (!c) return Promise.reject({ reason: "invalid", message: "銘柄コードが空です" });
  var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ try { ctrl.abort(); } catch (e) {} }, 10000) : null;
  var opts = { cache: "no-store" };
  if (ctrl) opts.signal = ctrl.signal;
  return fetch(base + "/?code=" + encodeURIComponent(c), opts).then(function(res){
    if (timer) clearTimeout(timer);
    if (res.status === 404) throw { reason: "notfound", status: 404 };
    if (!res.ok) throw { reason: "http", status: res.status, message: "HTTP " + res.status };
    return res.json();
  }).then(function(json){
    var parsed = RelayFeed.parse(json, c);
    if (!parsed.ok) throw { reason: parsed.reason || "invalid", message: parsed.message || "" };
    return parsed.data;
  }).catch(function(err){
    if (timer) clearTimeout(timer);
    if (err && err.reason) throw err;
    if (err && err.name === "AbortError") throw { reason: "timeout", message: "タイムアウトしました" };
    throw { reason: "network", message: err && err.message ? String(err.message) : "通信に失敗しました" };
  });
}
function fetchRelayHealth(relayUrl){
  var base = sanitizeRelayUrl(relayUrl || "");

  var timer = ctrl ? setTimeout(function(){ try { ctrl.abort(); } catch (e) {} }, 10000) : null;
  var opts = { cache: "no-store" };
  if (ctrl) opts.signal = ctrl.signal;
  return fetch(base + "/", opts).then(function(res){
    if (timer) clearTimeout(timer);
    if (!res.ok) throw { reason: "http", status: res.status, message: "HTTP " + res.status + " が返りました" };
    return res.json();
  }).then(function(json){
    if (timer) clearTimeout(timer);

/* 価格データの鮮度判定：取得日時（generatedAt）が2日以上前、または最新の終値の対象営業日が5日以上前なら「古い可能性」を返す */
function priceFreshness(){
  if (pricesStatus !== "ok" || !pricesData) return { stale: false, reasons: [] };
  var reasons = [];
  var now = Date.now();
  var gen = pricesData.generatedAt ? Date.parse(pricesData.generatedAt) : NaN;
  if (isFinite(gen) && now - gen > 2 * 24 * 3600 * 1000) reasons.push("取得日時（" + pricesData.generatedAt + "）が2日以上前です");
  var latest = "";
  Object.keys(pricesData.stocks).forEach(function(c){ if (pricesData.stocks[c].closeDate > latest) latest = pricesData.stocks[c].closeDate; });
  Object.keys(pricesData.indices).forEach(function(n){ if (pricesData.indices[n].latestDate > latest) latest = pricesData.indices[n].latestDate; });
  if (latest){
    var lt = Date.parse(latest + "T00:00:00");
    if (isFinite(lt) && now - lt > 5 * 24 * 3600 * 1000) reasons.push("最新の終値の対象営業日が " + latest + " で、直近の営業日から大きく離れています");

      var hp = MarginSim.holdingPnlNow(ins);
      var hPrin = MarginSim.holdingPrincipal(ins);
      var hRate = hPrin > 0 ? (hp.pnl / hPrin) * 100 : null;
      var sub = "計画基準価格 " + fmtYen(ins.planBasePrice) + "／最新終値 " + (ins.closePrice !== null ? fmtYen(ins.closePrice) + "（" + esc(ins.closeDate || "日付不明") + closeSourceSuffix(ins) + "）" : "未取得");
      var fqD = PriceFeed.stock(pricesData, ins.code);
      if (fqD && fqD.stale && ins.closeSource === "json") sub += "／前回データ（取得失敗のため）";
      if (ins.closeSource === "relay" && ins.closeQuality === "provisional") sub += "／暫定データ（異常値候補を暫定処理" + (ins.closeAnomalyCount ? "・異常値候補 " + ins.closeAnomalyCount + "件" : "") + "）";
      else if (ins.closeSource === "relay" && ins.closeQuality === "suspect") sub += "／大きな価格変動が検出されています（株式分割等の可能性" + (ins.closeAnomalyCount ? "・異常値候補 " + ins.closeAnomalyCount + "件" : "") + "）";
      else if (ins.closeSource === "relay" && ins.closeAnomalyCount) sub += "／異常値候補 " + ins.closeAnomalyCount + "件";
      var splitsD = effectiveSplits(ins, fqD);
      if (splitsD.length) sub += "／株式分割がありました（" + splitsD.map(function(sp){ return sp.date + "・" + sp.ratio; }).join("、") + "）。計画基準価格が分割前の価格でないか確認してください";
      if (ins.holding && ins.holding.qty > 0){
        sub += "／保有 " + ins.holding.qty.toLocaleString("ja-JP") + (ins.type === "ETF" ? "口" : "株") + "（" + (ins.holding.side === "sell" ? "売建" : "買建") + "）・平均建値 " + fmtYen(ins.holding.avgPrice)
             + "・評価損益 " + (ins.closePrice !== null && ins.closePrice > 0 ? fmtSignedYen(hp.pnl) + (hRate !== null ? "（" + (hRate >= 0 ? "+" : "−") + Math.abs(hRate).toFixed(2) + "%）" : "") : "終値未取得のため未計算");
      }
      html += '<div class="posline"><div class="posline-main"><strong>' + esc(normalizeCode(ins.code) || "コード未設定") + " " + esc(ins.name) + '</strong><span class="posline-sub">' + sub + '</span></div>'
        + (chg === null ? '<span class="pill mute">下落率 —</span>' : '<span class="pill ' + (chg >= 0 ? "up" : "down") + '">' + (chg >= 0 ? "+" : "−") + Math.abs(chg).toFixed(2) + "%</span>")
        + "</div>";
    });
    html += '<div class="rowflex mt"><button class="btn small" data-goto="plan">購入計画で価格・保有を確認・編集</button></div></div>';
  }

  html += '<div class="card"><h2>下落率 × 保証金維持率シミュレーション</h2>'
    + '<p class="sub">横軸：計画基準価格からの下落率／縦軸：保証金維持率（推計）。起点は現在の保有建玉で、未実行の購入段階だけを下落に応じて追加します。詳細表の行を選ぶとグラフ上に位置を示します。</p>'
    + '<div class="rowflex" style="justify-content:flex-end;margin-bottom:6px"><span style="font-size:.8rem;color:var(--muted);font-weight:700">縦軸</span><span class="seg" role="group" aria-label="縦軸スケール">'
    + '<button data-scale="auto" aria-pressed="' + (ui.chartScale !== "linear") + '">対数</button><button data-scale="linear" aria-pressed="' + (ui.chartScale === "linear") + '">線形</button></span></div>'
    + '<div class="chartbox">' + chartSVG() + "</div>"
    + '<div class="legend"><span><span class="sw"></span>シミュレーション維持率</span><span><span class="sw dash mgmt"></span>自主管理基準 ' + st.management + '%</span><span><span class="sw dash call"></span>追証基準 ' + st.marginCall + '%</span><span><span class="dotkey"></span>購入予定段階</span></div>'
    + "</div>";

  var detailMeta = "全" + sim.rows.length + "段階（0%〜−" + st.maxDrop + "%）"
    + " ・ 管理基準到達（0.1%精度）：" + (sim.firstMgmtPrecise !== null ? "<strong>−" + sim.firstMgmtPrecise.toFixed(1) + "%</strong>" : "最大下落率の範囲内では到達しません")
    + " ・ 追証基準到達（0.1%精度）：" + (sim.firstCallPrecise !== null ? "<strong>−" + sim.firstCallPrecise.toFixed(1) + "%</strong>" : "最大下落率の範囲内では到達しません")
    + (sim.firstMinMarginPrecise !== null ? " ・ 最低保証金を下回る下落率：<strong>−" + sim.firstMinMarginPrecise.toFixed(1) + "%</strong>" : "")
    + (ui.selectedDrop !== null ? " ・ 選択中：<strong>−" + ui.selectedDrop + "%</strong>" : "");
  html += '<details class="card detail-card" id="dropDetail"' + (ui.detailOpen ? " open" : "") + '><summary aria-label="下落率別の詳細を開閉する"><div class="detail-summary-in"><div class="detail-summary-main"><h2>下落率別の詳細（シミュレーション）</h2><div class="detail-summary-meta">' + detailMeta + ' — タップで表を開きます</div></div><span class="detail-toggle"><span class="label-open">詳細を開く</span><span class="label-close">閉じる</span><span class="chev" aria-hidden="true">▼</span></span></div></summary><div class="detail-body"><p class="sub">実口座の現在値ではなく、各下落率まで相場が下落し、到達した購入段階をすべて実行した場合の推計です。新規建余力は概算です。行を選ぶとグラフ上に位置を示します。<br>下落率の起点の区別：この表とグラフの下落率は<strong>各銘柄の計画基準価格を起点</strong>とする下落率です。一方、代用有価証券の連動設定（設定画面）は<strong>現在の代用評価額に対する変動の想定</strong>で、起点が異なります。基準への到達下落率は表の刻みより細かい0.1%精度（購入段階の直前・直後も評価）で別途算出し、上の要約とKPIに表示しています。維持率の分子では評価損は差し引き、評価益は算入しません（SBI証券公式ルール準拠）。</p><div class="tblwrap"><table class="dt"><thead><tr>'
    + "<th>下落率</th><th>累計購入額</th><th>建玉総額</th><th>評価損益</th><th>代用評価額</th><th>実質保証金</th><th>維持率</th><th>新規建余力（概算）</th><th>状態</th></tr></thead><tbody>";
  sim.rows.forEach(function(r){
    var rs = rateStatus(r.rate);
    var rowCls = ui.selectedDrop === r.drop ? "sel" : (r.rate !== null && r.rate < st.marginCall ? "row-danger" : (r.rate !== null && r.rate < st.management ? "row-warn" : ""));
    var stateLabel = r.rate === null ? "対象外" : rs.label;
    if (r.infeasibleAtDrop > 0) stateLabel += "・この段階は新規建て条件を満たさない可能性";
    else if (r.infeasibleCount > 0) stateLabel += "・購入不能の段階を含む";
    if (r.skipAtDrop > 0) stateLabel += "・この段階は見送り（数量0）";
    else if (r.skipCount > 0) stateLabel += "・見送り（数量0）の段階を含む";
    if (r.belowMinMargin) stateLabel += "・最低保証金未達（実質保証金が " + fmtYen(st.minMargin) + " 未満）";
    html += '<tr data-drop="' + r.drop + '" class="' + rowCls + '"><td class="num">−' + r.drop + '%</td><td class="num" data-label="累計購入額">' + fmtYenShort(r.newPrincipal) + '円</td><td class="num" data-label="建玉総額">' + fmtYenShort(r.totalPrincipal) + '円</td><td class="num" data-label="評価損益">' + fmtSignedYen(r.totalPnl) + '</td><td class="num" data-label="代用評価額">' + fmtYenShort(r.collateral) + '円</td><td class="num" data-label="実質保証金">' + fmtYenShort(r.balance) + '円</td><td class="num" data-label="維持率"><strong>' + fmtPct(r.rate) + '</strong></td><td class="num" data-label="新規建余力（概算）">' + fmtYenShort(r.capacity) + '円</td><td data-label="状態"><span class="pill ' + (r.belowMinMargin || r.infeasibleAtDrop > 0 ? "danger" : rs.cls) + '">' + esc(stateLabel) + "</span></td></tr>";
  });
  html += "</tbody></table></div>";
  if (sim.firstInfeasible){
    html += '<p class="hint">補助指標：−' + sim.firstInfeasible.drop + '% 段階は新規建て条件（新規建保証金率 ' + st.newMargin + '%）を満たさない可能性があります。その段階で購入を止めた場合、最大下落率 −' + st.maxDrop + '% 時点の維持率は <strong class="num">' + (sim.finalRateStopped === null ? "対象外" : fmtPct(sim.finalRateStopped)) + '</strong>（建玉総額 ' + fmtYen(sim.finalPrincipalStopped) + '）です。上の表は購入可能な段階をすべて実行した場合の推計で、この補助指標とは前提が異なります。</p>';
  }
  if (sim.rows.some(function(r){ return r.belowMinMargin; })){
    html += '<p class="hint">※ 実質保証金が最低保証金額 ' + fmtYen(st.minMargin) + ' を下回る行は、状態欄に「最低保証金未達」と文字で表示しています（色だけでは区別していません）。</p>';
  }
  if (sim.rows.some(function(r){ return r.existingPnlApprox; })){
    html += '<p class="hint">※ 既存建玉の一部は評価損益が未入力のため、評価損益の推計は概算です（未入力分は現在損益0として下落変動のみ反映）。正確な値が必要な場合は「口座・保有状況」で評価損益を入力してください。</p>';
  }
  html += "</div></details>";

  html += '<div class="card"><h2>現在の実口座情報</h2><p class="sub">シミュレーション値ではなく、登録されている現在の口座情報です。</p><dl class="kv">'
    + "<dt>証券会社</dt><dd>" + (state.account.broker ? esc(state.account.broker) : "未登録") + "</dd>"
    + "<dt>代用有価証券評価額（" + (state.account.collateralBasis === "after" ? "掛目適用後" : "時価×掛目で計算した適用後評価額") + "）</dt><dd class='num'>" + fmtYen(state.account.collateral) + "</dd>"
    + "<dt>委託保証金現金</dt><dd class='num'>" + fmtYen(state.account.cash) + "</dd>"
    + "<dt>銘柄別保有の建代金合計</dt><dd class='num'>" + fmtYen(cur.holdingsPrincipal) + "</dd>"
    + "<dt>計画銘柄以外の既存建玉 建代金合計</dt><dd class='num'>" + fmtYen(cur.principal - cur.holdingsPrincipal) + "</dd>"
    + "<dt>建代金合計（実績）</dt><dd class='num'>" + fmtYen(cur.principal) + "</dd>"
    + "<dt>推計保証金残高</dt><dd class='num'>" + fmtYen(cur.balance) + "</dd>"
    + "<dt>情報更新日時</dt><dd>" + (state.meta.updatedAt ? esc(state.meta.updatedAt) : "未記録") + "</dd></dl>"
    + '<div class="rowflex mt"><button class="btn" data-goto="account">口座情報を編集</button><button class="btn" data-goto="plan">購入計画を編集</button></div></div>';

  el.innerHTML = html;
  el.querySelectorAll("[data-goto]").forEach(function(b){ b.onclick = function(){ switchView(b.getAttribute("data-goto")); }; });
  el.querySelectorAll("[data-scale]").forEach(function(b){ b.onclick = function(){ ui.chartScale = b.getAttribute("data-scale"); renderDashboard(); }; });
  var detailEl = el.querySelector("#dropDetail");
  if (detailEl){ detailEl.addEventListener("toggle", function(){ ui.detailOpen = detailEl.open; var meta = detailEl.querySelector(".detail-summary-meta"); if (meta && !detailEl.open){ /* 閉じたときも要約はそのまま（再描画なしで状態だけ保持） */ } }); }
  el.querySelectorAll("tr[data-drop]").forEach(function(tr){
    tr.onclick = function(){ ui.selectedDrop = num(tr.getAttribute("data-drop")); ui.detailOpen = true; renderDashboard(); };
  });
}
function kpi(label, value, note, cls){
  return '<div class="kpi ' + (cls || "") + '"><div class="k-label">' + esc(label) + '</div><div class="k-value num">' + value + '</div><div class="k-note">' + esc(note) + "</div></div>";
}

/* ---------- 維持率グラフ（手書きSVG） ---------- */
function chartSVG(){
  var st = state.settings, rows = sim.rows.filter(function(r){ return r.rate !== null; });
  var W = 760, H = 380, L = 84, R = 16, T = 14, B = 40, iw = W - L - R, ih = H - T - B;
  if (!rows.length) return '<p class="hint">建玉がないため、維持率グラフは表示できません（対象外）。購入計画を登録すると、計画実行後の維持率が表示されます。</p>';
  var maxRate = Math.max.apply(null, rows.map(function(r){ return r.rate; }));
  var useLog = ui.chartScale !== "linear" && maxRate > 300;
  var yMin = useLog ? 5 : 0;
  var yMax = useLog ? Math.pow(10, Math.ceil(Math.log10(Math.max(maxRate, 30)))) : Math.max(30, Math.ceil(maxRate * 1.1 / 10) * 10);
  function X(d){ return L + (d / st.maxDrop) * iw; }
  function Y(v){
    if (useLog){ var lo = Math.log10(yMin), hi = Math.log10(yMax); return T + ih - ((Math.log10(Math.max(v, yMin)) - lo) / (hi - lo)) * ih; }
    return T + ih - (v / yMax) * ih;
  }
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="下落率と保証金維持率のシミュレーショングラフ">';
  var ticks = useLog ? [5,10,20,25,50,100,200,500,1000,2000,5000,10000,20000,50000,100000].filter(function(v){ return v >= yMin && v <= yMax; })
                     : (function(){ var a = []; var stepT = yMax > 1000 ? 500 : (yMax > 200 ? 100 : 25); for (var v = 0; v <= yMax; v += stepT) a.push(v); return a; })();
  ticks.forEach(function(v){
    var y = Y(v);
    s += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>'
       + '<text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v.toLocaleString("ja-JP") + "%</text>";
  });
  for (var d = 0; d <= st.maxDrop; d += (st.maxDrop >= 60 ? 10 : 5)){
    var x = X(d);
    s += '<text x="' + x + '" y="' + (H - 18) + '" text-anchor="middle" font-size="11" fill="var(--muted)">−' + d + '%</text>'
       + '<line x1="' + x + '" y1="' + T + '" x2="' + x + '" y2="' + (T + ih) + '" stroke="var(--line)" stroke-width="0.5" opacity="0.5"/>';
  }
  s += '<text x="' + (L + iw / 2) + '" y="' + (H - 2) + '" text-anchor="middle" font-size="11" fill="var(--muted)">下落率</text>';
  function thresh(v, color, label){
    if (v < yMin || v > yMax) return "";
    var y = Y(v);
    return '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y + '" stroke="' + color + '" stroke-width="1.6" stroke-dasharray="7 4"/>'
         + '<text x="' + (W - R - 2) + '" y="' + (y - 5) + '" text-anchor="end" font-size="11" font-weight="700" fill="' + color + '">' + label + " " + v + "%</text>";
  }
  s += thresh(st.management, "#d9930d", "自主管理基準");
  s += thresh(st.marginCall, "#d43a31", "追証基準");
  if (ui.selectedDrop !== null){
    var sx = X(ui.selectedDrop);
    s += '<line x1="' + sx + '" y1="' + T + '" x2="' + sx + '" y2="' + (T + ih) + '" stroke="var(--info)" stroke-width="1.6"/>';
  }
  var pts = rows.map(function(r){ return X(r.drop).toFixed(1) + "," + Y(r.rate).toFixed(1); }).join(" ");
  s += '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round"/>';
  rows.forEach(function(r){
    s += '<circle cx="' + X(r.drop) + '" cy="' + Y(r.rate) + '" r="' + (ui.selectedDrop === r.drop ? 5.5 : 3) + '" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"><title>−' + r.drop + "%：維持率 " + fmtPct(r.rate) + "</title></circle>";
  });
  /* 購入段階マーカー */
  var rateAt = {};
  sim.rows.forEach(function(r){ rateAt[r.drop] = r.rate; });
  var seen = {};
  state.instruments.forEach(function(ins){ ins.stages.forEach(function(sg){
    if (!sg.enabled || sg.executed || sg.dropPct > st.maxDrop) return;
    var row = sim.rows.reduce(function(best, r){ return Math.abs(r.drop - sg.dropPct) < Math.abs(best.drop - sg.dropPct) ? r : best; }, sim.rows[0]);
    if (!row || row.rate === null) return;
    var key = sg.dropPct + ":" + Math.round(row.rate);
    if (seen[key]) return; seen[key] = 1;
    s += '<circle cx="' + X(sg.dropPct) + '" cy="' + Y(row.rate) + '" r="5" fill="#d9930d" stroke="var(--surface)" stroke-width="1.5"><title>' + esc(ins.code) + " −" + sg.dropPct + "% 段階</title></circle>";
  });});
  s += "</svg>";
  return s;
}
</script>
<script>
"use strict";
/* ================= 購入計画 ================= */
function currentInstrument(){
  var ins = state.instruments.filter(function(i){ return i.id === ui.selectedInsId; })[0];
  if (!ins && state.instruments.length){ ins = state.instruments[0]; ui.selectedInsId = ins.id; }
  return ins || null;
}
function renderPlan(){
  var el = document.getElementById("view-plan");
  var html = '<div class="minibar"><span>計画購入総額（実購入） <b class="num">' + fmtYen(sim.planCost) + '</b></span><span>予算合計 <b class="num">' + fmtYen(sim.planBudget) + '</b></span><span>管理基準の最初の到達 <b>' + (sim.firstMgmtPrecise !== null ? "−" + sim.firstMgmtPrecise.toFixed(1) + "%（0.1%精度）" : "なし（−" + state.settings.maxDrop + "%まで）") + '</b></span><span>想定最大評価損 <b class="num">' + fmtSignedYen(sim.minPnl) + "</b></span></div>";
  html += '<div class="chips" role="listbox" aria-label="銘柄一覧">';
  state.instruments.forEach(function(ins){
    var tot = ins.stages.filter(function(s){ return s.enabled && !s.executed; }).reduce(function(a, s){ return a + s.budget; }, 0);
    html += '<button class="chip" data-ins="' + ins.id + '" aria-selected="' + (ins.id === ui.selectedInsId) + '"><span class="c-code">' + esc(normalizeCode(ins.code) || "コード未設定") + " " + esc(ins.name) + '</span><br><span class="c-name">' + (ins.type === "ETF" ? "ETF" : "個別株式") + "／計画予算 " + fmtYen(tot) + "</span></button>";
  });
  html += '<button class="chip" id="addIns"><span class="c-code">＋ 銘柄を追加</span><br><span class="c-name">個別株式・ETFを登録</span></button></div>';

  var ins = currentInstrument();
  if (!ins){
    html += '<div class="card"><h2>銘柄が登録されていません</h2><p class="sub">「銘柄を追加」から登録してください。</p></div>';
    el.innerHTML = html; bindPlanCommon(el); return;
  }
  var quote = PriceFeed.stock(pricesData, ins.code);
  var curChg = changePct(ins.planBasePrice, ins.closePrice);
  var holdPnl = MarginSim.holdingPnlNow(ins);
  var holdPrin = MarginSim.holdingPrincipal(ins);
  var holdRate = holdPrin > 0 ? (holdPnl.pnl / holdPrin) * 100 : null;
  /* 参考指数：終値データ（prices.json）の自動値を優先し、無い項目だけ手入力値で補う */
  var ixLatest = ins.ref.name !== "なし" ? PriceFeed.indexLatest(pricesData, ins.ref.name) : null;
  var ixBase = (ins.ref.name !== "なし" && ins.ref.baseDate) ? PriceFeed.indexCloseOn(pricesData, ins.ref.name, ins.ref.baseDate) : null;
  var refLatestVal = ixLatest ? ixLatest.latestClose : ins.ref.currentValue;
  var refLatestDate = ixLatest ? ixLatest.latestDate : "";
  var refBaseVal = ixBase ? ixBase.close : ins.ref.baseValue;
  var refBaseDateUsed = ixBase ? ixBase.date : ins.ref.baseDate;
  var refChg = changePct(refBaseVal, refLatestVal);
  function chgPill(v){ return v === null ? '<span class="pill mute">—</span>' : '<span class="pill ' + (v >= 0 ? "up" : "down") + '">' + (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) + "%</span>"; }

function bindStages(el, ins){

    if (!sg) return;
    row.querySelectorAll("[data-act]").forEach(function(ctrl){
      var act = ctrl.getAttribute("data-act");
      if (act === "toggle"){ ctrl.addEventListener("change", function(){ sg.enabled = ctrl.checked; recalc(); renderPlan(); }); }
      else if (act === "del"){ ctrl.addEventListener("click", function(){
        confirmModal("購入段階を削除しますか", "−" + sg.dropPct + "%／予算 " + fmtYen(sg.budget) + " の段階を削除します。", "削除する", function(){
          ins.stages = ins.stages.filter(function(s){ return s.id !== sid; }); recalc(); renderPlan();
        });
      }); }
      else if (act === "drop"){ ctrl.addEventListener("change", function(){ sg.dropPct = clamp(num(ctrl.value, sg.dropPct), 0, 100); recalc(); renderPlan(); }); }
      else if (act === "budget"){
        ctrl.addEventListener("input", function(){ sg.budget = clamp(Math.round(num(ctrl.value, 0)), 0, 1e12); recalc(); refreshStageRow(row, ins, sg); refreshMinibar(); });
        ctrl.addEventListener("change", function(){ renderPlan(); });

          var b = row.querySelector('[data-act="budget"]'); if (b) b.value = sg.budget;
          recalc(); refreshStageRow(row, ins, sg); refreshMinibar();
        });
        ctrl.addEventListener("change", function(){ renderPlan(); });
      }
      else if (act === "execToggle" || act === "markExec"){
        ctrl.addEventListener("click", function(){
          var toExec = act === "markExec" ? true : ctrl.checked;
          if (toExec && !sg.executed){
            /* 実行済みにする際は、計画値（想定価格・数量・実購入予定額）を実績の初期値として下書きする。実際の値と違えば実績欄で直せる */
            var r = sim.stageRes[sg.id];
            if (r){ if (sg.execPrice === null) sg.execPrice = r.price; if (sg.execQty === null) sg.execQty = r.qty; if (sg.execAmount === null) sg.execAmount = r.cost; }
          }

          recalc(); renderPlan();
          toast(toExec ? "段階を実行済みにしました。実績は「現在の保有」へ反映して管理してください。" : "段階を未実行に戻しました。");
        });

      else if (act === "execAmount"){
        ctrl.addEventListener("change", function(){
          sg.execAmount = ctrl.value === "" ? null : clamp(Math.round(num(ctrl.value, 0)), 0, 1e12);
          recalc(); renderPlan();

      else if (act === "reflect"){
        ctrl.addEventListener("click", function(){
          if (sg.execQty === null || sg.execPrice === null || !(sg.execQty > 0)){

    + fld("情報更新日時", '<input type="text" id="a_updated" value="' + esc(state.meta.updatedAt) + '" placeholder="例：2026-11-17 11:30">')
    + "</div>"
    + (hcInfo.mode === "before"
      ? '<p class="hint" style="font-size:.92rem">計算に使う代用評価額：<strong class="num">' + fmtYen(a.collateral) + "</strong>"
        + (hcInfo.applied !== null ? '（時価 ' + fmtYen(a.collateralMarket) + " × 掛目 " + a.collateralHaircut + "% を切り捨てて計算）" : "（時価と掛目がそろうと自動で計算されます）") + "</p>"
        + (hcInfo.warning ? '<div class="notice warn" style="margin-top:10px">掛目が未設定のため、時価から適用後評価額を計算できません（現在表示されている適用後評価額で計算しています）。</div>' : "")
        + '<p class="hint">掛目は証券会社・資産の種類によって異なります。この入力は単一の掛目率による簡略化です。入力方式を「直接入力」に戻すと、最後に計算された適用後評価額がそのまま直接編集できる値として残ります。</p>'
      : "")
    + '<dl class="kv mt"><dt>推計保証金残高（現在・実質保証金）</dt><dd class="num">' + fmtYen(cur.balance) + (cur.belowMinMargin ? '（最低保証金額 ' + fmtYen(state.settings.minMargin) + ' 未満：差し入れが必要になる場合があります）' : '（最低保証金額 ' + fmtYen(state.settings.minMargin) + ' 以上）') + '</dd>'
    + '<dt>推計維持率（現在の保有＋既存建玉）</dt><dd class="num">' + fmtPct(cur.rate) + (cur.pnlApprox ? "（評価損益未入力分あり・概算）" : "") + "</dd>"
    + (a.brokerRate !== null && cur.rate !== null ? '<dt>証券会社表示との差</dt><dd class="num">' + (a.brokerRate - cur.rate >= 0 ? "+" : "−") + Math.abs(a.brokerRate - cur.rate).toFixed(1) + " pt（計算モデルが異なるため差が生じます）</dd>" : "")
    + "</dl></div>";

  html += '<div class="card"><h2>計画銘柄以外の既存建玉</h2><p class="sub">購入計画の対象銘柄<strong>以外</strong>で、すでに保有している信用建玉を登録します。計画対象銘柄の保有は「購入計画」画面の銘柄ごとの「現在の保有」で管理してください。<strong>同じ建玉を両方に登録すると二重計上になります。</strong>全体の計算では、銘柄別保有とここの建玉を合算します。評価損益は空欄（未入力）にできます。その場合シミュレーションでは概算として扱い、勝手な値で補完しません。</p>'
    + '<div class="rowflex"><button class="btn primary small" id="addPos">＋ 建玉を追加</button></div><div id="posList">';
  state.positions.forEach(function(p){
    html += '<div class="posrow" data-pos="' + p.id + '"><div class="rowflex"><strong>' + esc(p.code || "コード未設定") + " " + esc(p.name || "") + '</strong><span class="pill ' + (p.side === "buy" ? "info" : "warn") + '">' + (p.side === "buy" ? "買建" : "売建") + '</span><span style="margin-left:auto"></span><button class="btn small danger-outline" data-pact="del">削除</button></div>'
      + '<div class="pr-grid">'
      + fld("銘柄コード", '<input type="text" data-pact="code" aria-label="建玉の銘柄コード" value="' + esc(p.code) + '" autocomplete="off">')
      + fld("銘柄名・メモ", '<input type="text" data-pact="name" aria-label="建玉の銘柄名・メモ" value="' + esc(p.name) + '" autocomplete="off">')
      + fld("買建・売建", '<select data-pact="side" aria-label="買建・売建"><option value="buy"' + (p.side === "buy" ? " selected" : "") + '>買建</option><option value="sell"' + (p.side === "sell" ? " selected" : "") + ">売建</option></select>")
      + fld("建代金（円）", '<input type="number" data-pact="principal" aria-label="建代金（円）" min="0" step="1" value="' + p.principal + '">')
      + fld("現在の評価損益（円・空欄=未入力）", '<input type="number" data-pact="pnl" aria-label="現在の評価損益（円）" step="1" value="' + (p.pnl === null ? "" : p.pnl) + '" placeholder="未入力">')
      + "</div></div>";
  });
  var totP = state.positions.reduce(function(s, p){ return s + p.principal; }, 0);
  html += '</div><p class="hint">計画銘柄以外の既存建玉の建代金合計：<strong class="num">' + fmtYen(totP) + '</strong>／銘柄別保有の建代金合計：<strong class="num">' + fmtYen(cur.holdingsPrincipal) + '</strong>（担保は銘柄ごとに重複計上せず、口座全体で一度だけ計算します）</p>' + otherPositionsWarningHtml(state) + "</div>";
  el.innerHTML = html;

  function on(id, fn){ var n = el.querySelector(id); if (n) n.addEventListener("change", function(){ fn(n); recalc(); renderAccount(); }); }
  on("#a_broker", function(n){ a.broker = n.value.trim().slice(0, 60); state.meta.isSample = false; });
  on("#a_collateral", function(n){ if (a.collateralBasis === "before") return; a.collateral = clamp(num(n.value, 0), 0, 1e12); state.meta.isSample = false; });
  on("#a_basis", function(n){
    a.collateralBasis = n.value === "before" ? "before" : "after";
    /* 時価＋掛目方式へ切り替えた初回は掛目に初期値80を表示する。時価欄は空欄から始め、
       適用後評価額を時価欄へ流し込むことはしない（二重適用の防止）。直接入力へ戻すときは
       最後に計算された適用後評価額がそのまま残る（sync は直接入力方式では何もしない） */
    if (a.collateralBasis === "before" && a.collateralHaircut === null) a.collateralHaircut = COLLATERAL_HAIRCUT_DEFAULT;
    syncCollateralFromHaircut(a);
  });
  on("#a_market", function(n){
    var v = n.value === "" ? NaN : num(n.value, NaN);
    a.collateralMarket = isFinite(v) ? clamp(v, 0, 1e12) : null;
    syncCollateralFromHaircut(a);
    state.meta.isSample = false;
  });
  on("#a_haircut", function(n){
    var v = n.value === "" ? NaN : num(n.value, NaN);
    a.collateralHaircut = isFinite(v) ? clamp(v, 0, 100) : null;
    syncCollateralFromHaircut(a);
    state.meta.isSample = false;
  });
  on("#a_cash", function(n){ a.cash = clamp(num(n.value, 0), -1e12, 1e12); state.meta.isSample = false; });
  on("#a_brokerRate", function(n){ a.brokerRate = n.value === "" ? null : num(n.value, NaN); if (!isFinite(a.brokerRate)) a.brokerRate = null; });
  on("#a_updated", function(n){ state.meta.updatedAt = n.value.trim(); });
  el.querySelector("#addPos").onclick = function(){
    state.positions.push({ id: uid("pos"), code: "", name: "", side: "buy", principal: 0, pnl: null });
    recalc(); renderAccount();
  };
  el.querySelectorAll("[data-pos]").forEach(function(row){
    var p = state.positions.filter(function(x){ return x.id === row.getAttribute("data-pos"); })[0];
    if (!p) return;
    row.querySelectorAll("[data-pact]").forEach(function(ctrl){
      var act = ctrl.getAttribute("data-pact");
      if (act === "del"){ ctrl.addEventListener("click", function(){
        confirmModal("建玉を削除しますか", "「" + esc(p.name || p.code || "建玉") + "」（建代金 " + fmtYen(p.principal) + "）を削除します。", "削除する", function(){
          state.positions = state.positions.filter(function(x){ return x.id !== p.id; }); recalc(); renderAccount();
        });
      }); return; }
      ctrl.addEventListener("change", function(){
        if (act === "code") p.code = normalizeCode(ctrl.value);
        else if (act === "name") p.name = ctrl.value.trim().slice(0, 60);
        else if (act === "side") p.side = ctrl.value === "sell" ? "sell" : "buy";
        else if (act === "principal") p.principal = clamp(num(ctrl.value, 0), 0, 1e12);
        else if (act === "pnl"){ p.pnl = ctrl.value === "" ? null : num(ctrl.value, NaN); if (!isFinite(p.pnl)) p.pnl = null; }
        recalc(); renderAccount();
      });
    });
  });
}

<script>

    + '<div class="card"><h2>価格中継（任意コード取得）</h2><p class="sub">終値データ（prices.json）に登録されていない銘柄コードでも、価格中継から終値を取得できるようにします。登録済みコードは従来どおり prices.json を優先し、中継は使いません。中継URLはこの端末のアプリデータ内にだけ保存されます。URLを空欄にすると中継は無効になります。</p>'
    + fld("中継URL", '<input type="text" id="relay_url" value="' + esc(s.relayUrl || "") + '" placeholder="https://…workers.dev" autocomplete="off" inputmode="url">')
    + '<div class="rowflex mt"><button class="btn small" id="relayTestBtn" type="button">中継をテスト</button><button class="btn small" id="relayResetBtn" type="button">初期値に戻す</button><span class="hint" id="relayTestResult" role="status" style="margin-top:0"></span></div>'

    + '<div class="card"><h2>データ管理</h2><p class="sub">入力したデータは、この端末のブラウザ内（IndexedDB）に形式バージョン付きで自動保存され、再起動後も自動で復元されます。保存先はこの端末・このブラウザ内のみで、他の端末とは同期されません。機種変更やブラウザのデータ消去に備えて、JSONバックアップも併用してください。</p>'
    + '<p class="hint" id="persistInfo">' + esc(persistInfoText()) + "</p>"
    + '<p class="hint">アプリのバージョン：アプリ v' + APP_VERSION + '（基本バージョン）／データ形式バージョン：v' + DATA_VERSION + '／Service Workerキャッシュ名：' + SW_CACHE_NAME + '。</p>'
    + '<div class="rowflex" style="margin-bottom:10px"><button class="btn small" id="checkUpdateBtn">更新を確認</button><span class="hint" id="updateResult" role="status" style="margin-top:0"></span></div>'
    + '<p class="hint">このアプリは公開パス（/margin-nanpin/）配下に置かれ、専用のキャッシュ名と専用のIndexedDB名を使うため、他の公開アプリと保存先やキャッシュが競合しない構成になっています。</p>'
    + '<p class="hint">' + pricesStatusText() + '</p><div class="rowflex" style="margin-bottom:10px"><button class="btn small" id="reloadPricesBtn">終値データを再読み込み</button></div>'

    + (storageBlocked ? '<div class="notice danger" style="margin:0 0 10px">保存データの形式バージョン（' + loadWarningVersion + '）がこのアプリ（' + DATA_VERSION + '）より新しいため読み込めませんでした。<div class="rowflex mt"><button class="btn danger-outline small" id="clearStoredBtn">保存データを消去して自動保存を再開</button></div></div>' : "")
    + (loadWarning === "corrupt" ? '<div class="notice warn" style="margin:0 0 10px">前回の保存データが破損していたため読み込めず、退避しました。現在のデータは自動保存されています。</div>' : "")
    + '<div class="rowflex"><button class="btn" id="saveNowBtn">今すぐ保存</button><button class="btn primary" id="exportBtn">JSONで書き出す（バックアップ）</button><button class="btn" id="importBtn">JSONを読み込む（復元）</button><button class="btn danger-outline" id="resetBtn">初期サンプルデータに戻す</button></div>'
    + '<p class="hint">読み込み時は形式とバージョンを検証し、不正な値（文字列・負数・範囲外）は自動で除去・丸めてから取り込みます。破損したファイルや、このアプリより新しい形式のファイルは取り込まず、現在のデータを保持します。取り込んだデータは自動保存にも反映されます。</p></div>'
    + "</div><div>"

    + '<div class="card" style="margin-top:14px"><h2>計算モデルの前提と注意</h2>'
    + '<ul style="margin:6px 0 0;padding-left:1.2em;font-size:.88rem">'
    + "<li>簡易シナリオ：すべての対象銘柄が同じ割合で下落し、担保は設定した連動割合で下落します（銘柄ごとに異なる下落率を設定する詳細シナリオは今後の拡張用にデータ構造のみ用意）。</li>"
    + "<li>購入段階は下落率の到達順に実行し、各段階の必要保証金（実購入額×新規建保証金率）を、到達時点の推計保証金と比較して実行可否を判定します。これは概算判定であり、維持率だけで新規建ての可否を判断していません。正確な新規建余力の再現に必要な情報が不足する項目は「概算」と明示しています。</li>"
    + "<li>価格は計画基準価格（下落率の起点・購入しても自動変更しない）／平均建値（実保有の約定平均）／最新終値（終値データ）の3つを分離して管理します。シミュレーションの起点は現在の保有建玉（銘柄別保有＋計画銘柄以外の既存建玉）で、未実行の計画段階だけを今後の下落に応じて追加購入します。実行済みの段階は実績として保有側で表し、シミュレーションで再購入しません（二重計上防止）。</li>"
    + "<li>既存建玉の評価損益の将来推計は「現在の時価（建代金＋現在評価損益）が下落率ぶん変動する」近似です。評価損益が未入力の建玉は計算から除外し（現在損益0として下落変動のみ反映）、維持率は概算である旨を該当表示の近くに明示します。</li>"
    + "<li>評価損益の保証金算入はSBI証券公式の委託保証金率の計算に準拠します：評価損益合計がマイナスの場合のみ差し引き、プラスの場合はゼロとして計算します（評価益は維持率に算入しません）。変更理由は、評価益を算入すると実際の制度より維持率が高く出て、リスクを過小評価するためです。</li>"
    + "<li>管理基準・追証基準への到達下落率は、表・グラフの刻み（初期値5%）とは別に、内部計算を0.1%刻みに細分化し、各購入段階のトリガー直前・直後も評価点に含めて算出します（段階購入で維持率が不連続に落ちるケースを見落とさないため）。到達しない場合は「最大下落率の範囲内では到達しません」と明示します。</li>"
    + "<li>最低保証金：制度上、新規建てには委託保証金が最低保証金額（初期値300,000円）以上必要です。実質保証金（現金＋代用評価額−評価損−控除費用）がこれを下回る場合、現在値とシミュレーション各行で文字による警告を表示します。</li>"
    + "<li>下落率の起点の区別：シミュレーションの下落率は各銘柄の<strong>計画基準価格を起点</strong>とする下落率です。代用有価証券の連動設定は<strong>現在の代用評価額に対する変動の想定</strong>であり、両者は起点が異なります（計算方法自体は従来どおりです）。</li>"
    + "<li>新規建て条件（新規建保証金率）を満たせなくなる段階がある場合、その段階を詳細表で「新規建て条件を満たさない可能性」と文字でマークし、「購入可能な段階までで止めた場合の最終維持率」を補助指標として、本体のシミュレーション結果（購入可能な段階をすべて実行した場合）と区別して表示します。</li>"
    + "<li>維持率が追証基準に到達することと、実際に追証が発生することは同一ではありません。</li>"

/* ---------- JSON エクスポート／インポート ---------- */
function exportJSON(){
  var payload = { app: "margin-nanpin-planner", version: DATA_VERSION, exportedAt: new Date().toISOString(), data: state };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nanpin-plan-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  toast("JSONバックアップを書き出しました。");
}
document.getElementById("importFile").addEventListener("change", function(ev){
  var file = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var parsed = null;
    try { parsed = JSON.parse(String(reader.result)); } catch (e) { parsed = null; }
    if (parsed === null){
      showModal("<h3>読み込めませんでした</h3><p style='margin:0 0 14px'>ファイルの内容がJSONとして読み取れないため、取り込みを中止しました。現在のデータはそのまま保持されています。</p><div class='rowflex' style='justify-content:flex-end'><button class='btn primary' onclick='closeModal()'>閉じる</button></div>");
      return;
    }
    var res = unpackState(parsed);
    if (!res.ok){
      var msg = res.reason === "version"
        ? "このファイルの形式バージョン（" + res.foundVersion + "）は、このアプリ（" + DATA_VERSION + "）より新しいため取り込めませんでした。新しいアプリで書き出したファイルは、古いアプリでは開けません。"
        : "ファイルの形式が不正か破損しているため、取り込みを中止しました。";
      showModal("<h3>読み込めませんでした</h3><p style='margin:0 0 14px'>" + esc(msg) + "現在のデータはそのまま保持されています。</p><div class='rowflex' style='justify-content:flex-end'><button class='btn primary' onclick='closeModal()'>閉じる</button></div>");
      return;
    }
    state = res.state;
    ui.selectedInsId = state.instruments.length ? state.instruments[0].id : null;
    ui.selectedDrop = null;
    recalc(); render();
    toast("データを復元しました（形式バージョン " + DATA_VERSION + " として検証済み）。");
  };
  reader.readAsText(file);
});

/* ---------- 自己テスト（指示書 §8） ---------- */
function runSelfTests(){
  var T = [];
  function t(name, ok, detail){ T.push({ name: name, ok: !!ok, detail: detail }); }
  /* 1 累計額 */
  var s1 = sampleState(); var r1 = MarginSim.simulate(s1);
  var cumBudget = s1.instruments[0].stages.reduce(function(a, x){ return a + x.budget; }, 0);
  var lastCum = r1.stageRes[s1.instruments[0].stages[s1.instruments[0].stages.length - 1].id].cumBudget;
  t("購入計画の累計額", cumBudget === 4500000 && lastCum === 4500000, "サンプル計画の予算合計・最終累計ともに 4,500,000円");
  /* 2 購入額変更で結果更新 */
  var s2 = JSON.parse(JSON.stringify(s1)); s2.instruments[0].stages[0].budget = 900000;
  var r2 = MarginSim.simulate(sanitizeState(s2));
  t("購入額変更時に全体の結果が更新される", r2.planCost !== r1.planCost && r2.rows[1].totalPrincipal !== r1.rows[1].totalPrincipal, "第1段階の予算を変更すると計画購入総額と建玉総額が変化");
  /* 3 複数銘柄の合算 */
  var s3 = sampleState();
  s3.instruments.push({ id: "t2", code: "7203", name: "テスト株", type: "stock", planBasePrice: 1000, closePrice: 1000, closeDate: "", closeSource: "", unit: 100, baseIsSample: false, holding: { qty: 0, avgPrice: 0, side: "buy" }, ref: { name: "なし", baseDate: "", baseValue: null, currentValue: null }, stages: [{ id: "t2s", dropPct: 10, budget: 90000, enabled: true, executed: false, execPrice: null, execQty: null, execAmount: null, reflected: false }] });
  var r3 = MarginSim.simulate(s3);
  var row10 = r3.rows.filter(function(r){ return r.drop === 10; })[0];
  t("複数銘柄の建玉が正しく合算される", row10 && row10.totalPrincipal === 64800 + r3.stageRes["t2s"].cost + (r1.rows.filter(function(r){ return r.drop === 10; })[0].newPrincipal), "−10%時点の建玉総額＝既存＋銘柄A計画＋銘柄B計画");
  /* 4 担保の重複計上なし */
  t("担保が重複計上されない", row10 && row10.collateral === MarginSim.collateralAt(s3.account.collateral, 10, 1), "銘柄が2つでも代用評価額は口座全体で1回だけ計上");
  /* 5 建玉ゼロ */
  var s5 = sampleState(); s5.positions = []; s5.instruments[0].stages = [];
  var r5 = MarginSim.simulate(s5);
  t("建玉ゼロでゼロ除算しない", r5.current.rate === null && r5.rows.every(function(r){ return r.rate === null; }), "建代金0のとき維持率は null（画面表示は「対象外」）で NaN にならない");
  /* 6 数量の売買単位 */
  var okUnit = true, okBudget = true;
  Object.keys(r1.stageRes).forEach(function(k){ var rr = r1.stageRes[k]; if (rr.qty % s1.instruments[0].unit !== 0) okUnit = false; });
  s1.instruments[0].stages.forEach(function(sg){ var rr = r1.stageRes[sg.id]; if (rr.cost > sg.budget) okBudget = false; });
  t("購入数量が売買単位に適合し予算を超えない", okUnit && okBudget, "全段階で数量は売買単位（サンプル1308は1口）の倍数、実購入額は予算以下");
  /* 7 保証金不足 */
  var s7 = sampleState(); s7.account.collateral = 1000; s7.account.cash = 0;
  var r7 = MarginSim.simulate(s7);
  t("保証金不足時の処理", Object.keys(r7.stageRes).some(function(k){ return !r7.stageRes[k].feasible; }) && !!r7.firstInfeasible, "担保を極小にすると段階が実行不能として判定され、最初の実行不能段階が記録される");
  /* 8 保存・復元 */
  var roundtrip = sanitizeState(JSON.parse(JSON.stringify(state)));
  t("保存・復元で数値が変化しない", JSON.stringify(roundtrip) === JSON.stringify(sanitizeState(state)), "JSON化→検証付き復元で全数値が一致");
  /* 9 不正入力の除去 */
  var dirty = sampleState(); dirty.instruments[0].stages[0].budget = "abc"; dirty.instruments[0].planBasePrice = -500; dirty.settings.maxDrop = 9999;
  var clean9 = sanitizeState(dirty);
  t("不正な入力値が計算に混入しない", clean9.instruments[0].stages[0].budget === 0 && clean9.instruments[0].planBasePrice === 0 && clean9.settings.maxDrop === 100, "文字列・負数・範囲外の値を検証で除去／丸め");
  /* 10 手計算との一致 */
  var s10 = { version: 1, meta: { isSample: false, updatedAt: "" },
    account: { broker: "", collateral: 1000000, collateralBasis: "after", cash: 0, brokerRate: null }, positions: [],
    instruments: [{ id: "h1", code: "9999", name: "手計算", type: "stock", planBasePrice: 1000, closePrice: 1000, closeDate: "", closeSource: "", unit: 100, baseIsSample: false, holding: { qty: 0, avgPrice: 0, side: "buy" }, ref: { name: "なし", baseDate: "", baseValue: null, currentValue: null }, stages: [{ id: "h1s", dropPct: 10, budget: 90000, enabled: true, executed: false, execPrice: null, execQty: null, execAmount: null, reflected: false }] }],
    settings: { marginCall: 20, management: 25, newMargin: 31, maxDrop: 80, step: 5, collateralMode: "same", collateralCustom: 100, includeProfit: true, fees: 0 } };
  var r10 = MarginSim.simulate(s10);
  var stg = r10.stageRes["h1s"];
  var row20 = r10.rows.filter(function(r){ return r.drop === 20; })[0];
  var expectedRate = (800000 - 10000) / 90000 * 100;
  t("計算結果が手計算と一致する", stg.price === 900 && stg.qty === 100 && stg.cost === 90000 && Math.abs(row20.rate - expectedRate) < 0.01 && row20.totalPnl === -10000,
    "価格900円×100株＝90,000円、−20%時点で担保800,000円・評価損−10,000円・維持率 " + expectedRate.toFixed(1) + "%");
  /* 11 形式バージョン付き保存の往復（自動保存・JSON 共通の封筒） */
  var packed = packState(s1);
  var unpacked = unpackState(JSON.parse(JSON.stringify(packed)));
  t("形式バージョン付きで保存・復元できる", packed.version === DATA_VERSION && unpacked.ok && JSON.stringify(unpacked.state) === JSON.stringify(sanitizeState(s1)), "封筒（バージョン " + DATA_VERSION + "）に包んでJSON化し、検証付きで開くと全数値が一致");
  /* 12 破損・形式不一致への対応 */
  var newerRes = unpackState({ app: "margin-nanpin-planner", version: DATA_VERSION + 99, data: sampleState() });
  var brokenRes = unpackState({ app: "margin-nanpin-planner", version: DATA_VERSION, data: { foo: 1 } });
  var garbageRes = unpackState("not an object");
  t("破損・形式不一致の保存データを安全に弾く", !newerRes.ok && newerRes.reason === "version" && !brokenRes.ok && brokenRes.reason === "corrupt" && !garbageRes.ok, "新しい形式は version、構造の壊れたデータは corrupt として検出し、推測で読み込まない");
  /* 13 終値データ（prices.json）の検証 */
  var feed13 = PriceFeed.sanitize({ updatedAt: "2026-11-17T07:00:00+09:00", source: "test",
    stocks: { "200A": { name: "テストETF", type: "ETF", unit: 1, close: 3081, closeDate: "2026-11-16" }, "BAD": { close: -5, closeDate: "2026-11-16" }, "NODATE": { close: 100, closeDate: "" } },
    indices: { "TOPIX": { latestClose: 3100, latestDate: "2026-11-16", history: { "2026-11-13": 3000, "2026-11-16": 3100 } } } });
  t("終値データ（prices.json）を検証して取り込む", !!feed13 && !!feed13.stocks["200A"] && !feed13.stocks["BAD"] && !feed13.stocks["NODATE"] && feed13.indices["TOPIX"].latestClose === 3100, "正常な銘柄・指数だけを取り込み、価格不正・日付なしの項目は除外する");
  /* 14 計画基準価格と最新終値の騰落率 */
  var chg14 = changePct(5500, 3081);
  t("計画基準価格と最新終値から騰落率を計算する", chg14 !== null && Math.abs(chg14 - (-43.9818)) < 0.001 && changePct(0, 100) === null && changePct(100, null) === null, "計画基準価格5,500円・終値3,081円 → −43.98%。計画基準価格未設定・終値未取得では計算しない");
  /* 15 旧形式（基準価格・現在価格）からの移行 */
  var old15 = sampleState();
  old15.instruments[0].basePrice = 5500; old15.instruments[0].currentPrice = 3500;
  delete old15.instruments[0].planBasePrice; delete old15.instruments[0].closePrice;
  var mig15 = sanitizeState(old15);
  t("旧形式データを新しい価格形式へ移行する", mig15.instruments[0].planBasePrice === 5500 && mig15.instruments[0].closePrice === 3500, "旧「基準価格」は計画基準価格へ、旧「現在価格」は最新終値へ引き継ぐ（下落率の起点は変わらない）");
  /* 16 参考指数の基準日終値の解決 */
  var base16 = PriceFeed.indexCloseOn(feed13, "TOPIX", "2026-11-15");
  var exact16 = PriceFeed.indexCloseOn(feed13, "TOPIX", "2026-11-13");
  t("参考指数の基準日の終値を解決する", !!base16 && base16.close === 3000 && base16.date === "2026-11-13" && !base16.exact && !!exact16 && exact16.exact === true, "基準日が休場日なら直近の営業日の終値を使い、完全一致かどうかを区別できる");
  /* 17 銘柄コードの正規化と、銘柄名・区分・売買単位の取り込み */
  var feed17 = PriceFeed.sanitize({ updatedAt: "2026-11-17T07:00:00+09:00", source: "test",
    stocks: { "200A": { name: "半導体ETF", type: "ETF", unit: 1, close: 3081, closeDate: "2026-11-16" },
              "285a": { name: "テスト半導体株", type: "個別株式", unit: 100, close: 8392, closeDate: "2026-11-16" } },
    indices: {} });
  var q17a = PriceFeed.stock(feed17, "200a");
  var q17b = PriceFeed.stock(feed17, " 285A ");
  t("銘柄コードを正規化し銘柄名・区分・売買単位を取り込める", normalizeCode(" 285a ") === "285A"
    && !!q17a && q17a.name === "半導体ETF" && q17a.type === "ETF" && q17a.unit === 1
    && !!q17b && q17b.type === "stock" && q17b.unit === 100,
    "小文字・空白つきのコードでも照合でき、ETFの売買単位1と個別株式（データ表記「個別株式」）の売買単位100・区分を正しく取り込む");
  /* 18 コード入力中のヒント表示（入力したコードを正規化してその場で照合する） */
  var savedFeed18 = pricesData, savedStatus18 = pricesStatus;
  pricesData = feed17; pricesStatus = "ok";

    "小文字・空白つきで入力しても「登録あり」と表示され、未登録コードは「未登録」と表示される（取得ボタンを押す前でも正しく判定）。1346はテスト用フィードに無いため未登録になるのが正しい");

  var v2data = sampleState();
  v2data.instruments[0].acquiredPrice = 5500;
