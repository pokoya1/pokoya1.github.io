<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#0d3b34" />
<link rel="icon" href="data:," />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>信用ナンピン計画・リスク管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface2:#eef2f5; --ink:#182230; --muted:#5a6b7e;
  --line:#d7dfe7; --line2:#c3cedb;
  --accent:#0d7a68; --accent-ink:#0a5c4f; --accent-bg:#e2f2ee;
  --warn:#9a6206; --warn-bg:#fdf0d5; --warn-line:#e8c877;
  --danger:#b3261e; --danger-bg:#fdecea; --danger-line:#f0b3ae;
  --info:#1d5fa8; --info-bg:#e6effa;
  --shadow:0 1px 3px rgba(16,32,48,.08),0 4px 14px rgba(16,32,48,.05);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f141b; --surface:#182029; --surface2:#1f2937; --ink:#e7edf4; --muted:#9db0c4;
    --line:#2b394c; --line2:#3a4c64;
    --accent:#2fbf9f; --accent-ink:#7fe3cb; --accent-bg:#123c33;
    --warn:#f0b95a; --warn-bg:#3d2f0e; --warn-line:#7a5c1c;
    --danger:#ff8a80; --danger-bg:#421d1a; --danger-line:#7c3833;
    --info:#8dbdf2; --info-bg:#17334f;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",system-ui,sans-serif;font-size:15px;line-height:1.55}
button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem}
input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent)}
.num{font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:.45rem .9rem;font-weight:700;font-size:.9rem;min-height:2.5rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#06231d}}
.btn.danger-outline{color:var(--danger);border-color:var(--danger-line)}
.btn.small{min-height:2.25rem;padding:.3rem .65rem;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type="number"],input[type="text"],input[type="date"],select{background:var(--surface);color:var(--ink);border:1px solid var(--line2);border-radius:8px;padding:.45rem .6rem;font:inherit;font-size:.95rem;width:100%}
input[type="number"]{text-align:right;font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type="range"]{width:100%;accent-color:var(--accent);min-height:2rem;padding:0}
label.flabel{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:.3rem}
.field{min-width:0}
.hint{font-size:.78rem;color:var(--muted);margin-top:.35rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px 96px}
/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.apptitle{font-weight:900;font-size:1rem;letter-spacing:.02em;margin-right:auto;display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:.12rem .6rem;font-size:.72rem;font-weight:700;border:1px solid var(--line2);background:var(--surface2);color:var(--muted)}
.badge.sample{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.tabs{display:none;gap:4px}
.tabs button{border:1px solid transparent;background:transparent;color:var(--muted);font-weight:700;border-radius:8px;padding:.5rem .9rem;min-height:2.5rem}
.tabs button[aria-selected="true"]{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent)}
@media(min-width:760px){.tabs{display:flex}.wrap{padding-bottom:40px}}
/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{background:none;border:none;color:var(--muted);font-size:.68rem;font-weight:700;padding:.45rem 0 .4rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:3.4rem}
.bottomnav button[aria-selected="true"]{color:var(--accent-ink)}
.bottomnav svg{width:22px;height:22px}
@media(min-width:760px){.bottomnav{display:none}}
/* cards & layout */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-top:14px}
.card h2{font-size:1.02rem;margin:0 0 4px;font-weight:900}
.card h3{font-size:.92rem;margin:0 0 8px;font-weight:900}
.card .sub{color:var(--muted);font-size:.83rem;margin:0 0 10px}
.grid2{display:grid;gap:14px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}.grid2.wide{grid-template-columns:3fr 2fr}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:.74rem;font-weight:700;color:var(--muted)}
.kpi .k-value{font-size:1.45rem;font-weight:900;line-height:1.25;margin-top:2px}
.kpi .k-value small{font-size:.8rem;font-weight:700;color:var(--muted)}
.kpi .k-note{font-size:.76rem;color:var(--muted);margin-top:2px}
.kpi.alert{border-color:var(--danger-line);background:var(--danger-bg)}
.kpi.caution{border-color:var(--warn-line);background:var(--warn-bg)}
.hero-rate{background:linear-gradient(135deg,#0d3b34,#0d7a68);color:#fff;border-radius:var(--radius);padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.hero-rate .h-label{font-size:.8rem;font-weight:700;opacity:.85}
.hero-rate .h-big{font-size:1.6rem;font-weight:900;line-height:1.35;margin-top:4px}
.hero-rate .h-sub{font-size:.88rem;opacity:.92;margin-top:6px}
.hero-rate.danger{background:linear-gradient(135deg,#5f130e,#b3261e)}
.hero-rate.caution{background:linear-gradient(135deg,#5c3d05,#9a6206)}
.pill{display:inline-block;border-radius:999px;padding:.1rem .55rem;font-size:.72rem;font-weight:700;vertical-align:middle}
.pill.safe{background:var(--accent-bg);color:var(--accent-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.mute{background:var(--surface2);color:var(--muted)}
.pill.info{background:var(--info-bg);color:var(--info)}
/* table */
.tblwrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:.88rem}
table.dt th,table.dt td{padding:.5rem .55rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.dt th{font-size:.74rem;color:var(--muted);font-weight:700;background:var(--surface2);position:sticky;top:0}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt tr.sel td{background:var(--accent-bg)}
table.dt tr.row-danger td{background:var(--danger-bg)}
table.dt tr.row-warn td{background:var(--warn-bg)}
table.dt tbody tr{cursor:pointer}
@media(max-width:640px){
  .hide-sp{display:none}
  /* 詳細表はスマホでは行カード形式に組み替える（横スクロールなし） */
  .tblwrap{overflow-x:visible}
  table.dt thead{display:none}
  table.dt,table.dt tbody{display:block}
  table.dt tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;padding:10px 6px;border-bottom:1px solid var(--line)}
  table.dt td{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:none;padding:.28rem 0;white-space:normal;text-align:right;font-size:.86rem}
  table.dt td::before{content:attr(data-label);font-size:.72rem;font-weight:700;color:var(--muted);text-align:left}
  table.dt td:first-child{grid-column:1 / -1;font-size:1rem;font-weight:900;border-bottom:1px dashed var(--line);padding-bottom:.4rem}
  table.dt td:first-child::before{content:"下落率"}
}
/* 計画比較表（ステップ2）：指標を行・候補（現在の計画と案）を列に並べる。スマホでは行カード形式に組み替える */
.cmpwrap{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:.88rem}
table.cmp th,table.cmp td{padding:.5rem .55rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.cmp th{font-size:.78rem;font-weight:700;background:var(--surface2)}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp td:first-child{color:var(--muted);font-weight:700;font-size:.8rem}
table.cmp .base-note{display:block;font-weight:400;font-size:.7rem;color:var(--warn);white-space:normal}
@media(max-width:640px){
  .cmpwrap{overflow-x:visible}
  table.cmp thead{display:none}
  table.cmp,table.cmp tbody{display:block}
  table.cmp tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;padding:10px 6px;border-bottom:1px solid var(--line)}
  table.cmp td{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:none;padding:.28rem 0;white-space:normal;text-align:right;font-size:.86rem}
  table.cmp td::before{content:attr(data-label);font-size:.72rem;font-weight:700;color:var(--muted);text-align:left}
  table.cmp td:first-child{grid-column:1 / -1;font-size:.95rem;font-weight:900;color:var(--ink);border-bottom:1px dashed var(--line);padding-bottom:.4rem}
  table.cmp td:first-child::before{content:""}
}
.slotrow{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;background:var(--surface)}
.slotrow .slotmeta{font-size:.82rem;color:var(--muted);flex:1;min-width:200px;padding-bottom:.45rem;line-height:1.6}
/* chart */
.chartbox{width:100%}
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:0;border-top:3px solid var(--accent);border-radius:2px}
.sw.dash{border-top-style:dashed}
.sw.mgmt{border-color:#d9930d}.sw.call{border-color:var(--danger)}
.dotkey{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d9930d}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);color:var(--muted);font-weight:700;padding:.35rem .8rem;min-height:2.25rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
/* plan */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:.55rem .8rem;text-align:left;min-height:3rem;box-shadow:var(--shadow)}
.chip[aria-selected="true"]{border-color:var(--accent);background:var(--accent-bg)}
.chip .c-code{font-weight:900;font-size:.95rem}
.chip .c-name{font-size:.72rem;color:var(--muted)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.formgrid{grid-template-columns:repeat(4,1fr)}.formgrid.c3{grid-template-columns:repeat(3,1fr)}}
.stagerow{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px;background:var(--surface)}
.stagerow.off{opacity:.55}
.stagerow .sr-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stagerow .sr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
@media(min-width:760px){.stagerow .sr-grid{grid-template-columns:repeat(4,1fr)}}
.stagerow .calc{font-size:.86rem}
.stagerow .calc .cl{font-size:.72rem;color:var(--muted);font-weight:700}
.stagerow .calc .cv{font-weight:900;font-size:1rem}
.switchlabel{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.85rem;cursor:pointer;padding:.3rem 0;min-height:2.25rem}
.minibar{position:sticky;top:57px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-top:14px;display:flex;gap:8px 18px;flex-wrap:wrap;font-size:.85rem}
.minibar b{font-size:1rem}
.posrow{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px}
.posrow .pr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
@media(min-width:760px){.posrow .pr-grid{grid-template-columns:repeat(5,1fr)}}
.rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mt{margin-top:12px}.mb0{margin-bottom:0}
.notice{border-radius:var(--radius);padding:12px 14px;font-size:.86rem;margin-top:14px;border:1px solid}
.notice.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--ink)}
.notice.info{background:var(--info-bg);border-color:var(--line2)}
.notice.danger{background:var(--danger-bg);border-color:var(--danger-line)}
details.more{margin-top:10px}
details.more summary{font-weight:700;color:var(--accent-ink);cursor:pointer;padding:.4rem 0;min-height:2.25rem}
/* 折り畳み式 詳細カード（ダッシュボード：下落率別の詳細） */
.card.detail-card{padding:0;overflow:hidden}
.card.detail-card>summary{list-style:none;cursor:pointer;padding:16px;-webkit-tap-highlight-color:transparent}
.card.detail-card>summary::-webkit-details-marker{display:none}
.card.detail-card>summary::marker{content:""}
.detail-summary-in{display:flex;align-items:flex-start;gap:12px}
.detail-summary-main{flex:1;min-width:0}
.detail-summary-main h2{font-size:1.02rem;margin:0;font-weight:900;line-height:1.4}
.detail-summary-meta{color:var(--muted);font-size:.82rem;margin-top:4px;line-height:1.5}
.detail-summary-meta strong{color:var(--ink)}
.detail-toggle{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface2);color:var(--accent-ink);border-radius:999px;padding:.32rem .7rem;font-size:.8rem;font-weight:700;white-space:nowrap;margin-top:2px}
.detail-toggle .chev{display:inline-block;font-size:.72rem;line-height:1;transition:transform .18s ease}
.card.detail-card[open ] .detail-toggle .chev{transform:rotate(180deg)}
.card.detail-card[open ] .detail-toggle .label-open{display:none}
.card.detail-card:not([open ]) .detail-toggle .label-close{display:none}
.detail-body{padding:0 16px 16px;border-top:1px solid var(--line)}
.detail-body .sub{margin-top:12px}
/* 前提サマリー（全画面共通・折りたたみ）：初期表示は要点1行のみで、銘柄数が多くても1行に収める */
.premise-oneline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:.92rem;line-height:1.5;padding-top:.35rem}
@media(max-width:640px){.detail-summary-in{flex-wrap:wrap}.detail-toggle{margin-top:6px}}
.kv{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;text-align:right;font-weight:700}
@media(max-width:640px){
  .kv{grid-template-columns:1fr;gap:0}
  .kv dt{margin-top:10px}
  .kv dd{text-align:left;font-size:1.02rem;border-bottom:1px solid var(--line);padding-bottom:6px}
}
/* modal & toast */
.modalback{position:fixed;inset:0;background:rgba(8,16,24,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;max-width:440px;width:100%;padding:20px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 8px;font-size:1.05rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:90;background:#182230;color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-size:.88rem;font-weight:700;box-shadow:var(--shadow);max-width:92vw;text-align:center}
@media(min-width:760px){.toast{bottom:28px}}
.testlist{list-style:none;margin:8px 0 0;padding:0;font-size:.88rem}
.testlist li{padding:.45rem 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
.testlist .ok{color:var(--accent-ink);font-weight:900}
.testlist .ng{color:var(--danger);font-weight:900}
footer.note{color:var(--muted);font-size:.78rem;margin-top:22px;line-height:1.7}
/* 価格パネル（計画基準価格・最新終値・参考指数） */
.pricepanel{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-top:12px}
.pricepanel .pp-label{font-size:.74rem;font-weight:700;color:var(--muted)}
.pricepanel .pp-value{font-size:1.35rem;font-weight:900;line-height:1.3;margin-top:2px}
.pricepanel .pp-value .pill{font-size:.95rem;padding:.2rem .7rem}
.coderow{display:flex;gap:10px;align-items:flex-end}
.coderow .btn{flex-shrink:0;min-height:3rem}
.pill.up{background:var(--accent-bg);color:var(--accent-ink)}
.pill.down{background:var(--info-bg);color:var(--info)}
.posline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.posline:last-child{border-bottom:none;padding-bottom:2px}
.posline-main{flex:1;min-width:0}
.posline-sub{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.posline .pill{font-size:.92rem;padding:.25rem .7rem;flex-shrink:0}
/* スマホ優先：入力欄は16px以上（iOSの自動ズーム防止）と大きめのタップ領域にする */
@media(max-width:759px){
  input[type="number"],input[type="text"],input[type="date"],select{font-size:16px;min-height:3rem}
  .btn{min-height:2.9rem}
  .chip{min-height:3.4rem}
  .pricepanel .pp-value{font-size:1.2rem}
}
.grouphead{font-size:1rem;font-weight:900;margin:18px 0 0}
.grouphead .gh-tag{font-size:.72rem;color:var(--muted);font-weight:700;margin-left:6px}
.view[hidden]{display:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="apptitle">信用ナンピン計画・リスク管理 <span class="badge sample" id="sampleBadge">サンプルデータ</span> <span class="badge" id="saveStatus" role="status">自動保存を確認中…</span></div>
    <nav class="tabs" role="tablist" aria-label="画面切替">
      <button role="tab" data-view="dashboard" aria-selected="true">ダッシュボード</button>
      <button role="tab" data-view="plan" aria-selected="false">購入計画</button>
      <button role="tab" data-view="account" aria-selected="false">口座・保有状況</button>
      <button role="tab" data-view="settings" aria-selected="false">設定・データ</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-dashboard"></section>
  <section class="view" id="view-plan" hidden></section>
  <section class="view" id="view-account" hidden></section>
  <section class="view" id="view-settings" hidden></section>
  <footer class="note">
    本ツールは信用取引の購入計画と保証金維持率の<strong>概算シミュレーション</strong>です。維持率が追証基準に到達することと、実際に追証（追加保証金）が発生することは同一ではありません。証券会社ごとの実際の計算制度・掛目・最低保証金等とは異なる場合があり、制度への適合を保証するものではありません。実際の取引判断は証券会社の表示と制度をご確認ください。口座の認証情報は取得せず、実際の注文も行いません。
  </footer>
</main>

<script>
"use strict";
/* ============================================================
   信用ナンピン計画・リスク管理（第一段階）
   計算モデルは独立モジュール MarginSim に分離。
   丸め規則：価格は円未満を切り捨てて表示・計算に使用（想定価格＝計画基準価格×(1−下落率) を円単位に切り捨て）。
   価格は3分離：計画基準価格（下落率の起点・ユーザー入力）／平均建値（銘柄別保有の実績）／最新終値（終値データ）。
   実行済みの購入段階は実績として保有側で表し、将来シミュレーションでは再購入しない（二重計上防止）。
   数量は売買単位で切り捨て、実購入額＝数量×想定価格（円）。予算を一切超えない。
   ============================================================ */
var DATA_VERSION = 3;
var APP_VERSION = "2.3";
var SW_CACHE_NAME = "nanpin-planner-v22";
var DEFAULT_RELAY_URL = "https://nanpin-price-relay.moppy4728.workers.dev";
var uidSeq = 100;
function uid(p){ return p + "_" + (++uidSeq) + "_" + Math.random().toString(36).slice(2,7); }
function num(v, fb){ var n = (typeof v === "string") ? Number(v.replace(/[,，\s]/g,"")) : Number(v); return isFinite(n) ? n : (fb === undefined ? 0 : fb); }
function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }
function fmtYen(v){ if (v === null || v === undefined || !isFinite(v)) return "—"; var r = Math.round(v); return (r < 0 ? "−" : "") + Math.abs(r).toLocaleString("ja-JP") + "円"; }
function fmtYenShort(v){ if (v === null || v === undefined || !isFinite(v)) return "—"; return (v < 0 ? "−" : "") + Math.abs(Math.round(v)).toLocaleString("ja-JP"); }
function fmtPct(v, digits){ if (v === null || v === undefined || !isFinite(v)) return "対象外"; return v.toFixed(digits === undefined ? 1 : digits) + "%"; }
function fmtSignedYen(v){ if (v === null || v === undefined || !isFinite(v)) return "—"; var r = Math.round(v); return (r > 0 ? "+" : (r < 0 ? "−" : "")) + Math.abs(r).toLocaleString("ja-JP") + "円"; }
function esc(s){ return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
/* 銘柄コードの正規化：前後の空白を除き英字を大文字化する（例 "285a" → "285A"）。コード照合はすべてこの形式で行う */
function normalizeCode(code){ return String(code === null || code === undefined ? "" : code).trim().toUpperCase().slice(0, 12); }
/* 価格中継URLの検証：https URL のみ許可し、それ以外は除去（空文字）する。末尾スラッシュは取り除く */
function sanitizeRelayUrl(v){
  if (v === null || v === undefined) return "";
  var s = String(v).trim().slice(0, 500);
  if (!s) return "";
  try { var u = new URL(s); if (u.protocol !== "https:") return ""; } catch (e) { return ""; }
  return s.replace(/\/+$/, "");
}
function isHttpsRelayUrl(v){ return !!sanitizeRelayUrl(v) && sanitizeRelayUrl(v) === String(v).trim().replace(/\/+$/, ""); }

/* ---------- サンプルデータ（指示書 §5） ---------- */
function sampleStages(){
  var defs = [[5,100000],[10,100000],[15,100000],[20,200000],[25,437500],[30,437500],[35,437500],[40,437500],[45,437500],[50,437500],[55,437500],[60,437500],[65,500000]];
  return defs.map(function(d){ return { id: uid("st"), dropPct: d[0], budget: d[1], enabled: true, executed: false, execPrice: null, execQty: null, execAmount: null, reflected: false }; });
}
function sampleState(){
  return {
    version: DATA_VERSION,
    meta: { isSample: true, updatedAt: "" },
    account: { broker: "", collateral: 15617481, collateralBasis: "after", collateralMarket: null, collateralHaircut: null, cash: 70309, brokerRate: null, unsettledPnl: null },
    positions: [
      { id: uid("pos"), code: "", name: "既存信用建玉（サンプル）", side: "buy", principal: 64800, pnl: null }
    ],
    instruments: [
      { id: uid("ins"), code: "1308", name: "上場インデックスファンドTOPIX", type: "ETF",
        planBasePrice: 3000, closePrice: null, closeDate: "", closeSource: "", unit: 1, baseIsSample: true,
        closePrev: null, closeChangePct: null, closeQuality: "", closeAnomalyCount: 0, closeSplits: [],
        holding: { qty: 0, avgPrice: 0, side: "buy" },
        ref: { name: "TOPIX", baseDate: "", baseValue: null, currentValue: null },
        stages: sampleStages(), slots: [] }
    ],
    settings: { marginCall: 20, management: 25, newMargin: 31, maxDrop: 80, step: 5,
                collateralMode: "same", collateralCustom: 100, includeProfit: false, fees: 0, minMargin: 300000,
                relayUrl: DEFAULT_RELAY_URL,
                /* シナリオ設定（形式v3のまま追加する任意項目・ステップ1で地ならし、ステップ3で実装）：
                   種別は一律（uniform・初期値）／詳細（perInstrument＝銘柄別終点）。終点マップは
                   「銘柄コード → 終点下落率(%)」で、詳細モードの経路評価に使う */
                scenarioType: "uniform", scenarioEndpoints: {},
                /* 表示モード（ステップ4・v2.2）：UI設定として保存する任意項目（形式は v3 のまま）。
                   簡易（simple）／詳細（detailed）の切替は表示と導線だけで、データと計算は共有する。
                   項目のない旧データ・旧JSONは「詳細」として読み込む（既存利用者の見た目を変えない） */
                viewMode: "detailed",
                /* 信用コストの概算（ステップ5・v2.3）：形式v3のまま追加する任意項目。
                   初期値は無効で、無効のときは表示・計算とも従来と完全に同一になる。
                   買方金利の初期値 2.80% はSBI証券の制度信用・一般信用（無期限）の買方金利の公表値 */
                costLayer: { enabled: false, ratePct: 2.80, days: 180, includeAdmin: false } }
  };
}

/* ---------- 入力サニタイズ（不正値を計算に混入させない） ---------- */
function sanitizeState(s){
  if (!s || typeof s !== "object") return null;
  var out = sampleState();
  out.meta = { isSample: !!(s.meta && s.meta.isSample), updatedAt: String((s.meta && s.meta.updatedAt) || "") };
  var a = s.account || {};
  out.account = {
    broker: String(a.broker || "").slice(0, 60),
    collateral: clamp(num(a.collateral, 0), 0, 1e12),
    collateralBasis: a.collateralBasis === "before" ? "before" : "after",
    /* 掛目入力モードの任意項目（形式v3のまま追加）：時価・掛目は未入力を null とし、新項目のない旧データでは
       方式＝直接入力（after）・時価と掛目は空で補完され、従来と完全に同じ値・動作で読み込まれる */
    collateralMarket: (a.collateralMarket === null || a.collateralMarket === "" || a.collateralMarket === undefined || !isFinite(num(a.collateralMarket, NaN))) ? null : clamp(num(a.collateralMarket, 0), 0, 1e12),
    collateralHaircut: (a.collateralHaircut === null || a.collateralHaircut === "" || a.collateralHaircut === undefined || !isFinite(num(a.collateralHaircut, NaN))) ? null : clamp(num(a.collateralHaircut, 0), 0, 100),
    cash: clamp(num(a.cash, 0), -1e12, 1e12),
    brokerRate: (a.brokerRate === null || a.brokerRate === "" || a.brokerRate === undefined) ? null : clamp(num(a.brokerRate, NaN), 0, 100000),
    /* 受渡未到来の決済損益（形式v3のまま追加する任意項目）：空欄（初期値・旧データ）＝算入しない（null）。
       プラス（受取予定の決済益）もマイナス（支払予定の決済損）も入力できる。null を clamp に通すと
       0 に化けるため、未入力は null のまま直接返す（評価損益 pnl の未入力保持と同じ注意） */
    unsettledPnl: (a.unsettledPnl === null || a.unsettledPnl === "" || a.unsettledPnl === undefined || !isFinite(num(a.unsettledPnl, NaN))) ? null : clamp(num(a.unsettledPnl, 0), -1e12, 1e12)
  };
  if (!isFinite(out.account.brokerRate)) out.account.brokerRate = null;
  out.positions = Array.isArray(s.positions) ? s.positions.slice(0, 100).map(function(p){
    p = p || {};
    var pnl = (p.pnl === null || p.pnl === "" || p.pnl === undefined) ? null : num(p.pnl, NaN);
    return { id: String(p.id || uid("pos")), code: normalizeCode(p.code), name: String(p.name || "").slice(0, 60),
             side: p.side === "sell" ? "sell" : "buy",
             principal: clamp(num(p.principal, 0), 0, 1e12),
             /* 未入力（null）は未入力のまま保持する。isFinite(null) は true になり clamp(null) は 0 を返すため、
                null をそのまま clamp に通すと「未入力」が「0円入力」に化けて概算警告が消えてしまう（B5の修正）。
                明示的に入力された 0 は 0 として保持し、未入力とは区別する */
             pnl: pnl === null ? null : (isFinite(pnl) ? clamp(pnl, -1e12, 1e12) : null) };
  }) : [];
  out.instruments = Array.isArray(s.instruments) ? s.instruments.slice(0, 50).map(function(it){
    it = it || {};
    var r = it.ref || {};
    var bv = (r.baseValue === null || r.baseValue === "" || r.baseValue === undefined) ? null : num(r.baseValue, NaN);
    var cv = (r.currentValue === null || r.currentValue === "" || r.currentValue === undefined) ? null : num(r.currentValue, NaN);
    /* 価格の3分離（形式v3）：計画基準価格（下落率の起点・ユーザー入力）／平均建値（保有管理）／最新終値（終値データ）。
       旧形式からの移行：v2の「取得価格 acquiredPrice」、さらに旧い「基準価格 basePrice」は、いずれも下落率の起点だったため
       計画基準価格 planBasePrice として引き継ぐ。「現在価格 currentPrice」は最新終値へ引き継ぐ。値は失わない。 */
    var pbRaw = (it.planBasePrice !== undefined && it.planBasePrice !== null) ? it.planBasePrice
              : ((it.acquiredPrice !== undefined && it.acquiredPrice !== null) ? it.acquiredPrice : it.basePrice);
    var cpRaw = (it.closePrice === undefined) ? it.currentPrice : it.closePrice;
    var cpv = (cpRaw === null || cpRaw === "" || cpRaw === undefined) ? null : num(cpRaw, NaN);
    var hd = it.holding || {};
    function optNum(v){ if (v === null || v === "" || v === undefined) return null; var n = num(v, NaN); return isFinite(n) ? clamp(n, 0, 1e12) : null; }
    function optSigned(v){ if (v === null || v === "" || v === undefined) return null; var n = num(v, NaN); return isFinite(n) ? clamp(n, -1000, 1000) : null; }
    var splitsIn = [];
    if (Array.isArray(it.closeSplits)){
      it.closeSplits.slice(0, 10).forEach(function(sp){
        sp = sp || {};
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(sp.date || ""))) return;
        var ratio = (typeof sp.ratio === "number" && isFinite(sp.ratio) && sp.ratio > 0) ? String(sp.ratio)
                  : (typeof sp.ratio === "string" && sp.ratio.trim() ? fmtSplitRatio(sp.ratio).slice(0, 20) : "");
        if (ratio) splitsIn.push({ date: String(sp.date), ratio: ratio });
      });
    }
    return { id: String(it.id || uid("ins")), code: normalizeCode(it.code), name: String(it.name || "").slice(0, 80),
      type: it.type === "stock" ? "stock" : "ETF",
      planBasePrice: clamp(num(pbRaw, 0), 0, 1e9),
      closePrice: isFinite(cpv) ? clamp(cpv, 0, 1e9) : null,
      closeDate: String(it.closeDate || "").slice(0, 10),
      closeSource: it.closeSource === "manual" ? "manual" : (it.closeSource === "json" ? "json" : (it.closeSource === "relay" ? "relay" : "")),
      closePrev: optNum(it.closePrev), closeChangePct: optSigned(it.closeChangePct),
      closeQuality: ["ok","provisional","suspect"].indexOf(it.closeQuality) >= 0 ? it.closeQuality : "",
      closeAnomalyCount: clamp(Math.round(num(it.closeAnomalyCount, 0)), 0, 1000),
      closeSplits: splitsIn,
      unit: Math.max(1, Math.round(num(it.unit, 1))), baseIsSample: !!it.baseIsSample,
      holding: { qty: clamp(Math.round(num(hd.qty, 0)), 0, 1e9),
                 avgPrice: clamp(num(hd.avgPrice, 0), 0, 1e9),
                 side: hd.side === "sell" ? "sell" : "buy" },
      ref: { name: ["日経平均","TOPIX","S&P500","NASDAQ100","なし"].indexOf(r.name) >= 0 ? r.name : "なし",
             baseDate: String(r.baseDate || ""), baseValue: isFinite(bv) ? bv : null, currentValue: isFinite(cv) ? cv : null },
      stages: Array.isArray(it.stages) ? it.stages.slice(0, 100).map(function(st){
        st = st || {};
        return { id: String(st.id || uid("st")), dropPct: clamp(num(st.dropPct, 0), 0, 100),
                 budget: clamp(Math.round(num(st.budget, 0)), 0, 1e12), enabled: st.enabled !== false,
                 executed: !!st.executed, execPrice: optNum(st.execPrice), execQty: (st.execQty === null || st.execQty === "" || st.execQty === undefined) ? null : clamp(Math.round(num(st.execQty, 0)), 0, 1e9),
                 execAmount: optNum(st.execAmount), reflected: !!st.reflected };
      }) : [],
      /* 計画スロット（案）（形式v3のまま追加する任意項目・ステップ2）：保持するのは未実行レシピだけ
         （名前・銘柄コード・計画基準価格・未実行段階の下落率と段階予算）。実行済み段階・実保有・口座情報・
         終値は含めない。スロットのない旧データ・旧JSONでは空配列で補完され、そのまま読み込める */
      slots: Array.isArray(it.slots) ? it.slots.slice(0, 5).map(function(sl){
        sl = sl || {};
        return { id: String(sl.id || uid("slot")), name: String(sl.name || "").slice(0, 40),
                 code: normalizeCode(sl.code), planBasePrice: clamp(num(sl.planBasePrice, 0), 0, 1e9),
                 stages: Array.isArray(sl.stages) ? sl.stages.slice(0, 100).map(function(s2){
                   s2 = s2 || {};
                   return { dropPct: clamp(num(s2.dropPct, 0), 0, 100), budget: clamp(Math.round(num(s2.budget, 0)), 0, 1e12) };
                 }) : [] };
      }) : [] };
  }) : [];
  var st = s.settings || {};
  out.settings = {
    marginCall: clamp(num(st.marginCall, 20), 0, 100), management: clamp(num(st.management, 25), 0, 100),
    newMargin: clamp(num(st.newMargin, 31), 1, 100), maxDrop: clamp(Math.round(num(st.maxDrop, 80)), 5, 100),
    step: clamp(num(st.step, 5), 1, 50),
    collateralMode: ["same","half","strong","none","custom"].indexOf(st.collateralMode) >= 0 ? st.collateralMode : "same",
    collateralCustom: clamp(num(st.collateralCustom, 100), 0, 300),
    /* 評価損益の算入はSBI証券公式ルール（評価損のみ算入・評価益は算入しない）に統一したため、旧設定値は引き継がない */
    includeProfit: false, fees: clamp(num(st.fees, 0), 0, 1e12),
    minMargin: clamp(num(st.minMargin, 300000), 0, 1e12),
    /* 価格中継URL：旧データで未設定なら初期値で補完する（移行ブロックはしない）。空欄は無効として保持し、https 以外は除去する */
    relayUrl: (st.relayUrl === undefined || st.relayUrl === null) ? DEFAULT_RELAY_URL : sanitizeRelayUrl(st.relayUrl),
    /* シナリオ設定（形式v3のまま追加する任意項目）：旧データ・旧JSONでは項目がないため
       種別＝一律（uniform）・銘柄別終点マップ＝空で補完し、そのまま一律として読み込める。
       終点マップは「銘柄コード → 終点下落率(%)」の素朴なマップとして検証し、不正な項目は除去する */
    scenarioType: st.scenarioType === "perInstrument" ? "perInstrument" : "uniform",
    scenarioEndpoints: (function(){
      var m = {}, src = (st.scenarioEndpoints && typeof st.scenarioEndpoints === "object" && !Array.isArray(st.scenarioEndpoints)) ? st.scenarioEndpoints : {};
      Object.keys(src).slice(0, 50).forEach(function(k){
        var code = normalizeCode(k);
        var v = num(src[k], NaN);
        if (code && isFinite(v)) m[code] = clamp(v, 0, 100);
      });
      return m;
    })(),
    /* 表示モード（ステップ4・v2.2）：任意項目。旧データ・旧JSONに項目がなければ「詳細（detailed）」で
       補完し、不正な値は「詳細」に倒す。モードは表示・導線だけに効き、計算には一切影響しない */
    viewMode: st.viewMode === "simple" ? "simple" : "detailed",
    /* 信用コストの概算（ステップ5・v2.3）：任意項目。旧データ・旧JSONに項目がなければ
       「無効・初期値（金利2.80%／保有180日／管理費なし）」で補完し、そのまま従来どおり読み込める。
       null・空欄は初期値に倒し（num(null) が 0 を返すため明示的に判定する）、範囲外は丸める */
    costLayer: (function(){
      var c = (st.costLayer && typeof st.costLayer === "object" && !Array.isArray(st.costLayer)) ? st.costLayer : {};
      function defNum(v, fb, lo, hi){ if (v === null || v === "" || v === undefined) return fb; var n = num(v, NaN); return isFinite(n) ? clamp(n, lo, hi) : fb; }
      return { enabled: !!c.enabled,
               ratePct: defNum(c.ratePct, 2.8, 0, 100),
               days: Math.round(defNum(c.days, 180, 0, 36500)),
               includeAdmin: !!c.includeAdmin };
    })()
  };
  out.version = DATA_VERSION;
  return out;
}

/* ============================================================
   計算モジュール MarginSim（証券会社の実制度とは独立した概算モデル）
   維持率 ＝（代用評価額(シナリオ後) ＋ 保証金現金 ＋ min(建玉評価損益, 0) − 控除費用 ＋ 受渡未到来の決済損益（入力がある場合のみ））÷ 建代金合計 × 100
   受渡未到来の決済損益は口座データの任意項目（未入力＝算入しない）。入力がある場合のみ、その金額を
   下落率で変動させない固定額として実質保証金（維持率の分子）にそのまま加える（現在値と全シナリオ共通）。
   評価損益の算入はSBI証券公式の委託保証金率の計算に合わせ、評価損（マイナス）の場合のみ差し引き、
   評価益（プラス）の場合はゼロとして計算する（評価益は維持率に算入しない）。評価損益そのものの表示は符号どおり行う。
   建代金合計が 0 のとき維持率は null（画面では「対象外」）。
   ============================================================ */
var MarginSim = (function(){
  function collateralFactor(settings){
    switch (settings.collateralMode){
      case "same": return 1; case "half": return 0.5; case "strong": return 1.2; case "none": return 0;
      case "custom": return clamp(num(settings.collateralCustom, 100), 0, 300) / 100;
      default: return 1;
    }
  }
  /* ---------- 詳細下落シナリオ（ステップ3・v2.1） ----------
     経路は「基準パス」（想定最大下落率まで進む共通のものさし）の下落率で表し、進行度 p ＝ 基準パス下落率 ÷ 想定最大下落率。
     一律（uniform）：全銘柄の下落率 ＝ 基準パス下落率（従来どおり）。
     詳細（perInstrument）：各銘柄の下落率 ＝ その銘柄の終点下落率 × p。
     終点は銘柄コードごとの設定（scenarioEndpoints）で、未設定の銘柄は想定最大下落率が終点になる。
     担保と計画銘柄以外の既存建玉は、どちらのモードでも基準パスで変動する（担保＝連動倍率×基準パス、
     既存建玉＝基準パスへの比例の近似を維持）。計算式はこのモジュール内の単一実装のままで、
     銘柄ごとの下落率への変換（dropFor）だけを差し替える。 */
  function scenarioDetailed(state){
    return !!(state && state.settings && state.settings.scenarioType === "perInstrument");
  }
  function endpointFor(state, ins){
    var st = (state && state.settings) || {};
    if (st.scenarioType !== "perInstrument") return num(st.maxDrop, 80);
    var map = (st.scenarioEndpoints && typeof st.scenarioEndpoints === "object" && !Array.isArray(st.scenarioEndpoints)) ? st.scenarioEndpoints : {};
    var v = num(map[normalizeCode(ins && ins.code)], NaN);
    return isFinite(v) ? clamp(v, 0, 100) : num(st.maxDrop, 80);
  }
  /* 基準パス下落率 baseDrop の時点で、銘柄 ins 自身の下落率を返す（一律では baseDrop そのもの） */
  function dropFor(state, ins, baseDrop){
    var st = (state && state.settings) || {};
    if (st.scenarioType !== "perInstrument") return baseDrop;
    var md = num(st.maxDrop, 0);
    if (!(md > 0)) return baseDrop;
    return endpointFor(state, ins) * (baseDrop / md);
  }
  /* 購入段階が発動する進行度（0〜1）。終点が0で下落率が正の段階は発動しないため Infinity */
  function triggerProgress(state, ins, sg){
    if (!(sg.dropPct > 0)) return 0;
    var ep = endpointFor(state, ins);
    if (!(ep > 0)) return Infinity;
    return sg.dropPct / ep;
  }
  /* 購入段階が発動する時点の基準パス下落率（一律では段階の下落率そのもの） */
  function triggerBaseDrop(state, ins, sg){
    var st = (state && state.settings) || {};
    if (st.scenarioType !== "perInstrument") return sg.dropPct;
    var tp = triggerProgress(state, ins, sg);
    if (!isFinite(tp)) return Infinity;
    return tp * num(st.maxDrop, 0);
  }
  /* 想定価格＝計画基準価格×(1−下落率) を円単位に切り捨てる共通の丸め処理。
     切り捨て前に相対 1e-9 の微小補正を加え、浮動小数点誤差を吸収する
     （例：70,000円×(1−0.55)＝31,499.999999999996 → 31,500円）。
     本物の端数（誤差より十分大きい小数部分）は従来どおり切り捨てる。
     想定価格・購入数量・建代金・累計購入額・評価損益はすべてこの価格から導出する */
  function stagePrice(basePrice, dropPct){
    var raw = basePrice * (1 - dropPct / 100);
    return Math.floor(raw + Math.abs(raw) * 1e-9);
  }
  function qtyFor(budget, price, unit){
    if (!(price > 0) || !(unit >= 1) || !(budget > 0)) return 0;
    return Math.floor(budget / price / unit) * unit;
  }
  /* SBI証券公式ルール：評価損益合計がマイナス（損）の場合のみ差し引き、プラス（益）の場合はゼロとして計算する */
  function adjPnl(pnl, settings){ return Math.min(pnl, 0); }
  /* 受渡未到来の決済損益：未入力（null・未定義・不正値）は 0（算入しない）。入力がある場合のみ固定額として加える */
  function unsettledAmount(state){
    var v = state && state.account ? state.account.unsettledPnl : null;
    if (v === null || v === "" || v === undefined) return 0;
    var n = num(v, NaN);
    return isFinite(n) ? n : 0;
  }
  /* ---------- 信用コストの概算レイヤー（ステップ5・v2.3） ----------
     買い建玉の金利（と任意で管理費）の概算を、通常の維持率とは別枠で差し引く参考値レイヤー。
     通常の維持率・到達・実購入予定額の計算には一切影響しない（費用込みは参考値の位置づけで、
     管理・追証基準への到達判定は通常の維持率が正本）。無効のときは費用0として扱い、表示も行わない。
     金利の概算式：建代金合計 × 買方金利（年率）× 想定保有日数 ÷ 365（建代金は約定金額ベース）。
     時間仮定：段階ごとの発動時期を暦日へ換算する根拠はないため比例配分はせず、経路の各評価点では
     「その時点の建代金合計に対する想定保有日数分の金利」を差し引く保守的な上限概算とする。
     管理費の概算：建玉件数 × 経過月数（想定保有日数 ÷ 30）× 110円（1建玉あたりの下限）。
     建玉件数 ＝ 既存建玉の件数（建代金のある計画銘柄以外の建玉＋保有のある計画銘柄）＋
     その評価時点で購入済みの計画段階数（現在値では未実行段階は数えない）。
     売り建玉の貸株料・逆日歩、名義書換料、配当落調整金は前提依存のため概算に含めない */
  function costLayerOf(state){
    var c = state && state.settings ? state.settings.costLayer : null;
    if (!c || !c.enabled) return null;
    return { ratePct: clamp(num(c.ratePct, 2.8), 0, 100),
             days: clamp(Math.round(num(c.days, 180)), 0, 36500),
             includeAdmin: !!c.includeAdmin };
  }
  function basePositionCount(state){
    var n = 0;
    (state.positions || []).forEach(function(p){ if (p.principal > 0) n++; });
    (state.instruments || []).forEach(function(ins){ if (ins.holding && ins.holding.qty > 0) n++; });
    return n;
  }
  /* 建玉件数（posCount）は呼び出し側が評価時点に応じて数える：現在値＝basePositionCount、
     経路の評価点＝basePositionCount＋その時点で購入済みの段階数、計画全体＝basePositionCount＋未実行段階数 */
  function costParts(state, totalPrincipal, posCount){
    var cl = costLayerOf(state);
    if (!cl) return { enabled: false, interest: 0, admin: 0, total: 0, count: 0, ratePct: 0, days: 0, includeAdmin: false };
    var interest = Math.max(0, num(totalPrincipal, 0)) * (cl.ratePct / 100) * (cl.days / 365);
    var cnt = Math.max(0, Math.round(num(posCount, 0)));
    var admin = cl.includeAdmin ? cnt * (cl.days / 30) * 110 : 0;
    return { enabled: true, interest: interest, admin: admin, total: interest + admin, count: cnt,
             ratePct: cl.ratePct, days: cl.days, includeAdmin: cl.includeAdmin };
  }
  /* 既存建玉の評価損益：現在値（建代金＋現在評価損益）が下落率ぶん変動する近似。pnl 未入力は 0 として概算し approx を立てる */
  function existingPnlAt(positions, dropPct){
    var pnl = 0, approx = false;
    positions.forEach(function(p){
      var cur = p.pnl === null ? 0 : p.pnl;
      if (p.pnl === null && p.principal > 0) approx = true;
      var mv = p.principal + cur;
      var delta = mv * (dropPct / 100);
      pnl += cur + (p.side === "sell" ? delta : -delta);
    });
    return { pnl: pnl, approx: approx };
  }
  function collateralAt(base, dropPct, factor){ return Math.max(0, Math.floor(base * (1 - (dropPct / 100) * factor))); }
  /* ---------- 銘柄別の実保有建玉（第4節） ----------
     保有は銘柄ごとに「数量×平均建値」で管理し、建代金と評価損益はここから一元計算する（二重入力・二重計上をしない）。
     現在の評価損益は最新終値基準。終値が無い保有は現在損益0として概算し approx を立てる（既存建玉の未入力と同じ扱い）。 */
  function holdingPrincipal(ins){ var h = ins.holding; return (h && h.qty > 0) ? h.qty * h.avgPrice : 0; }
  function holdingPnlNow(ins){
    var h = ins.holding;
    if (!h || !(h.qty > 0)) return { pnl: 0, approx: false };
    if (!(ins.closePrice > 0)) return { pnl: 0, approx: h.avgPrice > 0 };
    var diff = h.side === "sell" ? (h.avgPrice - ins.closePrice) : (ins.closePrice - h.avgPrice);
    return { pnl: h.qty * diff, approx: false };
  }
  /* 下落率シナリオでの保有評価損益：シナリオ価格は購入段階と同じく計画基準価格×(1−下落率)で決める
     （現在の下落率の地点では最新終値基準の現在損益と一致する）。計画基準価格が無い場合は終値、
     それも無い場合は平均建値を起点にする（終値が無い保有は概算として approx を引き継ぐ） */
  function holdingPnlAt(ins, dropPct){
    var h = ins.holding;
    if (!h || !(h.qty > 0)) return { pnl: 0, approx: false };
    var now = holdingPnlNow(ins);
    var base = ins.planBasePrice > 0 ? ins.planBasePrice : (ins.closePrice > 0 ? ins.closePrice : h.avgPrice);
    if (!(base > 0)) return { pnl: now.pnl, approx: now.approx };
    var price = base * (1 - dropPct / 100);
    var pnl = h.side === "sell" ? h.qty * (h.avgPrice - price) : h.qty * (price - h.avgPrice);
    return { pnl: pnl, approx: now.approx };
  }
  /* 基準パス下落率 baseDrop 時点の銘柄別保有の合計。銘柄ごとの下落率は dropFor で変換する
     （一律では全銘柄が baseDrop、詳細では各銘柄が自分の終点へ比例した下落率になる） */
  function holdingsTotalsAt(state, baseDrop){
    var principal = 0, pnl = 0, approx = false;
    state.instruments.forEach(function(ins){
      principal += holdingPrincipal(ins);
      var r = holdingPnlAt(ins, dropFor(state, ins, baseDrop));
      pnl += r.pnl; if (r.approx) approx = true;
    });
    return { principal: principal, pnl: pnl, approx: approx };
  }
  function holdingsTotalsNow(state){
    var principal = 0, pnl = 0, approx = false;
    state.instruments.forEach(function(ins){
      principal += holdingPrincipal(ins);
      var r = holdingPnlNow(ins);
      pnl += r.pnl; if (r.approx) approx = true;
    });
    return { principal: principal, pnl: pnl, approx: approx };
  }

  /* 全段階の数量・実購入額・実行可否をトリガー到達時点の保証金で判定。
     処理順：一律では下落率の昇順（同率は銘柄コード順・従来どおり）。詳細では発動する進行度の昇順で、
     同じ進行度で複数の段階が発動する場合は銘柄の登録順（同銘柄内は段階の登録順）に処理する */
  function evaluateStages(state){
    var st = state.settings, factor = collateralFactor(st);
    var detailed = scenarioDetailed(state);
    var flat = [];
    state.instruments.forEach(function(ins, ii){
      ins.stages.forEach(function(sg, si){ flat.push({ ins: ins, sg: sg, ii: ii, si: si }); });
    });
    if (detailed){
      flat.sort(function(a, b){
        var pa = triggerProgress(state, a.ins, a.sg), pb = triggerProgress(state, b.ins, b.sg);
        if (pa !== pb) return pa < pb ? -1 : 1;
        if (a.ii !== b.ii) return a.ii - b.ii;
        return a.si - b.si;
      });
    } else {
      flat.sort(function(a, b){ return a.sg.dropPct - b.sg.dropPct || String(a.ins.code).localeCompare(String(b.ins.code)); });
    }
    var result = {}; var executedPrior = [];
    flat.forEach(function(item){
      var ins = item.ins, sg = item.sg;
      var price = stagePrice(ins.planBasePrice, sg.dropPct);
      var qty = qtyFor(sg.budget, price, ins.unit);
      var cost = qty * price;
      /* 段階の状態は3分類する：buy＝購入（1売買単位以上あり新規建て条件を満たす）、
         skip＝見送り（単位丸め後の数量が0。保証金不足ではなく、実行不能として扱わず後続段階を妨げない）、
         infeasible＝実行不能（数量は1単位以上あるが新規建て条件を満たせない）。
         新規建て条件（31%等）の判定は数量が1売買単位以上の段階にだけ適用する */
      var rec = { price: price, qty: qty, cost: cost, feasible: false, status: "", reason: "", cumBudget: 0, executed: !!sg.executed };
      /* 実行済みの段階は実績として保有建玉側で表すため、将来シミュレーションでは再購入しない */
      if (sg.executed){ rec.status = "executed"; rec.reason = "実行済み"; result[sg.id] = rec; return; }
      if (!sg.enabled){ rec.status = "disabled"; rec.reason = "無効"; result[sg.id] = rec; return; }
      /* 詳細シナリオでは、銘柄の終点を超える下落率の段階はそのシナリオでは到達しないため発動しない。
         数量・金額は0として扱い、計画画面では「シナリオ終点を超えるため発動しません」と明示する */
      if (detailed && sg.dropPct > endpointFor(state, ins) + 1e-9){
        rec.qty = 0; rec.cost = 0; rec.status = "beyond";
        rec.reason = "シナリオ終点（−" + endpointFor(state, ins) + "%）を超えるため、このシナリオでは発動しません";
        result[sg.id] = rec; return;
      }
      if (qty <= 0){ rec.status = "skip"; rec.reason = price <= 0 ? "計画基準価格が未設定" : "見送り（数量0）：予算内で売買単位を購入できないため、この段階は購入しません（保証金不足ではありません）"; result[sg.id] = rec; return; }
      /* トリガー到達時点（その段階が発動する進行度）の推計保証金。
         到達時点は基準パス下落率で表し（一律では段階の下落率そのもの）、担保・既存建玉は基準パス、
         銘柄別保有と先行購入分は各銘柄自身の下落率で評価する */
      var t = detailed ? triggerBaseDrop(state, ins, sg) : sg.dropPct;
      var exP = existingPnlAt(state.positions, t);
      var hdT = holdingsTotalsAt(state, t);
      var newPnl = 0;
      executedPrior.forEach(function(p){
        var curPrice = stagePrice(p.ins.planBasePrice, dropFor(state, p.ins, t));
        newPnl += p.qty * (curPrice - p.price);
      });
      var balance = collateralAt(state.account.collateral, t, factor) + state.account.cash
                    + adjPnl(exP.pnl + hdT.pnl + newPnl, st) - st.fees + unsettledAmount(state);
      var required = Math.ceil(cost * st.newMargin / 100);
      if (balance >= required){ rec.feasible = true; rec.status = "buy"; executedPrior.push({ ins: ins, qty: qty, price: price }); }
      else { rec.status = "infeasible"; rec.reason = "必要保証金（概算 " + fmtYen(required) + "）に対し推計保証金が不足"; }
      result[sg.id] = rec;
    });
    /* 累計予算（有効かつ未実行の段階のみ、下落率順。実行済みは今後の購入予定に数えない） */
    state.instruments.forEach(function(ins){
      var sorted = ins.stages.slice().sort(function(a, b){ return a.dropPct - b.dropPct; });
      var cum = 0;
      sorted.forEach(function(sg){ if (sg.enabled && !sg.executed){ cum += sg.budget; } if (result[sg.id]) result[sg.id].cumBudget = cum; });
    });
    return result;
  }

  /* ある基準パス下落率・購入カットオフでの維持率／実質保証金／建代金合計（simulate の精緻化計算と共通の単一実装）。
     drop・cutoff は基準パス下落率で表す（一律では銘柄の下落率そのもの、詳細では進行度×想定最大下落率）。
     cutoff より深い段階はまだ購入していないものとして扱う（トリガー直前の評価に使う）。
     段階の発動は各銘柄自身の下落率で判定し（発動時点＝triggerBaseDrop）、保有・購入分の評価損益も
     各銘柄自身の下落率で計算する。担保と計画銘柄以外の既存建玉は基準パスで変動する */
  function pointAt(state, stageRes, drop, cutoff){
    var st = state.settings, factor = collateralFactor(st);
    var existingPrincipal = state.positions.reduce(function(s, p){ return s + p.principal; }, 0);
    var executed = [];
    state.instruments.forEach(function(ins){ ins.stages.forEach(function(sg){
      var r = stageRes[sg.id];
      if (sg.enabled && r && r.feasible && triggerBaseDrop(state, ins, sg) <= cutoff + 1e-9) executed.push({ ins: ins, sg: sg, r: r });
    });});
    var newPrincipal = executed.reduce(function(s, e){ return s + e.r.cost; }, 0);
    var newPnl = executed.reduce(function(s, e){
      var curPrice = stagePrice(e.ins.planBasePrice, dropFor(state, e.ins, drop));
      return s + e.r.qty * (curPrice - e.r.price);
    }, 0);
    var exP = existingPnlAt(state.positions, drop);
    var hdP = holdingsTotalsAt(state, drop);
    var collateral = collateralAt(state.account.collateral, drop, factor);
    var totalPnl = exP.pnl + hdP.pnl + newPnl;
    var balance = collateral + state.account.cash + adjPnl(totalPnl, st) - st.fees + unsettledAmount(state);
    var totalPrincipal = existingPrincipal + hdP.principal + newPrincipal;
    /* 費用込み維持率（概算・参考値）：この評価点の建代金合計と建玉件数（既存＋購入済み段階）から
       概算費用を求め、実質保証金から差し引く。通常の rate・balance は変更しない */
    var cp = costParts(state, totalPrincipal, basePositionCount(state) + executed.length);
    return { rate: totalPrincipal > 0 ? (balance / totalPrincipal) * 100 : null, balance: balance, totalPrincipal: totalPrincipal,
             cost: cp.total, costRate: totalPrincipal > 0 ? ((balance - cp.total) / totalPrincipal) * 100 : null };
  }
  /* 経路評価：下落率0%から targetDrop までの全評価点（0.1%刻み＋購入段階の直前・直後。到達計算と同じ評価点）を
     1回の走査で評価し、経路上の最低維持率とその下落率・目標下落率時点の維持率・経路上の最小の実質保証金を返す。
     予算逆算（ReverseCalc）の成立判定はこの評価だけを使い、計算式を複製しない */
  function pathEvaluate(state, targetDrop){
    var stageRes = evaluateStages(state);
    var target = clamp(num(targetDrop, 0), 0, 100);
    var triggerDrops = [];
    state.instruments.forEach(function(ins){ ins.stages.forEach(function(sg){
      var r = stageRes[sg.id];
      if (sg.enabled && !sg.executed && r && r.status !== "skip" && r.status !== "beyond") triggerDrops.push(triggerBaseDrop(state, ins, sg));
    }); });
    var candMap = {}, cands = [];
    function addC(d){ var k = d.toFixed(4); if (!candMap[k]){ candMap[k] = 1; cands.push(d); } }
    for (var d = 0; d <= target + 1e-9; d += 0.1) addC(Math.round(d * 10) / 10);
    addC(target);
    triggerDrops.forEach(function(td){ if (td <= target + 1e-9) addC(td); });
    cands.sort(function(a, b){ return a - b; });
    var minRate = null, minRateDrop = null, minBalance = null, rateAtTarget = null;
    var minCostRate = null, minCostRateDrop = null, costAtMin = null;
    function visit(pt, dropVal){
      if (pt.rate !== null && (minRate === null || pt.rate < minRate)){ minRate = pt.rate; minRateDrop = dropVal; }
      if (pt.costRate !== null && pt.costRate !== undefined && (minCostRate === null || pt.costRate < minCostRate)){ minCostRate = pt.costRate; minCostRateDrop = dropVal; costAtMin = pt.cost; }
      if (minBalance === null || pt.balance < minBalance) minBalance = pt.balance;
    }
    for (var i = 0; i < cands.length; i++){
      var cd = cands[i];
      var isTrig = triggerDrops.some(function(t){ return Math.abs(t - cd) < 1e-9; });
      if (isTrig) visit(pointAt(state, stageRes, cd, cd - 0.0001), cd);
      var after = pointAt(state, stageRes, cd, cd);
      visit(after, cd);
      if (Math.abs(cd - target) < 1e-9) rateAtTarget = after.rate;
    }
    return { stageRes: stageRes, minRate: minRate, minRateDrop: minRateDrop, rateAtTarget: rateAtTarget, minBalance: minBalance, targetDrop: target,
             minCostRate: minCostRate, minCostRateDrop: minCostRateDrop, costAtMin: costAtMin };
  }

  function simulate(state){
    var st = state.settings, factor = collateralFactor(st);
    var stageRes = evaluateStages(state);
    var drops = [];
    for (var d = 0; d <= st.maxDrop + 1e-9; d += st.step) drops.push(Math.round(d * 100) / 100);
    if (drops[drops.length - 1] !== st.maxDrop) drops.push(st.maxDrop);
    var existingPrincipal = state.positions.reduce(function(s, p){ return s + p.principal; }, 0);
    var rows = drops.map(function(drop){
      var executed = [];
      state.instruments.forEach(function(ins){
        ins.stages.forEach(function(sg){
          var r = stageRes[sg.id];
          if (sg.enabled && r && r.feasible && triggerBaseDrop(state, ins, sg) <= drop + 1e-9) executed.push({ ins: ins, sg: sg, r: r });
        });
      });
      var newPrincipal = executed.reduce(function(s, e){ return s + e.r.cost; }, 0);
      var newPnl = executed.reduce(function(s, e){
        var curPrice = stagePrice(e.ins.planBasePrice, dropFor(state, e.ins, drop));
        return s + e.r.qty * (curPrice - e.r.price);
      }, 0);
      var exP = existingPnlAt(state.positions, drop);
      var hdP = holdingsTotalsAt(state, drop);
      var collateral = collateralAt(state.account.collateral, drop, factor);
      var totalPnl = exP.pnl + hdP.pnl + newPnl;
      var balance = collateral + state.account.cash + adjPnl(totalPnl, st) - st.fees + unsettledAmount(state);
      var totalPrincipal = existingPrincipal + hdP.principal + newPrincipal;
      var rate = totalPrincipal > 0 ? (balance / totalPrincipal) * 100 : null;
      var capacity = st.newMargin > 0 ? Math.max(0, Math.floor(balance / (st.newMargin / 100)) - totalPrincipal) : 0;
      var infeasibleHere = 0, infeasibleAt = 0, skipHere = 0, skipAt = 0, beyondHere = 0;
      state.instruments.forEach(function(ins){ ins.stages.forEach(function(sg){
        var r = stageRes[sg.id];
        var bd = triggerBaseDrop(state, ins, sg);

       「最初」は発動時点（基準パス下落率）の早さで判定する（一律では段階の下落率そのもの）。

    var firstInfeasible = null;

       表・グラフは従来の刻み幅のままだが、基準への「最初の到達下落率」は細かい評価点で求める。
       段階購入のトリガーでは維持率が不連続に変化するため、トリガー下落率そのもの（購入後）に加えて
       トリガー直前（その段階をまだ購入していない状態）も評価点に含め、到達の見落としを防ぐ。 */
    function computeAt(drop, cutoff){ return pointAt(state, stageRes, drop, cutoff); }

       本体のシミュレーション（購入可能な段階はすべて実行する前提）とは区別して表示する */
    var lastRow = rows.length ? rows[rows.length - 1] : null;
    var stoppedRes = firstInfeasible ? computeAt(st.maxDrop, firstInfeasible.baseDrop - 0.0001)

    return { rows: rows, stageRes: stageRes, current: current, planBudget: planBudget, planCost: planCost,

/* ============================================================
   担保の終点表現（ステップ3・3-2）：担保の価格変動条件は「連動倍率」を正本とする1つの設定のまま、
   進行度1（想定最大下落率まで進んだ時点）の担保下落率＝終点でも表現・編集できるようにする。
     終点下落率（%） ＝ 連動倍率 × 想定最大下落率
     終点側を編集した場合は 倍率 ＝ 終点 ÷ 想定最大下落率 に換算し、連動割合（任意）として保存する。
   想定最大下落率が0等で換算できない場合は ok:false を返し、値は変更しない（勝手に決めない）。

  var custom = Math.round((ep / settings.maxDrop) * 1000) / 10;

/* ---------- シナリオ表示ヘルパー（ステップ3・3-3） ----------
   到達点は基準パス下落率（baseDrop）で保持し、表示時にモードへ変換する。
   一律：従来どおり単一の下落率。詳細：進行度＋その時点の銘柄別下落率の併記 */

  var md = state.settings.maxDrop, p = md > 0 ? baseDrop / md : 0;
  var parts = state.instruments.map(function(ins){
    return (normalizeCode(ins.code) || "コード未設定") + " −" + (MarginSim.endpointFor(state, ins) * p).toFixed(1) + "%";
  });

  if (baseDrop === null || baseDrop === undefined) return "";

/* ---------- 前提サマリー（ステップ4・4-2）：全画面共通の折りたたみ部品 ----------

    return '<p class="sub" style="margin-bottom:0">種別：<strong>一律</strong>。すべての銘柄が計画基準価格から同じ下落率で下落します（想定最大下落率 −' + s.maxDrop + '%まで）。' + collat + '。購入段階は下落率の到達順に処理します。計画銘柄以外の既存建玉は、各建玉自体の価格には連動せず、計画銘柄と同じ下落率で変動する近似として扱います。前提の変更は「設定・データ」画面で行えます。</p>';

function scenarioSummaryHtml(){

/* ---------- 簡易モードの要約と結果コメント（ステップ4・4-1） ----------

   簡易モードの表示はこの要約と、詳細モードと同じ sim（グローバル）から作るため、両モードで値は一致する */
function dashboardSummary(st){

           firstMgmt: r.firstMgmtPrecise, firstCall: r.firstCallPrecise,
           minRate: path.minRate, minRateDrop: path.minRateDrop, minPnl: r.minPnl,

}
/* 結果コメント：要約値から定型で組み立てる。断定的な助言にはせず、想定である旨と証券会社での確認を添える */
function resultCommentText(){
  var s = dashboardSummary(state), st = state.settings;
  var parts = [];
  if (s.rate === null) parts.push("現在は建玉がないため、維持率は対象外です");
  else parts.push("現在の維持率は " + fmtPct(s.rate) + " の推計です（自主管理基準 " + st.management + "%／追証基準 " + st.marginCall + "%）");
  if (s.firstMgmt !== null) parts.push("未実行の計画をすべて実行する前提では、自主管理基準には " + reachShort(s.firstMgmt) + " で到達する想定です");
  else parts.push("未実行の計画をすべて実行する前提でも、想定範囲では自主管理基準に到達しない想定です");
  if (s.firstCall !== null) parts.push("追証基準には " + reachShort(s.firstCall) + " で到達する想定です");
  if (s.minRate !== null && s.minRateDrop !== null) parts.push("経路上の最低維持率は " + fmtPct(s.minRate) + "（" + reachShort(s.minRateDrop) + " 時点）の想定です");
  if (s.planCost > 0) parts.push("未実行の購入計画の実購入予定額は合計 " + fmtYen(s.planCost) + " です");
  return parts.join("。") + "。これらは本ツールの計算モデルによる想定です。実際の可否は証券会社の表示で確認してください。";
}

/* ============================================================
   計画銘柄以外の既存建玉に関する警告（表示専用・計算には影響しない）
   これらの建玉は各建玉自体の価格には連動せず、計画銘柄と同じ下落率での概算として扱うため、
   実際の下落時は損失が表示より大きくなる可能性があることを文字で警告する。
   評価損益が未入力の建玉がある場合は、現在の維持率が概算になる旨も併せて示す。
   判定：建玉（建代金あり）が存在すれば警告対象。建玉が無ければ警告しない。

function otherPositionsRisk(state){
  var list = (state.positions || []).filter(function(p){ return p.principal > 0; });
  if (!list.length) return null;
  return { unknownPnl: list.some(function(p){ return p.pnl === null; }) };
}
function otherPositionsWarningHtml(state){
  var risk = otherPositionsRisk(state);
  if (!risk) return "";
  var msg = "<strong>計画銘柄以外の既存建玉について：</strong>これらの建玉の評価損は、このシミュレーションでは各建玉自体の価格変動には連動せず、計画銘柄と同じ下落率で一律に変動する概算として扱います。実際の下落時は、建玉ごとの値動きによって損失が表示より大きくなる可能性があります。";
  if (risk.unknownPnl) msg += "評価損益が未入力の建玉があるため、現在の維持率は概算です（未入力分は現在損益0として扱います）。";
  return '<div class="notice warn">' + msg + "</div>";
}

/* ============================================================
   代用有価証券の掛目入力モード（任意機能・計算モデルは変更しない）
   計算に使うのは常に「掛目適用後の評価額」account.collateral であり、入力方式はその入力方法だけを変える。
   入力方式は account.collateralBasis で表す：
     "after"  ＝ 適用後の評価額を直接入力（標準・初期値・従来どおり）
     "before" ＝ 適用前の時価（account.collateralMarket）と掛目（account.collateralHaircut %）から計算
   時価＋掛目方式では、時価と掛目が両方とも有効なときだけ
   適用後評価額 ＝ floor（時価 × 掛目/100）を collateral へ反映する。
   掛目が空欄・無効なときは collateral を変更せず警告フラグを返す（生の時価を担保として流用しない）。
   時価欄へ適用後評価額を流し込むことは決してしないため、方式を往復しても掛目が累積適用されることはない。
   ============================================================ */
var COLLATERAL_HAIRCUT_DEFAULT = 80; /* 時価＋掛目方式へ切り替えた初回の掛目初期値（SBI証券の株式・投信の標準） */
function collateralHaircutCalc(market, haircut){
  if (market === null || market === undefined || haircut === null || haircut === undefined) return null;
  var m = num(market, NaN), h = num(haircut, NaN);

}
function collateralHaircutInfo(account){
  var mode = account && account.collateralBasis === "before" ? "before" : "after";

  info.applied = collateralHaircutCalc(account.collateralMarket, account.collateralHaircut);
  var h = (account.collateralHaircut === null || account.collateralHaircut === undefined) ? NaN : num(account.collateralHaircut, NaN);

/* 時価＋掛目方式で両方が有効なときだけ、計算済みの適用後評価額を collateral へ反映する。それ以外では collateral を変更しない */

  var info = collateralHaircutInfo(account);
  if (info.mode === "before" && info.applied !== null) account.collateral = info.applied;

}

/* ============================================================
   終値データ（prices.json）の検証と参照 PriceFeed
   prices.json はアプリと同じ場所に置かれる外部ファイル（定期ジョブが大引け後に最新化する想定）。

     予算逆算は従来の一律シナリオ前提の評価を維持する（ステップ3）：詳細モードが選択されていても、
     逆算の評価用ステートでは種別を一律に固定し、暗黙に前提を変えない */
  function candidateState(state, insId, rows){
    var cs = cloneState(state);
    cs.settings.scenarioType = "uniform";
    var ins = findIns(cs, insId);
    if (!ins) return null;
    var kept = ins.stages.filter(function(s){ return s.executed; });
    var news = rows.map(function(r, i){
      return { id: "rev_" + i, dropPct: r.dropPct, budget: r.budget, enabled: true, executed: false, execPrice: null, execQty: null, execAmount: null, reflected: false };
    });
    ins.stages = kept.concat(news);
    return { state: cs, ids: news.map(function(s){ return s.id; }) };
  }
  /* 候補なしの前提評価用ステート：対象銘柄の未実行段階を除去し、他銘柄の計画は includeOthers で切り替える。
     逆算は一律前提のため、ここでも種別を一律に固定する */
  function baselineState(state, insId, includeOthers){
    var cs = cloneState(state);
    cs.settings.scenarioType = "uniform";
    cs.instruments.forEach(function(ins){
      if (ins.id === insId || !includeOthers) ins.stages = ins.stages.filter(function(s){ return s.executed; });
    });
    return cs;
  }
  function pathOk(path, params, minMargin){
    var okRate = path.minRate === null || path.minRate >= params.minRate - 1e-9;
    var okBalance = path.minBalance === null || path.minBalance >= minMargin - 1e-9;
    return { okRate: okRate, okBalance: okBalance, ok: okRate && okBalance };
  }
  /* 総予算1つ分の候補を現行エンジンで評価する（成立条件 a/b/c の判定つき） */
  function evaluateCandidate(state, insId, rawParams, totalBudget){
    var params = sanitizeParams(rawParams);
    var budget = Math.max(0, Math.round(num(totalBudget, 0)));
    var rows = generateBulkStages({ total: budget, start: params.start, end: params.end, step: params.step, mode: params.mode });
    var built = candidateState(state, insId, rows);
    if (!built) return { ok: false, totalBudget: budget, stages: [], totalCost: 0, totalQty: 0, condA: false, condB: false, condC: false, path: null };
    var path = MarginSim.pathEvaluate(built.state, params.target);
    var minMargin = built.state.settings.minMargin;
    var stages = [], totalCost = 0, totalQty = 0, condA = true;
    built.ids.forEach(function(id, i){
      var r = path.stageRes[id] || { price: 0, qty: 0, cost: 0, status: "" };
      stages.push({ dropPct: rows[i].dropPct, budget: rows[i].budget, price: r.price, qty: r.qty, cost: r.cost, status: r.status });
      totalCost += r.cost; totalQty += r.qty;
      /* (a) 数量が1売買単位以上の段階だけを判定対象にする（数量ゼロ＝見送りは許容） */
      if (r.qty > 0 && r.status !== "buy") condA = false;
    });
    var chk = pathOk(path, params, minMargin);
    /* 段階予算の合計：総予算を段階へ配分する際の円未満（100円単位）丸めの累積で、入力した総予算と
       実際に反映される段階予算の合計は最大で数円ずれることがある。表示・反映の基準はこの合計の方にする */
    var stagesBudgetTotal = stages.reduce(function(s, sg){ return s + sg.budget; }, 0);
    return { ok: condA && chk.ok, totalBudget: budget, stagesBudgetTotal: stagesBudgetTotal, stages: stages, totalCost: totalCost, totalQty: totalQty,
             condA: condA, condB: chk.okRate, condC: chk.okBalance,
             minRate: path.minRate, minRateDrop: path.minRateDrop, rateAtTarget: path.rateAtTarget, minBalance: path.minBalance };
  }
  /* 探索上限の自動設定：新規建て条件の逆数（例 1/0.31≒3.23）を土台に、現在の実質保証金
     （受渡未到来の算入分を含む現在の値。MarginSim.simulate の現在値）から到達可能な建代金合計の上限を
     見積もり、既存の建代金合計（現在の建玉総額）を差し引いたものを候補購入額の上限とする。負値なら0。
     これは制度上の上限ではなく探索用の天井である */
  function upperBound(state){
    var cur = MarginSim.simulate(state).current;
    var newMargin = state.settings.newMargin;
    var maxPrincipal = newMargin > 0 ? Math.floor(cur.balance / (newMargin / 100)) : 0;
    var upper = Math.max(0, maxPrincipal - cur.principal);
    return { upper: upper, balance: cur.balance, currentPrincipal: cur.principal, maxPrincipal: Math.max(0, maxPrincipal), newMargin: newMargin,
             basis: "現在の実質保証金 " + fmtYen(cur.balance) + " ÷ 新規建て条件 " + newMargin + "%（逆数 約" + (newMargin > 0 ? (100 / newMargin).toFixed(2) : "—") + "倍）＝ 到達可能な建代金合計の上限 約" + fmtYen(Math.max(0, maxPrincipal)) + "。ここから既存の建代金合計 " + fmtYen(cur.principal) + " を差し引いた " + fmtYen(upper) + " を探索上限とします（制度上の上限ではなく探索用の天井です）" };
  }
  function solve(state, insId, rawParams){
    var t0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
    function elapsed(){ var t1 = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now(); return Math.round((t1 - t0) * 10) / 10; }
    /* 入力検証：範囲外・数値でない値は無言で丸めず、理由を返して計算を実行しない */
    var verr = validateParams(rawParams);
    if (verr) return { status: "invalid", error: verr, params: rawParams, elapsedMs: elapsed() };
    var params = parseParams(rawParams);
    var minMargin = state.settings.minMargin;
    /* 例外 (1) 既存建玉のみで既に条件未達：候補なし・他銘柄計画なしの経路評価 */
    var base1 = MarginSim.pathEvaluate(baselineState(state, insId, false), params.target);
    var chk1 = pathOk(base1, params, minMargin);
    if (!chk1.ok){
      return { status: "existing_fail", params: params, minRate: base1.minRate, minRateDrop: base1.minRateDrop, minBalance: base1.minBalance,
               failRate: !chk1.okRate, failBalance: !chk1.okBalance, elapsedMs: elapsed() };
    }
    /* 例外 (2) 他銘柄の固定計画による未達：(1)は満たすが他銘柄の現行計画を含めると満たさない */
    var base2 = MarginSim.pathEvaluate(baselineState(state, insId, true), params.target);
    var chk2 = pathOk(base2, params, minMargin);
    if (!chk2.ok){
      return { status: "other_fail", params: params, minRate: base2.minRate, minRateDrop: base2.minRateDrop, minBalance: base2.minBalance,
               failRate: !chk2.okRate, failBalance: !chk2.okBalance, elapsedMs: elapsed() };
    }
    var ub = upperBound(state);
    if (!(ub.upper > 0)){
      return { status: "zero", reason: "upper", params: params, upper: ub, elapsedMs: elapsed() };
    }
    /* 探索中の候補評価の総回数を数える（探索メタ情報の表示と自己テストの上限確認用） */
    var evalCount = 0;
    function evalCounted(budget){
      evalCount++;
      return evaluateCandidate(state, insId, params, budget);
    }
    /* グリッド走査：上限までを約100分割し、成立する最大の格子点を取る（単調性は仮定しない） */
    var best = null;
    for (var i = 0; i <= GRID_DIV; i++){
      var b = Math.round(ub.upper * i / GRID_DIV);
      var ev = evalCounted(b);
      if (ev.ok && ev.totalQty > 0 && (best === null || b > best.totalBudget)) best = ev;
    }
    if (best === null){
      return { status: "zero", reason: "no_feasible", params: params, upper: ub, elapsedMs: elapsed() };
    }
    /* 精査：最大の格子点の区間内を約20分割してさらに細かく調べる */
    var gridStep = ub.upper / GRID_DIV;
    var intervalEnd = Math.min(ub.upper, best.totalBudget + gridStep);
    var refineStep = (intervalEnd - best.totalBudget) / REFINE_DIV;
    if (refineStep > 0){
      for (var k = 1; k <= REFINE_DIV; k++){
        var b2 = Math.round(best.totalBudget + refineStep * k);
        if (b2 <= best.totalBudget) continue;
        var ev2 = evalCounted(b2);
        if (ev2.ok && ev2.totalQty > 0) best = ev2;
      }
    }
    /* 最終走査（v1.9.2）：精査で得た最大の成立予算から1,000円刻みで増やしながら再評価し、
       最初に不成立になった手前を最終結果とする。精査の刻みは探索上限に比例して粗くなるが、
       この最終走査により最終粒度は上限の大小によらず約1,000円になる。
       追加の評価は最大 FINAL_MAX_EVALS 回まで（探索上限を超える候補は評価しない） */
    var finalEvals = 0;
    while (finalEvals < FINAL_MAX_EVALS){
      var b3 = best.totalBudget + FINAL_STEP;
      if (b3 > ub.upper) break;
      var ev3 = evalCounted(b3);
      finalEvals++;
      if (ev3.ok && ev3.totalQty > 0) best = ev3;
      else break;
    }
    /* 最終候補を現行エンジンで再評価して成立を確認してから結果とする */
    var finalEv = evalCounted(best.totalBudget);
    if (!finalEv.ok || finalEv.totalQty <= 0){
      return { status: "zero", reason: "no_feasible", params: params, upper: ub, elapsedMs: elapsed() };
    }
    var atCeiling = finalEv.totalBudget >= ub.upper - 1;
    /* 見出しの総予算は「実際に反映される段階予算の合計」と一致させる。探索で得た生の総予算は
       段階配分の丸め（100円単位）の累積で合計と最大で数円ずれるため、探索メタ情報側に残す */
    return { status: "ok", params: params, totalBudget: finalEv.stagesBudgetTotal, rawTotalBudget: finalEv.totalBudget, stages: finalEv.stages,
             totalCost: finalEv.totalCost, totalQty: finalEv.totalQty,
             minRate: finalEv.minRate, minRateDrop: finalEv.minRateDrop, rateAtTarget: finalEv.rateAtTarget, minBalance: finalEv.minBalance,
             atCeiling: atCeiling, upper: ub,
             meta: { upper: ub.upper, rawTotalBudget: finalEv.totalBudget, gridDiv: GRID_DIV, refineDiv: REFINE_DIV, gridStep: Math.round(gridStep), refineStep: Math.round(refineStep * 10) / 10, finalStep: FINAL_STEP, finalEvals: finalEvals, evalCount: evalCount, elapsedMs: elapsed() } };
  }
  return { sanitizeParams: sanitizeParams, validateParams: validateParams, parseParams: parseParams, evaluateCandidate: evaluateCandidate, upperBound: upperBound, solve: solve, GRID_DIV: GRID_DIV, REFINE_DIV: REFINE_DIV, FINAL_STEP: FINAL_STEP, FINAL_MAX_EVALS: FINAL_MAX_EVALS };
})();

/* ============================================================
   計画スロット（案）の保存・比較 PlanSlots（ステップ2・v2.0）
   銘柄ごとに最大5件の「案」を保存する。スロットが保持するのは未実行の将来レシピだけ：
   { id, 名前, 銘柄コード, 計画基準価格, 未実行段階のリスト（下落率・段階予算） }。
   実行済み段階・実保有・口座情報・終値は含めない（それらは常に現在のマスタを参照する）。
   比較の評価は表示のたびに現在のマスタ（口座・実保有・実行済み段階・他銘柄の計画・最新の終値）を
   前提として再計算し、保存時点の計算結果は保持しない。評価は既存エンジン MarginSim の
   simulate / pathEvaluate / pointAt をそのまま使い、計算式をここでは複製しない。
   候補ステートでも実行済み段階は共通の現実として残すため、候補どうしの差は未実行レシピだけから生じる。
   ============================================================ */
var PlanSlots = (function(){
  var MAX_SLOTS = 5;
  function slotsOf(ins){ return (ins && Array.isArray(ins.slots)) ? ins.slots : []; }
  /* 既定の名前「案N」：未使用の最小の番号を使う */
  function defaultName(ins){
    var used = {};
    slotsOf(ins).forEach(function(s){ used[s.name] = true; });
    var n = 1;
    while (used["案" + n]) n++;
    return "案" + n;
  }
  function makeSlot(name, code, planBasePrice, stageList){
    return { id: uid("slot"),
             name: String(name === null || name === undefined ? "" : name).slice(0, 40),
             code: normalizeCode(code),
             planBasePrice: clamp(num(planBasePrice, 0), 0, 1e9),
             stages: (Array.isArray(stageList) ? stageList : []).map(function(s){
               s = s || {};
               return { dropPct: clamp(num(s.dropPct, 0), 0, 100), budget: clamp(Math.round(num(s.budget, 0)), 0, 1e12) };
             }) };
  }
  /* 現在の計画（計画基準価格＋未実行段階）からスロットを作る。実行済み段階は含めない */
  function slotFromCurrentPlan(ins){
    return makeSlot(defaultName(ins), ins.code, ins.planBasePrice,
      ins.stages.filter(function(s){ return !s.executed; }));
  }
  /* 任意の段階レシピ（予算逆算のプレビュー等）からスロットを作る。計画基準価格は対象銘柄の現在の値を使う */
  function slotFromRecipe(ins, name, stageList){
    return makeSlot(name, ins.code, ins.planBasePrice, stageList);
  }
  /* スロットを追加する。上限（5件）に達していれば追加せず false を返す */
  function addSlot(ins, slot){
    if (!Array.isArray(ins.slots)) ins.slots = [];
    if (ins.slots.length >= MAX_SLOTS) return false;
    ins.slots.push(slot);
    return true;
  }
  function removeSlot(ins, slotId){
    if (!Array.isArray(ins.slots)) return false;
    var before = ins.slots.length;
    ins.slots = ins.slots.filter(function(s){ return s.id !== slotId; });
    return ins.slots.length !== before;
  }
  /* スロットを現在の計画へ反映する：未実行段階をレシピで置き換え、計画基準価格もスロットの値にする。
     実行済み段階と実保有は変更しない。スロット自体は残る */
  function applySlot(ins, slot){
    var kept = ins.stages.filter(function(s){ return s.executed; });
    var news = slot.stages.map(function(s){
      return { id: uid("st"), dropPct: s.dropPct, budget: s.budget, enabled: true, executed: false, execPrice: null, execQty: null, execAmount: null, reflected: false };
    });
    ins.stages = kept.concat(news);
    if (slot.planBasePrice !== ins.planBasePrice){ ins.planBasePrice = slot.planBasePrice; ins.baseIsSample = false; }
    return { keptCount: kept.length, newCount: news.length };
  }
  /* 評価済みシミュレーションから比較指標を取り出す。予算・実購入額・実行不能数は対象銘柄の
     未実行かつ有効な段階についての集計で、経路・到達・評価損は口座全体の指標。
     経路上の最低維持率は MarginSim.pathEvaluate、下落率−50%時点は MarginSim.pointAt、
     到達下落率は simulate の精緻化値、最終評価損は想定最大下落率時点の行の評価損益をそのまま使う */
  function metricsFor(st, simR, targetIns){
    var path = MarginSim.pathEvaluate(st, st.settings.maxDrop);
    var pt50 = MarginSim.pointAt(st, simR.stageRes, 50, 50);
    var lastRow = simR.rows.length ? simR.rows[simR.rows.length - 1] : null;
    var budgetTotal = 0, costTotal = 0, infeasibleCount = 0;
    targetIns.stages.forEach(function(sg){
      if (!sg.enabled || sg.executed) return;
      budgetTotal += sg.budget;
      var r = simR.stageRes[sg.id];
      if (r){ costTotal += r.cost; if (r.status === "infeasible") infeasibleCount++; }
    });
    return { budgetTotal: budgetTotal, costTotal: costTotal,
             minRate: path.minRate, minRateDrop: path.minRateDrop,
             firstMgmt: simR.firstMgmtPrecise, firstCall: simR.firstCallPrecise,
             rate50: pt50.rate, infeasibleCount: infeasibleCount,
             finalPnl: lastRow ? lastRow.totalPnl : null };
  }
  /* 「現在の計画」の評価：現在のステートそのものを既存エンジンで評価する */
  function evaluateCurrent(state, ins){
    return metricsFor(state, MarginSim.simulate(state), ins);
  }
  /* スロットの評価：現在のステートを複製し、対象銘柄の未実行段階だけをレシピに差し替え
     （実行済み段階は共通の現実として残す）、計画基準価格もスロット自身の値にして評価する */
  function evaluateSlot(state, ins, slot){
    var cs = JSON.parse(JSON.stringify(state));
    var ci = null;
    cs.instruments.forEach(function(x){ if (x.id === ins.id) ci = x; });
    if (!ci) return null;
    var kept = ci.stages.filter(function(s){ return s.executed; });
    var news = slot.stages.map(function(s, i){
      return { id: "slotcand_" + i, dropPct: s.dropPct, budget: s.budget, enabled: true, executed: false, execPrice: null, execQty: null, execAmount: null, reflected: false };
    });
    ci.stages = kept.concat(news);
    ci.planBasePrice = slot.planBasePrice;
    return metricsFor(cs, MarginSim.simulate(cs), ci);
  }
  return { MAX_SLOTS: MAX_SLOTS, slotsOf: slotsOf, defaultName: defaultName, makeSlot: makeSlot,
           slotFromCurrentPlan: slotFromCurrentPlan, slotFromRecipe: slotFromRecipe,
           addSlot: addSlot, removeSlot: removeSlot, applySlot: applySlot,
           metricsFor: metricsFor, evaluateCurrent: evaluateCurrent, evaluateSlot: evaluateSlot };
})();

<script>
"use strict";
/* ---------- アプリ状態と永続保存（IndexedDB） ----------
   データは端末のブラウザ内 IndexedDB に、形式バージョン付きの封筒（envelope）で自動保存し、
   起動時に復元する。保存データが破損している場合や、このアプリより新しい形式の場合は
   推測で読み込まず・勝手に上書きもせず、検証関数 unpackState が理由を返して安全に処理する。
   JSON バックアップ（書き出し／読み込み）も同じ封筒・同じ検証を通す。 */
var state = sampleState();
var sim = MarginSim.simulate(state);
var ui = { view: "dashboard", selectedInsId: state.instruments[0].id, selectedDrop: null, chartScale: "auto", detailOpen: false, premiseOpen: false };

function recalc(){ sim = MarginSim.simulate(state); scheduleSave(); }

/* 形式バージョン付きで包む／検証して開く（自動保存・復元・JSON 共通） */
function packState(st, savedAt){
  return { app: "margin-nanpin-planner", version: DATA_VERSION, savedAt: savedAt || new Date().toISOString(), data: st };
}
function unpackState(payload){
  if (!payload || typeof payload !== "object") return { ok: false, reason: "corrupt" };
  var raw = (payload.data && typeof payload.data === "object") ? payload.data : payload;
  var ver = num(payload.version !== undefined ? payload.version : raw.version, NaN);
  if (!isFinite(ver)) return { ok: false, reason: "corrupt" };
  if (ver > DATA_VERSION) return { ok: false, reason: "version", foundVersion: ver };
  if (!raw || typeof raw !== "object" || (!Array.isArray(raw.instruments) && !raw.account)) return { ok: false, reason: "corrupt" };
  var clean = sanitizeState(raw); /* 旧バージョンは現行形式の既定値で補いながら移行する */
  if (!clean) return { ok: false, reason: "corrupt" };
  return { ok: true, state: clean, fromVersion: ver };
}

/* ---------- IndexedDB ストレージ層 ---------- */
var IDB_NAME = "nanpin-planner-db", IDB_STORE = "kv", IDB_KEY = "app-state", IDB_CORRUPT_KEY = "app-state-corrupt-backup";
var persistenceReady = false; /* 初回読み込みが終わるまで自動保存しない（サンプルで保存済みデータを上書きしないため） */
var storageBlocked = false;   /* 新しい形式の保存データを検出したときは、上書き防止のため自動保存を止める */
var storageAvailable = true;  /* 埋め込み表示など IndexedDB が使えない環境では false になり、JSON のみで運用する */
var lastSavedAt = "";
/* ---------- 最終エクスポート日時の記録（C07） ----------
   書き出し操作の日時だけを、端末側の保存領域（IndexedDBの別キー）に記録する。
   エクスポートされるJSONデータ本体には混ぜない（バックアップの内容は従来どおり）。
   日時表示は「書き出し操作の記録」であり、ファイルの保存完了やバックアップの成功を断定するものではない。 */
var IDB_EXPORT_KEY = "last-export-at";
var lastExportAt = ""; /* ISO文字列。未記録なら "" */
var EXPORT_STALE_DAYS = 30;
function exportRecordStatus(iso, nowMs){
  if (!iso) return { recorded: false, stale: true, days: null };
  var t = Date.parse(iso);
  if (!isFinite(t)) return { recorded: false, stale: true, days: null };
  var days = Math.floor((nowMs - t) / (24 * 3600 * 1000));
  return { recorded: true, stale: days > EXPORT_STALE_DAYS, days: days };
}
function exportRecordText(){
  var st = exportRecordStatus(lastExportAt, Date.now());
  if (!st.recorded) return "最終エクスポート：未記録";
  var d = new Date(lastExportAt);
  return "最終エクスポート：" + d.toLocaleDateString("ja-JP") + " " + d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function exportPromptText(){
  var st = exportRecordStatus(lastExportAt, Date.now());
  if (!st.recorded) return "まだ書き出し操作の記録がありません。大切なデータを守るため、ときどきJSONで書き出して、別の場所にも保管しておくと安心です。";
  if (st.stale) return "前回の書き出し操作から " + st.days + " 日が経っています。データを守るため、そろそろ新しい書き出しをおすすめします。";
  return "";
}
function refreshExportInfo(){

function loadExportRecord(){

    if (typeof v === "string" && isFinite(Date.parse(v))) lastExportAt = v;

var loadWarning = "";         /* "" | "corrupt" | "version" */
var loadWarningVersion = null;
var saveTimer = null, savePending = false;

function idbOpen(){
  return new Promise(function(resolve, reject){
    if (!("indexedDB" in window)) { reject(new Error("IndexedDB unavailable")); return; }
    var req = window.indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error("IndexedDB open failed")); };
    req.onblocked = function(){ reject(new Error("IndexedDB blocked")); };
  });
}
function idbRun(mode, fn){
  return idbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(IDB_STORE, mode);
      var req = null;
      try { req = fn(tx.objectStore(IDB_STORE)); } catch (e) { try { db.close(); } catch (e2) {} reject(e); return; }
      tx.oncomplete = function(){ db.close(); resolve(req ? req.result : null); };
      tx.onabort = function(){ db.close(); reject(tx.error || new Error("IndexedDB aborted")); };
      tx.onerror = function(){ reject(tx.error || new Error("IndexedDB failed")); };
    });
  });
}
function idbGet(key){ return idbRun("readonly", function(s){ return s.get(key); }); }
function idbPut(key, val){ return idbRun("readwrite", function(s){ return s.put(val, key); }); }
function idbDel(key){ return idbRun("readwrite", function(s){ return s.delete(key); }); }

function persistInfoText(){
  if (!storageAvailable) return "この環境ではブラウザ内保存（IndexedDB）を利用できないため、自動保存は無効です。JSONバックアップをご利用ください。";
  if (storageBlocked) return "保存データが新しい形式（バージョン " + loadWarningVersion + "）のため読み込めず、上書き防止のため自動保存を停止しています。下のボタンで保存データを消去すると、現在のデータで自動保存を再開できます。";
  return "自動保存：有効（この端末のブラウザ内に保存）" + (lastSavedAt ? "／最終保存 " + lastSavedAt : "／まだ保存されていません") + "。データ形式バージョン：" + DATA_VERSION + "。";
}
function setSaveStatus(text){
  var n = document.getElementById("saveStatus");
  if (n) n.textContent = text;
  var info = document.getElementById("persistInfo");
  if (info) info.textContent = persistInfoText();
}
function scheduleSave(){
  if (!persistenceReady || storageBlocked || !storageAvailable) return;
  savePending = true;
  setSaveStatus("未保存の変更があります…");
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ saveNow(); }, 300);
}
function saveNow(){
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  if (!persistenceReady || storageBlocked || !storageAvailable || !savePending) return Promise.resolve(false);
  savePending = false;
  var at = new Date();
  return idbPut(IDB_KEY, packState(state, at.toISOString())).then(function(){
    lastSavedAt = at.toLocaleDateString("ja-JP") + " " + at.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    setSaveStatus("自動保存済み " + at.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }));
    return true;
  }).catch(function(){
    storageAvailable = false;
    setSaveStatus("自動保存を利用できません");
    return false;
  });
}
function manualSave(){ savePending = true; return saveNow(); }
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "hidden") saveNow(); });
window.addEventListener("beforeunload", function(){ saveNow(); });

/* 起動時の復元：保存データがあれば検証して読み込む。なければ現在の（サンプル）状態を初回保存する */
function initPersistence(){
  idbGet(IDB_KEY).then(function(record){
    if (record === undefined || record === null){
      persistenceReady = true;
      savePending = true;
      saveNow();
      return;
    }
    var res = unpackState(record);
    if (res.ok){
      state = res.state;
      ui.selectedInsId = state.instruments.length ? state.instruments[0].id : null;
      ui.selectedDrop = null;
      if (record.savedAt) { var d = new Date(record.savedAt); if (isFinite(d.getTime())) lastSavedAt = d.toLocaleString("ja-JP"); }
      persistenceReady = true;
      sim = MarginSim.simulate(state);
      render();
      setSaveStatus("保存データを復元しました");
      toast("前回保存したデータを復元しました。");
      return;
    }
    if (res.reason === "version"){
      /* 新しい形式：内容を推測で読まず、上書きもしない */
      storageBlocked = true; loadWarning = "version"; loadWarningVersion = res.foundVersion;
      persistenceReady = true;
      setSaveStatus("保存データの形式が新しいため未読込");
      render();
      toast("保存データは新しい形式のため読み込めませんでした。自動保存は停止しています。");
      return;
    }
    /* 破損：原本を退避キーへ移してから初期データで開始し、自動保存を再開する */
    loadWarning = "corrupt";
    idbPut(IDB_CORRUPT_KEY, record).then(function(){ return idbDel(IDB_KEY); }).catch(function(){}).then(function(){
      persistenceReady = true;
      savePending = true;
      saveNow();
      render();
      toast("保存データが破損していたため、初期データで開始しました。");
    });
  }).catch(function(){
    storageAvailable = false;
    persistenceReady = true;
    setSaveStatus("自動保存を利用できません");
    render();
  });
}
