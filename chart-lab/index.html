// Perfect-order pullback (Stage 5-E-5; method F, single-bar type).
// Both the previous and the current bar must be in perfect order
// (bullish: C > EMA5 > EMA25 > EMA75; bearish mirrored). The level M
// is the PREVIOUS bar's EMA5, known once that bar completed. Bullish
// fires when the current low touches M (L <= M, equality allowed) and
// the close recovers strictly above M (C > M); bearish mirrored with
// the high and C < M. Within a continuous run of the composite
// condition only the first bar fires; refire requires a valid
// non-satisfaction (unknown does not release). Multi-bar pullbacks
// and post-breakdown recoveries are out of scope. Independent of the
// sub-rules' outputs and ON/OFF.
registerRule(defRule('perfect-order-pullback', {
  id: 'perfect-order-pullback', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [];
    let prevState = null, lastValid = -1;
    for (let t = 1; t < bars.length; t++) {
      const p = bars[t - 1], c = bars[t];
      const E5p = F.ema5[t - 1], E25p = F.ema25[t - 1], E75p = F.ema75[t - 1];
      const E5 = F.ema5[t], E25 = F.ema25[t], E75 = F.ema75[t];
      const vals = [E5p, E25p, E75p, E5, E25, E75, p.close, c.close, c.high, c.low];
      if (!p.complete || !c.complete || vals.some(v => v == null || !Number.isFinite(v))) continue;
      const orderP = (p.close > E5p && E5p > E25p && E25p > E75p) ? 'bullish' : (p.close < E5p && E5p < E25p && E25p < E75p) ? 'bearish' : null;
      const orderT = (c.close > E5 && E5 > E25 && E25 > E75) ? 'bullish' : (c.close < E5 && E5 < E25 && E25 < E75) ? 'bearish' : null;
      let s = 'neutral';
      if (orderP === 'bullish' && orderT === 'bullish' && c.low <= E5p && c.close > E5p) s = 'bullish';
      else if (orderP === 'bearish' && orderT === 'bearish' && c.high >= E5p && c.close < E5p) s = 'bearish';
      const first = lastValid < 0, gap = !first && t - lastValid > 1;
      if ((s === 'bullish' || s === 'bearish') && s !== prevState) {
        const bull = s === 'bullish', sg = bull ? 1 : -1, M = E5p;
        const cs = [critN(bull ? '前足：終値 − EMA5 > 0' : '前足：EMA5 − 終値 > 0', sg * (p.close - E5p), 0, true, 1, 1, true),
                    critN(bull ? '前足：EMA5 − EMA25 > 0' : '前足：EMA25 − EMA5 > 0', sg * (E5p - E25p), 0, true, 1, 1, true),
                    critN(bull ? '前足：EMA25 − EMA75 > 0' : '前足：EMA75 − EMA25 > 0', sg * (E25p - E75p), 0, true, 1, 1, true),
                    critN(bull ? '当足：終値 − EMA5 > 0' : '当足：EMA5 − 終値 > 0', sg * (c.close - E5), 0, true, 1, 1, true),
                    critN(bull ? '当足：EMA5 − EMA25 > 0' : '当足：EMA25 − EMA5 > 0', sg * (E5 - E25), 0, true, 1, 1, true),
                    critN(bull ? '当足：EMA25 − EMA75 > 0' : '当足：EMA75 − EMA25 > 0', sg * (E25 - E75), 0, true, 1, 1, true),
                    critN(bull ? '接触（水準M − 当足安値）>= 0' : '接触（当足高値 − 水準M）>= 0', bull ? M - c.low : c.high - M, 0, true, 1, 1, true),
                    critN(bull ? '終値回復（当足終値 − 水準M）> 0' : '終値回復（水準M − 当足終値）> 0', bull ? c.close - M : M - c.close, 0, true, 1, 1, true)];
        const sc = scoreOf2(cs);
        const kindText = first
          ? 'この足対が最初の有効な評価であり、過去の成立は不明（初観測）。'
          : gap
            ? '評価不能な足対を挟んだ初観測であり、間の成立は断定しない。'
            : '有効な不成立を経た成立として検出した。';
        ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: bull ? 'bullish' : 'bearish', direction: bull ? 'bullish-traditional' : 'bearish-traditional', startIndex: t - 1, endIndex: t, detectedIndex: t, criteria: cs, explanation: `${bull ? '強気' : '弱気'}パーフェクトオーダーが前足・当足とも継続する中で、当足の${bull ? '安値' : '高値'} ${fmt(bull ? c.low : c.high)} が前足EMA5の水準 M=${fmt(M)} に接触し、終値 ${fmt(c.close)} が水準を${bull ? '上' : '下'}回って回復した。${kindText}水準は前足確定時のEMA5であり、当足のEMA5ではない。足内の到達順・約定は主張しない。特徴量からの再導出であり、下位ルールの出力には依存しない。伝統的な解釈であり予測ではない。` }));
      }
      prevState = s; lastValid = t;
    }
    return ev;
  }
}));

// ---------- Stage 5-C-2: RSI / stochastics family (v0.8, JSON-driven) ----------
// Zone entries share the legacy RSI control flow (armed flag, re-arm check
// on the current value first, incomplete bars never consume an entry).
function zoneEntries(bars, S, cfg) {
  const out = { oversold: [], overbought: [] };
  for (const side of ['oversold', 'overbought']) {
    const enter = side === 'oversold' ? cfg.lowEnter : cfg.highEnter;
    const rearm = side === 'oversold' ? cfg.lowRearm : cfg.highRearm;
    let armed = true;
    for (let i = 1; i < bars.length; i++) {
      const s0 = S[i - 1], s1 = S[i];
      if (s0 == null || s1 == null) continue;
      if (!armed) { if (rearm(s1)) armed = true; else continue; }
      if (!bars[i].complete) continue;
      if (enter(s0, s1)) { armed = false; out[side].push({ index: i, s0, s1 }); }
    }
  }
  return out;
}

// Trend pullback RSI confluence (Stage 5-E-5; method F — re-derived
// from features, independent of the sub-rules' outputs and ON/OFF).
// Bullish: RSI14 exits the oversold zone between ADJACENT valid
// completed bars (R[t-1] < 30, R[t] >= 30) while the recovery bar t is
// in bullish perfect order (C > EMA5 > EMA25 > EMA75) and the previous
// bar's EMA order was already bullish (its close position is not
// required). Bearish mirrored. This is NOT the rsi-zone-exit state
// machine (no 35/65 rearm): the exit transition itself is the event.
// No fire across a gap or when the exit and the order disagree.
registerRule(defRule('trend-pullback-rsi', {
  id: 'trend-pullback-rsi', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [];
    let prev = null;
    for (let t = 0; t < bars.length; t++) {
      const R = F.rsi14[t], E5 = F.ema5[t], E25 = F.ema25[t], E75 = F.ema75[t], C = bars[t].close;
      const ok = !!bars[t].complete && R != null && E5 != null && E25 != null && E75 != null &&
        Number.isFinite(R) && Number.isFinite(E5) && Number.isFinite(E25) && Number.isFinite(E75) && Number.isFinite(C);
      if (!ok) { prev = null; continue; }
      if (prev) {
        const exitBull = prev.r < 30 && R >= 30, exitBear = prev.r > 70 && R <= 70;
        if (exitBull || exitBear) {
          const bull = exitBull;
          const orderT = bull ? (C > E5 && E5 > E25 && E25 > E75) : (C < E5 && E5 < E25 && E25 < E75);
          const orderP = bull ? (prev.e5 > prev.e25 && prev.e25 > prev.e75) : (prev.e5 < prev.e25 && prev.e25 < prev.e75);
          if (orderT && orderP) {
            const s = bull ? 1 : -1;
            const cs = [critN(bull ? 'RSI14（前足）< 30（圏域内）' : 'RSI14（前足）> 70（圏域内）', bull ? 30 - prev.r : prev.r - 70, 0, true, 1, 1, true),
                        critN(bull ? 'RSI14（当足）>= 30（退出）' : 'RSI14（当足）<= 70（退出）', bull ? R - 30 : 70 - R, 0, true, 1, 1, true),
                        critN(bull ? '終値 − EMA5（当足）> 0' : 'EMA5 − 終値（当足）> 0', s * (C - E5), 0, true, 1, 1, true),
                        critN(bull ? 'EMA5 − EMA25（当足）> 0' : 'EMA25 − EMA5（当足）> 0', s * (E5 - E25), 0, true, 1, 1, true),
                        critN(bull ? 'EMA25 − EMA75（当足）> 0' : 'EMA75 − EMA25（当足）> 0', s * (E25 - E75), 0, true, 1, 1, true),
                        critN(bull ? 'EMA5 − EMA25（前足）> 0' : 'EMA25 − EMA5（前足）> 0', s * (prev.e5 - prev.e25), 0, true, 1, 1, true),
                        critN(bull ? 'EMA25 − EMA75（前足）> 0' : 'EMA75 − EMA25（前足）> 0', s * (prev.e25 - prev.e75), 0, true, 1, 1, true)];
            const sc = scoreOf2(cs);
            ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: bull ? 'bullish' : 'bearish', direction: bull ? 'bullish-traditional' : 'bearish-traditional', startIndex: t - 1, endIndex: t, detectedIndex: t, criteria: cs, explanation: `RSI14 が${bull ? '売られすぎ圏' : '買われすぎ圏'}を退出し（${fmt(prev.r, 1)} → ${fmt(R, 1)}）、回復足で${bull ? '強気' : '弱気'}パーフェクトオーダーが成立している（終値 ${fmt(C)}、EMA5 ${fmt(E5)}、EMA25 ${fmt(E25)}、EMA75 ${fmt(E75)}）。前足もEMA順序が同方向だった。圏域滞在全体のトレンド継続を示すものではなく、rsi-zone-exit の再発火解除（35／65）とは別の判定。特徴量からの再導出であり、下位ルールの出力には依存しない。伝統的な解釈であり予測ではない。` }));
          }
        }
      }
      prev = { r: R, e5: E5, e25: E25, e75: E75 };
    }
    return ev;
  }
}));

      const cs = [critN(`終値がケルトナー${hit === 'upper' ? '上限' : '下限'}を突破`, hit === 'upper' ? c1 - band : band - c1, 0, true, Math.min(1, Math.abs(c1 - band) / (F.atr14[i] || 1) + 0.3), 2, true)];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: hit, direction: hit === 'upper' ? 'bullish-traditional' : 'bearish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `終値 ${fmt(c1)} がケルトナーチャネル（EMA20±2×ATR10）の${hit === 'upper' ? '上限' : '下限'} ${fmt(band)} を終値で抜けた。定義は独自確定。伝統的な解釈であり予測ではない。` }));
    }
    return ev;
  }
}));

// Squeeze breakout (Stage 5-E-4; project-original). Reuses the
// existing Bollinger bands (SMA20 +/- 2 population SD) and Keltner
// channels (EMA20 +/- 2 Wilder ATR10). Q[t] (BB contained in KC,
// equality counts as containment) is evaluated only when all four
// bounds are finite and consistent and the KC width is positive;
// anything else is unknown. A release is certified only between
// ADJACENT valid completed bars (Q true -> false), and only the
// release bar itself can fire: up when the previous close was at or
// inside the upper BB and the release close breaks above it, down
// mirrored. At most one event per squeeze interval; late breakouts
// after the release bar are out of scope. An unknown bar voids any
// release across it and restarts the interval from the returning
// compression state. startIndex is the observed interval start;
// history stays a single transition at the release bar. Direction is
// judged by the price close only (no TTM momentum/histogram).
registerRule(defRule('squeeze-breakout', {
  id: 'squeeze-breakout', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [];
    let prevQ = null, prev = null, start = null;
    for (let t = 0; t < bars.length; t++) {
      const BU = F.bbUpper[t], BL = F.bbLower[t], KU = F.kcUpper[t], KL = F.kcLower[t], C = bars[t].close;
      const valid = !!bars[t].complete && BU != null && BL != null && KU != null && KL != null &&
        Number.isFinite(BU) && Number.isFinite(BL) && Number.isFinite(KU) && Number.isFinite(KL) && Number.isFinite(C) &&
        BU >= BL && KU > KL;
      if (!valid) { prevQ = null; prev = null; start = null; continue; }
      const q = BL >= KL && BU <= KU;
      if (q) {
        if (prevQ !== true) start = t;
      } else {
        if (prevQ === true && start !== null && prev) {
          const up = prev.c <= prev.bu && C > BU;
          const down = prev.c >= prev.bl && C < BL;
          if (up || down) {
            const cs = [critN('前足の内包（BB下限 − KC下限）', prev.bl - prev.kl, 0, true, 1, 1, true),
                        critN('前足の内包（KC上限 − BB上限）', prev.ku - prev.bu, 0, true, 1, 1, true),
                        critN('当足の解消幅（内包の不成立量）', Math.max(KL - BL, BU - KU), 0, true, 1, 1, true),
                        critN(up ? '前足終値の位置（BB上限 − 前足終値）' : '前足終値の位置（前足終値 − BB下限）', up ? prev.bu - prev.c : prev.c - prev.bl, 0, true, 1, 1, true),
                        critN(up ? '当足終値の突破幅（終値 − BB上限）' : '当足終値の突破幅（BB下限 − 終値）', up ? C - BU : BL - C, 0, true, 1, 1, true)];
            const sc = scoreOf2(cs);
            ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: up ? 'up' : 'down', direction: up ? 'bullish-traditional' : 'bearish-traditional', startIndex: start, endIndex: t, detectedIndex: t, criteria: cs, explanation: `スクイーズ（BBがKC内に内包）が解消し、解消足の終値がボリンジャーバンドを${up ? '上' : '下'}抜けた：圧縮区間は足 ${start} から観測され、前足は BB[${fmt(prev.bl)}, ${fmt(prev.bu)}] が KC[${fmt(prev.kl)}, ${fmt(prev.ku)}] 内にあり、当足の終値 ${fmt(C)} が BB${up ? '上限' : '下限'} ${fmt(up ? BU : BL)} を終値で突破した。解消足のみを対象とし、遅れて起こる突破は対象外。方向は価格終値で判定するプロジェクト独自の操作的定義であり、TTMのモメンタム判定とは異なる。伝統的な解釈であり予測ではない。` }));
          }
        }
        start = null;
      }
      prevQ = q;
      prev = { c: C, bu: BU, bl: BL, ku: KU, kl: KL };
    }
    return ev;
  }
}));

registerRule(defRule('atr-regime', {
  id: 'atr-regime', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    const t = zoneEntries(bars, F.atrRatio, {
      lowEnter: (s0, s1) => s0 >= P.contraction && s1 < P.contraction, lowRearm: (s1) => s1 >= P.rearm,
      highEnter: (s0, s1) => s0 <= P.expansion && s1 > P.expansion, highRearm: (s1) => s1 <= P.rearm,
    });
    for (const [side, variant] of [['oversold', 'contraction'], ['overbought', 'expansion']]) {
      const contraction = side === 'oversold', thr = contraction ? P.contraction : P.expansion;
      for (const { index: i, s1 } of t[side]) {
        const atrPct = F.atr14[i] / bars[i].close * 100;
        const cs = [critN(contraction ? 'ATR比率が 0.8 を下抜け' : 'ATR比率が 1.2 を上抜け', s1, thr, true, Math.min(1, Math.abs(s1 - thr) + 0.3), 2, true),
                    critN('ATR%（ATR／終値×100、併記）', atrPct, 0, null, null, 0, false)];
        const sc = scoreOf2(cs);
        ev.push(makeEvent(this, { state: 'observation', score: sc.score, coverage: sc.coverage, variant, direction: null, startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `ATR比率（ATR14／SMA50）が ${fmt(s1, 2)} となり、ボラティリティの${contraction ? '縮小' : '拡大'}レジームへ入った（ATR% ${fmt(atrPct, 2)}）。再発火は比率が 1.0 に戻るまで抑止する。状態の観察であり予測ではない。` }));
      }
    }
    return ev;
  }
}));

registerRule(defRule('hv-percentile', {
  id: 'hv-percentile', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    const t = zoneEntries(bars, F.hvPct, {
      lowEnter: (s0, s1) => s0 > P.low && s1 <= P.low, lowRearm: (s1) => s1 > P.lowRearm,

}));

registerRule(defRule('nr-pattern', {
  id: 'nr-pattern', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (const p of P.periods) {
      for (let i = p - 1; i < bars.length; i++) {
        if (!bars[i].complete) continue;
        let mn = Infinity; for (let k = i - p + 1; k < i; k++) mn = Math.min(mn, F.range[k]);
        if (!(F.range[i] < mn)) continue; // strict: ties are not NR (defs 0.9)
        const cs = [critN(`値幅が直近 ${p} 本で厳密に最小`, F.range[i], mn, true, 1, 2, true)];
        const sc = scoreOf2(cs);
        ev.push(makeEvent(this, { state: 'observation', score: sc.score, coverage: sc.coverage, variant: `nr${p}`, direction: null, startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `値幅 ${fmt(F.range[i])} が直近 ${p} 本の中で最小（同値は最小とみなさない）。形状の観察であり予測ではない。` }));
      }
    }
    return ev;
  }
}));

registerRule(defRule('range-expansion', {
  id: 'range-expansion', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 14; i < bars.length; i++) {
      if (!bars[i].complete) continue;
      const ref = F.atr14[i - 1];
      if (ref == null || !(F.tr[i] >= P.multiple * ref)) continue;
      const up = bars[i].close >= bars[i].open;
      const cs = [critN('トゥルーレンジが前足時点 ATR14 の2倍以上', F.tr[i] / ref, P.multiple, true, Math.min(1, F.tr[i] / ref / 4 + 0.3), 2, true)];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: up ? 'up' : 'down', direction: up ? 'bullish-traditional' : 'bearish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `トゥルーレンジ ${fmt(F.tr[i])} が前足時点の ATR14（${fmt(ref)}）の ${fmt(F.tr[i] / ref, 1)} 倍に達した値幅拡大足。伝統的な解釈であり予測ではない。` }));
    }
    return ev;
  }
}));

registerRule(defRule('inside-bar', {
  id: 'inside-bar', version: '0.1',
  evaluate(ctx) {
    const { bars } = ctx, ev = [];
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete) continue;
      const b = bars[i], p = bars[i - 1];
      if (!(b.high <= p.high && b.low >= p.low)) continue; // equality counts as inside (defs 0.9)
      const cs = [critN('高値が前足高値以下・安値が前足安値以上', Math.min(p.high - b.high, b.low - p.low), 0, true, 1, 2, true)];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, { state: 'observation', score: sc.score, coverage: sc.coverage, variant: null, direction: null, startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `高値・安値が前足の範囲内に収まるインサイドバー（等号は包含に含める）。形状の観察であり予測ではない。` }));
    }
    return ev;
  }
}));

registerRule(defRule('outside-bar', {
  id: 'outside-bar', version: '0.1',
  evaluate(ctx) {
    const { bars } = ctx, ev = [];
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete) continue;
      const b = bars[i], p = bars[i - 1];
      if (!(b.high >= p.high && b.low <= p.low && (b.high > p.high || b.low < p.low))) continue;
      const variant = b.close > b.open ? 'bullish' : (b.close < b.open ? 'bearish' : null);
      const cs = [critN('高値・安値が前足の範囲を上下に超過', Math.min(b.high - p.high, p.low - b.low), 0, true, 1, 2, true)];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, { state: 'observation', score: sc.score, coverage: sc.coverage, variant, direction: variant === 'bullish' ? 'bullish-traditional' : (variant === 'bearish' ? 'bearish-traditional' : null), startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `高値・安値が前足の範囲を上下に超えるアウトサイドバー。形状の観察であり予測ではない。` }));
    }
    return ev;
  }
}));

// ---------- Stage 5-C-3 second half: Mass / Chaikin / volume (v1.1, JSON-driven) ----------
// Volume is the generator's synthetic value in every rule below.
registerRule(defRule('mass-index-bulge', {
  id: 'mass-index-bulge', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    let seenAbove = false;
    for (let i = 40; i < bars.length; i++) {
      const mi = F.massIndex[i];
      if (mi == null || !bars[i].complete) continue;
      if (mi > P.bulgeLevel) { seenAbove = true; continue; }
      if (seenAbove && mi < P.triggerLevel) {
        seenAbove = false;
        const cs = [critN('MI が 27 超の履歴の後に 26.5 未満へ低下', mi, P.triggerLevel, true, 1, 2, true)];
        const sc = scoreOf2(cs);
        ev.push(makeEvent(this, { state: 'observation', score: sc.score, coverage: sc.coverage, variant: null, direction: null, startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `マスインデックスが ${fmt(mi, 1)} となり、27超からの低下（bulge）が成立した。非方向性の観察であり予測ではない（5分足への適用は独自適用）。` }));
      }
    }
    return ev;
  }
}));

registerRule(defRule('chaikin-volatility', {
  id: 'chaikin-volatility', version: '0.1',

      if (!bars[i].complete) continue;
      const hit = zeroCrossAt(F.chaikinVol, i);

registerRule(defRule('volume-spike', {
  id: 'volume-spike', version: '0.1',
  evaluate(ctx) {
    const { bars } = ctx, ev = [], P = this.parameters;
    for (let i = P.period; i < bars.length; i++) {
      if (!bars[i].complete) continue;
      const v = bars[i].volume;
      if (v == null) continue;
      let s = 0, okAll = true;
      for (let k = i - P.period; k < i; k++) { if (bars[k].volume == null) { okAll = false; break; } s += bars[k].volume; }
      if (!okAll) continue;
      const mean = s / P.period;
      if (!(mean > 0 && v >= P.multiple * mean)) continue;
      const cs = [critN('当足出来高が直前20本平均の2倍以上', v / mean, P.multiple, true, Math.min(1, v / mean / 4 + 0.3), 2, true)];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, { state: 'observation', score: sc.score, coverage: sc.coverage, variant: null, direction: null, startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `出来高 ${Math.round(v)} が直前20本（当足を含まない）の平均 ${Math.round(mean)} の ${fmt(v / mean, 1)} 倍に達した。出来高は生成器の合成値であり、現実の売買の証拠ではない。` }));
    }
    return ev;
  }
}));

registerRule(defRule('volume-dryup', {
  id: 'volume-dryup', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    let inDry = null;
    for (let i = 0; i < bars.length; i++) {
      const pct = F.volPct[i];
      if (pct == null || !bars[i].complete) continue;
      const now = pct <= P.percentile;
      if (inDry === null) { inDry = now; continue; }
      if (now === inDry) continue;
      inDry = now;
      const cs = [critN(now ? '出来高の分位が 10 以下' : '出来高の分位が 10 を上回った', pct, P.percentile, true, 1, 2, true)];

      ev.push(makeEvent(this, { state: 'observation', score: sc.score, coverage: sc.coverage, variant: now ? 'dryup' : 'release', direction: null, startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `出来高の分位が ${fmt(pct, 1)} となり、枯渇状態が${now ? '成立' : '解消'}した（直近60本・当足込み・中順位）。出来高は合成値。状態の観察であり予測ではない。` }));
    }
    return ev;
  }
}));

function slopeTurnRule(id, seriesKey, label) {
  return defRule(id, {
    id, version: '0.1',
    evaluate(ctx) {
      const { bars, F } = ctx, ev = [], S = F[seriesKey], P = this.parameters;
      for (let i = P.slopePeriod + 1; i < bars.length; i++) {
        if (!bars[i].complete) continue;
        const s0 = (S[i - 1] != null && S[i - 1 - P.slopePeriod] != null) ? S[i - 1] - S[i - 1 - P.slopePeriod] : null;
        const s1 = (S[i] != null && S[i - P.slopePeriod] != null) ? S[i] - S[i - P.slopePeriod] : null;
        if (s0 == null || s1 == null) continue;
        const hit = (s0 < 0 && s1 > 0) ? 1 : (s0 > 0 && s1 < 0) ? -1 : 0;
        if (!hit) continue;
        const cs = [critN(hit > 0 ? `前時点 ${label}傾き < 0` : `前時点 ${label}傾き > 0`, s0, 0, true, 1, 1, true),
                    critN(`現時点 ${label}傾き（10本差）`, s1, 0, true, 1, 2, true)];
        const sc = scoreOf2(cs);
        ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: hit > 0 ? 'up' : 'down', direction: hit > 0 ? 'bullish-traditional' : 'bearish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `${label} の傾き（10本差）が ${Math.round(s0)} → ${Math.round(s1)} と符号を変えた。出来高は生成器の合成値であり、現実の資金流入の証拠ではない。伝統的な解釈であり予測ではない。` }));
      }
      return ev;
    }
  });
}
registerRule(slopeTurnRule('obv-slope-turn', 'obv', 'OBV'));
registerRule(slopeTurnRule('adl-slope-turn', 'adl', 'A/Dライン'));

registerRule(defRule('obv-break', {
  id: 'obv-break', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = P.period; i < bars.length; i++) {
      if (!bars[i].complete) continue;
      const cur = F.obv[i];
      if (cur == null) continue;
      let hh = -Infinity, ll = Infinity, okAll = true;
      for (let k = i - P.period; k < i; k++) { if (F.obv[k] == null) { okAll = false; break; } hh = Math.max(hh, F.obv[k]); ll = Math.min(ll, F.obv[k]); }
      if (!okAll) continue;
      const hit = cur > hh ? 'upper' : (cur < ll ? 'lower' : null);
      if (!hit) continue;
      const cs = [critN(`OBV が直前 ${P.period} 本の${hit === 'upper' ? '最高値' : '最安値'}を更新`, hit === 'upper' ? cur - hh : ll - cur, 0, true, 1, 2, true)];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: hit, direction: hit === 'upper' ? 'bullish-traditional' : 'bearish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `OBV が直前20本（当足除外）の${hit === 'upper' ? '最高値' : '最安値'}を更新した。出来高は生成器の合成値であり、現実の資金流入の証拠ではない。伝統的な解釈であり予測ではない。` }));
    }
    return ev;
  }
}));

registerRule(defRule('cmf-zone', {

registerRule(defRule('updown-volume-ratio', {
  id: 'updown-volume-ratio', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    const t = zoneEntries(bars, F.upDownRatio, {
      lowEnter: (s0, s1) => s0 > P.lowerZone && s1 <= P.lowerZone, lowRearm: (s1) => s1 >= P.rearm,
      highEnter: (s0, s1) => s0 < P.upperZone && s1 >= P.upperZone, highRearm: (s1) => s1 <= P.rearm,

}));

registerRule(defRule('vwap-cross', {

registerRule(defRule('vwap-deviation', {
  id: 'vwap-deviation', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    let armedAbove = true, armedBelow = true, curDay = null;
    for (let i = 0; i < bars.length; i++) {
      if (bars[i].day !== curDay) { curDay = bars[i].day; armedAbove = true; armedBelow = true; }
      const dev = F.vwapDev[i];
      if (dev == null || !bars[i].complete) continue;
      if (Math.abs(dev) < P.rearm) { armedAbove = true; armedBelow = true; }
      const side = (dev >= P.zone && armedAbove) ? 'above' : (dev <= -P.zone && armedBelow) ? 'below' : null;
      if (!side) continue;
      if (side === 'above') armedAbove = false; else armedBelow = false;
      const cs = [critN(side === 'above' ? 'VWAP乖離率が +1%以上' : 'VWAP乖離率が −1%以下', dev, side === 'above' ? P.zone : -P.zone, true, Math.min(1, Math.abs(dev) / 2 + 0.3), 2, true)];

}));

registerRule(defRule('opening-range-break', {
  id: 'opening-range-break', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    let gi = 0;
    while (gi < bars.length) {
      let gj = gi;
      while (gj < bars.length && bars[gj].day === bars[gi].day) gj++;
      // day group = [gi, gj). The opening is known only if the day starts at 09:00.
      if (bars[gi].minute === 540) {
        let count = 0, rh = -Infinity, rl = Infinity, firedUp = false, firedDown = false;
        for (let i = gi; i < gj; i++) {
          if (!bars[i].complete) continue;
          count++;
          if (count <= P.rangeBars) { rh = Math.max(rh, bars[i].high); rl = Math.min(rl, bars[i].low); continue; }
          const c = bars[i].close;
          const hit = (c > rh && !firedUp) ? 'upper' : (c < rl && !firedDown) ? 'lower' : null;
          if (!hit) continue;
          if (hit === 'upper') firedUp = true; else firedDown = true;
          const cs = [critN(`終値が寄付きレンジ（6本）の${hit === 'upper' ? '上限' : '下限'}を突破`, hit === 'upper' ? c - rh : rl - c, 0, true, Math.min(1, Math.abs(hit === 'upper' ? c - rh : rl - c) / (F.atr14[i] || 1) + 0.3), 2, true)];
          const sc = scoreOf2(cs);
          ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: hit, direction: hit === 'upper' ? 'bullish-traditional' : 'bearish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `終値 ${fmt(c)} が寄付きレンジ（最初の6本、${fmt(rl)}〜${fmt(rh)}）を${hit === 'upper' ? '上抜け' : '下抜け'}した（同日・同方向は1回まで）。伝統的な解釈であり予測ではない。` }));
        }
      }
      gi = gj;
    }
    return ev;
  }
}));

// Ichimoku three roles (Stage 5-E-3, defs 0.27). Method F: state
// composition at a single bar (project doc section 46), NOT an AND of
// the three single-cross events. At each completed bar t the three
// conditions must coexist: bullish = tenkan > kijun AND close >
// cloudTop AND chikouDiff > 0; bearish = tenkan < kijun AND close <
// cloudBottom AND chikouDiff < 0 (all strict; inside the cloud, on a
// boundary, any equality or a mixed direction is neutral).
// F.cloudTop / F.cloudBottom are the cloud formed by the senkou spans
// computed at t-26 (the shift is already folded in); the raw senkou
// values are never used as the current cloud, and no event is
// backdated to the chikou display position t-26.
// Internal states bullish / bearish / neutral / unknown never add
// output states. A bar whose inputs are not all finite (warmup, null)
// or that is incomplete is unknown: it neither fires nor releases,
// and the previous valid state is kept. The first valid bar fires
// once as an initial observation if it is bullish / bearish (when it
// became true in the past is unknown). Afterwards a fire happens only
// on a transition to a different bullish / bearish state; a move to
// neutral is an internal release only, and persistence never refires.
// Returning from a gap in the SAME direction does not refire;
// returning in a DIFFERENT direction fires as an initial observation
// at that bar (no transition during the gap is asserted). A direct
// flip fires. No reset at day / lunch boundaries (continuous).
// Events are confirmed only — confirmation that the three conditions
// hold, not of any profit. Periods are 5-minute bar counts (project's
// own application); the firing / gap rules are project conventions.
registerRule(defRule('ichimoku-three-roles', {
  id: 'ichimoku-three-roles', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [];
    let prev = null, lastValid = -1;
    for (let t = 0; t < bars.length; t++) {
      const T = F.tenkan[t], K = F.kijun[t], C = bars[t].close, U = F.cloudTop[t], L = F.cloudBottom[t], D = F.chikouDiff[t];
      if (!bars[t].complete || T == null || K == null || U == null || L == null || D == null ||
          !Number.isFinite(T) || !Number.isFinite(K) || !Number.isFinite(C) || !Number.isFinite(U) || !Number.isFinite(L) || !Number.isFinite(D)) continue;
      let s = 'neutral';
      if (T > K && C > U && D > 0) s = 'bullish';
      else if (T < K && C < L && D < 0) s = 'bearish';
      const first = lastValid < 0, gap = !first && t - lastValid > 1;
      if ((s === 'bullish' || s === 'bearish') && s !== prev) {
        const bull = s === 'bullish';
        const cs = bull
          ? [critN('転換線 − 基準線 > 0', T - K, 0, true, 1, 1, true),
             critN('終値 − 雲上限 > 0', C - U, 0, true, 1, 1, true),
             critN('遅行差（終値 − 26本前終値）> 0', D, 0, true, 1, 1, true)]
          : [critN('基準線 − 転換線 > 0', K - T, 0, true, 1, 1, true),
             critN('雲下限 − 終値 > 0', L - C, 0, true, 1, 1, true),
             critN('−遅行差（26本前終値 − 終値）> 0', -D, 0, true, 1, 1, true)];
        const sc = scoreOf2(cs);
        const kindText = first
          ? 'この足が最初の有効な評価であり、過去に成立した時刻は不明（初観測）。'
          : gap
            ? '欠測区間を挟んだ初観測であり、欠測中の状態遷移は断定しない。'
            : `直前の有効状態（${prev === 'bullish' ? '三役好転' : prev === 'bearish' ? '三役逆転' : '中立'}）からの変化として検出した。`;
        ev.push(makeEvent(this, {
          state: 'confirmed', score: sc.score, coverage: sc.coverage,
          variant: bull ? 'bullish' : 'bearish',
          direction: bull ? 'bullish-traditional' : 'bearish-traditional',
          startIndex: t, endIndex: t, detectedIndex: t, criteria: cs,
          explanation: `一目三役${bull ? '好転' : '逆転'}の3条件が同一足で成立した（転換線 ${fmt(T)} ${bull ? '>' : '<'} 基準線 ${fmt(K)}、終値 ${fmt(C)} ${bull ? '>' : '<'} 雲${bull ? '上限' : '下限'} ${fmt(bull ? U : L)}、遅行差 ${fmt(D)} ${bull ? '>' : '<'} 0）。${kindText}3条件の成立確認であり収益の確認ではない。期間は5分足の本数として扱う独自適用。伝統的な解釈であり予測ではない。`,
        }));
      }
      prev = s; lastValid = t;
    }
    return ev;
  }
}));

const priceMaCrossRule = (id, key, startIdx, label, note) => defRule(id, {
  id, version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [];
    for (let i = startIdx; i < bars.length; i++) {
      if (!bars[i].complete) continue;

      const d0 = bars[i - 1].close - F[key][i - 1], d1 = bars[i].close - F[key][i];

      ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: hit > 0 ? 'up' : 'down', direction: hit > 0 ? 'bullish-traditional' : 'bearish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `終値が ${label} を${hit > 0 ? '上抜け' : '下抜け'}した。${note}伝統的な解釈であり予測ではない。` }));
    }
    return ev;
  }
});

registerRule(defRule('daily-ma-position', {

    }

}));

registerRule(defRule('pivot-touch', {

registerRule(crossRule('sma-cross-bullish', 'SMA5/20 強気クロス', true));

// 7/8. RSI14 threshold entries (with re-arm hysteresis)
// Stage 5-C-2: entry detection now runs on the shared RSI zone state machine
// below. The machine replicates the legacy loop semantics EXACTLY (re-arm
// check on the current value before the hit check; incomplete bars never
// consume an entry); compat-v07 verifies the produced events are deep-equal
// to the frozen v0.7 output. The machine also tracks zone occupancy and
// emits the exit transitions consumed by rsi-zone-exit.
function rsiZoneMachine(bars, F) {
  const R = F.rsi14;
  const sides = {};
  for (const oversold of [true, false]) {
    const enter = oversold ? 30 : 70, rearm = oversold ? 35 : 65;
    const entries = [], exits = [];
    let armed = true, inZone = null;
    for (let i = 1; i < bars.length; i++) {
      const r0 = R[i - 1], r1 = R[i];
      if (r0 == null || r1 == null) continue;
      if (inZone === null) inZone = oversold ? r0 < enter : r0 > enter;
      // entry side (legacy-exact)
      let skipEntry = false;
      if (!armed) { if (oversold ? r1 >= rearm : r1 <= rearm) armed = true; else skipEntry = true; }
      if (!skipEntry && bars[i].complete) {
        const hit = oversold ? (r0 >= enter && r1 < enter) : (r0 <= enter && r1 > enter);
        if (hit) { armed = false; entries.push({ index: i, r0, r1 }); }
      }
      // exit side (independent occupancy tracking; defs 0.7)
      if (!inZone) { if (oversold ? r1 < enter : r1 > enter) inZone = true; }
      else if (oversold ? r1 >= enter : r1 <= enter) {
        if (bars[i].complete) { exits.push({ index: i, r0, r1 }); inZone = false; }
      }
    }
    sides[oversold ? 'oversold' : 'overbought'] = { entries, exits };
  }
  return sides;
}

function rsiRule(id, name, oversold) {
  return {
    id, version: '0.1', name, category: 'oscillator', family: 'rsi', lookback: 15,
    parameters: oversold ? { enter: 30, rearm: 35 } : { enter: 70, rearm: 65 },
    evaluate(ctx) {
      const { bars, F } = ctx, ev = [], P = this.parameters;
      const { entries } = rsiZoneMachine(bars, F)[oversold ? 'oversold' : 'overbought'];
      for (const { index: i, r0, r1 } of entries) {
        const cs = [crit(oversold ? 'RSI14 が 30 未満へ進入' : 'RSI14 が 70 超へ進入', r1, P.enter, true, Math.min(1, Math.abs(r1 - P.enter) / 10 + 0.3), 2, true)];
        ev.push(makeEvent(this, { state: 'confirmed', score: scoreOf(cs), direction: oversold ? 'bullish-traditional' : 'bearish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `RSI14 が ${fmt(r0, 1)} → ${fmt(r1, 1)} と${oversold ? '30未満（売られすぎ圏）' : '70超（買われすぎ圏）'}へ進入。伝統的解釈であり予測ではない。再発火は RSI が ${P.rearm} に戻るまで抑止する。` }));
      }
      return ev;
    }
  };
}
registerRule(rsiRule('rsi-oversold', 'RSI14 売られすぎ進入', true));
registerRule(rsiRule('rsi-overbought', 'RSI14 買われすぎ進入', false));

// 9/10. Double top / double bottom (ZigZag pivots, default scale x2)
// Prior-trend definition (formalised): the first pivot must be the extreme close of the
// 20 bars up to and including itself (top: highest close; bottom: lowest close).
function doubleRule(id, name, top) {
  return {
    id, version: '0.1', name, category: 'pattern', family: 'double', lookback: 90,
    parameters: { zigzagScale: 2, proxAtr: 0.5, depthAtr: 1.5, minGap: 2, maxGap: 30, expireBars: 30, trendBars: 20 },
    evaluate(ctx) {
      const { bars, F } = ctx, P = this.parameters, ev = [];
      const zz = ctx.zigzags[P.zigzagScale];
      if (!zz) return ev;
      const piv = zz.pivots, closes = bars.map(b => b.close);
      const t1 = top ? 'high' : 'low', t2 = top ? 'low' : 'high';
      for (let s = 0; s + 2 < piv.length; s++) {
        const p1 = piv[s], mid = piv[s + 1], p2 = piv[s + 2];
        if (!(p1.type === t1 && mid.type === t2 && p2.type === t1)) continue;
        const atr2 = F.atr14[p2.index];
        if (atr2 == null || atr2 <= 0) continue;
        const prox = Math.abs(p2.price - p1.price), depth = top ? Math.min(p1.price, p2.price) - mid.price : mid.price - Math.max(p1.price, p2.price);
        const gap1 = mid.index - p1.index, gap2 = p2.index - mid.index;
        let trendPass = false;
        if (p1.index >= P.trendBars - 1) {
          let ext = top ? -Infinity : Infinity;
          for (let k = p1.index - P.trendBars + 1; k <= p1.index; k++) ext = top ? Math.max(ext, closes[k]) : Math.min(ext, closes[k]);
          trendPass = Math.abs(ext - p1.price) < 1e-9;
        }
        const cs = [crit('2極値の近似（差 ≤ ATR×0.5）', prox / atr2, P.proxAtr, prox <= P.proxAtr * atr2, 1 - Math.min(1, prox / atr2 / P.proxAtr) * 0.5, 30, true),
                    crit(top ? '谷の深さ ≥ ATR×1.5' : '山の高さ ≥ ATR×1.5', depth / atr2, P.depthAtr, depth >= P.depthAtr * atr2, Math.min(1, depth / atr2 / P.depthAtr), 25, true),
                    crit('転換点間隔 2〜30本', Math.max(gap1, gap2), P.maxGap, gap1 >= P.minGap && gap1 <= P.maxGap && gap2 >= P.minGap && gap2 <= P.maxGap, 1, 15, true),
                    crit(top ? '直前傾向：第1高値が直前20本の最高終値' : '直前傾向：第1安値が直前20本の最安終値', trendPass ? 1 : 0, 1, trendPass, trendPass ? 1 : 0, 10, false),
                    crit(top ? 'ネックライン終値下抜け' : 'ネックライン終値上抜け', null, mid.price, false, 0, 20, true)];
        const shapePass = cs[0].pass && cs[1].pass && cs[2].pass;
        if (!shapePass) continue;
        // scan forward from p2.confirmedIndex for neckline break / invalidation (causal)
        const neck = mid.price, limit = Math.min(bars.length - 1, p2.confirmedIndex + P.expireBars);
        let outcome = null;
        for (let j = p2.confirmedIndex + 1; j <= limit; j++) {
          if (top ? closes[j] > Math.max(p1.price, p2.price) : closes[j] < Math.min(p1.price, p2.price)) { outcome = { kind: 'expired', index: j }; break; }
          if (top ? closes[j] < neck : closes[j] > neck) { outcome = { kind: 'break', index: j }; break; }
        }
        const base = { direction: top ? 'bearish-traditional' : 'bullish-traditional', startIndex: p1.index, endIndex: p2.index, overlays: [{ type: 'neckline', price: neck, from: mid.index, to: outcome ? outcome.index : limit }, { type: 'pivots', points: [p1, mid, p2] }] };
        if (outcome && outcome.kind === 'break') {
          cs[4] = crit(cs[4].name, closes[outcome.index], neck, true, 1, 20, true);
          ev.push(makeEvent(this, { ...base, state: 'confirmed', score: scoreOf(cs), detectedIndex: outcome.index, criteria: cs, history: [{ state: 'forming', index: p2.confirmedIndex }, { state: 'confirmed', index: outcome.index }], explanation: `${name}が成立。第1${top ? '高値' : '安値'} ${fmt(p1.price)}円・第2${top ? '高値' : '安値'} ${fmt(p2.price)}円（差はATRの${fmt(prox / atr2, 2)}倍）、ネックライン ${fmt(neck)}円を終値で${top ? '下抜け' : '上抜け'}。` }));
        } else if (outcome && outcome.kind === 'expired') {
          ev.push(makeEvent(this, { ...base, state: 'expired', score: scoreOf(cs), detectedIndex: p2.confirmedIndex, criteria: cs, history: [{ state: 'forming', index: p2.confirmedIndex }, { state: 'expired', index: outcome.index }], explanation: `${name}の候補は形状破壊により失効した（成立には至らなかった）。` }));
        } else {
          ev.push(makeEvent(this, { ...base, state: 'forming', score: scoreOf(cs), detectedIndex: p2.confirmedIndex, criteria: cs, explanation: `${name}を形成中。2極値は確認済みで、ネックライン ${fmt(neck)}円の${top ? '下抜け' : '上抜け'}待ち（未成立）。` }));
        }
      }
      return ev;
    }
  };
}
registerRule(doubleRule('double-top', 'ダブルトップ', true));
registerRule(doubleRule('double-bottom', 'ダブルボトム', false));

// 11. Swing break (Dow) — Stage 5-D-1. Price-break reading of the catalog
// definition, fixed in defs 0.15: the watched levels are the most recent
// CONFIRMED swing high / swing low (waveform foundation, zigzagScale=2).
// A level is usable only on bars strictly AFTER its pivot's confirmedIndex
// (a pivot confirmed on bar t was not knowable before bar t's close, so it
// can never be "broken" on bar t itself). The first close strictly beyond
// the level fires once per pivot; equality is not a break; no tolerance.
// A newer same-kind pivot supersedes an unconsumed level silently.
// HH/HL/LH/LL pivot-structure relations are NOT events of this rule — they
// are observations on the foundation. Provisional pivots are never used.
// sessionPolicy=continuous: levels persist across lunch and day boundaries.
registerRule(defRule('swing-break', {
  id: 'swing-break', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, P = this.parameters, ev = [];
    const wf = ctx.waveforms[P.zigzagScale];
    if (!wf) return ev;
    const pivots = wf.pivots;
    let pi = 0, hi = null, lo = null; // live levels: { pivot, consumed }
    for (let t = 0; t < bars.length; t++) {
      while (pi < pivots.length && pivots[pi].confirmedIndex < t) {
        const p = pivots[pi++];
        if (p.kind === 'high') hi = { pivot: p, consumed: false };
        else lo = { pivot: p, consumed: false };
      }
      if (!bars[t].complete) continue;
      const c = bars[t].close;
      const live = (hi && !hi.consumed && c > hi.pivot.price) ? { L: hi, up: true }
        : (lo && !lo.consumed && c < lo.pivot.price) ? { L: lo, up: false } : null;
      if (!live) continue;
      live.L.consumed = true;
      const p = live.L.pivot, level = p.price;
      const beyond = live.up ? c - level : level - c;
      const cs = [critN(`終値が直近の確定スイング${live.up ? '高値' : '安値'}を${live.up ? '上抜け' : '下抜け'}`, beyond, 0, true, Math.min(1, beyond / (F.atr14[t] || 1) + 0.3), 2, true)];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, {
        state: 'confirmed', score: sc.score, coverage: sc.coverage,
        variant: live.up ? 'up' : 'down',
        direction: live.up ? 'bullish-traditional' : 'bearish-traditional',
        startIndex: p.pivotIndex, endIndex: t, detectedIndex: t, criteria: cs,
        overlays: [
          { type: 'swing-level', price: level, from: p.pivotIndex, to: t },
          { type: 'pivots', points: [{ index: p.pivotIndex, price: level, type: p.kind }] },
        ],
        explanation: `終値 ${fmt(c)} が、${p.confirmedIndex} 本目で確定したスイング${live.up ? '高値' : '安値'} ${fmt(level)}（${p.pivotIndex} 本目）を${live.up ? '上抜け' : '下抜け'}した。ダウ理論のスイングブレイクの操作化であり、伝統的な解釈であって予測ではない。`,
      }));
    }
    return ev;
  }
}));

// 12. Fibonacci retracement touch (Stage 5-D-1 follow-up, defs 0.16).
// Only the NEWEST completed swing (both endpoint pivots confirmed, waveform
// foundation, zigzagScale=2) is watched. Levels are B - r*(B - A) for
// r in {0.382, 0.5, 0.618} (0.5 is the conventional 50% retracement, NOT a
// Fibonacci ratio). A level is usable only on bars strictly AFTER the swing
// end pivot's confirmedIndex; touches on or before the confirmation bar
// never fire (no retroactive events). A touch is the bar's [low, high]
// range including the level (equality included) and is an OBSERVATION of
// possible contact (the pivot-touch state contract): intrabar order,
// execution and reversal success are NOT asserted, and no reversal
// confirmation event exists in this rule. At most one fire per
// (swing, ratio); a newer completed swing retires the old swing's unfired
// levels. Multiple levels touched on one bar fire in parallel, unordered.
// sessionPolicy=continuous: day-crossing swings are watched and their
// crossing attributes are recorded. Provisional pivots are never used.
registerRule(defRule('fib-retracement', {
  id: 'fib-retracement', version: '0.1',
  evaluate(ctx) {
    const { bars } = ctx, P = this.parameters, ev = [];
    const wf = ctx.waveforms[P.zigzagScale];
    if (!wf) return ev;
    const swings = wf.swings;
    let si = 0, active = null, fired = new Set();
    for (let t = 0; t < bars.length; t++) {
      while (si < swings.length && swings[si].confirmedIndex < t) { active = swings[si++]; fired = new Set(); }
      if (!active || !bars[t].complete) continue;
      const A = active.from, B = active.to, range = B.price - A.price;
      for (const r of P.levels) {
        if (fired.has(r)) continue;
        const level = B.price - r * range;
        const bar = bars[t];
        if (!(bar.low <= level && level <= bar.high)) continue;
        fired.add(r);
        const up = active.direction === 'up';
        const cs = [critN(`当足の高安が ${r === 0.5 ? '50%戻し' : `${r * 100}%`}水準を含む`, level, bar.close, true, 1, 2, true)];
        const sc = scoreOf2(cs);
        ev.push(makeEvent(this, {
          state: 'observation', score: sc.score, coverage: sc.coverage,
          variant: String(r),
          direction: up ? 'bullish-traditional' : 'bearish-traditional',
          startIndex: A.pivotIndex, endIndex: t, detectedIndex: t, criteria: cs,
          overlays: [
            { type: 'swing-level', price: level, from: B.pivotIndex, to: t },
            { type: 'pivots', points: [{ index: A.pivotIndex, price: A.price, type: A.kind }, { index: B.pivotIndex, price: B.price, type: B.kind }] },
          ],
          explanation: `確定スイング（${A.pivotIndex} 本目の ${fmt(A.price)} から ${B.pivotIndex} 本目の ${fmt(B.price)}、${B.confirmedIndex} 本目で完成）の ${r === 0.5 ? '50%戻し（慣用的な水準で、フィボナッチ比率ではない）' : `${r * 100}%戻し`}水準 ${fmt(level)} に、当足の高安が接触した${active.crossesDay ? '（日跨ぎのスイング）' : ''}。接触した可能性の観察であり、足内の順序・反転の成否は推定しない。予測ではない。`,
        }));
      }
    }
    return ev;
  }
}));

// 13/14. Triple top / triple bottom (Stage 5-D-2 batch 1, defs 0.17).
// Skeleton: five alternating CONFIRMED pivots from the waveform foundation
// (zigzagScale=2). Family semantics follow the doubles: proximity and depth
// are measured on ONE common scale (ATR14 at the final peak's pivot bar),
// the prior trend is a scored (non-mandatory) criterion, completion is a
// strict CLOSE break, and invalidation (close beyond the extreme peak) is
// checked before the break on each watch bar. Differences from the doubles,
// fixed by the 5-D-2 spec: the neckline is the horizontal line through the
// FARTHER of the two valleys/peaks (a sloped line is not used), and a
// candidate whose watch window elapses unresolved is recorded as expired
// (time expiry), not left as forming. A centre-dominant shape (the H&S
// region) fails the three-peak spread test by construction, so the two
// families partition the shapes. Provisional pivots are never used.
function tripleRule(id, top) {
  return defRule(id, {
    id, version: '0.1',
    evaluate(ctx) {
      const { bars, F } = ctx, P = this.parameters, ev = [];
      const wf = ctx.waveforms[P.zigzagScale];
      if (!wf) return ev;
      const piv = wf.pivots, closes = bars.map(b => b.close);
      const t1 = top ? 'high' : 'low', name = this.name;
      for (let s = 0; s + 4 < piv.length; s++) {
        const q = piv.slice(s, s + 5);
        if (!(q[0].kind === t1 && q[2].kind === t1 && q[4].kind === t1 && q[1].kind !== t1 && q[3].kind !== t1)) continue;
        const [p1, v1, p2, v2, p3] = q;
        const atrRef = F.atr14[p3.pivotIndex];
        if (atrRef == null || atrRef <= 0) continue;
        const peaks = [p1.price, p2.price, p3.price];
        const spread = Math.max(...peaks) - Math.min(...peaks);
        const d1 = top ? Math.min(p1.price, p2.price) - v1.price : v1.price - Math.max(p1.price, p2.price);
        const d2 = top ? Math.min(p2.price, p3.price) - v2.price : v2.price - Math.max(p2.price, p3.price);
        const depth = Math.min(d1, d2);
        const gaps = [v1.pivotIndex - p1.pivotIndex, p2.pivotIndex - v1.pivotIndex, v2.pivotIndex - p2.pivotIndex, p3.pivotIndex - v2.pivotIndex];
        let trendPass = false;
        if (p1.pivotIndex >= P.trendBars - 1) {
          let ext = top ? -Infinity : Infinity;
          for (let k = p1.pivotIndex - P.trendBars + 1; k <= p1.pivotIndex; k++) ext = top ? Math.max(ext, closes[k]) : Math.min(ext, closes[k]);
          trendPass = Math.abs(ext - p1.price) < 1e-9;
        }
        const cs = [crit('3峰の近接（最大最小差 ≤ ATR×0.5）', spread / atrRef, P.proxAtr, spread <= P.proxAtr * atrRef, 1 - Math.min(1, spread / atrRef / P.proxAtr) * 0.5, 30, true),

                      crit('転換点間隔 2〜30本', Math.max(...gaps), P.maxGap, gaps.every(g => g >= P.minGap && g <= P.maxGap), 1, 15, true),

                      crit(top ? 'ネックライン終値下抜け' : 'ネックライン終値上抜け', null, top ? Math.min(v1.price, v2.price) : Math.max(v1.price, v2.price), false, 0, 20, true)];
        if (!(cs[0].pass && cs[1].pass && cs[2].pass)) continue;

        if (!outcome && bars.length - 1 > born + P.expireBars) outcome = { kind: 'expired', index: born + P.expireBars, why: 'timeout' };

        } else if (outcome && outcome.kind === 'expired') {

// 15. Head and shoulders / inverse (Stage 5-D-2 batch 2, defs 0.18).
// ONE rule, variants 'top' (三尊) and 'bottom' (逆三尊). Skeleton: five
// alternating CONFIRMED pivots from the waveform foundation (zigzagScale=2).
// The head must exceed the HIGHER shoulder by strictly more than
// headAtr x ATRref (equality is not dominance) and the shoulders must lie
// within shoulderProxAtr x ATRref of each other. The band is the same
// 0.5 ATR band as the triples' three-peak proximity, so the families
// partition the three-peak shapes: a skeleton cannot satisfy both, and
// shapes with far-apart shoulders and a weakly dominant head satisfy
// neither. ATRref is ATR14 at the final pivot's bar (the triples/doubles
// common-scale convention). Neckline, close-break completion, watch
// window, invalidation (close beyond the head) and the time-expiry state
// convention follow the triple rules. Provisional pivots are never used.
registerRule(defRule('head-and-shoulders', {
  id: 'head-and-shoulders', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, P = this.parameters, ev = [];
    const wf = ctx.waveforms[P.zigzagScale];
    if (!wf) return ev;
    const piv = wf.pivots, closes = bars.map(b => b.close);
    for (let s = 0; s + 4 < piv.length; s++) {
      const q = piv.slice(s, s + 5);
      const top = q[0].kind === 'high';
      if (!(q[2].kind === q[0].kind && q[4].kind === q[0].kind && q[1].kind !== q[0].kind && q[3].kind !== q[0].kind)) continue;
      const [ls, v1, hd, v2, rs] = q;
      const atrRef = F.atr14[rs.pivotIndex];
      if (atrRef == null || atrRef <= 0) continue;
      const dom = top ? hd.price - Math.max(ls.price, rs.price) : Math.min(ls.price, rs.price) - hd.price;
      const shDiff = Math.abs(ls.price - rs.price);
      const d1 = top ? Math.min(ls.price, hd.price) - v1.price : v1.price - Math.max(ls.price, hd.price);
      const d2 = top ? Math.min(hd.price, rs.price) - v2.price : v2.price - Math.max(hd.price, rs.price);
      const depth = Math.min(d1, d2);
      const gaps = [v1.pivotIndex - ls.pivotIndex, hd.pivotIndex - v1.pivotIndex, v2.pivotIndex - hd.pivotIndex, rs.pivotIndex - v2.pivotIndex];
      let trendPass = false;
      if (ls.pivotIndex >= P.trendBars - 1) {
        let ext = top ? -Infinity : Infinity;
        for (let k = ls.pivotIndex - P.trendBars + 1; k <= ls.pivotIndex; k++) ext = top ? Math.max(ext, closes[k]) : Math.min(ext, closes[k]);
        trendPass = Math.abs(ext - ls.price) < 1e-9;
      }
      const neck = top ? Math.min(v1.price, v2.price) : Math.max(v1.price, v2.price);
      const cs = [crit('頭の優位（高い方の肩より ATR×0.5 超）', dom / atrRef, P.headAtr, dom > P.headAtr * atrRef, Math.min(1, dom / atrRef / P.headAtr), 25, true),
                    crit('肩の近接（左右差 ≤ ATR×0.5）', shDiff / atrRef, P.shoulderProxAtr, shDiff <= P.shoulderProxAtr * atrRef, 1 - Math.min(1, shDiff / atrRef / P.shoulderProxAtr) * 0.5, 20, true),
                    crit(top ? '2谷の深さ（浅い方） ≥ ATR×1.5' : '2山の高さ（浅い方） ≥ ATR×1.5', depth / atrRef, P.depthAtr, depth >= P.depthAtr * atrRef, Math.min(1, depth / atrRef / P.depthAtr), 20, true),
                    crit('転換点間隔 2〜30本', Math.max(...gaps), P.maxGap, gaps.every(g => g >= P.minGap && g <= P.maxGap), 1, 10, true),
                    crit(top ? '直前傾向：左肩が直前20本の最高終値' : '直前傾向：左底が直前20本の最安終値', trendPass ? 1 : 0, 1, trendPass, trendPass ? 1 : 0, 5, false),
                    crit(top ? 'ネックライン終値下抜け' : 'ネックライン終値上抜け', null, neck, false, 0, 20, true)];
      if (!(cs[0].pass && cs[1].pass && cs[2].pass && cs[3].pass)) continue;
      const born = rs.confirmedIndex, limit = Math.min(bars.length - 1, born + P.expireBars);
      let outcome = null;
      for (let j = born + 1; j <= limit; j++) {
        if (top ? closes[j] > hd.price : closes[j] < hd.price) { outcome = { kind: 'expired', index: j, why: 'destroyed' }; break; }
        if (top ? closes[j] < neck : closes[j] > neck) { outcome = { kind: 'break', index: j }; break; }
      }
      if (!outcome && bars.length - 1 > born + P.expireBars) outcome = { kind: 'expired', index: born + P.expireBars, why: 'timeout' };
      const nm = top ? '三尊' : '逆三尊';
      const base = { variant: top ? 'top' : 'bottom', direction: top ? 'bearish-traditional' : 'bullish-traditional', startIndex: ls.pivotIndex, endIndex: rs.pivotIndex, overlays: [{ type: 'neckline', price: neck, from: v1.pivotIndex, to: outcome ? outcome.index : limit }, { type: 'pivots', points: q.map(p => ({ index: p.pivotIndex, price: p.price, type: p.kind })) }] };
      if (outcome && outcome.kind === 'break') {

        ev.push(makeEvent(this, { ...base, state: 'confirmed', score: scoreOf(cs), detectedIndex: outcome.index, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'confirmed', index: outcome.index }], explanation: `${nm}が成立。左${top ? '肩' : '底'} ${fmt(ls.price)}円・頭 ${fmt(hd.price)}円・右${top ? '肩' : '底'} ${fmt(rs.price)}円（頭は${top ? '高い' : '低い'}方の${top ? '肩' : '底'}よりATRの${fmt(dom / atrRef, 2)}倍${top ? '高い' : '低い'}）、ネックライン ${fmt(neck)}円を終値で${top ? '下抜け' : '上抜け'}。形状の一致は予測を意味しない。` }));
      } else if (outcome && outcome.kind === 'expired') {
        ev.push(makeEvent(this, { ...base, state: 'expired', score: scoreOf(cs), detectedIndex: born, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'expired', index: outcome.index }], explanation: outcome.why === 'destroyed' ? `${nm}の候補は形状破壊により失効した（成立には至らなかった）。` : `${nm}の候補は監視窓（${P.expireBars}本）内に成立せず期限切れで失効した。` }));
      } else {
        ev.push(makeEvent(this, { ...base, state: 'forming', score: scoreOf(cs), detectedIndex: born, criteria: cs, explanation: `${nm}を形成中。5ピボットは確認済みで、ネックライン ${fmt(neck)}円の${top ? '下抜け' : '上抜け'}待ち（未成立）。` }));
      }
    }

  }
