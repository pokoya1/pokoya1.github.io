// Synthetic market, v0.1. Time unit: trading year.
function generate(seed=1, options={}) {
  const c={base:null, regimes:true, season:true, jumps:true, volume:true,
    lambda:1, jumpSD:.008, history:500, ...options};
  if(!Number.isInteger(c.history)||c.history<0||c.history>5000||
    !Number.isFinite(c.lambda)||c.lambda<0||c.lambda>100||
    !Number.isFinite(c.jumpSD)||c.jumpSD<0||c.jumpSD>.2||
    (c.base!==null&&(!Number.isFinite(c.base)||c.base<0||c.base>3))) throw Error('Invalid settings');
  function rng(s){return ()=>{s=(s+0x6D2B79F5)|0;let t=s;
    t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)+.5;};}
  const stream=k=>{const r=rng((Number(seed)^k)|0);return ()=>r()/4294967296};
  const p=stream(11), v=stream(29), j=stream(47), w=stream(71);
  const normal=u=>Math.sqrt(-2*Math.log(u()))*Math.cos(2*Math.PI*u());
  const dt=1/(252*3960), h=c.lambda/3960;
  const kappa=Math.expm1(c.jumpSD*c.jumpSD/2);
  const days=Math.ceil(c.history/66)+1, bars=[];
  let S=10000;
  for(let d=0;d<days;d++){
    const base=c.base??(.2+.6*v()); let state=1;
    for(let b=0;b<66;b++){
      const day=d-days+1, minute=b<30?540+5*b:750+5*(b-30);
      let O=S,H=S,L=S,V=0,variance=0,jumps=0;
      for(let t=0;t<60;t++){
        if(c.regimes&&v()<1-Math.exp(-5/1800)){
          state=(state+(v()<.5?1:2))%3;
        }
        const x=(b*60+t)/3960;
        const f=c.season?(.75+.65*Math.exp(-x/.065)+.5*Math.exp(-(1-x)/.065)+.25*Math.exp(-Math.abs(x-30/66)/.025)):1;
        const sigma=base*f*(c.regimes?[.5,1,2.5][state]:1);
        let r=-.5*sigma*sigma*dt+sigma*Math.sqrt(dt)*normal(p);
        if(c.jumps){let n=0,prod=j(),limit=Math.exp(-h);
          while(prod>limit){n++;prod*=j();}
          r+=-h*kappa;for(let a=0;a<n;a++)r+=c.jumpSD*normal(j);jumps+=n;
        }
        S*=Math.exp(r); H=Math.max(H,S);L=Math.min(L,S);
        variance+=sigma*sigma*dt;
        if(c.volume)V+=Math.round(100*f*(1+Math.min(10,Math.abs(r)/.001))*Math.exp(.3*normal(w)-.045));
      }
      bars.push({day,minute,open:O,high:H,low:L,close:S,volume:V,
        variance,jumps,complete:true});
    }
  }
  return {seed,config:c,bars:bars.slice(-(c.history+66))};
}

// ---------- Stage 2: causal ZigZag on closes ----------
// A pivot is confirmed only when the close has reversed from the candidate extreme
// by >= k * ATR. Two ATR reference modes (v0.2), both fully causal:
//  - 'current' (default, v0.1 definition): ATR14 of the bar where the reversal is
//    tested. Note: a pure ATR decline can shrink the threshold and confirm a pivot
//    with little price movement (documented artefact; see test-detector).
//  - 'pivot': ATR14 frozen at the bar where the standing candidate extreme was set;
//    the frozen value updates ONLY when the candidate extreme updates. If the
//    candidate was set before ATR14 existed (first 13 bars), the frozen value is
//    adopted at the first bar where ATR14 becomes available while that candidate
//    stands (initial-adoption rule). Equal prices never update a candidate
//    (strict > / <), in both modes and both directions.
// Scales k = 1/2/3 are computed independently. Missing ATR (null or 0) blocks
// confirmation in both modes. Initial direction is 'undetermined' until the
// first pivot confirms.
// Returns { pivots: [{index, price, type:'high'|'low', confirmedIndex}], candidate: {index, price, type} | null }
function zigzag(bars, F, k, atrMode = 'current') {
  const closes = bars.map(b => b.close);
  const pivots = [];
  let mode = 'undetermined'; // 'seekHigh' | 'seekLow'
  let candHigh = { index: 0, price: closes[0], atr: null }, candLow = { index: 0, price: closes[0], atr: null };
  let candidate = null;
  const thr = (cand, atrNow) => {
    if (atrMode === 'pivot') {
      if (cand.atr == null && atrNow != null) cand.atr = atrNow; // initial adoption
      return cand.atr != null && cand.atr > 0 ? k * cand.atr : null;
    }
    return atrNow != null && atrNow > 0 ? k * atrNow : null;
  };
  const pub = cand => ({ index: cand.index, price: cand.price });
  for (let i = 0; i < bars.length; i++) {
    const c = closes[i], atr = F.atr14[i];
    if (mode === 'undetermined') {
      if (c > candHigh.price) candHigh = { index: i, price: c, atr };
      if (c < candLow.price) candLow = { index: i, price: c, atr };
      const tL = thr(candLow, atr), tH = thr(candHigh, atr);
      if (tL != null && c >= candLow.price + tL) { pivots.push({ ...pub(candLow), type: 'low', confirmedIndex: i }); mode = 'seekHigh'; candHigh = { index: i, price: c, atr }; }
      else if (tH != null && c <= candHigh.price - tH) { pivots.push({ ...pub(candHigh), type: 'high', confirmedIndex: i }); mode = 'seekLow'; candLow = { index: i, price: c, atr }; }
    } else if (mode === 'seekHigh') {
      if (c > candHigh.price) candHigh = { index: i, price: c, atr };
      candidate = { ...pub(candHigh), type: 'high' };
      const t = thr(candHigh, atr);
      if (t != null && c <= candHigh.price - t) { pivots.push({ ...pub(candHigh), type: 'high', confirmedIndex: i }); mode = 'seekLow'; candLow = { index: i, price: c, atr }; candidate = null; }
    } else {
      if (c < candLow.price) candLow = { index: i, price: c, atr };
      candidate = { ...pub(candLow), type: 'low' };
      const t = thr(candLow, atr);
      if (t != null && c >= candLow.price + t) { pivots.push({ ...pub(candLow), type: 'low', confirmedIndex: i }); mode = 'seekHigh'; candHigh = { index: i, price: c, atr }; candidate = null; }
    }
  }
  if (mode === 'seekHigh') candidate = { ...pub(candHigh), type: 'high' };
  if (mode === 'seekLow') candidate = { ...pub(candLow), type: 'low' };
  return { pivots, candidate };
}

// ---------- Stage 5-D-0: waveform foundation (read-only Pivot/Swing derivation) ----------
// A read-only derivation layer over the EXISTING zigzag() output (project doc
// section 23). It never recomputes, reorders or re-times pivots: the confirmed
// pivot sequence is referenced exactly as zigzag() produced it, and no rule,
// event or existing output changes. New pattern rules (5-D-1 onward) build
// their skeletons from these confirmed pivots only.
//
// Pivot: { pivotIndex, confirmedIndex, kind: 'high'|'low', price, atrMode,
//          scale, key }
//   - pivotIndex is the bar of the extreme; confirmedIndex is the bar where
//     the reversal confirmed it. Both are bar indexes (never timestamps).
//   - Identity: within one run (one bar series, one atrMode, one scale),
//     pivotIndex alone is unique — pivot indexes are strictly increasing and
//     each bar appears at most once (verified by test-waveform-5d0). `key`
//     ('<atrMode>:<scale>:<pivotIndex>') is the cross-run unique form.
// Swing: { from, to, direction: 'up'|'down', height, heightAtr, barsSpan,
//          confirmedIndex, crossesSession, crossesDay }
//   - from/to reference the foundation's own Pivot objects (consecutive pair).
//   - height is signed (to.price - from.price); direction follows its sign.
//   - heightAtr = |height| / ATR14 at the END pivot's confirmedIndex (the
//     volatility scale in force when the swing became known); null when that
//     ATR is missing or zero (the codebase-wide null = unavailable rule).
//   - barsSpan counts BARS (to.pivotIndex - from.pivotIndex), never elapsed
//     time: the lunch break and overnight gaps are not uniform time steps.
//   - crossesSession: the span crosses the lunch break within one day
//     (from.minute <= 685 and to.minute >= 750 on the same day).
//     crossesDay: the two pivots sit on different days. Both are null when
//     the bars carry no day/minute fields (unavailable, not false).
//   - confirmedIndex is the end pivot's confirmedIndex: a swing is knowable
//     only from that bar on, which keeps every derivation causal.
// provisional: { fromPivot, candidate: { pivotIndex, kind, price } } | null
//   - The still-unconfirmed standing extreme, exposed ONLY as a reserved
//     interface for a future preview (decision 5-D①A). It is unstable — its
//     index/price move as new extremes print — and MUST NOT be used for
//     event identity, forming events, history or statistics. No rule reads
//     it in this stage.
function buildWaveformFoundation(bars, F, zigzagResult, scale, atrMode) {
  const pivots = zigzagResult.pivots.map(p => ({
    pivotIndex: p.index,
    confirmedIndex: p.confirmedIndex,
    kind: p.type,
    price: p.price,
    atrMode,
    scale,
    key: `${atrMode}:${scale}:${p.index}`,
  }));
  const swings = [];
  for (let i = 0; i + 1 < pivots.length; i++) {
    const from = pivots[i], to = pivots[i + 1];
    const height = to.price - from.price;
    const atrRef = F.atr14[to.confirmedIndex];
    const fb = bars[from.pivotIndex], tb = bars[to.pivotIndex];
    const hasCal = fb && tb && fb.day != null && tb.day != null && fb.minute != null && tb.minute != null;
    swings.push({
      from, to,
      direction: height > 0 ? 'up' : 'down',
      height,
      heightAtr: atrRef != null && atrRef > 0 ? Math.abs(height) / atrRef : null,
      barsSpan: to.pivotIndex - from.pivotIndex,
      confirmedIndex: to.confirmedIndex,
      crossesSession: hasCal ? (fb.day === tb.day && fb.minute <= 685 && tb.minute >= 750) : null,
      crossesDay: hasCal ? (fb.day !== tb.day) : null,

    fromPivot: pivots[pivots.length - 1],

// ---------- Stage 3: rule registry & evaluation ----------
// A rule is an independent module: { id, version, name, category, family, lookback,
// parameters, evaluate(ctx) -> events[] }. ctx = { bars, F, zigzags: {1,2,3} }.
// Events: { eventId, ruleId, ruleVersion, state, score, direction, startIndex, endIndex,
// detectedIndex, criteria: [{name, measured, threshold, pass, match, weight, mandatory}],
// missingCriteria: [names], overlays: [], explanation, history: [{state, index}] }

}

// scoreOf2 renormalizes the score over evaluable criteria and reports coverage.
function critN(name, measured, threshold, pass, match, weight, mandatory) {

}
// Deterministic event id (Stage 5-E-7, proposal A): the base format

const fmt = (x, d = 2) => x == null ? '—' : (+x).toFixed(d);

// 1. Doji
registerRule(defRule('doji', {

    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete || !bars[i - 1].complete) continue;
      const p = bars[i - 1], c = bars[i];
      if (!(F.dir[i - 1] < 0 && F.dir[i] > 0)) continue;
      const prevBodyTop = p.open, prevBodyBot = p.close, prevBody = prevBodyTop - prevBodyBot;
      if (prevBody <= 0) continue;
      const coverTop = c.close - prevBodyTop, coverBot = prevBodyBot - c.open;
      const coverRatio = Math.min(c.close, prevBodyTop) - Math.max(c.open, prevBodyBot);
      const full = coverTop >= 0 && coverBot >= 0;
      const cs = [crit('前足が陰線', F.dir[i - 1], -1, true, 1, 1, true),
                  crit('当足が陽線', F.dir[i], 1, true, 1, 1, true),
                  crit('実体が前実体を包含', Math.min(coverTop, coverBot), 0, full, full ? 1 : Math.max(0, coverRatio / prevBody), 3, true)];
      if (full) ev.push(makeEvent(this, { state: 'confirmed', score: scoreOf(cs), direction: 'bullish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs, explanation: `陽線の実体（${fmt(c.open)}〜${fmt(c.close)}円）が前陰線の実体（${fmt(prevBodyBot)}〜${fmt(prevBodyTop)}円）を包含し、強気包み足が成立。` }));
      else if (coverRatio / prevBody >= P.approxCoverRatio) ev.push(makeEvent(this, { state: 'approximate', score: scoreOf(cs), direction: 'bullish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs, explanation: `実体の被覆率は${fmt(coverRatio / prevBody * 100, 0)}%で完全包含に届かず近似。` }));
    }
    return ev;
  }
}));

// Engulfing / RSI confluence (Stage 5-E-5; method F). The engulfing
// judgment is re-derived from OHLC with EXACTLY the confirmed
// mandatory conditions of bullish-engulfing / bearish-engulfing
// (both bars completed, opposite directions, the current body fully
// covering the previous body with equality allowed; approximate is
// excluded), combined with the SAME bar's RSI zone state (bullish:
// RSI14 < 30; bearish: RSI14 > 70). No zone-entry event and no
// multi-bar window. Independent of the sub-rules' outputs and ON/OFF.
registerRule(defRule('engulfing-confluence', {
  id: 'engulfing-confluence', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [];
    for (let t = 1; t < bars.length; t++) {
      const p = bars[t - 1], c = bars[t];
      if (!p.complete || !c.complete) continue;
      const R = F.rsi14[t];
      if (R == null || !Number.isFinite(R)) continue;
      const bullEng = p.close < p.open && c.close > c.open && c.close >= p.open && c.open <= p.close;
      const bearEng = p.close > p.open && c.close < c.open && c.open >= p.close && c.close <= p.open;
      if (bullEng && R < 30) {
        const cs = [critN('前足が陰線（始値 − 終値）', p.open - p.close, 0, true, 1, 1, true),
                    critN('当足が陽線（終値 − 始値）', c.close - c.open, 0, true, 1, 1, true),
                    critN('包含・終値側（当足終値 − 前足始値）>= 0', c.close - p.open, 0, true, 1, 1, true),
                    critN('包含・始値側（前足終値 − 当足始値）>= 0', p.close - c.open, 0, true, 1, 1, true),
                    critN('30 − RSI14 > 0（同足の圏域状態）', 30 - R, 0, true, 1, 1, true)];
        const sc = scoreOf2(cs);
        ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: 'bullish', direction: 'bullish-traditional', startIndex: t - 1, endIndex: t, detectedIndex: t, criteria: cs, explanation: `強気包み足（陽線の実体 ${fmt(c.open)}〜${fmt(c.close)} が前陰線の実体 ${fmt(p.close)}〜${fmt(p.open)} を完全包含）が、RSI14 ${fmt(R, 1)} の売られすぎ圏（<30）と同一足で合流した。包み足判定は既存 bullish-engulfing の confirmed 必須条件と同一で、approximate は含まない。OHLCからの再導出であり、下位ルールの出力には依存しない。伝統的な解釈であり予測ではない。` }));
      } else if (bearEng && R > 70) {
        const cs = [critN('前足が陽線（終値 − 始値）', p.close - p.open, 0, true, 1, 1, true),
                    critN('当足が陰線（始値 − 終値）', c.open - c.close, 0, true, 1, 1, true),
                    critN('包含・始値側（当足始値 − 前足終値）>= 0', c.open - p.close, 0, true, 1, 1, true),
                    critN('包含・終値側（前足始値 − 当足終値）>= 0', p.open - c.close, 0, true, 1, 1, true),
                    critN('RSI14 − 70 > 0（同足の圏域状態）', R - 70, 0, true, 1, 1, true)];
        const sc = scoreOf2(cs);
        ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: 'bearish', direction: 'bearish-traditional', startIndex: t - 1, endIndex: t, detectedIndex: t, criteria: cs, explanation: `弱気包み足（陰線の実体 ${fmt(c.close)}〜${fmt(c.open)} が前陽線の実体 ${fmt(p.open)}〜${fmt(p.close)} を完全包含）が、RSI14 ${fmt(R, 1)} の買われすぎ圏（>70）と同一足で合流した。包み足判定は既存 bearish-engulfing の confirmed 必須条件と同一で、approximate は含まない。OHLCからの再導出であり、下位ルールの出力には依存しない。伝統的な解釈であり予測ではない。` }));
      }
    }
    return ev;
  }
}));

// 4. Red three soldiers (three white soldiers)
registerRule(defRule('three-soldiers', {
  id: 'three-soldiers', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 2; i < bars.length; i++) {
      const idx = [i - 2, i - 1, i];
      if (!idx.every(j => bars[j].complete && F.dir[j] > 0 && F.range[j] > 0)) continue;
      if (!(bars[i - 1].close > bars[i - 2].close && bars[i].close > bars[i - 1].close)) continue;
      const openInPrevBody = j => bars[j].open >= Math.min(bars[j - 1].open, bars[j - 1].close) && bars[j].open <= Math.max(bars[j - 1].open, bars[j - 1].close);
      if (!(openInPrevBody(i - 1) && openInPrevBody(i))) continue;
      const brOK = idx.every(j => F.bodyRatio[j] >= P.bodyRatioMin), upOK = idx.every(j => F.upper[j] / F.range[j] <= P.upperRatioMax);
      // preceding context (scored, not mandatory): downtrend/flat before the pattern
      let contextPass = null, slopePrev = null;
      if (i - 2 - P.contextBars >= 0) {
        const j0 = i - 2 - P.contextBars, j1 = i - 3;
        let sx = 0, sy = 0, sxy = 0, sxx = 0; const p = j1 - j0 + 1;
        for (let k = 0; k < p; k++) { const x = k, y = bars[j0 + k].close; sx += x; sy += y; sxy += x * y; sxx += x * x; }
        slopePrev = (p * sxy - sx * sy) / (p * sxx - sx * sx);
        contextPass = slopePrev <= 0;
      }
      const cs = [crit('3陽線・終値上昇・始値が直前実体内', 1, 1, true, 1, 2, true),
                  crit('各実体/値幅 ≥ 0.5', Math.min(...idx.map(j => F.bodyRatio[j])), P.bodyRatioMin, brOK, Math.min(...idx.map(j => F.bodyRatio[j])), 2, true),
                  crit('各上ヒゲ/値幅 ≤ 0.25', Math.max(...idx.map(j => F.upper[j] / F.range[j])), P.upperRatioMax, upOK, 1 - Math.max(...idx.map(j => F.upper[j] / F.range[j])), 1, true),
                  crit('前方の下落文脈（10本回帰傾き ≤ 0）', slopePrev, 0, contextPass === true, contextPass == null ? null : (contextPass ? 1 : 0), 1, false)];
      const shapeOK = brOK && upOK;
      if (shapeOK && contextPass === true) ev.push(makeEvent(this, { coverage: contextPass == null ? 5 / 6 : 1, state: 'confirmed', score: scoreOf(cs), direction: 'bullish-traditional', startIndex: i - 2, endIndex: i, detectedIndex: i, criteria: cs, explanation: `3本連続陽線で終値が上昇し、前方の下落文脈も確認でき、赤三兵が成立。` }));
      else if (shapeOK) ev.push(makeEvent(this, { coverage: contextPass == null ? 5 / 6 : 1, state: 'approximate', score: scoreOf(cs), direction: 'bullish-traditional', startIndex: i - 2, endIndex: i, detectedIndex: i, criteria: cs, explanation: `形状は赤三兵だが、前方の下落文脈が${contextPass == null ? '判定不能（データ不足）' : '確認できない'}ため近似とする。` }));
    }
    return ev;
  }
}));


// 4b. Long upper shadow (v0.3, JSON-driven; mirror of long-lower-shadow)
registerRule(defRule('long-upper-shadow', {
  id: 'long-upper-shadow', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 0; i < bars.length; i++) {
      if (!bars[i].complete || F.range[i] <= 0) continue;
      const up = F.upper[i], bo = F.body[i], ra = F.range[i];
      const ratioBody = bo > 0 ? up / bo : (up > 0 ? Infinity : 0), ratioRange = up / ra;
      const cs = [critN('上ヒゲ ≥ 実体×2', ratioBody === Infinity ? 99 : ratioBody, P.upperVsBody, ratioBody >= P.upperVsBody, Math.min(1, ratioBody / 3), 2, true),
                  critN('上ヒゲ ≥ 値幅×0.6', ratioRange, P.upperVsRange, ratioRange >= P.upperVsRange, ratioRange, 2, true)];
      const sc = scoreOf2(cs);
      if (ratioBody >= P.upperVsBody && ratioRange >= P.upperVsRange) ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, direction: 'bearish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `上ヒゲ=${fmt(up)}円（実体の${fmt(ratioBody, 1)}倍、値幅の${fmt(ratioRange * 100, 0)}%）で長い上ヒゲが成立。伝統的には上値での売り圧力のサインと解釈される（予測ではない）。` }));
      else if (ratioBody >= P.approxUpperVsBody && ratioRange >= P.approxUpperVsRange) ev.push(makeEvent(this, { state: 'approximate', score: sc.score, coverage: sc.coverage, direction: 'bearish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: `上ヒゲは実体の${fmt(ratioBody, 1)}倍・値幅の${fmt(ratioRange * 100, 0)}%で、長い上ヒゲに近似（成立条件未達）。` }));
    }
    return ev;
  }
}));

// 4c. Marubozu (v0.3, JSON-driven; variant = direction of the bar)
registerRule(defRule('marubozu', {
  id: 'marubozu', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 0; i < bars.length; i++) {
      if (!bars[i].complete || F.range[i] <= 0 || F.bodyRatio[i] == null || F.dir[i] === 0) continue;
      const br = F.bodyRatio[i], variant = F.dir[i] > 0 ? 'bullish' : 'bearish';
      const cs = [critN('値幅が正', F.range[i], '>0', true, 1, 1, true),
                  critN('実体/値幅 ≥ 0.9', br, P.bodyRatioMin, br >= P.bodyRatioMin, br, 3, true)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, variant, direction: variant === 'bullish' ? 'bullish-traditional' : 'bearish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs };
      if (br >= P.bodyRatioMin) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `実体/値幅=${fmt(br, 3)}（閾値0.9以上）で丸坊主（${variant === 'bullish' ? '陽線' : '陰線'}）が成立。ヒゲがほぼなく一方向への勢いを示す形状（予測ではない）。` }));
      else if (br >= P.approxBodyRatioMin) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `実体/値幅=${fmt(br, 3)}で丸坊主に近似（成立閾値0.9は未達）。` }));
    }
    return ev;
  }
}));

// 4d. Bearish engulfing (v0.3, JSON-driven; mirror of bullish-engulfing, catalog 'engulfing')
registerRule(defRule('bearish-engulfing', {
  id: 'bearish-engulfing', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete || !bars[i - 1].complete) continue;
      const p = bars[i - 1], c = bars[i];

      const prevBodyTop = p.close, prevBodyBot = p.open, prevBody = prevBodyTop - prevBodyBot;
      if (prevBody <= 0) continue;
      const coverTop = c.open - prevBodyTop, coverBot = prevBodyBot - c.close;
      const coverRatio = Math.min(c.open, prevBodyTop) - Math.max(c.close, prevBodyBot);
      const full = coverTop >= 0 && coverBot >= 0;
      const cs = [critN('前足が陽線', F.dir[i - 1], 1, true, 1, 1, true),
                  critN('当足が陰線', F.dir[i], -1, true, 1, 1, true),
                  critN('実体が前実体を包含', Math.min(coverTop, coverBot), 0, full, full ? 1 : Math.max(0, coverRatio / prevBody), 3, true)];
      const sc = scoreOf2(cs);
      if (full) ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, direction: 'bearish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs, explanation: `陰線の実体（${fmt(c.close)}〜${fmt(c.open)}円）が前陽線の実体（${fmt(prevBodyBot)}〜${fmt(prevBodyTop)}円）を包含し、弱気包み足が成立。` }));
      else if (coverRatio / prevBody >= P.approxCoverRatio) ev.push(makeEvent(this, { state: 'approximate', score: sc.score, coverage: sc.coverage, direction: 'bearish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs, explanation: `実体の被覆率は${fmt(coverRatio / prevBody * 100, 0)}%で完全包含に届かず近似。` }));
    }
    return ev;
  }
}));

// 4e. Harami (v0.3, JSON-driven; containment is non-strict, current body strictly smaller;
// opposite colour is typical and scored, never mandatory — section 16/17 decision)
registerRule(defRule('harami', {
  id: 'harami', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete || !bars[i - 1].complete) continue;
      const body1 = F.body[i - 1], body2 = F.body[i];
      if (body1 <= 0 || body2 <= 0 || F.dir[i - 1] === 0) continue;
      const p = bars[i - 1], c = bars[i];
      const top1 = Math.max(p.open, p.close), bot1 = Math.min(p.open, p.close);
      const top2 = Math.max(c.open, c.close), bot2 = Math.min(c.open, c.close);
      const contained = bot2 >= bot1 && top2 <= top1;
      const overlap = Math.max(0, Math.min(top1, top2) - Math.max(bot1, bot2));
      const smaller = body2 < body1;
      const opposite = F.dir[i] === -F.dir[i - 1];
      const strong = body2 <= P.smallBodyRatioMax * body1;
      const variant = F.dir[i - 1] < 0 ? 'bullish' : 'bearish';
      const cs = [critN('当足実体が前足実体内に包含', overlap / body2, 1, contained, overlap / body2, 3, true),
                  critN('当足実体 < 前足実体', body2 / body1, 1, smaller, 1 - Math.min(1, body2 / body1), 2, true),
                  critN('当足が前足と逆方向（典型形）', F.dir[i], -F.dir[i - 1], opposite, opposite ? 1 : 0, 1, false),
                  critN('当足実体 ≤ 前足実体の0.5倍（強い包含）', body2 / body1, P.smallBodyRatioMax, strong, strong ? 1 : 0, 1, false)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, variant, direction: variant === 'bullish' ? 'bullish-traditional' : 'bearish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs };
      if (contained && smaller) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `当足の実体（${fmt(bot2)}〜${fmt(top2)}円）が前足の実体（${fmt(bot1)}〜${fmt(top1)}円）の内側に収まり、はらみ足が成立（${variant === 'bullish' ? '前足が陰線の底型' : '前足が陽線の天井型'}）。` }));
      else if (smaller && bot2 >= p.low && top2 <= p.high) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `当足実体は前足の値幅内にあるが実体の包含には届かず、はらみ足に近似。` }));
    }
    return ev;
  }
}));

// 4f. Hammer / hanging man (v0.3, JSON-driven; shape = long lower shadow, the prior
// 10-bar close-regression slope is a mandatory context that selects the variant.
// When the context cannot be judged (insufficient history) no event is emitted.)
registerRule(defRule('hammer-context', {
  id: 'hammer-context', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 0; i < bars.length; i++) {
      if (!bars[i].complete || F.range[i] <= 0) continue;
      if (i - P.contextBars < 0) continue; // context unavailable -> no event (documented)
      let sx = 0, sy = 0, sxy = 0, sxx = 0; const p = P.contextBars;
      for (let k = 0; k < p; k++) { const x = k, y = bars[i - p + k].close; sx += x; sy += y; sxy += x * y; sxx += x * x; }
      const slope = (p * sxy - sx * sy) / (p * sxx - sx * sx);
      const variant = slope <= 0 ? 'hammer' : 'hanging-man';
      const lo = F.lower[i], bo = F.body[i], ra = F.range[i];
      const ratioBody = bo > 0 ? lo / bo : (lo > 0 ? Infinity : 0), ratioRange = lo / ra;
      const cs = [critN('下ヒゲ ≥ 実体×2', ratioBody === Infinity ? 99 : ratioBody, P.lowerVsBody, ratioBody >= P.lowerVsBody, Math.min(1, ratioBody / 3), 2, true),
                  critN('下ヒゲ ≥ 値幅×0.6', ratioRange, P.lowerVsRange, ratioRange >= P.lowerVsRange, ratioRange, 2, true),
                  critN('直前文脈（10本終値の回帰傾き）で金槌/首吊りを区別', slope, 0, true, 1, 1, true)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, variant, direction: variant === 'hammer' ? 'bullish-traditional' : 'bearish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs };
      const shapeFull = ratioBody >= P.lowerVsBody && ratioRange >= P.lowerVsRange;
      const shapeApprox = ratioBody >= P.approxLowerVsBody && ratioRange >= P.approxLowerVsRange;
      if (shapeFull) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `${variant === 'hammer' ? '下落・横ばい文脈（傾き' + fmt(slope, 2) + '）で金槌' : '上昇文脈（傾き' + fmt(slope, 2) + '）で首吊り線'}が成立。下ヒゲは実体の${fmt(ratioBody, 1)}倍・値幅の${fmt(ratioRange * 100, 0)}%。伝統的解釈であり予測ではない。` }));
      else if (shapeApprox) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `${variant === 'hammer' ? '金槌' : '首吊り線'}の形状に近似（下ヒゲは実体の${fmt(ratioBody, 1)}倍・値幅の${fmt(ratioRange * 100, 0)}%で成立条件未達）。` }));
    }
    return ev;
  }
}));

// 4g. Morning/evening star, windowless type (v0.3, JSON-driven, ORIGINAL definition —
// not the traditional gap-based pattern; the name carries 窓なし型（独自）per section 16/18.
// The star is identified by its close sitting outside the first bar's close, and the
// third bar by its penetration into the first bar's body.)
registerRule(defRule('morning-evening-star-windowless', {
  id: 'morning-evening-star-windowless', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 2; i < bars.length; i++) {
      const idx = [i - 2, i - 1, i];
      if (!idx.every(j => bars[j].complete && F.range[j] > 0 && F.bodyRatio[j] != null)) continue;
      const d1 = F.dir[i - 2];
      if (d1 === 0 || F.body[i - 2] <= 0) continue;
      const morning = d1 < 0, variant = morning ? 'morning' : 'evening';
      const dir3ok = morning ? F.dir[i] > 0 : F.dir[i] < 0;
      const b1 = bars[i - 2], bs = bars[i - 1];
      const pen = morning ? (bars[i].close - b1.close) / (b1.open - b1.close) : (b1.close - bars[i].close) / (b1.close - b1.open);
      const starOutside = morning ? bs.close <= b1.close : bs.close >= b1.close;
      const bigOk = F.bodyRatio[i - 2] >= P.bigBodyRatioMin;
      const starOk = F.bodyRatio[i - 1] <= P.starBodyRatioMax;
      const penOk = pen >= P.penetrationMin;
      // preceding context (scored, not mandatory): trend in the first bar's direction
      let contextPass = null, slopePrev = null;
      if (i - 2 - P.contextBars >= 0) {
        const j0 = i - 2 - P.contextBars, j1 = i - 3;
        let sx = 0, sy = 0, sxy = 0, sxx = 0; const p = j1 - j0 + 1;
        for (let k = 0; k < p; k++) { const x = k, y = bars[j0 + k].close; sx += x; sy += y; sxy += x * y; sxx += x * x; }
        slopePrev = (p * sxy - sx * sy) / (p * sxx - sx * sx);
        contextPass = morning ? slopePrev <= 0 : slopePrev >= 0;
      }
      const cs = [critN('第1足が大実体（実体/値幅 ≥ 0.5）', F.bodyRatio[i - 2], P.bigBodyRatioMin, bigOk, F.bodyRatio[i - 2], 2, true),
                  critN('第2足（星）が小幅（実体/値幅 ≤ 0.3）', F.bodyRatio[i - 1], P.starBodyRatioMax, starOk, 1 - F.bodyRatio[i - 1], 2, true),
                  critN('星の終値が第1足終値の外側', bs.close, b1.close, starOutside, starOutside ? 1 : 0, 2, true),
                  critN('第3足が逆方向', F.dir[i], morning ? 1 : -1, dir3ok, dir3ok ? 1 : 0, 1, true),
                  critN('第3足が第1足実体へ50%以上切り込む', pen, P.penetrationMin, penOk, Math.max(0, Math.min(1, pen)), 3, true),
                  critN('直前文脈（10本回帰傾き）', slopePrev, 0, contextPass, contextPass == null ? null : (contextPass ? 1 : 0), 1, false)];
      const sc = scoreOf2(cs);

// 4n. Harami cross (v0.4, JSON-driven, Stage 5-B-2 trial): harami containment with
// a doji as the second bar (a zero body is allowed, unlike harami). When the
// second body is zero, the opposite-color auxiliary cannot be judged (pass=null).
registerRule(defRule('harami-cross', {
  id: 'harami-cross', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete || !bars[i - 1].complete || F.range[i] <= 0 || F.range[i - 1] <= 0 || F.bodyRatio[i] == null) continue;
      const body1 = F.body[i - 1], body2 = F.body[i];
      if (body1 <= 0 || F.dir[i - 1] === 0) continue;
      const p = bars[i - 1], c = bars[i];
      const top1 = Math.max(p.open, p.close), bot1 = Math.min(p.open, p.close);
      const top2 = Math.max(c.open, c.close), bot2 = Math.min(c.open, c.close);
      const contained = bot2 >= bot1 && top2 <= top1;
      const overlap = Math.max(0, Math.min(top1, top2) - Math.max(bot1, bot2));
      const overlapRatio = body2 > 0 ? overlap / body2 : (contained ? 1 : 0);
      const smaller = body2 < body1;
      const dojiOk = F.bodyRatio[i] <= P.dojiBodyRatioMax;
      const opposite = body2 > 0 ? (F.dir[i] === -F.dir[i - 1]) : null;
      const strong = body2 <= P.smallBodyRatioMax * body1;
      const variant = F.dir[i - 1] < 0 ? 'bullish' : 'bearish';
      const cs = [critN('当足実体が前足実体内に包含', overlapRatio, 1, contained, overlapRatio, 3, true),
                  critN('当足実体 < 前足実体', body2 / body1, 1, smaller, 1 - Math.min(1, body2 / body1), 2, true),
                  critN('当足が十字（実体/値幅 ≤ 0.1）', F.bodyRatio[i], P.dojiBodyRatioMax, dojiOk, 1 - F.bodyRatio[i] / 0.5, 2, true),
                  critN('当足が前足と逆方向（典型形）', body2 > 0 ? F.dir[i] : null, -F.dir[i - 1], opposite, opposite == null ? null : (opposite ? 1 : 0), 1, false),
                  critN('当足実体 ≤ 前足実体の0.5倍（強い包含）', body2 / body1, P.smallBodyRatioMax, strong, strong ? 1 : 0, 1, false)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, variant, direction: variant === 'bullish' ? 'bullish-traditional' : 'bearish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs };
      if (contained && smaller && dojiOk) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `前足の実体（${fmt(bot1)}〜${fmt(top1)}円）の内側で十字となり、はらみ寄せ線が成立（${variant === 'bullish' ? '前足が陰線の底型' : '前足が陽線の天井型'}）。` }));
      else if (smaller && dojiOk && bot2 >= p.low && top2 <= p.high) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `当足の十字は前足の値幅内にあるが実体の包含には届かず、はらみ寄せ線に近似。` }));
    }
    return ev;
  }
}));

// 4o. Shooting star / inverted hammer (v0.4, JSON-driven, Stage 5-B-2 trial):
// mirror of hammer-context. Shape = long upper shadow; the prior 10-bar
// close-regression slope is a mandatory context selecting the variant
// (slope >= 0: shooting star; slope < 0: inverted hammer). No event when the
// context cannot be judged.
registerRule(defRule('shooting-star-context', {
  id: 'shooting-star-context', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 0; i < bars.length; i++) {
      if (!bars[i].complete || F.range[i] <= 0) continue;
      if (i - P.contextBars < 0) continue; // context unavailable -> no event (documented)
      let sx = 0, sy = 0, sxy = 0, sxx = 0; const p = P.contextBars;
      for (let k = 0; k < p; k++) { const x = k, y = bars[i - p + k].close; sx += x; sy += y; sxy += x * y; sxx += x * x; }
      const slope = (p * sxy - sx * sy) / (p * sxx - sx * sx);
      const variant = slope >= 0 ? 'shooting-star' : 'inverted-hammer';
      const up = F.upper[i], bo = F.body[i], ra = F.range[i];
      const ratioBody = bo > 0 ? up / bo : (up > 0 ? Infinity : 0), ratioRange = up / ra;
      const cs = [critN('上ヒゲ ≥ 実体×2', ratioBody === Infinity ? 99 : ratioBody, P.upperVsBody, ratioBody >= P.upperVsBody, Math.min(1, ratioBody / 3), 2, true),
                  critN('上ヒゲ ≥ 値幅×0.6', ratioRange, P.upperVsRange, ratioRange >= P.upperVsRange, ratioRange, 2, true),
                  critN('直前文脈（10本終値の回帰傾き）で流れ星/逆金槌を区別', slope, 0, true, 1, 1, true)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, variant, direction: variant === 'shooting-star' ? 'bearish-traditional' : 'bullish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs };
      const shapeFull = ratioBody >= P.upperVsBody && ratioRange >= P.upperVsRange;
      const shapeApprox = ratioBody >= P.approxUpperVsBody && ratioRange >= P.approxUpperVsRange;
      if (shapeFull) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `${variant === 'shooting-star' ? '上昇・横ばい文脈（傾き' + fmt(slope, 2) + '）で流れ星' : '下落文脈（傾き' + fmt(slope, 2) + '）で逆金槌'}が成立。上ヒゲは実体の${fmt(ratioBody, 1)}倍・値幅の${fmt(ratioRange * 100, 0)}%。伝統的解釈であり予測ではない。` }));
      else if (shapeApprox) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `${variant === 'shooting-star' ? '流れ星' : '逆金槌'}の形状に近似（上ヒゲは実体の${fmt(ratioBody, 1)}倍・値幅の${fmt(ratioRange * 100, 0)}%で成立条件未達）。` }));
    }
    return ev;
  }
}));

// 4p. Piercing pattern, windowless type (v0.4, JSON-driven, Stage 5-B-2 trial,
// ORIGINAL definition — the traditional open condition cannot hold on continuous
// bars (O[t]=C[t-1]) and is therefore not judged; penetration into the first
// bar's body is the criterion. Not the traditional pattern's establishment.)
registerRule(defRule('piercing-line-windowless', {
  id: 'piercing-line-windowless', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete || !bars[i - 1].complete || F.range[i - 1] <= 0) continue;
      if (!(F.dir[i - 1] < 0 && F.dir[i] > 0)) continue;
      const b1 = bars[i - 1], b2 = bars[i];
      const body1 = b1.open - b1.close;
      if (body1 <= 0) continue;
      const br1 = F.bodyRatio[i - 1];
      const pen = (b2.close - b1.close) / body1;
      const within = b2.close < b1.open;
      const solidOk = br1 >= P.bodyRatioMin;
      let contextPass = null, slopePrev = null;
      if (i - 1 - P.contextBars >= 0) {
        const j0 = i - 1 - P.contextBars, j1 = i - 2;
        let sx = 0, sy = 0, sxy = 0, sxx = 0; const p = j1 - j0 + 1;
        for (let k = 0; k < p; k++) { const x = k, y = bars[j0 + k].close; sx += x; sy += y; sxy += x * y; sxx += x * x; }
        slopePrev = (p * sxy - sx * sy) / (p * sxx - sx * sx);
        contextPass = slopePrev <= 0;
      }
      const cs = [critN('第1足が陰線', F.dir[i - 1], -1, true, 1, 1, true),
                  critN('第1足が大実体（実体/値幅 ≥ 0.5）', br1, P.bodyRatioMin, solidOk, br1, 2, true),
                  critN('第2足が陽線', F.dir[i], 1, true, 1, 1, true),
                  critN('第2足終値が第1足始値を超えない（包み足と区別）', b2.close, b1.open, within, within ? 1 : 0, 2, true),
                  critN('第2足が第1足実体へ50%以上切り込む', pen, P.penetrationMin, pen >= P.penetrationMin, Math.max(0, Math.min(1, pen)), 3, true),
                  critN('直前文脈（10本回帰傾き ≤ 0）', slopePrev, 0, contextPass, contextPass == null ? null : (contextPass ? 1 : 0), 1, false)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, direction: 'bullish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs };
      if (solidOk && within && pen >= P.penetrationMin) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `切り込み足（窓なし型・独自）が成立。第2足の切り込みは第1足実体の${fmt(pen * 100, 0)}%。始値条件は連続足では成立しないため含めない独自定義による成立であり、原型の成立ではない。` }));
      else if (solidOk && within && pen >= P.approxPenetrationMin) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `切り込み足（窓なし型・独自）に近似（切り込み${fmt(pen * 100, 0)}%）。独自定義の近似であり原型の成立ではない。` }));
    }
    return ev;
  }
}));

                  critN('直前文脈（10本回帰傾き ≥ 0）', slopePrev, 0, contextPass, contextPass == null ? null : (contextPass ? 1 : 0), 1, false)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, direction: 'bearish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs };
      if (solidOk && within && pen >= P.penetrationMin) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `かぶせ線（窓なし型・独自）が成立。第2足のかぶせは第1足実体の${fmt(pen * 100, 0)}%。始値条件は連続足では成立しないため含めない独自定義による成立であり、原型の成立ではない。` }));
      else if (solidOk && within && pen >= P.approxPenetrationMin) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `かぶせ線（窓なし型・独自）に近似（かぶせ${fmt(pen * 100, 0)}%）。独自定義の近似であり原型の成立ではない。` }));
    }
    return ev;
  }
}));

// 4r. Four price doji (v0.5, JSON-driven, Stage 5-B-2 batch): all four prices
// equal (zero range). No approximate tier, no direction.
registerRule(defRule('four-price-doji', {
  id: 'four-price-doji', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [];
    for (let i = 0; i < bars.length; i++) {
      if (!bars[i].complete || F.range[i] !== 0) continue;
      const cs = [critN('四値が同一（値幅ゼロ）', F.range[i], 0, true, 1, 1, true)];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, explanation: '始値・高値・安値・終値がすべて同一で四値同一十字線が成立。方向性は示さない形状。' }));
    }
    return ev;
  }
}));

// 4s. High wave (v0.5, JSON-driven, Stage 5-B-2 batch): long shadows on both
// sides with a small-to-medium body. Variant records the body color; the shape
// is traditionally neutral, so no direction. Distinguished from long-legged
// doji by the body-ratio ceiling.
registerRule(defRule('high-wave', {
  id: 'high-wave', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 0; i < bars.length; i++) {
      if (!bars[i].complete || F.range[i] <= 0 || F.bodyRatio[i] == null) continue;
      const br = F.bodyRatio[i], ur = F.upper[i] / F.range[i], lr = F.lower[i] / F.range[i];
      const variant = F.body[i] > 0 ? (F.dir[i] > 0 ? 'bullish' : 'bearish') : null;
      const cs = [critN('実体/値幅 ≤ 0.4', br, P.bodyRatioMax, br <= P.bodyRatioMax, 1 - br, 2, true),
                  critN('上ヒゲ/値幅 ≥ 0.3', ur, P.legRatioMin, ur >= P.legRatioMin, ur, 2, true),
                  critN('下ヒゲ/値幅 ≥ 0.3', lr, P.legRatioMin, lr >= P.legRatioMin, lr, 2, true)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, variant, startIndex: i, endIndex: i, detectedIndex: i, criteria: cs };
      if (br <= P.bodyRatioMax && ur >= P.legRatioMin && lr >= P.legRatioMin) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `上下ヒゲが長く（上${fmt(ur * 100, 0)}%・下${fmt(lr * 100, 0)}%）実体が小さく、寄せ線が成立。迷いを示す形状で方向性は示さない。` }));
      else if (br <= P.approxBodyRatioMax && ur >= P.approxLegRatioMin && lr >= P.approxLegRatioMin) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `寄せ線に近似（実体/値幅=${fmt(br, 3)}、上ヒゲ${fmt(ur * 100, 0)}%、下ヒゲ${fmt(lr * 100, 0)}%で成立条件未達）。` }));
    }
    return ev;
  }
}));

// 4t. Tweezer top/bottom (v0.5, JSON-driven, Stage 5-B-2 batch): two consecutive
// bars with (nearly) equal highs (top) or lows (bottom). Equality is judged
// against ATR14 (the catalog's provisional ATR basis, finalized in defs 0.4);
// without a settled ATR the rule does not judge.
registerRule(defRule('tweezer', {
  id: 'tweezer', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete || !bars[i - 1].complete) continue;
      const atr = F.atr14[i];
      if (atr == null || atr <= 0) continue;
      const top = F.dir[i - 1] > 0 && F.dir[i] < 0, bottom = F.dir[i - 1] < 0 && F.dir[i] > 0;
      if (!top && !bottom) continue;
      const diff = top ? Math.abs(bars[i].high - bars[i - 1].high) : Math.abs(bars[i].low - bars[i - 1].low);
      const variant = top ? 'top' : 'bottom';
      const tol = P.atrTolRatio * atr;
      const cs = [critN(top ? '陽線→陰線（天井型）' : '陰線→陽線（底型）', 1, 1, true, 1, 1, true),
                  critN(top ? '高値の差 ≤ ATR×0.1' : '安値の差 ≤ ATR×0.1', diff, tol, diff <= tol, diff <= tol ? 1 : Math.max(0, 1 - diff / atr), 3, true)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, variant, direction: top ? 'bearish-traditional' : 'bullish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs };
      if (diff <= tol) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `連続2本の${top ? '高値' : '安値'}がほぼ一致（差${fmt(diff)}円、ATRの${fmt(diff / atr * 100, 0)}%）し、毛抜き（${top ? '天井' : '底'}型）が成立。` }));
      else if (diff <= P.approxAtrTolRatio * atr) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `毛抜きに近似（${top ? '高値' : '安値'}の差${fmt(diff)}円はATRの${fmt(diff / atr * 100, 0)}%で一致条件未達）。` }));
    }
    return ev;
  }
}));

// 4u. Homing pigeon (v0.5, JSON-driven, Stage 5-B-2 batch): harami containment
// with BOTH bars bearish (the original form only, per the catalog). The
// same-color condition is what distinguishes it from harami.
registerRule(defRule('homing-pigeon', {
  id: 'homing-pigeon', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete || !bars[i - 1].complete) continue;
      if (!(F.dir[i - 1] < 0 && F.dir[i] < 0)) continue;
      const body1 = F.body[i - 1], body2 = F.body[i];
      if (body1 <= 0 || body2 <= 0) continue;
      const p = bars[i - 1], c = bars[i];
      const top1 = Math.max(p.open, p.close), bot1 = Math.min(p.open, p.close);
      const top2 = Math.max(c.open, c.close), bot2 = Math.min(c.open, c.close);
      const contained = bot2 >= bot1 && top2 <= top1;
      const overlap = Math.max(0, Math.min(top1, top2) - Math.max(bot1, bot2));
      const smaller = body2 < body1;
      const strong = body2 <= P.smallBodyRatioMax * body1;
      const cs = [critN('当足実体が前足実体内に包含', overlap / body2, 1, contained, overlap / body2, 3, true),
                  critN('当足実体 < 前足実体', body2 / body1, 1, smaller, 1 - Math.min(1, body2 / body1), 2, true),
                  critN('当足も陰線（同色）', F.dir[i], -1, true, 1, 1, true),
                  critN('当足実体 ≤ 前足実体の0.5倍（強い包含）', body2 / body1, P.smallBodyRatioMax, strong, strong ? 1 : 0, 1, false)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, direction: 'bullish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs };
      if (contained && smaller) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `陰線の実体（${fmt(bot2)}〜${fmt(top2)}円）が前陰線の実体（${fmt(bot1)}〜${fmt(top1)}円）の内側に収まり、帰り鳩が成立。` }));
      else if (smaller && bot2 >= p.low && top2 <= p.high) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `当足実体は前足の値幅内にあるが実体の包含には届かず、帰り鳩に近似。` }));
    }
    return ev;
  }
}));

// 4v. Three inside up/down (v0.5, JSON-driven, Stage 5-B-2 batch): a harami
// plus a third bar that closes beyond the first bar's body end.
registerRule(defRule('three-inside', {
  id: 'three-inside', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 2; i < bars.length; i++) {
      const idx = [i - 2, i - 1, i];
      if (!idx.every(j => bars[j].complete)) continue;
      const dir1 = F.dir[i - 2];
      const body1 = F.body[i - 2], body2 = F.body[i - 1];
      if (dir1 === 0 || body1 <= 0 || body2 <= 0) continue;
      const b1 = bars[i - 2], b2 = bars[i - 1];
      const top1 = Math.max(b1.open, b1.close), bot1 = Math.min(b1.open, b1.close), mid1 = (top1 + bot1) / 2;
      const top2 = Math.max(b2.open, b2.close), bot2 = Math.min(b2.open, b2.close);
      const contained = bot2 >= bot1 && top2 <= top1;
      const overlap = Math.max(0, Math.min(top1, top2) - Math.max(bot1, bot2));
      const smaller = body2 < body1;
      const strong = body2 <= P.smallBodyRatioMax * body1;
      const variant = dir1 < 0 ? 'bullish' : 'bearish';
      const dir3ok = F.dir[i] === -dir1;
      const closeBeyond = variant === 'bullish' ? bars[i].close > top1 : bars[i].close < bot1;
      const closeMid = variant === 'bullish' ? bars[i].close > mid1 : bars[i].close < mid1;
      const cs = [critN('第2足実体が第1足実体内に包含', overlap / body2, 1, contained, overlap / body2, 3, true),
                  critN('第2足実体 < 第1足実体', body2 / body1, 1, smaller, 1 - Math.min(1, body2 / body1), 2, true),
                  critN('第3足が第1足と逆方向', F.dir[i], -dir1, dir3ok, dir3ok ? 1 : 0, 1, true),
                  critN('第3足終値が第1足実体端を超える', bars[i].close, variant === 'bullish' ? top1 : bot1, closeBeyond, closeBeyond ? 1 : 0, 3, true),
                  critN('第2足実体 ≤ 第1足実体の0.5倍（強い包含）', body2 / body1, P.smallBodyRatioMax, strong, strong ? 1 : 0, 1, false)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, variant, direction: variant === 'bullish' ? 'bullish-traditional' : 'bearish-traditional', startIndex: i - 2, endIndex: i, detectedIndex: i, criteria: cs };
      if (contained && smaller && dir3ok && closeBeyond) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `はらみ足に確認足が続き、第3足終値が第1足の実体端を超え、はらみ三法が成立（${variant === 'bullish' ? '上げ型' : '下げ型'}）。` }));
      else if (contained && smaller && dir3ok && closeMid) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `はらみ三法に近似（第3足終値が第1足実体の中点は超えたが実体端には届かない）。` }));
    }
    return ev;
  }
}));

// 4w. Three outside up/down (v0.5, JSON-driven, Stage 5-B-2 batch): an
// engulfing pair plus a third bar continuing beyond the engulfing close.
registerRule(defRule('three-outside', {
  id: 'three-outside', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 2; i < bars.length; i++) {
      const idx = [i - 2, i - 1, i];
      if (!idx.every(j => bars[j].complete)) continue;
      if (F.dir[i - 2] === 0 || F.dir[i - 1] !== -F.dir[i - 2]) continue;
      const b1 = bars[i - 2], b2 = bars[i - 1];
      const body1 = F.body[i - 2];
      if (body1 <= 0) continue;
      const top1 = Math.max(b1.open, b1.close), bot1 = Math.min(b1.open, b1.close);
      const top2 = Math.max(b2.open, b2.close), bot2 = Math.min(b2.open, b2.close);
      const full = bot2 <= bot1 && top2 >= top1;
      const coverRatio = (Math.min(top1, top2) - Math.max(bot1, bot2)) / body1;
      const variant = F.dir[i - 1] > 0 ? 'bullish' : 'bearish';
      const dir3ok = F.dir[i] === F.dir[i - 1];
      const prog = variant === 'bullish' ? bars[i].close > b2.close : bars[i].close < b2.close;
      const cs = [critN('第1足と第2足が逆方向', 1, 1, true, 1, 1, true),
                  critN('第2足実体が第1足実体を包含', coverRatio, 1, full, Math.max(0, Math.min(1, coverRatio)), 3, true),
                  critN('第3足が包みと同方向', F.dir[i], F.dir[i - 1], dir3ok, dir3ok ? 1 : 0, 1, true),
                  critN('第3足終値が第2足終値を超える', bars[i].close, b2.close, prog, prog ? 1 : 0, 2, true)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, variant, direction: variant === 'bullish' ? 'bullish-traditional' : 'bearish-traditional', startIndex: i - 2, endIndex: i, detectedIndex: i, criteria: cs };
      if (full && dir3ok && prog) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `包み足に確認足が続き、第3足が同方向に進み、包み三法が成立（${variant === 'bullish' ? '上げ型' : '下げ型'}）。` }));
      else if (coverRatio >= P.approxCoverRatio && dir3ok && prog) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `包み三法に近似（実体の被覆率${fmt(coverRatio * 100, 0)}%で完全包含に届かない）。` }));
    }
    return ev;
  }
}));

// 4x. Neck family (v0.5, JSON-driven, Stage 5-B-2 batch): after a solid bearish
// bar, a bullish bar that recovers only weakly. The three rules are separated
// by the recovery yardstick: on-neck references the first bar's LOW (ATR
// tolerance), in-neck / thrusting use penetration bands into the first body.
// Confirmed only (no approximate tier); bearish-continuation reading.
function neckPrecond(F, i, P) {
  return F.dir[i - 1] < 0 && F.dir[i] > 0 && F.bodyRatio[i - 1] != null && F.bodyRatio[i - 1] >= P.bodyRatioMin && F.body[i - 1] > 0;
}
function neckCriteria(F, i, P, bandCrit) {
  return [critN('第1足が陰線', F.dir[i - 1], -1, true, 1, 1, true),
          critN('第1足が大実体（実体/値幅 ≥ 0.5）', F.bodyRatio[i - 1], P.bodyRatioMin, true, F.bodyRatio[i - 1], 2, true),
          critN('第2足が陽線', F.dir[i], 1, true, 1, 1, true),
          bandCrit];
}
registerRule(defRule('on-neck', {
  id: 'on-neck', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete || !bars[i - 1].complete || !neckPrecond(F, i, P)) continue;
      const atr = F.atr14[i];
      if (atr == null || atr <= 0) continue;
      const diff = Math.abs(bars[i].close - bars[i - 1].low), tol = P.atrTolRatio * atr;
      const cs = neckCriteria(F, i, P, critN('第2足終値と第1足安値の差 ≤ ATR×0.1', diff, tol, diff <= tol, diff <= tol ? 1 : Math.max(0, 1 - diff / atr), 3, true));
      const sc = scoreOf2(cs);
      if (diff <= tol) ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, direction: 'bearish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs, explanation: `陽線の終値が前足安値とほぼ同水準（差${fmt(diff)}円）にとどまり、首線乗りが成立。弱い反発で下落継続の解釈とされる（予測ではない）。` }));
    }
    return ev;
  }
}));
registerRule(defRule('in-neck', {
  id: 'in-neck', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete || !bars[i - 1].complete || !neckPrecond(F, i, P)) continue;
      const b1 = bars[i - 1];
      const pen = (bars[i].close - b1.close) / (b1.open - b1.close);
      const ok = pen > 0 && pen <= P.penetrationMax;
      const cs = neckCriteria(F, i, P, critN('侵入度が (0, 0.25]', pen, P.penetrationMax, ok, Math.max(0, Math.min(1, pen)), 3, true));
      const sc = scoreOf2(cs);
      if (ok) ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, direction: 'bearish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs, explanation: `陽線が前足実体の下端付近まで入り（侵入度${fmt(pen * 100, 0)}%）、入り首線が成立。下落継続の解釈とされる（予測ではない）。` }));
    }
    return ev;
  }
}));
registerRule(defRule('thrusting', {
  id: 'thrusting', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete || !bars[i - 1].complete || !neckPrecond(F, i, P)) continue;
      const b1 = bars[i - 1];
      const pen = (bars[i].close - b1.close) / (b1.open - b1.close);
      const ok = pen > P.penetrationMin && pen < P.penetrationMax;
      const cs = neckCriteria(F, i, P, critN('侵入度が (0.25, 0.5)', pen, P.penetrationMax, ok, Math.max(0, Math.min(1, pen)), 3, true));
      const sc = scoreOf2(cs);
      if (ok) ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, direction: 'bearish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs, explanation: `陽線が前足実体の中点手前まで切り込み（侵入度${fmt(pen * 100, 0)}%）、突っ込み線が成立。切り込み足には届かない弱い形で、下落継続の解釈とされる（予測ではない）。` }));
    }
    return ev;
  }
}));

// 4y. Counterattack / meeting lines (v0.5, JSON-driven, Stage 5-B-2 batch):
// ONE shared judgment for both IDs (section 11): opposite directions, a solid
// second bar, and closes meeting within an ATR tolerance. On continuous bars
// their condition sets coincide; the original IDs are kept per the sources,
// and the shared family (equal-close) records the relationship.
function equalCloseRule(id) {
  return defRule(id, {
    id, version: '0.1',
    evaluate(ctx) {
      const { bars, F } = ctx, ev = [], P = this.parameters;
      for (let i = 1; i < bars.length; i++) {
        if (!bars[i].complete || !bars[i - 1].complete) continue;
        if (F.dir[i - 1] === 0 || F.dir[i] !== -F.dir[i - 1] || F.bodyRatio[i] == null) continue;
        const atr = F.atr14[i];
        if (atr == null || atr <= 0) continue;
        const diff = Math.abs(bars[i].close - bars[i - 1].close), tol = P.atrTolRatio * atr;
        const br2 = F.bodyRatio[i];
        const variant = F.dir[i - 1] < 0 ? 'bullish' : 'bearish';
        const cs = [critN('2足が逆方向', 1, 1, true, 1, 1, true),
                    critN('第2足が大実体（実体/値幅 ≥ 0.5）', br2, P.bodyRatioMin, br2 >= P.bodyRatioMin, br2, 2, true),
                    critN('終値の差 ≤ ATR×0.1', diff, tol, diff <= tol, diff <= tol ? 1 : Math.max(0, 1 - diff / atr), 3, true)];
        const sc = scoreOf2(cs);
        const base = { score: sc.score, coverage: sc.coverage, variant, direction: variant === 'bullish' ? 'bullish-traditional' : 'bearish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs };
        if (br2 >= P.bodyRatioMin && diff <= tol) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `逆方向の大実体が前足終値とほぼ同値（差${fmt(diff)}円）で引け、${this.name}が成立。連続足では反撃線と出会い線の条件は一致する（出典上の別IDとして保持）。` }));
        else if (br2 >= P.bodyRatioMin && diff <= P.approxAtrTolRatio * atr) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `${this.name}に近似（終値の差${fmt(diff)}円はATRの${fmt(diff / atr * 100, 0)}%で一致条件未達）。` }));
      }
      return ev;
    }
  });
}
registerRule(equalCloseRule('counterattack'));
registerRule(equalCloseRule('meeting-lines'));

// 4z. Matching low (v0.5, JSON-driven, Stage 5-B-2 batch): two bearish bars
// closing at (nearly) the same price. Shares the ATR equality judgment with
// the equal-close family.
registerRule(defRule('matching-low', {
  id: 'matching-low', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete || !bars[i - 1].complete) continue;
      if (!(F.dir[i - 1] < 0 && F.dir[i] < 0)) continue;
      const atr = F.atr14[i];
      if (atr == null || atr <= 0) continue;
      const diff = Math.abs(bars[i].close - bars[i - 1].close), tol = P.atrTolRatio * atr;
      const cs = [critN('2足とも陰線', 1, 1, true, 1, 1, true),
                  critN('終値の差 ≤ ATR×0.1', diff, tol, diff <= tol, diff <= tol ? 1 : Math.max(0, 1 - diff / atr), 3, true)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, direction: 'bullish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs };
      if (diff <= tol) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `2本の陰線の終値がほぼ一致（差${fmt(diff)}円）し、同値安値が成立。下値の支持を示す解釈とされる（予測ではない）。` }));
      else if (diff <= P.approxAtrTolRatio * atr) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `同値安値に近似（終値の差${fmt(diff)}円はATRの${fmt(diff / atr * 100, 0)}%で一致条件未達）。` }));
    }
    return ev;
  }
}));

// 4aa. Doji star, windowless type (v0.5, JSON-driven, Stage 5-B-2 batch,
// ORIGINAL definition): a doji right after a solid bar, with the doji's close
// outside the first bar's close (the star position, aligned with the finalized
// morning/evening star windowless definition). Not the traditional pattern.
registerRule(defRule('doji-star-windowless', {
  id: 'doji-star-windowless', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 1; i < bars.length; i++) {
      if (!bars[i].complete || !bars[i - 1].complete || F.bodyRatio[i] == null || F.bodyRatio[i - 1] == null) continue;
      const dir1 = F.dir[i - 1];
      if (dir1 === 0) continue;
      const variant = dir1 < 0 ? 'morning' : 'evening';
      const solidOk = F.bodyRatio[i - 1] >= P.bigBodyRatioMin;
      const dojiOk = F.bodyRatio[i] <= P.starBodyRatioMax;
      const starOutside = variant === 'morning' ? bars[i].close <= bars[i - 1].close : bars[i].close >= bars[i - 1].close;
      const cs = [critN('第1足が大実体（実体/値幅 ≥ 0.5）', F.bodyRatio[i - 1], P.bigBodyRatioMin, solidOk, F.bodyRatio[i - 1], 2, true),
                  critN('第2足が十字（実体/値幅 ≤ 0.1）', F.bodyRatio[i], P.starBodyRatioMax, dojiOk, 1 - F.bodyRatio[i] / 0.5, 2, true),
                  critN('星の終値が第1足終値の外側', bars[i].close, bars[i - 1].close, starOutside, starOutside ? 1 : 0, 2, true)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, variant, direction: variant === 'morning' ? 'bullish-traditional' : 'bearish-traditional', startIndex: i - 1, endIndex: i, detectedIndex: i, criteria: cs };
      if (solidOk && dojiOk && starOutside) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: `寄せ十字星（窓なし型・独自）が成立。大実体の直後に十字が第1足終値の外側で引けた。窓を必須とする原型とは別の独自定義による成立であり、原型の成立ではない。` }));
      else if (solidOk && starOutside && F.bodyRatio[i] <= P.approxStarBodyRatioMax) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `寄せ十字星（窓なし型・独自）に近似（第2足の実体/値幅=${fmt(F.bodyRatio[i], 3)}で十字条件未達）。独自定義の近似であり原型の成立ではない。` }));
    }
    return ev;
  }
}));

// 4ab. Three methods (v0.5, JSON-driven, Stage 5-B-2 batch): a solid bar, three
// small bars contained in its body, and a final bar closing beyond the first
// close. The windowless mat-hold form is a VARIANT of this rule (section 11):
// rising skeleton whose middle bars trade above the first bar's high while
// their closes hold above the first body's midpoint.
registerRule(defRule('three-methods', {
  id: 'three-methods', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 4; i < bars.length; i++) {
      const idx = [i - 4, i - 3, i - 2, i - 1, i];
      if (!idx.every(j => bars[j].complete && F.range[j] > 0)) continue;
      const b1 = bars[i - 4], b5 = bars[i];
      const dir1 = F.dir[i - 4], body1 = F.body[i - 4];
      if (dir1 === 0 || body1 <= 0) continue;
      const rising = dir1 > 0;
      const top1 = Math.max(b1.open, b1.close), bot1 = Math.min(b1.open, b1.close), mid1 = (top1 + bot1) / 2;
      const midIdx = [i - 3, i - 2, i - 1];
      const solidOk = F.bodyRatio[i - 4] >= P.bodyRatioMin;
      const smallOk = midIdx.every(j => F.body[j] <= P.middleBodyRatioMax * body1);
      const contained = midIdx.every(j => Math.min(bars[j].open, bars[j].close) >= bot1 && Math.max(bars[j].open, bars[j].close) <= top1);
      const counterOk = midIdx.every(j => F.dir[j] === -dir1 || F.dir[j] === 0);
      const matHold = rising && !contained && midIdx.some(j => bars[j].high > b1.high) && midIdx.every(j => bars[j].close >= mid1);
      const variant = contained ? (rising ? 'rising' : 'falling') : (matHold ? 'mat-hold' : null);
      const dir5ok = F.dir[i] === dir1;
      const closeBeyond = rising ? b5.close > b1.close : b5.close < b1.close;
      const closeMid = rising ? b5.close > mid1 : b5.close < mid1;
      const cs = [critN('第1足が大実体（実体/値幅 ≥ 0.5）', F.bodyRatio[i - 4], P.bodyRatioMin, solidOk, F.bodyRatio[i - 4], 2, true),
                  critN('中間3本が小幅（実体 ≤ 第1足実体の0.5倍）', Math.max(...midIdx.map(j => F.body[j])) / body1, P.middleBodyRatioMax, smallOk, smallOk ? 1 : 0, 2, true),
                  critN('中間足の位置（実体内包／マットホールド形）', contained ? 1 : 0, 1, contained || matHold, contained || matHold ? 1 : 0, 2, true),
                  critN('中間3本が逆方向（典型形）', counterOk ? 1 : 0, 1, counterOk, counterOk ? 1 : 0, 1, false),
                  critN('第5足が第1足と同方向でその終値を超える', b5.close, b1.close, dir5ok && closeBeyond, dir5ok && closeBeyond ? 1 : 0, 3, true)];
      const sc = scoreOf2(cs);
      const base = { score: sc.score, coverage: sc.coverage, variant, direction: rising ? 'bullish-traditional' : 'bearish-traditional', startIndex: i - 4, endIndex: i, detectedIndex: i, criteria: cs };
      if (solidOk && smallOk && variant && dir5ok && closeBeyond) ev.push(makeEvent(this, { ...base, state: 'confirmed', explanation: variant === 'mat-hold' ? 'マットホールド（上げ三法の変種・窓なし形）が成立。中間足が高値で第1足の高値を超えて推移しつつ終値が実体中点を割り込まず、第5足が第1足終値を超えた。窓を必須とする原型の成立ではない。' : `${rising ? '上げ三法' : '下げ三法'}が成立。大実体の後に小幅足3本が実体内で続き、第5足が第1足終値を超えた。` }));
      else if (solidOk && smallOk && contained && dir5ok && closeMid) ev.push(makeEvent(this, { ...base, state: 'approximate', explanation: `${rising ? '上げ三法' : '下げ三法'}に近似（第5足終値が第1足実体の中点は超えたが終値には届かない）。` }));
    }
    return ev;
  }
}));

// 5/6. SMA5/20 crosses
function crossRule(id, name, bullish) {
  return {
    id, version: '0.1', name, category: 'trend', family: 'moving-average', lookback: 21, parameters: {},
    evaluate(ctx) {
      const { bars, F } = ctx, ev = [];
      for (let i = 1; i < bars.length; i++) {
        if (!bars[i].complete) continue;
        const a0 = F.sma5[i - 1], b0 = F.sma20[i - 1], a1 = F.sma5[i], b1 = F.sma20[i];
        if (a0 == null || b0 == null || a1 == null || b1 == null) continue;
        const hit = bullish ? (a0 <= b0 && a1 > b1) : (a0 >= b0 && a1 < b1);
        if (!hit) continue;
        const sep = F.atr14[i] > 0 ? Math.abs(a1 - b1) / F.atr14[i] : 0;
        const cs = [crit(bullish ? '前時点 SMA5 ≤ SMA20' : '前時点 SMA5 ≥ SMA20', a0 - b0, 0, true, 1, 1, true),
                    crit(bullish ? '現時点 SMA5 > SMA20' : '現時点 SMA5 < SMA20', a1 - b1, 0, true, Math.min(1, sep + 0.3), 2, true)];
        ev.push(makeEvent(this, { state: 'confirmed', score: scoreOf(cs), direction: bullish ? 'bullish-traditional' : 'bearish-traditional', startIndex: i, endIndex: i, detectedIndex: i, criteria: cs, overlays: [{ type: 'sma', index: i }], explanation: `SMA5（${fmt(a1)}円）がSMA20（${fmt(b1)}円）を${bullish ? '上抜け' : '下抜け'}した${bullish ? '強気' : '弱気'}クロス。伝統的なトレンド転換の解釈であり予測ではない。` }));
      }
      return ev;
    }
  };
}
// ---- advance-block (defs-driven; Stage 5-B-2 final batch) ----
registerRule(defRule('advance-block', {
  id: 'advance-block', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 2; i < bars.length; i++) {
      const idx = [i - 2, i - 1, i];
      if (!idx.every(j => bars[j].complete)) continue;
      if (!idx.every(j => F.dir[j] > 0)) continue;
      if (!(bars[i - 1].close > bars[i - 2].close && bars[i].close > bars[i - 1].close)) continue;
      const inBody = (o, j) => o > Math.min(bars[j].open, bars[j].close) && o < Math.max(bars[j].open, bars[j].close);
      if (!(inBody(bars[i - 1].open, i - 2) && inBody(bars[i].open, i - 1))) continue;
      const upperRatio = F.range[i] > 0 ? F.upper[i] / F.range[i] : 0;
      const upperOk = upperRatio >= P.upperRatioMin;
      const shrinkAll = F.body[i] < F.body[i - 2] && F.body[i - 1] <= F.body[i - 2] && F.body[i] <= F.body[i - 1];
      const shrinkAny = F.body[i] < F.body[i - 2];
      if (!upperOk || !shrinkAny) continue;
      const cs = [
        critN('陽線3本・終値上昇・始値が前足実体内', 1, 1, true, 1, 2),
        critN('実体が縮小（第3足<第1足、各足が非増大）', shrinkAll ? 1 : 0.5, 1, shrinkAll, shrinkAll ? 1 : 0.5, 3),
        critN('第3足の上ヒゲ/値幅', upperRatio, P.upperRatioMin, upperOk, Math.min(1, upperRatio), 2),
        critN('上ヒゲが増大（第3足>=第2足）', F.upper[i] - F.upper[i - 1], 0, F.upper[i] >= F.upper[i - 1], F.upper[i] >= F.upper[i - 1] ? 1 : 0, 1, false),
      ];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, { state: shrinkAll ? 'confirmed' : 'approximate', score: sc.score, coverage: sc.coverage, variant: null, direction: 'bearish-traditional', startIndex: i - 2, endIndex: i, detectedIndex: i, criteria: cs, explanation: '陽線が続くが実体が縮小し上ヒゲが伸びている。伝統解釈では上昇の勢いの減衰（先行ブロック）。' }));
    }
    return ev;
  }
}));

// ---- stalled (defs-driven; Stage 5-B-2 final batch) ----
registerRule(defRule('stalled', {
  id: 'stalled', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 2; i < bars.length; i++) {
      const idx = [i - 2, i - 1, i];
      if (!idx.every(j => bars[j].complete)) continue;
      if (!(F.dir[i - 2] > 0 && F.dir[i - 1] > 0 && F.dir[i] >= 0)) continue;
      if (!(bars[i - 1].close >= bars[i - 2].close && bars[i].close >= bars[i - 1].close)) continue;
      const b1 = F.body[i - 2];
      if (!(b1 > 0)) continue;
      const solidOk = F.bodyRatio[i - 2] >= P.bodyRatioMin;
      const midOk = F.body[i - 1] <= b1;
      const ratio3 = F.body[i] / b1;
      if (!solidOk || !midOk || ratio3 > P.approxSmallBodyRatioMax) continue;
      const smallOk = ratio3 <= P.smallBodyRatioMax;
      const cs = [
        critN('第1足が大陽線（実体比）', F.bodyRatio[i - 2], P.bodyRatioMin, solidOk, Math.min(1, F.bodyRatio[i - 2]), 2),
        critN('第2足の実体が第1足以下', F.body[i - 1] - b1, 0, midOk, midOk ? 1 : 0, 1),
        critN('第3足が小実体（第1足比）', ratio3, P.smallBodyRatioMax, smallOk, smallOk ? 1 : 0.5, 3),
      ];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, { state: smallOk ? 'confirmed' : 'approximate', score: sc.score, coverage: sc.coverage, variant: null, direction: 'bearish-traditional', startIndex: i - 2, endIndex: i, detectedIndex: i, criteria: cs, explanation: '大陽線の後、小さな陽線が並んで停滞している。伝統解釈では上昇の停滞（停滞線）。第3足の小ささで判定し、上ヒゲは条件にしない（先行ブロックとの区別）。' }));
    }
    return ev;
  }
}));

// ---- three-line-strike (defs-driven; Stage 5-B-2 final batch) ----
registerRule(defRule('three-line-strike', {
  id: 'three-line-strike', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [];
    for (let i = 3; i < bars.length; i++) {
      const idx = [i - 3, i - 2, i - 1, i];
      if (!idx.every(j => bars[j].complete)) continue;
      const d = F.dir[i - 3];
      if (d === 0 || F.dir[i - 2] !== d || F.dir[i - 1] !== d) continue;
      const prog = d > 0
        ? (bars[i - 2].close > bars[i - 3].close && bars[i - 1].close > bars[i - 2].close)
        : (bars[i - 2].close < bars[i - 3].close && bars[i - 1].close < bars[i - 2].close);
      if (!prog) continue;
      if (F.dir[i] !== -d) continue;
      const open1 = bars[i - 3].open;
      const spanMid = (open1 + bars[i - 1].close) / 2;
      const beyondOpen = d > 0 ? bars[i].close < open1 : bars[i].close > open1;
      const beyondMid = d > 0 ? bars[i].close < spanMid : bars[i].close > spanMid;
      if (!beyondMid) continue;
      const cs = [
        critN('3本が同方向で終値進行', 1, 1, true, 1, 2),
        critN('第4足が逆方向', 1, 1, true, 1, 1),
        critN('第4足終値が第1足始値を超える', beyondOpen ? 1 : 0.5, 1, beyondOpen, beyondOpen ? 1 : 0.5, 3),
      ];
      const sc = scoreOf2(cs);
      const variant = F.dir[i] > 0 ? 'bullish' : 'bearish';
      ev.push(makeEvent(this, { state: beyondOpen ? 'confirmed' : 'approximate', score: sc.score, coverage: sc.coverage, variant, direction: F.dir[i] > 0 ? 'bullish-traditional' : 'bearish-traditional', startIndex: i - 3, endIndex: i, detectedIndex: i, criteria: cs, explanation: '同方向の3本を第4足が一気に打ち消した（三線打）。始値条件は連続足では等号に退化するため判定に含めない。' }));
    }
    return ev;
  }
}));

// ---- unique-three-river (defs-driven; Stage 5-B-2 final batch) ----
registerRule(defRule('unique-three-river', {
  id: 'unique-three-river', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 2; i < bars.length; i++) {
      const idx = [i - 2, i - 1, i];
      if (!idx.every(j => bars[j].complete)) continue;
      if (!(F.dir[i - 2] < 0 && F.bodyRatio[i - 2] >= P.bodyRatioMin)) continue;
      if (!(F.dir[i - 1] < 0 && F.body[i - 1] <= P.smallBodyRatioMax * F.body[i - 2])) continue;
      const lowerRatio = F.range[i - 1] > 0 ? F.lower[i - 1] / F.range[i - 1] : 0;
      if (lowerRatio < P.lowerVsRangeMin) continue;
      const newLow = bars[i - 1].low < bars[i - 2].low;
      const eqLow = bars[i - 1].low <= bars[i - 2].low;
      if (!eqLow) continue;
      if (!(F.dir[i] > 0 && F.body[i] <= P.smallBodyRatioMax * F.body[i - 2])) continue;
      if (!(bars[i].close > bars[i - 1].close && bars[i].close < bars[i - 2].close)) continue;
      const cs = [
        critN('第1足が陰線の大実体', F.bodyRatio[i - 2], P.bodyRatioMin, true, Math.min(1, F.bodyRatio[i - 2]), 2),
        critN('第2足の下ヒゲ/値幅', lowerRatio, P.lowerVsRangeMin, true, Math.min(1, lowerRatio), 2),
        critN('第2足が安値を更新', newLow ? 1 : 0.5, 1, newLow, newLow ? 1 : 0.5, 2),
        critN('第3足は小陽線で終値が第1足終値未満', 1, 1, true, 1, 1),
      ];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, { state: newLow ? 'confirmed' : 'approximate', score: sc.score, coverage: sc.coverage, variant: null, direction: 'bullish-traditional', startIndex: i - 2, endIndex: i, detectedIndex: i, criteria: cs, explanation: '長い陰線、小実体で長い下ヒゲの陰線（安値更新）、小陽線の組み合わせ（特異三川底）。第3足の終値が第1足終値を下回る反発の弱さが特徴。' }));
    }
    return ev;
  }
}));

// ---- stick-sandwich (defs-driven; Stage 5-B-2 final batch; equal-close family) ----
registerRule(defRule('stick-sandwich', {
  id: 'stick-sandwich', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 2; i < bars.length; i++) {
      const idx = [i - 2, i - 1, i];
      if (!idx.every(j => bars[j].complete)) continue;
      if (!(F.dir[i - 2] < 0 && F.dir[i - 1] > 0 && F.dir[i] < 0)) continue;
      const atr = F.atr14[i];
      if (atr == null || !(atr > 0)) continue; // no ATR history -> no judgment
      const diff = Math.abs(bars[i].close - bars[i - 2].close);
      const eq = diff <= P.atrTolRatio * atr;
      const near = diff <= P.approxAtrTolRatio * atr;
      if (!near) continue;
      const cs = [
        critN('陰線・陽線・陰線の並び', 1, 1, true, 1, 1),
        critN('両端の終値差/ATR14', diff / atr, P.atrTolRatio, eq, eq ? 1 : 0.5, 3),
      ];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, { state: eq ? 'confirmed' : 'approximate', score: sc.score, coverage: sc.coverage, variant: null, direction: 'bullish-traditional', startIndex: i - 2, endIndex: i, detectedIndex: i, criteria: cs, explanation: '陰線・陽線・陰線で両端の終値がほぼ一致する形（スティックサンドイッチ）。伝統解釈では下値の支持。終値一致はATR14比で判定する。' }));
    }
    return ev;
  }
}));

// ---- ladder (defs-driven; Stage 5-B-2 final batch; count fixed at 5 bars) ----
registerRule(defRule('ladder', {
  id: 'ladder', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 4; i < bars.length; i++) {
      const idx = [i - 4, i - 3, i - 2, i - 1, i];
      if (!idx.every(j => bars[j].complete)) continue;
      for (const form of ['bottom', 'top']) {
        const s = form === 'bottom' ? -1 : 1;
        if (!(F.dir[i - 4] === s && F.dir[i - 3] === s && F.dir[i - 2] === s)) continue;
        const prog = s < 0
          ? (bars[i - 3].close < bars[i - 4].close && bars[i - 2].close < bars[i - 3].close)
          : (bars[i - 3].close > bars[i - 4].close && bars[i - 2].close > bars[i - 3].close);
        if (!prog) continue;
        const shadow = form === 'bottom' ? F.upper[i - 1] : F.lower[i - 1];
        const shadowRatio = F.range[i - 1] > 0 ? shadow / F.range[i - 1] : 0;
        if (shadowRatio < P.shadowVsRangeMin) continue;
        if (F.dir[i] !== -s) continue;
        const bodyEnd = form === 'bottom' ? Math.max(bars[i - 1].open, bars[i - 1].close) : Math.min(bars[i - 1].open, bars[i - 1].close);
        const beyondEnd = form === 'bottom' ? bars[i].close > bodyEnd : bars[i].close < bodyEnd;
        const beyondClose = form === 'bottom' ? bars[i].close > bars[i - 1].close : bars[i].close < bars[i - 1].close;
        if (!beyondClose) continue;
        const cs = [
          critN('3本連続で同方向・終値進行', 1, 1, true, 1, 2),
          critN('第4足の反転側ヒゲ/値幅', shadowRatio, P.shadowVsRangeMin, true, Math.min(1, shadowRatio), 2),
          critN('第5足が逆方向で第4足実体端を超える', beyondEnd ? 1 : 0.5, 1, beyondEnd, beyondEnd ? 1 : 0.5, 3),
        ];
        const sc = scoreOf2(cs);
        ev.push(makeEvent(this, { state: beyondEnd ? 'confirmed' : 'approximate', score: sc.score, coverage: sc.coverage, variant: form, direction: form === 'bottom' ? 'bullish-traditional' : 'bearish-traditional', startIndex: i - 4, endIndex: i, detectedIndex: i, criteria: cs, explanation: form === 'bottom'
          ? '陰線の連続の後、上ヒゲの足を経て陽線が実体上端を超えた（ラダー底、本数は5本に固定）。'
          : '陽線の連続の後、下ヒゲの足を経て陰線が実体下端を超えた（ラダー天、本数は5本に固定）。' }));
      }
    }
    return ev;
  }
}));

// ---- streak (defs-driven; observation counter; Stage 5-B-2 final batch) ----
registerRule(defRule('streak', {
  id: 'streak', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    let runLen = 0, runDir = 0;
    for (let i = 0; i < bars.length; i++) {

      else if (d !== 0) { runLen = 1; runDir = d; }
      else { runLen = 0; runDir = 0; }
      if (!bars[i].complete || runLen < P.minStreak) continue;

      ev.push(makeEvent(this, { state: 'observation', score: null, coverage: 1, variant: runDir > 0 ? 'bullish' : 'bearish', direction: runDir > 0 ? 'bullish-traditional' : 'bearish-traditional', startIndex: i - runLen + 1, endIndex: i, detectedIndex: i, criteria: cs, explanation: `${runLen}本連続の${runDir > 0 ? '陽線' : '陰線'}（終値単調）。観察記録であり、方向の予測ではない。` }));
    }

// ---- breakaway-windowless (defs-driven; original windowless type; Stage 5-B-2 final batch) ----
registerRule(defRule('breakaway-windowless', {
  id: 'breakaway-windowless', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [], P = this.parameters;
    for (let i = 4; i < bars.length; i++) {
      const idx = [i - 4, i - 3, i - 2, i - 1, i];
      if (!idx.every(j => bars[j].complete)) continue;
      const d = F.dir[i - 4];
      if (d === 0 || F.bodyRatio[i - 4] < P.bodyRatioMin) continue;
      const prog = d > 0
        ? (bars[i - 3].close < bars[i - 4].close && bars[i - 2].close < bars[i - 3].close && bars[i - 1].close < bars[i - 2].close)
        : (bars[i - 3].close > bars[i - 4].close && bars[i - 2].close > bars[i - 3].close && bars[i - 1].close > bars[i - 2].close);
      if (!prog) continue;
      if (F.dir[i] !== -d) continue;
      const body1 = F.body[i - 4];
      if (!(body1 > 0)) continue;
      const pen = d > 0 ? (bars[i - 4].close - bars[i].close) / body1 : (bars[i].close - bars[i - 4].close) / body1;
      const inside = pen > 0 && pen < 1;
      const near = pen >= -0.25 && pen <= 0;
      if (!(inside || near)) continue;
      const cs = [
        critN('第1足が大実体', F.bodyRatio[i - 4], P.bodyRatioMin, true, Math.min(1, F.bodyRatio[i - 4]), 2),
        critN('中間3本が逆方向へ終値進行', 1, 1, true, 1, 2),
        critN('第5足の第1足実体への侵入度', pen, 0, inside, inside ? Math.min(1, pen + 0.5) : 0.5, 3),
      ];
      const sc = scoreOf2(cs);
      ev.push(makeEvent(this, { state: inside ? 'confirmed' : 'approximate', score: sc.score, coverage: sc.coverage, variant: d > 0 ? 'up' : 'down', direction: d > 0 ? 'bearish-traditional' : 'bullish-traditional', startIndex: i - 4, endIndex: i, detectedIndex: i, criteria: cs, explanation: '強い実体の後に逆方向へ3本進み、最終足が第1足の実体内へ切り戻した（離脱足の窓なし型・独自）。窓を必須とする原型の成立ではない。' }));
    }
    return ev;
  }
}));

// ---------- Stage 5-C-1: moving-average / MACD family (v0.7, JSON-driven) ----------
// Shared conventions (defs 0.6): a cross is a STRICT sign change of the
// difference series (equality on either side is not a cross); no event while
// a needed feature is null; features are not reset at session boundaries.

// Generic strict cross of two series a (fast) vs b (slow) at bar i.
function crossAt(A, B, i) {
  const a0 = A[i - 1], b0 = B[i - 1], a1 = A[i], b1 = B[i];
  if (a0 == null || b0 == null || a1 == null || b1 == null) return 0;
  if (a0 < b0 && a1 > b1) return 1;
  if (a0 > b0 && a1 < b1) return -1;
  return 0;
}
// Strict zero cross of one series at bar i.
function zeroCrossAt(S, i) {
  const s0 = S[i - 1], s1 = S[i];
  if (s0 == null || s1 == null) return 0;
  if (s0 < 0 && s1 > 0) return 1;
  if (s0 > 0 && s1 < 0) return -1;
  return 0;
}

  }
}));

// GMMA group-mean cross (Stage 5-E-4; project-original judgment on the
// generally known 12-EMA GMMA composition). Representatives are the
// plain means S (short group 3/5/8/10/12/15) and L (long group
// 30/35/40/45/50/60) of the close EMAs; a strict sign change of
// D = S - L between ADJACENT valid completed bars fires once. No fire
// through equality, at the first valid bar, across a gap (null /
// non-finite / incomplete bar resets adjacency), and no refire while
// the sign persists. A mean cross does NOT imply every short line is
// above every long line; no separation/order/width conditions.
registerRule(defRule('gmma-cross', {
  id: 'gmma-cross', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, ev = [];
    const SH = [F.ema3, F.ema5, F.ema8, F.ema10, F.ema12, F.ema15];
    const LO = [F.ema30, F.ema35, F.ema40, F.ema45, F.ema50, F.ema60];
    let prev = null;
    for (let t = 0; t < bars.length; t++) {
      let s = 0, l = 0, ok = !!bars[t].complete;
      if (ok) {
        for (const a of SH) { const v = a[t]; if (v == null || !Number.isFinite(v)) { ok = false; break; } s += v; }
        if (ok) for (const a of LO) { const v = a[t]; if (v == null || !Number.isFinite(v)) { ok = false; break; } l += v; }
      }
      if (!ok) { prev = null; continue; }
      s /= 6; l /= 6;
      const d = s - l;
      if (prev) {
        const up = prev.d < 0 && d > 0, down = prev.d > 0 && d < 0;
        if (up || down) {
          const cs = [critN('群平均差 D（前足）', prev.d, 0, true, 1, 1, true),
                      critN('群平均差 D（当足）', d, 0, true, 1, 1, true),
                      critN('短期群平均 S（当足）', s, null, true, 1, 1, true),
                      critN('長期群平均 L（当足）', l, null, true, 1, 1, true)];
          const sc = scoreOf2(cs);
          ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: up ? 'up' : 'down', direction: up ? 'bullish-traditional' : 'bearish-traditional', startIndex: t, endIndex: t, detectedIndex: t, criteria: cs, explanation: `GMMA群平均が${up ? '上' : '下'}向きに交差した：短期群（EMA 3・5・8・10・12・15）の平均 ${fmt(s)} と長期群（EMA 30・35・40・45・50・60）の平均 ${fmt(l)} の差が、前足 ${fmt(prev.d)} から当足 ${fmt(d)} へ厳密に符号変化した。群平均の交差であり、全短期線が全長期線より${up ? '上' : '下'}にあることは意味しない。群平均による判定はプロジェクト独自の操作的定義。伝統的な解釈であり予測ではない。` }));
        }
      }
      prev = { d };
    }
    return ev;
  }
}));

registerRule(defRule('perfect-order', {
