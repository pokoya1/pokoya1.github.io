// --- Minimal geometric foundation (Stage 5-D-3): ordinary least squares
// over (barIndex, price) points. a = Sxy / Sxx with Sxy = sum((x-xbar)(y-ybar)),
// Sxx = sum((x-xbar)^2); b = ybar - a*xbar. Pivot indices strictly increase,
// so Sxx > 0 for any two or more skeleton points (no zero-variance case).
// Lines fitted from a candidate's pivots are FIXED at the candidate's birth
// and are never refit with later bars.
function fitLine(points) {
  const n = points.length;
  const mx = points.reduce((s, p) => s + p.x, 0) / n, my = points.reduce((s, p) => s + p.y, 0) / n;
  let sxy = 0, sxx = 0;
  for (const p of points) { sxy += (p.x - mx) * (p.y - my); sxx += (p.x - mx) * (p.x - mx); }
  const a = sxx > 0 ? sxy / sxx : 0;
  return { a, b: my - a * mx, at: (x) => a * x + (my - a * mx) };
}

// 16. Triangle, symmetric type (Stage 5-D-3 batch 1, defs 0.19).
// Skeleton: five alternating CONFIRMED pivots (either orientation). The
// upper/lower lines are OLS fits over each side's pivot points only (all-bar
// highs/lows would import unconfirmed extremes and non-skeleton noise),
// fixed at the birth (fifth pivot's confirmedIndex) and never refit. Shape
// gates at birth: each side's total travel over the skeleton span is at
// least slopeAtr x ATRref with the converging sign (upper down, lower up);
// every skeleton pivot stays within containAtr x ATRref inside its side's
// line; the width at the last pivot is positive and narrower than at the
// first pivot. Horizontal-sided (ascending/descending) types fail the
// slope-materiality gate by construction and are deferred. Watch: from
// born+1 for expireBars; on each bar the apex (upper <= lower) expires the
// candidate BEFORE any break test; a strict close beyond a line confirms
// with variant up/down; equality is not a break; variant is null while
// unbroken. x is the bar index (one bar is one step across lunch/day gaps).
registerRule(defRule('triangle', {
  id: 'triangle', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, P = this.parameters, ev = [];
    const wf = ctx.waveforms[P.zigzagScale];
    if (!wf) return ev;
    const piv = wf.pivots, closes = bars.map(b => b.close);
    for (let s = 0; s + 4 < piv.length; s++) {
      const q = piv.slice(s, s + 5);
      if (!(q[1].kind !== q[0].kind && q[2].kind === q[0].kind && q[3].kind !== q[0].kind && q[4].kind === q[0].kind)) continue;
      const highs = q.filter(p => p.kind === 'high'), lows = q.filter(p => p.kind === 'low');
      const atrRef = F.atr14[q[4].pivotIndex];
      if (atrRef == null || atrRef <= 0) continue;
      const U = fitLine(highs.map(p => ({ x: p.pivotIndex, y: p.price })));
      const Lw = fitLine(lows.map(p => ({ x: p.pivotIndex, y: p.price })));
      const x1 = q[0].pivotIndex, x5 = q[4].pivotIndex, span = x5 - x1;
      const upTravel = -U.a * span / atrRef, loTravel = Lw.a * span / atrRef;
      const wStart = U.at(x1) - Lw.at(x1), wEnd = U.at(x5) - Lw.at(x5);
      const gaps = [q[1].pivotIndex - q[0].pivotIndex, q[2].pivotIndex - q[1].pivotIndex, q[3].pivotIndex - q[2].pivotIndex, q[4].pivotIndex - q[3].pivotIndex];
      // No containment gate: the fitted lines are regressions, not envelopes.
      // A natural triangle whose legs shrink in bar count leaves its middle
      // pivot above the OLS upper line (measured 0.57 ATR on the reference
      // synthetic), so requiring pivots to stay inside their line rejects
      // textbook shapes; residuals are part of the regression definition.
      const cs = [crit('上辺の下降（区間移動量 ≥ ATR×0.5）', upTravel, P.slopeAtr, upTravel >= P.slopeAtr, Math.min(1, Math.max(0, upTravel) / P.slopeAtr), 25, true),
                    crit('下辺の上昇（区間移動量 ≥ ATR×0.5）', loTravel, P.slopeAtr, loTravel >= P.slopeAtr, Math.min(1, Math.max(0, loTravel) / P.slopeAtr), 25, true),
                    crit('収束（終端の幅が始端より狭く正）', wStart > 0 ? wEnd / wStart : null, 1, wEnd > 0 && wEnd < wStart, wStart > 0 ? Math.max(0, 1 - wEnd / wStart) : 0, 20, true),
                    crit('転換点間隔 2〜30本', Math.max(...gaps), P.maxGap, gaps.every(g => g >= P.minGap && g <= P.maxGap), 1, 10, true),
                    crit('終値の辺ブレイク', null, null, false, 0, 20, true)];
      if (!(cs[0].pass && cs[1].pass && cs[2].pass && cs[3].pass)) continue;
      const born = q[4].confirmedIndex, limit = Math.min(bars.length - 1, born + P.expireBars);
      let outcome = null;
      for (let j = born + 1; j <= limit; j++) {
        if (U.at(j) <= Lw.at(j)) { outcome = { kind: 'expired', index: j, why: 'apex' }; break; }
        if (closes[j] > U.at(j)) { outcome = { kind: 'break', index: j, dir: 'up' }; break; }
        if (closes[j] < Lw.at(j)) { outcome = { kind: 'break', index: j, dir: 'down' }; break; }
      }
      if (!outcome && bars.length - 1 > born + P.expireBars) outcome = { kind: 'expired', index: born + P.expireBars, why: 'timeout' };
      const toIdx = outcome ? outcome.index : limit;
      const base = { startIndex: x1, endIndex: x5, overlays: [{ type: 'trendline', role: 'upper', from: x1, to: toIdx, priceFrom: U.at(x1), priceTo: U.at(toIdx) }, { type: 'trendline', role: 'lower', from: x1, to: toIdx, priceFrom: Lw.at(x1), priceTo: Lw.at(toIdx) }, { type: 'pivots', points: q.map(p => ({ index: p.pivotIndex, price: p.price, type: p.kind })) }] };
      if (outcome && outcome.kind === 'break') {
        const up = outcome.dir === 'up';
        cs[4] = crit(cs[4].name, closes[outcome.index], up ? U.at(outcome.index) : Lw.at(outcome.index), true, 1, 20, true);
        ev.push(makeEvent(this, { ...base, variant: outcome.dir, direction: up ? 'bullish-traditional' : 'bearish-traditional', state: 'confirmed', score: scoreOf(cs), detectedIndex: outcome.index, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'confirmed', index: outcome.index }], explanation: `三角持ち合い（対称型）が成立。終値が${up ? '上辺' : '下辺'}を${up ? '上抜け' : '下抜け'}した（上辺の傾き ${fmt(U.a, 2)}円/本、下辺の傾き ${fmt(Lw.a, 2)}円/本、幅は ${fmt(wStart)}円から ${fmt(wEnd)}円へ収束）。形状の一致は予測を意味しない。` }));
      } else if (outcome && outcome.kind === 'expired') {
        ev.push(makeEvent(this, { ...base, state: 'expired', score: scoreOf(cs), detectedIndex: born, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'expired', index: outcome.index }], explanation: outcome.why === 'apex' ? '三角持ち合い（対称型）の候補は、2線の交点（頂点）に達して失効した（ブレイクには至らなかった）。' : `三角持ち合い（対称型）の候補は監視窓（${P.expireBars}本）内にブレイクせず期限切れで失効した。` }));
      } else {
        ev.push(makeEvent(this, { ...base, state: 'forming', score: scoreOf(cs), detectedIndex: born, criteria: cs, explanation: '三角持ち合い（対称型）を形成中。5ピボットは確認済みで、終値の辺ブレイク待ち（未成立）。' }));
      }
    }
    return ev;
  }
}));

// 17. Rectangle break (Stage 5-D-3 batch 2, defs 0.20). Skeleton: four
// alternating CONFIRMED pivots (two highs, two lows; touches=2 per side,
// adopted from the catalog's provisional value). The band levels are the
// extremes of the touches (upper = max of the highs, lower = min of the
// lows) so the band contains its defining pivots by construction; mean or
// band-center levels would leave a touch pivot outside its own band.
// Shape gates at birth: each side's spread is within proxAtr x ATRref
// (equality passes; this also rejects an outlier touch), the height is at
// least minHeightAtr x ATRref, and each leg spans minGap..maxGap bars.
// There is no separate invalidation: a close outside the band IS the
// break. Watch from born+1 for expireBars; a strict close beyond a level
// confirms with variant up/down; equality is not a break; timeout expires;
// variant is null while unbroken. Distinct from triangle by construction
// (horizontal proximity here vs opposing slopes and convergence there);
// boundary skeletons may satisfy both or neither.
registerRule(defRule('rectangle-break', {
  id: 'rectangle-break', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, P = this.parameters, ev = [];
    const wf = ctx.waveforms[P.zigzagScale];
    if (!wf) return ev;
    const piv = wf.pivots, closes = bars.map(b => b.close);
    for (let s = 0; s + 3 < piv.length; s++) {
      const q = piv.slice(s, s + 4);
      if (!(q[1].kind !== q[0].kind && q[2].kind === q[0].kind && q[3].kind !== q[0].kind)) continue;
      const highs = q.filter(p => p.kind === 'high'), lows = q.filter(p => p.kind === 'low');
      const atrRef = F.atr14[q[3].pivotIndex];
      if (atrRef == null || atrRef <= 0) continue;
      const upper = Math.max(...highs.map(p => p.price)), lower = Math.min(...lows.map(p => p.price));
      const spH = (upper - Math.min(...highs.map(p => p.price))) / atrRef;
      const spL = (Math.max(...lows.map(p => p.price)) - lower) / atrRef;
      const height = (upper - lower) / atrRef;
      const gaps = [q[1].pivotIndex - q[0].pivotIndex, q[2].pivotIndex - q[1].pivotIndex, q[3].pivotIndex - q[2].pivotIndex];
      const cs = [crit('上限の近接（高値の広がり ≤ ATR×0.5）', spH, P.proxAtr, spH <= P.proxAtr, 1 - Math.min(1, spH / P.proxAtr) * 0.5, 20, true),
                    crit('下限の近接（安値の広がり ≤ ATR×0.5）', spL, P.proxAtr, spL <= P.proxAtr, 1 - Math.min(1, spL / P.proxAtr) * 0.5, 20, true),
                    crit('レンジの高さ（≥ ATR×1.0）', height, P.minHeightAtr, height >= P.minHeightAtr, Math.min(1, height / P.minHeightAtr), 15, true),
                    crit('各辺の接触回数（≥ 2回）', Math.min(highs.length, lows.length), P.touches, highs.length >= P.touches && lows.length >= P.touches, 1, 15, true),
                    crit('転換点間隔 2〜30本', Math.max(...gaps), P.maxGap, gaps.every(g => g >= P.minGap && g <= P.maxGap), 1, 10, true),
                    crit('終値の帯ブレイク', null, null, false, 0, 20, true)];
      if (!(cs[0].pass && cs[1].pass && cs[2].pass && cs[4].pass)) continue;
      const born = q[3].confirmedIndex, limit = Math.min(bars.length - 1, born + P.expireBars);
      let outcome = null;
      for (let j = born + 1; j <= limit; j++) {
        if (closes[j] > upper) { outcome = { kind: 'break', index: j, dir: 'up' }; break; }
        if (closes[j] < lower) { outcome = { kind: 'break', index: j, dir: 'down' }; break; }
      }
      if (!outcome && bars.length - 1 > born + P.expireBars) outcome = { kind: 'expired', index: born + P.expireBars };
      const legs = wf.swings.filter(w => w.from && w.to && q.some(p => p.key === w.from.key) && q.some(p => p.key === w.to.key));
      const crossNote = legs.some(w => w.crossesDay) ? '（日跨ぎを含む）' : legs.some(w => w.crossesSession) ? '（昼休み跨ぎを含む）' : '';
      const base = { startIndex: q[0].pivotIndex, endIndex: q[3].pivotIndex, overlays: [{ type: 'range-band', upper, lower, from: q[0].pivotIndex, to: outcome ? outcome.index : limit }, { type: 'pivots', points: q.map(p => ({ index: p.pivotIndex, price: p.price, type: p.kind })) }] };
      if (outcome && outcome.kind === 'break') {
        const up = outcome.dir === 'up';
        cs[5] = crit(cs[5].name, closes[outcome.index], up ? upper : lower, true, 1, 20, true);
        ev.push(makeEvent(this, { ...base, variant: outcome.dir, direction: up ? 'bullish-traditional' : 'bearish-traditional', state: 'confirmed', score: scoreOf(cs), detectedIndex: outcome.index, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'confirmed', index: outcome.index }], explanation: `水平レンジ（上限 ${fmt(upper)}円・下限 ${fmt(lower)}円${crossNote}）を終値が${up ? '上抜け' : '下抜け'}した。各辺2回の接触で範囲が確定していた。形状の一致は予測を意味しない。` }));
      } else if (outcome && outcome.kind === 'expired') {
        ev.push(makeEvent(this, { ...base, state: 'expired', score: scoreOf(cs), detectedIndex: born, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'expired', index: outcome.index }], explanation: `水平レンジ（上限 ${fmt(upper)}円・下限 ${fmt(lower)}円${crossNote}）は監視窓（${P.expireBars}本）内にブレイクせず期限切れで失効した。` }));
      } else {
        ev.push(makeEvent(this, { ...base, state: 'forming', score: scoreOf(cs), detectedIndex: born, criteria: cs, explanation: `水平レンジ（上限 ${fmt(upper)}円・下限 ${fmt(lower)}円${crossNote}）を形成中。4ピボットは確認済みで、終値の帯ブレイク待ち（未成立）。` }));
      }
    }
    return ev;
  }
}));

// Breakout retest (Stage 5-E-7 restart; method E — event
// referencing). For each CONFIRMED rectangle-break record, the old
// upper (up break) or lower (down break) is FIXED as the level M and
// the tolerance e = 0.5 x ATR14[b] is FIXED at the break bar b (the
// record's actual confirmed transition); neither is recomputed during
// the watch. The watch runs b+1..b+30 and accepts only the single-bar
// type: previous close strictly outside the band on the break side,
// the bar's extreme (low for up, high for down) inside the CLOSED
// band [M-e, M+e], and the close strictly back outside. First success
// ends the watch; a failure close (beyond the far side of the band)
// ends it internally; a deep wick alone does not. A gap in the
// observations (incomplete bar, non-finite values) aborts the watch
// with no resume. The event id carries the source record's full
// eventId as its suffix (proposal A), so distinct source individuals
// firing at the same b/t/level still get distinct ids.
registerRule(defRule('breakout-retest', {
  id: 'breakout-retest', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, P = this.parameters, ev = [];
    const sources = ctx.internalEvents['rectangle-break'] || [];
    const seen = new Map();
    for (const s of sources) {
      if (s.state !== 'confirmed') continue;
      const conf = (s.history || []).find(h => h.state === 'confirmed');
      if (!conf) continue;
      const band = (s.overlays || []).find(o => o.type === 'range-band');
      if (!band || (s.variant !== 'up' && s.variant !== 'down')) continue;
      const up = s.variant === 'up';
      const b = conf.index, M = up ? band.upper : band.lower;
      const fp = `${s.variant}|${b}|${band.upper}|${band.lower}|${s.startIndex}`;
      if (seen.has(s.eventId)) {
        if (seen.get(s.eventId) !== fp) throw new Error(`breakout-retest: source id ${s.eventId} carries conflicting fixed information`);
        continue; // duplicate source record -> one watch
      }
      seen.set(s.eventId, fp);
      const bc = bars[b];
      if (!bc || !Number.isFinite(bc.close) || !(up ? bc.close > M : bc.close < M)) continue; // record/bars inconsistency
      const atr = F.atr14[b];
      if (atr == null || !Number.isFinite(atr) || atr <= 0) continue;
      const e = P.toleranceAtr * atr;
      const last = Math.min(bars.length - 1, b + P.watchBars);
      for (let t = b + 1; t <= last; t++) {
        const bar = bars[t], prev = bars[t - 1];
        if (!bar.complete || !prev.complete) break; // observation gap aborts the watch
        const c = bar.close, pc = prev.close, ext = up ? bar.low : bar.high;
        if (!Number.isFinite(c) || !Number.isFinite(pc) || !Number.isFinite(ext)) break;
        if (up ? c < M - e : c > M + e) break; // failure close ends the watch internally
        const prevOut = up ? pc > M + e : pc < M - e;
        const closeOut = up ? c > M + e : c < M - e;
        const inBand = ext >= M - e && ext <= M + e;
        if (!(prevOut && inBand && closeOut)) continue;
        const cs = [critN('元水準 M（旧上限／旧下限で固定）', M, null, true, 1, 1, false),
                    critN('許容幅 e = 0.5 × ATR14[b]', e, null, true, 1, 1, false),
                    critN('ATR14[b]', atr, null, true, 1, 1, false),
                    critN('前足終値の外側余裕（方向調整済み）', up ? pc - (M + e) : (M - e) - pc, 0, true, 1, 2, true),
                    critN('接触の帯内余裕（近い側）', Math.min(ext - (M - e), (M + e) - ext), 0, true, 1, 2, true),
                    critN('当足終値の外側余裕（方向調整済み）', up ? c - (M + e) : (M - e) - c, 0, true, 1, 2, true),
                    critN('経過本数（t − b）', t - b, P.watchBars, true, 1, 1, false)];
        const sc = scoreOf2(cs);
        ev.push(makeEvent(this, { state: 'confirmed', score: sc.score, coverage: sc.coverage, variant: up ? 'bullish' : 'bearish', direction: up ? 'bullish-traditional' : 'bearish-traditional', startIndex: b, endIndex: t, detectedIndex: t, criteria: cs, idSuffix: s.eventId,
          overlays: [{ type: 'source', ruleId: 'rectangle-break', eventId: s.eventId, breakIndex: b, level: M, tolerance: e }],
          explanation: `rectangle-break（${s.eventId}、確定足 b=${b}）の旧${up ? '上限' : '下限'} ${fmt(M)}円へのリテスト。許容幅 e=${fmt(e)}円（0.5×ATR14[b]=${fmt(atr)}円、確定時に固定）。${t - b}本目に${up ? '安値' : '高値'}が帯 [${fmt(M - e)}, ${fmt(M + e)}] に触れ、終値 ${fmt(c)}円が帯の外側へ復帰した。足内経路は断定しない。独立した証拠や反転保証ではなく、伝統的な解釈であり予測ではない。` }));
        break; // first success ends the watch
      }
    }
    return ev;
  }
}));

// 18. Wedge (Stage 5-D-3 batch 3, defs 0.21). Skeleton: five alternating
// CONFIRMED pivots; the two lines are the same fitLine OLS fits over each
// side's pivot prices as triangle, fixed at the birth and never refit.
// Both slopes must share a sign (rising: both positive; falling: both
// negative) with each side's total travel over the span at least slopeAtr
// x ATRref, and the width must narrow by at least convergeAtr x ATRref
// with a positive end width: with same-sign slopes a bare wEnd < wStart
// cannot separate a wedge from a near-parallel channel (triangle needs no
// explicit floor because its opposing travels imply >= 1 ATR of
// narrowing). variant is the PATTERN type (rising/falling), fixed at
// birth; a confirmed event records the ACTUAL break direction (both
// directions are observable), and the traditional association (rising
// wedge bearish, falling wedge bullish) is commentary, not a condition.
// Watch from born+1 for expireBars: the apex check (upper <= lower)
// expires the candidate before any break test; strict close breaks only;
// equality is not a break; timeout expires.
registerRule(defRule('wedge', {
  id: 'wedge', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, P = this.parameters, ev = [];
    const wf = ctx.waveforms[P.zigzagScale];
    if (!wf) return ev;
    const piv = wf.pivots, closes = bars.map(b => b.close);
    for (let s = 0; s + 4 < piv.length; s++) {
      const q = piv.slice(s, s + 5);
      if (!(q[1].kind !== q[0].kind && q[2].kind === q[0].kind && q[3].kind !== q[0].kind && q[4].kind === q[0].kind)) continue;
      const highs = q.filter(p => p.kind === 'high'), lows = q.filter(p => p.kind === 'low');
      const atrRef = F.atr14[q[4].pivotIndex];
      if (atrRef == null || atrRef <= 0) continue;
      const U = fitLine(highs.map(p => ({ x: p.pivotIndex, y: p.price })));
      const Lw = fitLine(lows.map(p => ({ x: p.pivotIndex, y: p.price })));
      const type = U.a > 0 && Lw.a > 0 ? 'rising' : U.a < 0 && Lw.a < 0 ? 'falling' : null;
      if (!type) continue;
      const dir = type === 'rising' ? 1 : -1;
      const x1 = q[0].pivotIndex, x5 = q[4].pivotIndex, span = x5 - x1;
      const upTravel = dir * U.a * span / atrRef, loTravel = dir * Lw.a * span / atrRef;
      const wStart = U.at(x1) - Lw.at(x1), wEnd = U.at(x5) - Lw.at(x5);
      const narrowing = (wStart - wEnd) / atrRef;
      const gaps = [q[1].pivotIndex - q[0].pivotIndex, q[2].pivotIndex - q[1].pivotIndex, q[3].pivotIndex - q[2].pivotIndex, q[4].pivotIndex - q[3].pivotIndex];
      const cs = [crit('上辺の同方向の傾き（区間移動量 ≥ ATR×0.5）', upTravel, P.slopeAtr, upTravel >= P.slopeAtr, Math.min(1, Math.max(0, upTravel) / P.slopeAtr), 25, true),
                    crit('下辺の同方向の傾き（区間移動量 ≥ ATR×0.5）', loTravel, P.slopeAtr, loTravel >= P.slopeAtr, Math.min(1, Math.max(0, loTravel) / P.slopeAtr), 25, true),
                    crit('収束（幅の縮小 ≥ ATR×0.5・終端の幅が正）', narrowing, P.convergeAtr, wEnd > 0 && narrowing >= P.convergeAtr, Math.min(1, Math.max(0, narrowing) / P.convergeAtr), 20, true),
                    crit('転換点間隔 2〜30本', Math.max(...gaps), P.maxGap, gaps.every(g => g >= P.minGap && g <= P.maxGap), 1, 10, true),
                    crit('終値の辺ブレイク', null, null, false, 0, 20, true)];
      if (!(cs[0].pass && cs[1].pass && cs[2].pass && cs[3].pass)) continue;
      const born = q[4].confirmedIndex, limit = Math.min(bars.length - 1, born + P.expireBars);
      let outcome = null;
      for (let j = born + 1; j <= limit; j++) {
        if (U.at(j) <= Lw.at(j)) { outcome = { kind: 'expired', index: j, why: 'apex' }; break; }
        if (closes[j] > U.at(j)) { outcome = { kind: 'break', index: j, dir: 'up' }; break; }
        if (closes[j] < Lw.at(j)) { outcome = { kind: 'break', index: j, dir: 'down' }; break; }
      }
      if (!outcome && bars.length - 1 > born + P.expireBars) outcome = { kind: 'expired', index: born + P.expireBars, why: 'timeout' };
      const toIdx = outcome ? outcome.index : limit;
      const nm = type === 'rising' ? '上昇ウェッジ' : '下降ウェッジ';
      const base = { variant: type, startIndex: x1, endIndex: x5, overlays: [{ type: 'trendline', role: 'upper', from: x1, to: toIdx, priceFrom: U.at(x1), priceTo: U.at(toIdx) }, { type: 'trendline', role: 'lower', from: x1, to: toIdx, priceFrom: Lw.at(x1), priceTo: Lw.at(toIdx) }, { type: 'pivots', points: q.map(p => ({ index: p.pivotIndex, price: p.price, type: p.kind })) }] };
      if (outcome && outcome.kind === 'break') {
        const up = outcome.dir === 'up';
        cs[4] = crit(cs[4].name, closes[outcome.index], up ? U.at(outcome.index) : Lw.at(outcome.index), true, 1, 20, true);
        ev.push(makeEvent(this, { ...base, direction: up ? 'bullish-traditional' : 'bearish-traditional', state: 'confirmed', score: scoreOf(cs), detectedIndex: outcome.index, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'confirmed', index: outcome.index }], explanation: `${nm}が成立。終値が${up ? '上辺' : '下辺'}を${up ? '上抜け' : '下抜け'}した（上辺の傾き ${fmt(U.a, 2)}円/本、下辺の傾き ${fmt(Lw.a, 2)}円/本、幅は ${fmt(wStart)}円から ${fmt(wEnd)}円へ収束）。ブレイク方向は実際に起きた方向であり、形状の一致は予測を意味しない。` }));
      } else if (outcome && outcome.kind === 'expired') {
        ev.push(makeEvent(this, { ...base, state: 'expired', score: scoreOf(cs), detectedIndex: born, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'expired', index: outcome.index }], explanation: outcome.why === 'apex' ? `${nm}の候補は、2線の交点（頂点）に達して失効した（ブレイクには至らなかった）。` : `${nm}の候補は監視窓（${P.expireBars}本）内にブレイクせず期限切れで失効した。` }));
      } else {
        ev.push(makeEvent(this, { ...base, state: 'forming', score: scoreOf(cs), detectedIndex: born, criteria: cs, explanation: `${nm}を形成中。5ピボットは確認済みで、終値の辺ブレイク待ち（未成立）。` }));
      }
    }
    return ev;
  }
}));

// ---------- trendline-break (Stage 5-D-3 batch 4, defs 0.22) ----------
// Lines through the two most recent confirmed same-kind pivots (support
// from lows, resistance from highs), fixed at the second pivot's
// confirmation. A break is a CROSSING after birth: the previous close on
// the inner side and the current close strictly beyond the line — a
// candidate born with the price already outside its line cannot fire
// until the price returns inside and crosses again. Candidates live
// until broken or superseded by a newer same-kind pivot. Because this
// rule emits forming events for its candidates, a superseded candidate
// must still leave an event (the detector-wide causality contract: a
// prefix forming event must persist in the full run), so supersession
// ends the candidate as expired — unlike swing-break, whose levels never
// appear as events at all. Overlaps with the geometric rules are not
// suppressed.
registerRule(defRule('trendline-break', {
  id: 'trendline-break', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, P = this.parameters, ev = [];
    const wf = ctx.waveforms[P.zigzagScale];
    if (!wf) return ev;
    const piv = wf.pivots, closes = bars.map(b => b.close);
    const crossesDay = (from, to) => { for (let j = from + 1; j <= to; j++) if (bars[j] && bars[from] && bars[j].day !== bars[from].day) return true; return false; };
    for (let i = 0; i + 2 < piv.length; i++) {
      const p1 = piv[i], mid = piv[i + 1], p2 = piv[i + 2];
      if (p2.kind !== p1.kind || mid.kind === p1.kind) continue;
      const leg1 = mid.pivotIndex - p1.pivotIndex, leg2 = p2.pivotIndex - mid.pivotIndex;
      if (leg1 < P.minGap || leg2 < P.minGap) continue;
      const isRes = p1.kind === 'high';
      const line = fitLine([{ x: p1.pivotIndex, y: p1.price }, { x: p2.pivotIndex, y: p2.price }]);
      const born = p2.confirmedIndex;
      const sup = i + 4 < piv.length ? piv[i + 4].confirmedIndex : Infinity;
      const limit = Math.min(bars.length - 1, sup);
      let brk = null;
      for (let j = born + 1; j <= limit; j++) {
        const prevIn = isRes ? closes[j - 1] <= line.at(j - 1) : closes[j - 1] >= line.at(j - 1);
        const nowOut = isRes ? closes[j] > line.at(j) : closes[j] < line.at(j);
        if (prevIn && nowOut) { brk = j; break; }
      }
      const superseded = !brk && sup !== Infinity;
      const variant = isRes ? 'resistance' : 'support';
      const nm = isRes ? '抵抗線' : '支持線';
      const toIdx = brk !== null ? brk : limit;
      const cs = [crit('同種確定ピボット2点による直線', 2, 2, true, 1, 30, true),
                    crit('構成脚の間隔（各脚 ≥ 2本）', Math.min(leg1, leg2), P.minGap, true, 1, 20, true),
                    crit('終値の交差ブレイク', brk !== null ? closes[brk] : null, brk !== null ? line.at(brk) : null, brk !== null, brk !== null ? 1 : 0, 50, true)];
      const base = { variant, startIndex: p1.pivotIndex, endIndex: p2.pivotIndex, overlays: [{ type: 'trendline', role: variant, from: p1.pivotIndex, to: toIdx, priceFrom: line.at(p1.pivotIndex), priceTo: line.at(toIdx) }, { type: 'pivots', points: [p1, p2].map(p => ({ index: p.pivotIndex, price: p.price, type: p.kind })) }] };
      const dayNote = crossesDay(p1.pivotIndex, toIdx) ? '直線の区間は日を跨ぐ。' : '';
      if (brk !== null) {
        ev.push(makeEvent(this, { ...base, direction: isRes ? 'bullish-traditional' : 'bearish-traditional', state: 'confirmed', score: scoreOf(cs), detectedIndex: brk, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'confirmed', index: brk }], explanation: `${nm}（確定${isRes ? '高値' : '安値'}2点を結ぶ直線、傾き ${fmt(line.a, 2)}円/本）を終値が${isRes ? '上抜け' : '下抜け'}した（前足は線の内側）。トレンドラインの突破は線の定義に依存する価格事象であり、トレンド転換の証明ではない。${dayNote}` }));
      } else if (superseded) {
        ev.push(makeEvent(this, { ...base, state: 'expired', score: scoreOf(cs), detectedIndex: sup, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'expired', index: sup }], explanation: `${nm}（確定${isRes ? '高値' : '安値'}2点を結ぶ直線、傾き ${fmt(line.a, 2)}円/本）は、より新しい同種ピボットが確定して直線が置き換わり、ブレイクなく失効した。${dayNote}` }));
      } else {
        ev.push(makeEvent(this, { ...base, state: 'forming', score: scoreOf(cs), detectedIndex: born, criteria: cs, explanation: `${nm}（確定${isRes ? '高値' : '安値'}2点を結ぶ直線、傾き ${fmt(line.a, 2)}円/本）が存続中。終値の交差ブレイクはまだ起きていない（未成立）。${dayNote}` }));
      }
    }
    return ev;
  }
}));

// ---------- flag-pennant (Stage 5-D-3 batch 5, defs 0.23) ----------
// Pole = a completed foundation swing that is large (>= poleAtr x ATR14
// at the pole-end pivot) and fast (<= poleMaxBars). The consolidation
// skeleton is the pole-end pivot plus the next four confirmed pivots;
// its lines are fitted once at birth and never refit. pennant = material
// convergence with opposing/flat slopes; flag = width roughly maintained
// with mild slopes; same-sign material convergence (wedge territory)
// and material broadening form no candidate. A counter-direction break
// ends the candidate as expired (a failed continuation, kept in
// history). detectedIndex is the bar the recorded outcome was
// determined, per the trendline-break lesson.
registerRule(defRule('flag-pennant', {
  id: 'flag-pennant', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, P = this.parameters, ev = [];
    const wf = ctx.waveforms[P.zigzagScale];
    if (!wf) return ev;
    const piv = wf.pivots, closes = bars.map(b => b.close);
    const crossesDay = (from, to) => { for (let j = from + 1; j <= to; j++) if (bars[j] && bars[from] && bars[j].day !== bars[from].day) return true; return false; };
    for (let i = 1; i + 4 < piv.length; i++) {
      const A = piv[i - 1], B = piv[i];
      const atrRef = F.atr14[B.pivotIndex];
      if (atrRef == null || atrRef <= 0) continue;
      const poleH = Math.abs(B.price - A.price), poleBars = B.pivotIndex - A.pivotIndex;
      if (!(poleH >= P.poleAtr * atrRef && poleBars <= P.poleMaxBars)) continue;
      const up = B.price > A.price;
      const q = piv.slice(i, i + 5);
      const gaps = [q[1].pivotIndex - q[0].pivotIndex, q[2].pivotIndex - q[1].pivotIndex, q[3].pivotIndex - q[2].pivotIndex, q[4].pivotIndex - q[3].pivotIndex];
      if (!gaps.every(g => g >= P.minGap && g <= P.maxGap)) continue;
      const x1 = B.pivotIndex, x5 = q[4].pivotIndex, span = x5 - x1;
      const counter = q.filter(p => up ? p.kind === 'low' : p.kind === 'high');
      const deepest = up ? Math.min(...counter.map(p => p.price)) : Math.max(...counter.map(p => p.price));
      const retrace = (up ? B.price - deepest : deepest - B.price) / poleH;
      if (!(retrace <= P.retraceMax)) continue;
      const highs = q.filter(p => p.kind === 'high'), lows = q.filter(p => p.kind === 'low');
      const U = fitLine(highs.map(p => ({ x: p.pivotIndex, y: p.price })));
      const Lw = fitLine(lows.map(p => ({ x: p.pivotIndex, y: p.price })));
      const wStart = U.at(x1) - Lw.at(x1), wEnd = U.at(x5) - Lw.at(x5);
      const narrowing = (wStart - wEnd) / atrRef;
      const upTravel = U.a * span / atrRef, loTravel = Lw.a * span / atrRef;
      let type = null;
      if (wEnd > 0 && narrowing >= P.convergeAtr && U.a <= 0 && Lw.a >= 0) type = 'pennant';
      else if (Math.abs(narrowing) < P.convergeAtr && Math.abs(upTravel) <= P.flagTravelMax && Math.abs(loTravel) <= P.flagTravelMax) type = 'flag';
      if (!type) continue;
      const born = q[4].confirmedIndex, limit = Math.min(bars.length - 1, born + P.expireBars);
      let outcome = null;
      for (let j = born + 1; j <= limit; j++) {
        if (U.at(j) <= Lw.at(j)) { outcome = { kind: 'expired', index: j, why: 'apex' }; break; }
        if (up ? closes[j] > U.at(j) : closes[j] < Lw.at(j)) { outcome = { kind: 'break', index: j }; break; }
        if (up ? closes[j] < Lw.at(j) : closes[j] > U.at(j)) { outcome = { kind: 'expired', index: j, why: 'counter' }; break; }
      }
      if (!outcome && bars.length - 1 > born + P.expireBars) outcome = { kind: 'expired', index: born + P.expireBars, why: 'timeout' };
      const toIdx = outcome ? outcome.index : limit;
      const cs = [crit('ポールの大きさ（高さ ≥ ATR×4）', +(poleH / atrRef).toFixed(4), P.poleAtr, true, Math.min(1, (poleH / atrRef) / P.poleAtr), 25, true),
                    crit('ポールの速さ（到達 ≤ 20本）', poleBars, P.poleMaxBars, true, 1, 15, true),
                    crit('保ち合いの戻し（≤ ポールの50%）', +retrace.toFixed(4), P.retraceMax, true, Math.max(0, 1 - retrace), 20, true),
                    crit('保ち合いの形状（収束=pennant／平行・緩傾斜=flag）', type === 'pennant' ? +narrowing.toFixed(4) : +Math.abs(narrowing).toFixed(4), type === 'pennant' ? P.convergeAtr : P.convergeAtr, true, 1, 20, true),
                    crit('ポール方向への終値ブレイク', null, null, false, 0, 20, true)];
      const base = { variant: type, startIndex: A.pivotIndex, endIndex: x5, overlays: [{ type: 'trendline', role: 'upper', from: x1, to: toIdx, priceFrom: U.at(x1), priceTo: U.at(toIdx) }, { type: 'trendline', role: 'lower', from: x1, to: toIdx, priceFrom: Lw.at(x1), priceTo: Lw.at(toIdx) }, { type: 'pivots', points: [A, ...q].map(p => ({ index: p.pivotIndex, price: p.price, type: p.kind })) }] };
      const nm = type === 'pennant' ? 'ペナント' : '旗型';
      const dayNote = crossesDay(A.pivotIndex, toIdx) ? 'パターンの区間は日を跨ぐ。' : '';
      const shapeNote = `${up ? '上昇' : '下降'}ポール（高さ ${fmt(poleH)}円＝ATR×${fmt(poleH / atrRef, 1)}、${poleBars}本）の後に${nm}を形成。戻しはポールの ${fmt(retrace * 100, 0)}%。`;
      if (outcome && outcome.kind === 'break') {
        cs[4] = crit(cs[4].name, closes[outcome.index], up ? U.at(outcome.index) : Lw.at(outcome.index), true, 1, 20, true);
        ev.push(makeEvent(this, { ...base, direction: up ? 'bullish-traditional' : 'bearish-traditional', state: 'confirmed', score: scoreOf(cs), detectedIndex: outcome.index, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'confirmed', index: outcome.index }], explanation: `${shapeNote}終値がポールと同方向へブレイクして成立した。形状の一致は継続の証明や予測を意味しない。${dayNote}` }));
      } else if (outcome && outcome.kind === 'expired') {
        const whyText = outcome.why === 'counter' ? 'ポールと逆方向へ終値がブレイクし、継続形として失敗したため失効した。' : outcome.why === 'apex' ? '2線の交点（頂点）に達して失効した（ブレイクには至らなかった）。' : `監視窓（${P.expireBars}本）内にブレイクせず期限切れで失効した。`;
        ev.push(makeEvent(this, { ...base, state: 'expired', score: scoreOf(cs), detectedIndex: outcome.index, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'expired', index: outcome.index }], explanation: `${shapeNote}${whyText}${dayNote}` }));
      } else {
        ev.push(makeEvent(this, { ...base, state: 'forming', score: scoreOf(cs), detectedIndex: born, criteria: cs, explanation: `${shapeNote}保ち合いは確定し、同方向への終値ブレイク待ち（未成立）。${dayNote}` }));
      }
    }
    return ev;
  }
}));


// 22. Broadening formation (Stage 5-D-4 batch 1, defs 0.24). The
// mirror image of the symmetric triangle on the same machinery: five
// alternating CONFIRMED pivots, fitLine over each side's pivot prices,
// lines FIXED at birth (the fifth pivot's confirmedIndex), never
// refit; the fitted lines are regressions, not envelopes. Gates at
// birth: the upper slope is strictly positive with travel >= slopeAtr
// x ATRref, the lower slope is strictly negative with travel >=
// slopeAtr x ATRref (ATR14 at the fifth pivot's pivotIndex; equality
// passes), the width widens by >= widenAtr x ATRref (implied >= 1.0 x
// ATRref by the two travel gates; kept as an explicit measured
// criterion), and each leg spans minGap..maxGap bars. The lines
// diverge, so their crossing lies in the past and there is NO apex
// expiry: watch born+1..+expireBars; a strict close beyond either
// line confirms (variant = break direction, null while unbroken;
// equality is not a break); timeout expires; series end leaves
// forming. detectedIndex is the outcome-determination bar (the
// trendline-break / flag-pennant convention; the older shape rules
// record birth there for expired events — a known family split,
// handed to 5-D-5). Partition by construction: triangle needs
// convergence, wedge needs same-sign slopes, flag/pennant need
// narrowing or near-parallel lines; rectangle uses extreme levels
// and may co-fire on boundary shapes (overlaps are recorded, not
// suppressed). Thresholds mirror the wedge convergence floor by
// symmetry; they are project conventions, not literature values.
registerRule(defRule('broadening', {
  id: 'broadening', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, P = this.parameters, ev = [];
    const wf = ctx.waveforms[P.zigzagScale];
    if (!wf) return ev;
    const piv = wf.pivots, closes = bars.map(b => b.close);
    for (let s = 0; s + 4 < piv.length; s++) {
      const q = piv.slice(s, s + 5);
      if (!(q[1].kind !== q[0].kind && q[2].kind === q[0].kind && q[3].kind !== q[0].kind && q[4].kind === q[0].kind)) continue;
      const highs = q.filter(p => p.kind === 'high'), lows = q.filter(p => p.kind === 'low');
      const atrRef = F.atr14[q[4].pivotIndex];
      if (atrRef == null || atrRef <= 0) continue;
      const U = fitLine(highs.map(p => ({ x: p.pivotIndex, y: p.price })));
      const Lw = fitLine(lows.map(p => ({ x: p.pivotIndex, y: p.price })));
      const x1 = q[0].pivotIndex, x5 = q[4].pivotIndex, span = x5 - x1;
      const upTravel = U.a * span / atrRef, loTravel = -Lw.a * span / atrRef;
      const wStart = U.at(x1) - Lw.at(x1), wEnd = U.at(x5) - Lw.at(x5);
      const widening = (wEnd - wStart) / atrRef;
      const gaps = [q[1].pivotIndex - q[0].pivotIndex, q[2].pivotIndex - q[1].pivotIndex, q[3].pivotIndex - q[2].pivotIndex, q[4].pivotIndex - q[3].pivotIndex];
      const cs = [crit('上辺の上昇（傾き正・区間移動量 ≥ ATR×0.5）', upTravel, P.slopeAtr, U.a > 0 && upTravel >= P.slopeAtr, Math.min(1, Math.max(0, upTravel) / P.slopeAtr), 25, true),
                    crit('下辺の下降（傾き負・区間移動量 ≥ ATR×0.5）', loTravel, P.slopeAtr, Lw.a < 0 && loTravel >= P.slopeAtr, Math.min(1, Math.max(0, loTravel) / P.slopeAtr), 25, true),
                    crit('幅の拡大（拡大量 ≥ ATR×0.5）', widening, P.widenAtr, wStart > 0 && widening >= P.widenAtr, Math.min(1, Math.max(0, widening) / P.widenAtr), 20, true),
                    crit('転換点間隔 2〜30本', Math.max(...gaps), P.maxGap, gaps.every(g => g >= P.minGap && g <= P.maxGap), 1, 10, true),
                    crit('終値の辺ブレイク', null, null, false, 0, 20, true)];
      if (!(cs[0].pass && cs[1].pass && cs[2].pass && cs[3].pass)) continue;
      const born = q[4].confirmedIndex, limit = Math.min(bars.length - 1, born + P.expireBars);
      let outcome = null;
      for (let j = born + 1; j <= limit; j++) {
        if (closes[j] > U.at(j)) { outcome = { kind: 'break', index: j, dir: 'up' }; break; }
        if (closes[j] < Lw.at(j)) { outcome = { kind: 'break', index: j, dir: 'down' }; break; }
      }
      if (!outcome && bars.length - 1 > born + P.expireBars) outcome = { kind: 'expired', index: born + P.expireBars };
      const toIdx = outcome ? outcome.index : limit;
      const legs = wf.swings.filter(w => w.from && w.to && q.some(p => p.key === w.from.key) && q.some(p => p.key === w.to.key));
      const crossNote = legs.some(w => w.crossesDay) ? '（日跨ぎを含む）' : legs.some(w => w.crossesSession) ? '（昼休み跨ぎを含む）' : '';
      const base = { startIndex: x1, endIndex: x5, overlays: [{ type: 'trendline', role: 'upper', from: x1, to: toIdx, priceFrom: U.at(x1), priceTo: U.at(toIdx) }, { type: 'trendline', role: 'lower', from: x1, to: toIdx, priceFrom: Lw.at(x1), priceTo: Lw.at(toIdx) }, { type: 'pivots', points: q.map(p => ({ index: p.pivotIndex, price: p.price, type: p.kind })) }] };
      if (outcome && outcome.kind === 'break') {
        const up = outcome.dir === 'up';
        cs[4] = crit(cs[4].name, closes[outcome.index], up ? U.at(outcome.index) : Lw.at(outcome.index), true, 1, 20, true);
        ev.push(makeEvent(this, { ...base, variant: outcome.dir, direction: up ? 'bullish-traditional' : 'bearish-traditional', state: 'confirmed', score: scoreOf(cs), detectedIndex: outcome.index, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'confirmed', index: outcome.index }], explanation: `拡大型（発散）が成立。終値が${up ? '上辺' : '下辺'}を${up ? '上抜け' : '下抜け'}した（上辺の傾き ${fmt(U.a, 2)}円/本、下辺の傾き ${fmt(Lw.a, 2)}円/本、幅は ${fmt(wStart)}円から ${fmt(wEnd)}円へ拡大${crossNote}）。形状の一致は予測を意味しない。` }));
      } else if (outcome && outcome.kind === 'expired') {
        ev.push(makeEvent(this, { ...base, state: 'expired', score: scoreOf(cs), detectedIndex: outcome.index, criteria: cs, history: [{ state: 'forming', index: born }, { state: 'expired', index: outcome.index }], explanation: `拡大型の候補は監視窓（${P.expireBars}本）内にブレイクせず期限切れで失効した（幅は ${fmt(wStart)}円から ${fmt(wEnd)}円へ拡大${crossNote}）。` }));
      } else {
        ev.push(makeEvent(this, { ...base, state: 'forming', score: scoreOf(cs), detectedIndex: born, criteria: cs, explanation: `拡大型（発散）を形成中。5ピボットは確認済みで、終値の辺ブレイク待ち（未成立${crossNote}）。` }));
      }
    }
    return ev;
  }
}));

// 16. RSI divergence (Stage 5-E-1, defs 0.25). Method A, fixed in project
// doc section 44: over the CONFIRMED pivot sequence of the waveform
// foundation (zigzagScale=2, ATR mode as selected at run time), only the
// immediately preceding same-kind pivot forms a pair with each pivot
// (an opposite-kind pivot in between is allowed). Regular type only:
// a low pair with P2.price < P1.price and RSI14 at P2's pivot bar
// strictly above RSI14 at P1's pivot bar is bullish; a high pair with
// P2.price > P1.price and RSI strictly lower is bearish. The RSI is
// read at the pivot OCCURRENCE bar (F.rsi14), never at the confirmed
// bar. Equality on either side fails (strict inequalities). No spacing
// cap, no price/RSI difference threshold, no RSI zone condition and no
// extra trend condition. A pair whose RSI is null or non-finite at
// either pivot bar is unjudgeable and skipped — it is NOT replaced by
// an older same-kind pivot (the next pair still starts from P2).
// Provisional pivots are never used. Detection is at P2's
// confirmedIndex only (P1 is necessarily confirmed by then, pivots
// confirming in sequence); state is confirmed only, with the existing
// single-transition history at the confirmation bar. Hidden type and
// method B (independent indicator-extremum detection) are NOT
// implemented. sessionPolicy=continuous: pairs may cross lunch and
// day boundaries. Co-firing with other rules is allowed; the
// direction is the traditional interpretation, not a prediction.
registerRule(defRule('divergence-rsi', {
  id: 'divergence-rsi', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, P = this.parameters, ev = [];
    const wf = ctx.waveforms[P.zigzagScale];
    if (!wf) return ev;
    const last = { high: null, low: null };
    for (const p2 of wf.pivots) {
      const p1 = last[p2.kind];
      last[p2.kind] = p2;
      if (!p1) continue;
      const r1 = F.rsi14[p1.pivotIndex], r2 = F.rsi14[p2.pivotIndex];
      if (r1 == null || r2 == null || !Number.isFinite(r1) || !Number.isFinite(r2)) continue;
      const bull = p2.kind === 'low';
      const priceDiff = bull ? p1.price - p2.price : p2.price - p1.price;
      const rsiDiff = bull ? r2 - r1 : r1 - r2;
      if (!(priceDiff > 0 && rsiDiff > 0)) continue;
      const cs = [critN(bull ? '価格の安値が直前の安値ピボットより切り下がり（厳密）' : '価格の高値が直前の高値ピボットより切り上がり（厳密）', priceDiff, 0, true, 1, 2, true),
                  critN(bull ? '発生足のRSI14が前側ピボット発生足より上昇（厳密）' : '発生足のRSI14が前側ピボット発生足より下降（厳密）', rsiDiff, 0, true, 1, 2, true)];
      const sc = scoreOf2(cs);
      const b1 = bars[p1.pivotIndex], b2 = bars[p2.pivotIndex];
      const crossNote = b1 && b2 && b1.day != null && b2.day != null && b1.day !== b2.day ? '（日跨ぎのピボット対）' : '';
      ev.push(makeEvent(this, {
        state: 'confirmed', score: sc.score, coverage: sc.coverage,
        variant: bull ? 'bullish' : 'bearish',
        direction: bull ? 'bullish-traditional' : 'bearish-traditional',
        startIndex: p1.pivotIndex, endIndex: p2.pivotIndex, detectedIndex: p2.confirmedIndex, criteria: cs,
        overlays: [
          { type: 'pivots', points: [{ index: p1.pivotIndex, price: p1.price, type: p1.kind }, { index: p2.pivotIndex, price: p2.price, type: p2.kind }] },
        ],
        explanation: `確定ピボット対（${bull ? '安値' : '高値'} ${p1.pivotIndex} 本目の ${fmt(p1.price)} → ${bull ? '安値' : '高値'} ${p2.pivotIndex} 本目の ${fmt(p2.price)}）で、価格の${bull ? '安値が切り下がった' : '高値が切り上がった'}一方、発生足のRSI14は ${fmt(r1, 1)} → ${fmt(r2, 1)} と${bull ? '上昇' : '下降'}した。通常型の${bull ? '強気' : '弱気'}ダイバージェンス（方式A）${crossNote}。後側ピボットの確認足 ${p2.confirmedIndex} 本目で検出した。伝統的な解釈であり予測ではない。`,
      }));
    }
    return ev;
  }
}));

// 17. MACD / Stochastic divergence (Stage 5-E-2, defs 0.26). Method A
// inherited from the RSI rule above (project doc section 45, which
// fixed section 44's framework for these two): the same confirmed
// pivot pairs of the waveform foundation (zigzagScale=2, run-time ATR
// mode), the indicator read at each pivot's OCCURRENCE bar only,
// regular type only, strict inequalities, no spacing / difference /
// zone / trend additions, a null or non-finite pair is skipped and
// never bridged, provisional pivots unused, detection at P2's
// confirmedIndex, confirmed state only with the single-transition
// history. The shared helper below serves ONLY these two new rules;
// the RSI rule keeps its own implementation (section 45: do not touch
// it, no common refactor in this batch). Simultaneous firing of the
// three divergence indicators is allowed and is NOT independent
// evidence. Hidden type and method B are NOT implemented.
function divergencePairEvents(rule, ctx, series, ind) {
  const { bars } = ctx, P = rule.parameters, ev = [];
  const wf = ctx.waveforms[P.zigzagScale];
  if (!wf) return ev;
  const last = { high: null, low: null };
  for (const p2 of wf.pivots) {
    const p1 = last[p2.kind];
    last[p2.kind] = p2;
    if (!p1) continue;
    const v1 = series[p1.pivotIndex], v2 = series[p2.pivotIndex];
    if (v1 == null || v2 == null || !Number.isFinite(v1) || !Number.isFinite(v2)) continue;
    const bull = p2.kind === 'low';
    const priceDiff = bull ? p1.price - p2.price : p2.price - p1.price;
    const indDiff = bull ? v2 - v1 : v1 - v2;
    if (!(priceDiff > 0 && indDiff > 0)) continue;
    const cs = [critN(bull ? '価格の安値が直前の安値ピボットより切り下がり（厳密）' : '価格の高値が直前の高値ピボットより切り上がり（厳密）', priceDiff, 0, true, 1, 2, true),
                critN(ind.critName(bull), indDiff, 0, true, 1, 2, true)];
    const sc = scoreOf2(cs);
    const b1 = bars[p1.pivotIndex], b2 = bars[p2.pivotIndex];
    const crossNote = b1 && b2 && b1.day != null && b2.day != null && b1.day !== b2.day ? '（日跨ぎのピボット対）' : '';
    ev.push(makeEvent(rule, {
      state: 'confirmed', score: sc.score, coverage: sc.coverage,
      variant: bull ? 'bullish' : 'bearish',
      direction: bull ? 'bullish-traditional' : 'bearish-traditional',
      startIndex: p1.pivotIndex, endIndex: p2.pivotIndex, detectedIndex: p2.confirmedIndex, criteria: cs,
      overlays: [
        { type: 'pivots', points: [{ index: p1.pivotIndex, price: p1.price, type: p1.kind }, { index: p2.pivotIndex, price: p2.price, type: p2.kind }] },
      ],
      explanation: ind.explain(bull, p1, p2, v1, v2, crossNote),
    }));
  }
  return ev;
}

// MACD divergence uses the MACD LINE (F.macd = EMA12 - EMA26 of the
// closes), never the signal line (EMA9 of the MACD line) and never the
// histogram (line - signal): those belong to macd-signal-cross /
// macd-histogram-turn and can judge a pair oppositely.
registerRule(defRule('divergence-macd', {
  id: 'divergence-macd', version: '0.1',
  evaluate(ctx) {
    return divergencePairEvents(this, ctx, ctx.F.macd, {
      critName: bull => bull ? '発生足のMACD線が前側ピボット発生足より上昇（厳密）' : '発生足のMACD線が前側ピボット発生足より下降（厳密）',
      explain: (bull, p1, p2, v1, v2, crossNote) => `確定ピボット対（${bull ? '安値' : '高値'} ${p1.pivotIndex} 本目の ${fmt(p1.price)} → ${bull ? '安値' : '高値'} ${p2.pivotIndex} 本目の ${fmt(p2.price)}）で、価格の${bull ? '安値が切り下がった' : '高値が切り上がった'}一方、発生足のMACD線（EMA12−EMA26）は ${fmt(v1, 1)} → ${fmt(v2, 1)} と${bull ? '上昇' : '下降'}した。通常型の${bull ? '強気' : '弱気'}ダイバージェンス（方式A）${crossNote}。シグナル線・ヒストグラムではなくMACD線を用いる。後側ピボットの確認足 ${p2.confirmedIndex} 本目で検出した。伝統的な解釈であり予測ではない。`,
    });
  }
}));

// Stochastic divergence uses Fast %K (F.stochK, period 14), never %D
// (the 3-bar SMA of %K): %D smoothing can judge a pair oppositely and
// belongs to stochastic-cross. %K is null on a zero-range 14-bar
// window (unjudgeable pair) and saturates at 0 / 100, where equality
// fails the strict inequality — no threshold or %D substitution is
// introduced to change the count.
registerRule(defRule('divergence-stochastic', {
  id: 'divergence-stochastic', version: '0.1',
  evaluate(ctx) {
    return divergencePairEvents(this, ctx, ctx.F.stochK, {
      critName: bull => bull ? '発生足のFast %K（14）が前側ピボット発生足より上昇（厳密）' : '発生足のFast %K（14）が前側ピボット発生足より下降（厳密）',
      explain: (bull, p1, p2, v1, v2, crossNote) => `確定ピボット対（${bull ? '安値' : '高値'} ${p1.pivotIndex} 本目の ${fmt(p1.price)} → ${bull ? '安値' : '高値'} ${p2.pivotIndex} 本目の ${fmt(p2.price)}）で、価格の${bull ? '安値が切り下がった' : '高値が切り上がった'}一方、発生足のFast %K（14）は ${fmt(v1, 1)} → ${fmt(v2, 1)} と${bull ? '上昇' : '下降'}した。通常型の${bull ? '強気' : '弱気'}ダイバージェンス（方式A）${crossNote}。%DではなくFast %Kを用いる。後側ピボットの確認足 ${p2.confirmedIndex} 本目で検出した。伝統的な解釈であり予測ではない。`,
    });
  }
}));

// ---------- runner ----------
// options.enabled: array of rule ids (default: all). Disabled rules are NOT executed at all
// (separation by on/off, per product decision 2026-11-18).
// options.zigzagAtrMode: 'current' (default) | 'pivot' — see zigzag() notes.
// Pattern x RSI divergence (Stage 5-E-6; method E — event
// referencing). Fires only when a CONFIRMED double-bottom (double-top)
// record and a CONFIRMED regular bullish (bearish) divergence-rsi
// record refer to the very same confirmed pivot pair: the shape's two
// bottoms (tops) P1/P2 and the RSI record's consecutive same-kind pair
// must agree on kind, occurrence bars, prices and the P2 confirmation
// bar — all read from the records' fixed identification data (pivot
// overlays and the confirmed history transition), never re-judged.
// Ts is the shape's actual transition to confirmed (the neckline-break
// bar in its history, not the skeleton birth); Td is the P2
// OBV divergence (Stage 5-E-8, defs 0.32). Method A on the existing
// F.obv cumulative feature: consecutive same-kind confirmed pivot
// pairs (zigzagScale=2), OBV read at each pivot's OCCURRENCE bar
// only, regular type only, strict inequalities, no spacing /
// difference / zone / trend additions. A null or non-finite pair is
// skipped and never bridged. On top of the sibling convention, the
// OBV value must also be VALID at P2's confirmation bar and that bar
// must be complete (validity only — the confirmation bar's value is
// never used for direction). F.obv itself is unchanged: it starts at
// 0, adds sign(close diff) x volume (unchanged close adds nothing),
// and stays null forever after a missing volume. The volume here is
// SYNTHETIC — mechanically linked to price moves and time of day —
// so this is not evidence of real trading or fund flows.
registerRule(defRule('divergence-obv', {
  id: 'divergence-obv', version: '0.1',
  evaluate(ctx) {
    const { bars, F } = ctx, P = this.parameters, ev = [];
    const wf = ctx.waveforms[P.zigzagScale];
    if (!wf) return ev;
    const last = { high: null, low: null };
    for (const p2 of wf.pivots) {
      const p1 = last[p2.kind];
      last[p2.kind] = p2;
      if (!p1) continue;
      const o1 = F.obv[p1.pivotIndex], o2 = F.obv[p2.pivotIndex];
      if (o1 == null || o2 == null || !Number.isFinite(o1) || !Number.isFinite(o2)) continue;
      const oc = F.obv[p2.confirmedIndex], bc = bars[p2.confirmedIndex];
      if (oc == null || !Number.isFinite(oc) || !bc || !bc.complete) continue;
      const bull = p2.kind === 'low';
      const priceDiff = bull ? p1.price - p2.price : p2.price - p1.price;
      const obvDiff = bull ? o2 - o1 : o1 - o2;
      if (!(priceDiff > 0 && obvDiff > 0)) continue;
      const cs = [critN(bull ? '価格の安値が直前の安値ピボットより切り下がり（厳密）' : '価格の高値が直前の高値ピボットより切り上がり（厳密）', priceDiff, 0, true, 1, 2, true),
                  critN(bull ? '発生足のOBVが前側ピボット発生足より上昇（厳密）' : '発生足のOBVが前側ピボット発生足より下降（厳密）', obvDiff, 0, true, 1, 2, true)];
      const sc = scoreOf2(cs);
      const b1 = bars[p1.pivotIndex], b2 = bars[p2.pivotIndex];
