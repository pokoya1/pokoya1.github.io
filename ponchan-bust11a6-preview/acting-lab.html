<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUST-11a-3 表情連動比較</title><style>
*{box-sizing:border-box}body{font:15px system-ui,sans-serif;background:#f1f3f5;color:#202530;max-width:960px;margin:auto;padding:12px}h1{font-size:1.25rem}section{background:white;border:1px solid #d0d5db;border-radius:12px;padding:12px;margin:12px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}figure{margin:0;min-width:0}canvas{display:block;width:100%;height:auto;border:1px solid #ddd;border-radius:8px;background:#fff}figcaption{font-weight:600;font-size:.9rem}button,select{font:inherit;padding:9px;border:1px solid #aab1bd;border-radius:7px;background:white;margin:3px}input[type=range]{width:100%}small{color:#46515d}pre{font:12px monospace;white-space:pre-wrap}label{display:inline-block}#status{font-weight:bold}
</style></head><body><h1>ポーンちゃん｜表情・発話連動 BUST-11a-3</h1><p id="status" role="status">素材読み込み中</p><section class="pair"><figure><figcaption>基準：11a-2＋同一口パク</figcaption><canvas id="left" width="1024" height="1024"></canvas><pre id="leftInfo"></pre></figure><figure><figcaption>試作：11a-3 表情連動</figcaption><canvas id="right" width="1024" height="1024"></canvas><pre id="rightInfo"></pre></figure></section><section id="controls" inert><label>衣装 <select id="costume"><option value="hoodie">パーカー</option><option value="cardigan">カーディガン</option></select></label><label>速度 <select id="speed"><option value=".25">0.25倍</option><option value=".5">0.5倍</option><option value="1" selected>1倍</option></select></label><label>画角 <select id="zoom"><option value="gesture">腕・上半身</option><option value="face">顔の拡大</option><option value="full">全身</option></select></label><label><input id="talk" type="checkbox" checked>模擬発話</label><br><button id="play">再生</button><button id="pause">停止</button><button id="prev">−1/30秒</button><button id="next">＋1/30秒</button><button id="reset">最初</button><button id="mid">手を振る場面</button><p>経過時間 <output id="time">0.00秒</output></p><input id="seek" aria-label="時間" type="range" min="0" max="3.72" step=".001" value="0"><label><input id="loop" type="checkbox">比較ループ</label><p><small>左右とも同じ素材・同じ経過時間。両側は11a-2の同一手振りと同一口パク。右だけ瞬き、頬、視線、眉、頭の小さな傾き、呼吸を連動。無音の時間演出であり音声同期ではありません。中間PNGは共通。</small></p></section><script src="js/avatar-bust.js"></script><script src="js/pose-lab.js"></script><script src="js/wave-study.js"></script><script src="js/acting-study.js"></script><script src="js/acting-ui.js"></script></body></html>
