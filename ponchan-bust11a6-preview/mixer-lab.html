<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUST-11a-4 統合動作ラボ</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#f1f3f5;color:#242832;max-width:900px;margin:auto;padding:12px}h1{font-size:1.25rem}section{background:white;border:1px solid #ccd2da;border-radius:12px;padding:10px;margin:10px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}figure{margin:0;min-width:0}canvas{display:block;width:100%;height:auto;background:#fff;border:1px solid #ddd;border-radius:8px}button,select{font:inherit;padding:9px;border:1px solid #aab1bd;border-radius:7px;background:white;margin:3px}pre{white-space:pre-wrap;font:12px monospace}small{color:#46515d}</style></head><body><h1>ポーンちゃん｜統合動作ラボ BUST-11a-4</h1><p id="status">素材読み込み中</p><section class="pair"><figure><figcaption>基本パーカー</figcaption><canvas id="hoodie" width="1024" height="1024"></canvas></figure><figure><figcaption>青灰カーディガン</figcaption><canvas id="cardigan" width="1024" height="1024"></canvas></figure></section><section id="controls" inert><button id="demo">自動切替デモ</button><button id="play">再生</button><button id="pause">停止</button><button id="step">1/30秒進む</button><button id="reset">初期化</button><br><button id="wave">手振り</button><button id="point">指差し</button><button id="explain">説明</button><button id="cancel">動作を中断</button><br><button id="speak">模擬発話</button><button id="blink">瞬き要求</button><button id="look">視線を移す</button><label>表情<select id="expr"><option value="neutral">通常</option><option value="happy">笑顔</option><option value="joy">喜び</option><option value="concerned">困惑</option><option value="surprised">驚き</option><option value="relaxed">休息</option></select></label><label>速度<select id="speed"><option value=".25">0.25</option><option value=".5">0.5</option><option value="1" selected>1</option></select></label><label>画角<select id="zoom"><option value="gesture">上半身</option><option value="face">顔</option></select></label><pre id="info"></pre><pre id="events"></pre><small>腕の変更は現在の腕を下ろしてから開始。発話と一部表情は排他。瞬きは発話の終了後に開始。停止中の指示は再生またはコマ送りで進みます。無音試験。本編とは独立。</small></section><script src="js/avatar-bust.js"></script><script src="js/pose-lab.js"></script><script src="js/wave-study.js"></script><script src="js/motion-mixer.js"></script><script src="js/mixer-ui.js"></script></body></html>
