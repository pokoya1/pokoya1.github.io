<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BUST-11a-1 動作比較ラボ</title>
<style>body{font:15px system-ui,sans-serif;background:#f1f3f5;color:#202530;max-width:920px;margin:auto;padding:12px}h1{font-size:1.3rem}section{background:white;border:1px solid #d0d5db;border-radius:12px;padding:12px;margin:12px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair figure{margin:0;min-width:0}.pair canvas{width:100%;height:auto;display:block;background:#fff;border-radius:6px;border:1px solid #d0d5db;box-sizing:border-box}button,select,input{font:inherit}button,select{padding:8px;margin:3px;border:1px solid #aab1bd;border-radius:7px;background:white}button{cursor:pointer}input[type=range]{width:100%}label{display:inline-block;margin:4px}small{color:#495466}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#status{font-weight:bold}button:disabled{opacity:.45}</style>
<h1>ポーンちゃん｜BUST-11a-1 動作比較ラボ</h1><p id="status" role="status">素材読み込み中</p>
<section class="pair"><figure><figcaption id="leftLabel">基準：パーカー</figcaption><canvas id="left" width="1024" height="1024"></canvas></figure><figure><figcaption id="rightLabel">比較：カーディガン</figcaption><canvas id="right" width="1024" height="1024"></canvas></figure></section>
<section id="controls" inert><label>比較 <select id="compare"><option value="costumes">両衣装</option><option value="hoodie">パーカー A/B</option><option value="cardigan">カーディガン A/B</option></select></label><label>動作 <select id="gesture"><option value="wave">手を振る</option><option value="point">指す</option><option value="explain">説明</option></select></label><label>表示 <select id="zoom"><option value="gesture">腕・上半身</option><option value="upper">上半身拡大</option><option value="full">全身</option></select></label><label><input type="checkbox" id="bones">関節位置表示</label><label>速度 <select id="speed"><option value="0.25">0.25倍</option><option value="0.5">0.5倍</option><option value="1" selected>1倍</option></select></label><br><button id="play">再生</button><button id="pause">一時停止</button><button id="prev">−1コマ</button><button id="next">＋1コマ</button><button id="reset">最初</button><button id="focus">60〜65%へ</button><p>姿勢進行率 <output id="pct">0%</output></p><input id="progress" aria-label="姿勢進行率" type="range" min="0" max="100" step="1" value="0"><p>終端手首角度（袖は固定） <output id="angleValue">0°</output></p><input id="angle" aria-label="終端手首角度" type="range" min="-12" max="12" step="1" value="0"><small>中間PNGは袖・手一体。関節表示はmanifestの座標（骨格推定ではない）。再生は上げ下げの比較専用で、発話演出は含まない。</small><pre id="info"></pre></section>
<section><h2 style="font-size:1rem">候補素材 A/B（同一衣装のみ）</h2><p>既存のトリム済みPNGと同じピクセル寸法・座標に加工済みの候補を、右側の1スロットだけ差し替えます。未加工のSee-Through画像は直接使用不可。</p><label>対象 <select id="slot"></select></label><input type="file" id="candidate" accept="image/png" disabled><button id="clear" disabled>元に戻す</button><p id="candidateStatus">未登録</p></section>
<script src="js/avatar-bust.js"></script><script src="js/pose-lab.js"></script><script src="js/lab-ui.js"></script></html>
